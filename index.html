<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brieftauben-Verwaltung</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0F1117;--bg2:#161B22;--bg3:#1C2333;--bg4:#242B3D;
  --green:#5B8659;--green2:#4a6e48;--green3:#3d5c3b;
  --text:#E8EAF0;--text2:#9BA3AF;--text3:#6B7280;
  --border:#2A3347;--border2:#3A4560;
  --blue:#4A90D9;--purple:#a855f7;--orange:#e8893a;
  --radius:10px;--radius-sm:6px;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh}
.serif{font-family:'Playfair Display',serif}

/* ── Header ── */
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:13px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;background:var(--green3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
header h1{font-family:'Playfair Display',serif;font-size:18px;font-weight:600}
.db-status{font-size:11px;color:var(--text3);margin-top:1px}
.header-right{display:flex;align-items:center;gap:8px}
.stat-pill{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--text2);white-space:nowrap}
.stat-pill span{color:var(--green);font-weight:500;font-family:monospace}

/* ── Nav ── */
nav{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;padding:0 16px;overflow-x:auto}
nav button{background:none;border:none;border-bottom:2px solid transparent;color:var(--text2);padding:11px 16px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;white-space:nowrap;transition:color .15s,border-color .15s}
nav button:hover{color:var(--text)}
nav button.active{color:var(--green);border-bottom-color:var(--green);font-weight:500}

/* ── Main ── */
main{padding:18px 20px;max-width:1300px;margin:0 auto}

/* ── Cards ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card-title{font-weight:500;font-size:14px;margin-bottom:14px;display:flex;align-items:center;gap:8px}

/* ── Suche & Filter ── */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-wrap input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px 9px 36px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--green)}
.search-wrap input::placeholder{color:var(--text3)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}
select{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:8px 10px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;cursor:pointer;height:36px}
select:focus{border-color:var(--green)}
.count-label{font-size:12px;color:var(--text3);white-space:nowrap}

/* ── Tabelle ── */
.table-wrap{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg3);color:var(--text3);font-weight:500;text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
th:hover{color:var(--text2)}
td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3);color:var(--text);cursor:pointer}
.ring{font-family:monospace;font-size:11.5px;color:var(--text);background:var(--bg3);padding:2px 7px;border-radius:4px;border:1px solid var(--border)}
.ring-sm{font-family:monospace;font-size:11px;color:var(--green);background:color-mix(in srgb,var(--green) 10%,var(--bg3));padding:1px 6px;border-radius:3px;cursor:pointer;transition:background .15s}
.ring-sm:hover{background:color-mix(in srgb,var(--green) 20%,var(--bg3))}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500}
.badge-m{background:#1a2d4a;color:#7ab3e0}
.badge-f{background:#2d1a3d;color:#c97fd4}
.badge-u{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}

/* ── Pagination ── */
.pagination{display:flex;align-items:center;gap:6px;margin-top:12px;justify-content:flex-end;flex-wrap:wrap}
.pagination button{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:5px 11px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;transition:all .15s}
.pagination button:hover:not(:disabled){border-color:var(--green);color:var(--text)}
.pagination button:disabled{opacity:.3;cursor:default}
.pagination span{font-size:12px;color:var(--text3)}

/* ── Detail ── */
.back-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:7px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;margin-bottom:14px;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.back-btn:hover{border-color:var(--green);color:var(--text)}
.detail-name{font-family:'Playfair Display',serif;font-size:26px;margin-bottom:3px}
.detail-ring{font-family:monospace;font-size:14px;color:var(--green);margin-bottom:14px}
.section-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin:18px 0 10px}
.parent-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;cursor:pointer;transition:border-color .15s,background .15s}
.parent-card:hover{border-color:var(--green);background:var(--bg4)}
.parent-card.male{border-left:3px solid var(--blue)}
.parent-card.female{border-left:3px solid var(--purple)}
.parent-card.unknown{cursor:default;opacity:.5}
.parent-card.unknown:hover{border-color:var(--border);background:var(--bg3)}
.field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.field-item label{display:block;font-size:10px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.field-item span{font-size:13px;color:var(--text)}

/* ── Buttons ── */
.btn{background:var(--green3);border:1px solid var(--green2);color:#e8f0e8;padding:7px 15px;border-radius:var(--radius-sm);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;transition:background .15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--green2)}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text2)}
.btn-outline:hover{border-color:var(--green);color:var(--text);background:none}
.btn-sm{padding:5px 11px;font-size:12px}

/* ── Pedigree ── */
.ped-wrap{overflow-x:auto;padding:4px 0 8px}
/* ── Stammbaum-Grid ── */
.ped-tree{display:flex;flex-direction:row;align-items:stretch;gap:0;min-width:860px;overflow-x:auto}
.ped-col{display:flex;flex-direction:column;justify-content:space-around;position:relative;padding:0 6px}
.ped-col-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;text-align:center;padding:4px 0 8px;border-bottom:1px solid var(--border);margin-bottom:4px}
.ped-col-hdr{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;text-align:center;padding:4px 0;margin-bottom:6px}
.ped-cell{display:flex;align-items:center;flex:1;position:relative;min-height:60px}
.ped-cell-inner{width:100%}
/* Verbindungslinien */
.ped-col.has-lines .ped-cell::before{
  content:'';position:absolute;left:-6px;top:50%;
  width:6px;height:1px;background:var(--border);
}
.ped-col.has-lines .ped-cell::after{
  content:'';position:absolute;left:-6px;
  width:1px;background:var(--border);
}
/* Obere Hälfte des Paares */
.ped-cell.pair-top::after{top:50%;bottom:0}
/* Untere Hälfte des Paares */
.ped-cell.pair-bottom::after{top:0;bottom:50%}
/* Einzelkind (Proband) */
.ped-cell.solo::after{display:none}
.ped-col-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.ped-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 10px;cursor:pointer;transition:border-color .15s,background .15s}
.ped-box:hover{border-color:var(--green);background:var(--bg4)}
.ped-box.male{border-left:3px solid var(--blue)}
.ped-box.female{border-left:3px solid var(--purple)}
.ped-box.empty{opacity:.3;cursor:default;border-style:dashed}
.ped-box.empty:hover{border-color:var(--border);background:var(--bg3)}
.ped-box.root{border-color:var(--green2);background:color-mix(in srgb,var(--green) 8%,var(--bg3))}
.ped-ring{font-family:monospace;font-size:11px;color:var(--green);font-weight:600}
.ped-name{font-size:12px;color:var(--text);margin-top:2px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ped-info{font-size:11px;color:var(--text3);margin-top:1px}

/* ── Stammbaum Suche ── */
.ped-result{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;display:flex;align-items:center;gap:10px}
.ped-result:hover{background:var(--bg3)}
.ped-result:last-child{border-bottom:none}

/* ── Statistik ── */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px;text-align:center}
.stat-num{font-family:'Playfair Display',serif;font-size:32px;color:var(--green);font-weight:600;line-height:1}
.stat-label{font-size:12px;color:var(--text3);margin-top:5px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.bar-label{font-size:12px;color:var(--text2);width:50px;flex-shrink:0;font-family:monospace;text-align:right}
.bar-track{flex:1;background:var(--bg3);border-radius:4px;height:18px;overflow:hidden}
.bar-fill{background:linear-gradient(90deg,var(--green3),var(--green2));height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;min-width:30px;transition:width .4s ease}
.bar-fill span{font-size:11px;color:#e8f0e8;white-space:nowrap}

/* ── Neue Taube / Formular ── */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.form-field{display:grid;gap:5px}
.form-field label{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.4px}
.form-field input,.form-field select,.form-field textarea{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:8px 10px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--green)}
.form-field textarea{min-height:80px;resize:vertical}
.form-full{grid-column:1 / -1}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.form-msg{font-size:12px;padding:8px 12px;border-radius:var(--radius-sm);margin-bottom:10px}
.form-msg.ok{background:color-mix(in srgb,var(--green) 10%,var(--bg3));color:var(--green);border:1px solid color-mix(in srgb,var(--green) 30%,var(--border))}
.form-msg.err{background:#1e0f0f;color:#e07070;border:1px solid #5a1f1f}
.autocomplete-wrap{position:relative}
.autocomplete-drop{position:absolute;top:100%;left:0;right:0;background:var(--bg2);border:1px solid var(--border2);border-top:none;border-radius:0 0 var(--radius-sm) var(--radius-sm);z-index:50;max-height:160px;overflow-y:auto;display:none}
.autocomplete-drop.open{display:block}
.ac-item{padding:7px 10px;cursor:pointer;font-size:12px;color:var(--text2);display:flex;align-items:center;gap:8px;transition:background .1s}
.ac-item:hover,.ac-item.selected{background:var(--bg3);color:var(--text)}
.ac-ring{font-family:monospace;font-size:11px;color:var(--green)}

/* ── Inzuchtrechner ── */
.ibc-result{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;text-align:center;margin-top:12px}
.ibc-num{font-family:'Playfair Display',serif;font-size:36px;font-weight:600}
.ibc-num.low{color:var(--green)}
.ibc-num.mid{color:var(--orange)}
.ibc-num.high{color:#e07070}
.ibc-label{font-size:12px;color:var(--text3);margin-top:4px}

/* ── Sonstige ── */
.loading{text-align:center;padding:48px;color:var(--text3)}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:#1e0f0f;border:1px solid #5a1f1f;color:#e07070;border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:14px;font-size:13px}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block}
.divider{border:none;border-top:1px solid var(--border);margin:14px 0}
.empty-state{text-align:center;padding:40px;color:var(--text3)}
.empty-state .icon{font-size:32px;margin-bottom:10px}
.tag-list{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:3px 11px;font-size:12px;color:var(--text2)}
.tag strong{color:var(--text);margin-left:5px}
@media(max-width:640px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .ped-grid{grid-template-columns:repeat(4,160px)}
  .header-right{display:none}
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">🕊</div>
    <div>
      <h1>Brieftauben-Verwaltung</h1>
      <div class="db-status" id="db-status">Verbinde mit Datenbank…</div>
    </div>
  </div>
  <div class="header-right" id="headerStats"></div>
</header>

<nav id="nav">
  <button class="active" onclick="showTab('tauben')">🐦 Tauben</button>
  <button onclick="showTab('stammbaum')">🌳 Stammbaum</button>
  <button onclick="showTab('paarung')">💑 Paarungscheck</button>
  <button onclick="showTab('neu')">＋ Neue Taube</button>
  <button onclick="showTab('scan')">📷 Scan</button>
  <button onclick="showTab('nachkommen')">🐣 Nachkommen</button>
  <button onclick="showTab('statistik')">📊 Statistik</button>
</nav>

<main id="main">
  <div class="loading"><div class="spinner"></div>Lade Daten…</div>
</main>

<script>
const SUPA_URL      = 'https://vwdqqdmtjztduzqrdbpc.supabase.co/rest/v1';
const SUPA_AUTH_URL = 'https://vwdqqdmtjztduzqrdbpc.supabase.co/auth/v1';
const SUPA_KEY      = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3ZHFxZG10anp0ZHV6cXJkYnBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ5NDM2NzEsImV4cCI6MjA4MDUxOTY3MX0.igi8KVrlMvc5EuHkNTS0WsQm5ySq6eK7lawASWVxdJg';

// Auth-State
let AUTH = { token: null, user: null };
function authHeaders(){
  const tok = AUTH.token || SUPA_KEY;
  return {'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + tok,
          'Content-Type': 'application/json', 'Prefer': 'return=representation'};
}
// H als Funktion — liefert immer aktuellen Token
const H = authHeaders;

// ── Auth-Funktionen ────────────────────────────────────────────
async function signIn(email, pw){
  const r = await fetch(SUPA_AUTH_URL+'/token?grant_type=password', {
    method:'POST',
    headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
    body: JSON.stringify({email, password:pw})
  });
  const d = await r.json();
  if(!r.ok) throw new Error(d.error_description || d.msg || 'Login fehlgeschlagen');
  AUTH.token = d.access_token;
  AUTH.user  = d.user;
  // Session im localStorage speichern
  localStorage.setItem('bv_session', JSON.stringify({token:d.access_token, refresh:d.refresh_token, user:d.user}));
  return d;
}

async function refreshSession(refreshToken){
  const r = await fetch(SUPA_AUTH_URL+'/token?grant_type=refresh_token', {
    method:'POST',
    headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
    body: JSON.stringify({refresh_token: refreshToken})
  });
  if(!r.ok) return false;
  const d = await r.json();
  AUTH.token = d.access_token;
  AUTH.user  = d.user;
  localStorage.setItem('bv_session', JSON.stringify({token:d.access_token, refresh:d.refresh_token, user:d.user}));
  return true;
}

async function signOut(){
  try{
    await fetch(SUPA_AUTH_URL+'/logout', {
      method:'POST',
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+(AUTH.token||'')}
    });
  } catch(e){}
  AUTH = {token:null, user:null};
  localStorage.removeItem('bv_session');
  renderLogin();
}

async function restoreSession(){
  const raw = localStorage.getItem('bv_session');
  if(!raw) return false;
  try{
    const s = JSON.parse(raw);
    // Erst versuchen Token direkt zu verwenden
    AUTH.token = s.token;
    AUTH.user  = s.user;
    // Refresh versuchen falls Token abgelaufen
    const ok = await refreshSession(s.refresh);
    return ok || !!s.token;
  } catch(e){ return false; }
}

// ── Login-UI ───────────────────────────────────────────────────
function renderLogin(errMsg){
  document.body.innerHTML = `
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)">
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:40px 36px;width:340px;box-shadow:0 8px 40px #0008">
      <div style="text-align:center;margin-bottom:28px">
        <div style="font-size:32px;margin-bottom:8px">🕊️</div>
        <div style="font-family:Georgia,serif;font-size:22px;font-weight:700;color:var(--text)">Brieftauben-Verwaltung</div>
        <div style="font-size:13px;color:var(--text3);margin-top:6px">Bitte anmelden</div>
      </div>
      ${errMsg ? `<div style="background:#2a0f0f;color:#e07070;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:16px">⚠️ ${errMsg}</div>` : ''}
      <div style="display:flex;flex-direction:column;gap:14px">
        <div>
          <label style="font-size:12px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:6px">E-Mail</label>
          <input id="login-email" type="email" placeholder="name@beispiel.de" autocomplete="email"
            style="width:100%;box-sizing:border-box;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;outline:none"
            onkeydown="if(event.key==='Enter')document.getElementById('login-pw').focus()">
        </div>
        <div>
          <label style="font-size:12px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:6px">Passwort</label>
          <input id="login-pw" type="password" placeholder="••••••••" autocomplete="current-password"
            style="width:100%;box-sizing:border-box;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;outline:none"
            onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <button onclick="doLogin()"
          style="background:var(--green);color:#000;font-weight:700;font-size:15px;border:none;border-radius:10px;padding:12px;cursor:pointer;margin-top:4px;transition:opacity .2s"
          onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">
          Anmelden
        </button>
      </div>
      <div style="text-align:center;font-size:11px;color:var(--text3);margin-top:20px">
        Zugang nur für autorisierte Nutzer
      </div>
    </div>
  </div>`;
}

async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pw    = document.getElementById('login-pw').value;
  if(!email||!pw){ renderLogin('Bitte E-Mail und Passwort eingeben.'); return; }
  const btn = document.querySelector('button[onclick="doLogin()"]');
  if(btn){ btn.textContent='Anmelden…'; btn.disabled=true; }
  try{
    await signIn(email, pw);
    startApp();
  } catch(e){
    renderLogin(e.message);
  }
}

async function startApp(){
  // App-HTML wiederherstellen falls Login-Screen alles überschrieben hat
  if(!document.getElementById('main')){
    location.reload(); return;
  }
  // Logout-Button im Header einblenden

// ── Feldhelfer ─────────────────────────────────────────────────
const ring   = p => p.ringnumber || p.ringnumberold || p.pigeonid || '?';
const name_  = p => p.name || '';
const sex_   = p => { const g = String(p.gender||'').trim().toLowerCase(); if(['m','1'].includes(g))return'M'; if(['f','2','w'].includes(g))return'F'; return '?'; };
function pigeonStateName(p){
  if(p.pigeonstateid && S.pigeonStates && S.pigeonStates.length){
    const found = S.pigeonStates.find(s=>s.pigeonstateid===p.pigeonstateid);
    if(found) return found.name||'';
  }
  return p.pigeonstate||'';
}
const year_  = p => p.date_year || '';
const label_ = p => p.name ? `${p.name} (${ring(p)})` : ring(p);

function findFather(p){ return p.fatherid ? S.pigeons.find(x=>x.pigeonid===p.fatherid)||null : p.ringnumberfather ? S.pigeons.find(x=>x.ringnumber===p.ringnumberfather)||null : null; }
function findMother(p){ return p.motherid ? S.pigeons.find(x=>x.pigeonid===p.motherid)||null : p.ringnumbermother ? S.pigeons.find(x=>x.ringnumber===p.ringnumbermother)||null : null; }
function findById(id){ if(!id)return null; return S.pigeons.find(p=>p.pigeonid===id||p.ringnumber===String(id))||null; }
function getAncestors(p, depth=4){
  if(!p||depth===0) return new Set();
  const s = new Set([p.pigeonid]);
  const f = findFather(p), m = findMother(p);
  getAncestors(f,depth-1).forEach(x=>s.add(x));
  getAncestors(m,depth-1).forEach(x=>s.add(x));
  return s;
}

// ── Inzuchtberechnung (Wright-Koeffizient, 5 Gen.) ───────────
function calcInbreeding(bird, depth=5){
  function ancestors(b, gen, path){
    if(!b||gen>depth) return {};
    const res = {};
    if(gen>0){ if(!res[b.pigeonid]) res[b.pigeonid]=[]; res[b.pigeonid].push(gen); }
    const f=findFather(b), m=findMother(b);
    const fa=ancestors(f,gen+1,path+'-f'), ma=ancestors(m,gen+1,path+'-m');
    for(const [id,gens] of Object.entries(fa)){ if(!res[id])res[id]=[]; res[id].push(...gens); }
    for(const [id,gens] of Object.entries(ma)){ if(!res[id])res[id]=[]; res[id].push(...gens); }
    return res;
  }
  const f=findFather(bird), m=findMother(bird);
  if(!f||!m) return 0;
  const fa=ancestors(f,1,''), ma=ancestors(m,1,'');
  let coeff=0;
  for(const id of Object.keys(fa)){
    if(ma[id]){
      const fGens=fa[id], mGens=ma[id];
      for(const n of fGens) for(const p of mGens) coeff+=Math.pow(0.5,n+p+1);
    }
  }
  return coeff;
}

function calcInbreedingPair(male, female, depth=5){
  // Simuliere ein hypothetisches Nachkomme-Objekt
  const fake = { pigeonid: '__tmp__', fatherid: male.pigeonid, motherid: female.pigeonid };
  const origFind = (id) => S.pigeons.find(p=>p.pigeonid===id);
  // patching findFather/findMother lokal
  function anc(b, gen){
    if(!b||gen>depth) return {};
    const res={};
    if(gen>0){ if(!res[b.pigeonid])res[b.pigeonid]=[]; res[b.pigeonid].push(gen); }
    const fid = b===fake ? male.pigeonid : (b.fatherid||null);
    const mid = b===fake ? female.pigeonid : (b.motherid||null);
    const fb  = fid ? (S.pigeons.find(p=>p.pigeonid===fid)||null) : null;
    const mb  = mid ? (S.pigeons.find(p=>p.pigeonid===mid)||null) : null;
    const fa=anc(fb,gen+1), ma=anc(mb,gen+1);
    for(const [id,g] of Object.entries(fa)){ if(!res[id])res[id]=[]; res[id].push(...g); }
    for(const [id,g] of Object.entries(ma)){ if(!res[id])res[id]=[]; res[id].push(...g); }
    return res;
  }
  const fa=anc(male,1), ma=anc(female,1);
  let coeff=0;
  for(const id of Object.keys(fa)){
    if(ma[id]){
      for(const n of fa[id]) for(const p of ma[id]) coeff+=Math.pow(0.5,n+p+1);
    }
  }
  return coeff;
}

async function loadData(){
  S.loading=true; S._loadingMore=false; render();
  // Status-Tabelle laden
  try{ const ps=await apiGet('/pigeonstates?order=name.asc'); S.pigeonStates=ps||[]; } catch(e){ S.pigeonStates=[]; }
  const BATCH=500;
  try{
    // Erste Batch sofort laden → UI erscheint schnell
    const first = await apiGet('/pigeons?deleted=eq.false&limit='+BATCH+'&offset=0&order=date_year.desc,number.asc');
    S.pigeons = first||[];
    S.error=null;
    S.loading=false;
    updateHeaderStats();
    // Beim Start: komplettes render() damit DOM aufgebaut wird
    render();
    applyFilter();

    // Rest im Hintergrund nachladen
    if((first||[]).length===BATCH){
      S._loadingMore=true;
      updateHeaderStats();
      let offset=BATCH;
      while(true){
        const batch = await apiGet('/pigeons?deleted=eq.false&limit='+BATCH+'&offset='+offset+'&order=date_year.desc,number.asc');
        if(!batch||batch.length===0) break;
        S.pigeons = S.pigeons.concat(batch);
        updateHeaderStats();
        // Hintergrund-Batch: Tabelle still aktualisieren
        S.filtered=[...S.pigeons];
        if(document.getElementById('table-wrap')) renderTableOnly();
        if(batch.length<BATCH) break;
        offset+=BATCH;
      }
      S._loadingMore=false;
      updateHeaderStats();
      applyFilter();
    }
  } catch(e){
    S.loading=false;
    S._loadingMore=false;
    S.error=e.message;
    document.getElementById('db-status').textContent='Verbindungsfehler';
    render();
  }
}

function applyFilter(){
  let arr=[...S.pigeons];
  const q=S.search.trim();
  const ql=q.toLowerCase();

  if(q){
    /*
      Eingabe-Erkennung — 4 Modi:
      A) "26/1" oder "2026/1" oder "26-1" → Jahrgang + Endnummer
      B) "idefix 1" oder "1 idefix"       → Name + Nummer kombiniert
      C) Rein numerisch                   → Endnummer-Scoring
      D) Text                             → Freitext
    */

    // ── Modus A: Jahrgang/Endnummer z.B. "26/1", "2026-1", "25/455" ──
    const modeA = q.match(/^(\d{2,4})[\/\-\s](\d{1,6})$/) || q.match(/^(\d{1,6})[\/\-\s](\d{2,4})$/);
    // ── Modus B: Gemischt z.B. "idefix 1", "chef 333" ──
    const modeB_numWord = q.match(/^(\d{1,6})\s+(.+)$/) || q.match(/^(.+)\s+(\d{1,6})$/);

    if(modeA){
      // Beide Teile extrahieren — prüfe welcher der Jahrgang ist (2- oder 4-stellig ≥ 19xx/20xx)
      let part1 = modeA[1], part2 = modeA[2];
      let yr, num;
      const isYear = v => {
        const n=parseInt(v);
        if(v.length===4 && n>=1900 && n<=2100) return true;
        if(v.length===2 && n>=0 && n<=99) return true;
        return false;
      };
      if(isYear(part1) && !isYear(part2)){ yr=part1; num=part2; }
      else if(isYear(part2) && !isYear(part1)){ yr=part2; num=part1; }
      else { yr=part1; num=part2; }
      // Jahrgang normalisieren (2-stellig → 20xx)
      const yrFull = yr.length===2 ? '20'+yr : yr;
      arr = arr.filter(p=>{
        if(String(p.date_year) !== yrFull) return false;
        const segs = (p.ringnumber||p.ringnumberold||'').split(/[^\d]+/).filter(s=>s);
        const last = segs[segs.length-1]||'';
        const lastS = last.replace(/^0+/,'')||'0';
        const numS  = num.replace(/^0+/,'')||'0';
        const rnNoSp = (p.ringnumber||p.ringnumberold||'').replace(/\s+/g,'');
        const idxN = rnNoSp.lastIndexOf(num);
        const endsExact = rnNoSp.endsWith(num) && (idxN===0||!/\d/.test(rnNoSp[idxN-1]));
        return last===num || lastS===numS || endsExact;
      });
      arr.sort((a,b)=>(ring(a)||'').localeCompare(ring(b)));

    } else {
      const isNumeric = /^\d{1,}$/.test(q);

      if(isNumeric){
        // ── Modus C: Endnummer-Suche mit Relevanz-Scoring ──
        function getNumSegs(rn){
          return (rn||'').trim().split(/[^\d]+/).filter(s=>s.length>0);
        }
        const scored=[];
        S.pigeons.forEach(p=>{
          const rn       = (p.ringnumber||p.ringnumberold||'').trim();
          const rnNoSpace= rn.replace(/\s+/g,'');
          const rnC      = rn.replace(/[^\d]/g,'');
          const numSegs  = getNumSegs(rn);
          const lastSeg  = numSegs[numSegs.length-1]||'';
          const idxQ     = rnNoSpace.lastIndexOf(q);
          const endsExact= rnNoSpace.endsWith(q) && (idxQ===0||!/\d/.test(rnNoSpace[idxQ-1]));
          const lastExact= lastSeg===q;
          const nameWords= (p.name||'').trim().split(/\s+/);
          const nameExact= nameWords.some(w=>w===q);
          const nameCont = (p.name||'').includes(q);
          const rnCont   = rnC.includes(q);

          if(lastExact || endsExact){
            scored.push({p,score:1});
          } else if(numSegs.some(s=>s===q)){
            scored.push({p,score:2});
          } else if(nameExact){
            scored.push({p,score:3});
          } else if(rnCont){
            scored.push({p,score:4});
          } else if(nameCont){
            scored.push({p,score:5});
          }
        });
        scored.sort((a,b)=>{
          if(a.score!==b.score) return a.score-b.score;
          // Gleicher Score: neueste zuerst
          const yd=(b.p.date_year||0)-(a.p.date_year||0);
          if(yd!==0) return yd;
          return (ring(a.p)||'').localeCompare(ring(b.p));
        });
        arr=scored.map(x=>x.p);

      } else {
        // ── Modus D: Freitext + optionaler Name+Nummer-Kombi ──
        // Prüfe ob ein Zahlenanteil + Textanteil (z.B. "idefix 1")
        const mixMatch = q.match(/^(.+?)\s+(\d{1,6})$/) || q.match(/^(\d{1,6})\s+(.+)$/);
        if(mixMatch){
          const numPart  = (mixMatch[1].match(/^\d+$/) ? mixMatch[1] : mixMatch[2]);
          const textPart = (mixMatch[1].match(/^\d+$/) ? mixMatch[2] : mixMatch[1]).toLowerCase();
          const scored=[];
          S.pigeons.forEach(p=>{
            const nameMatch = (p.name||'').toLowerCase().includes(textPart);
            const segs = (p.ringnumber||p.ringnumberold||'').split(/[^\d]+/).filter(s=>s);
            const last = segs[segs.length-1]||'';
            const rnNoSp = (p.ringnumber||p.ringnumberold||'').replace(/\s+/g,'');
            const idxN = rnNoSp.lastIndexOf(numPart);
            const endsExact = rnNoSp.endsWith(numPart)&&(idxN===0||!/\d/.test(rnNoSp[idxN-1]));
            const numMatch = last===numPart||endsExact||segs.some(s=>s===numPart);
            if(nameMatch && numMatch) scored.push({p,score:1});
            else if(nameMatch)        scored.push({p,score:2});
            else if(numMatch)         scored.push({p,score:3});
          });
          scored.sort((a,b)=>{
            if(a.score!==b.score) return a.score-b.score;
            return (b.p.date_year||0)-(a.p.date_year||0);
          });
          arr=scored.map(x=>x.p);
        } else {
          arr=arr.filter(p=>(p.ringnumber||'').toLowerCase().includes(ql)
            ||(p.ringnumberold||'').toLowerCase().includes(ql)
            ||(p.name||'').toLowerCase().includes(ql)
            ||(p.color||'').toLowerCase().includes(ql)
            ||(p.strain||'').toLowerCase().includes(ql)
            ||(p.breeder||'').toLowerCase().includes(ql)
            ||(p.owner||'').toLowerCase().includes(ql)
            ||(p.ringnumberfather||'').toLowerCase().includes(ql)
            ||(p.ringnumbermother||'').toLowerCase().includes(ql));
        }
      }
    }
  }

  if(S.sexFilter!=='all') arr=arr.filter(p=>sex_(p)===S.sexFilter);
  if(S.yearFilter!=='all') arr=arr.filter(p=>String(p.date_year)===S.yearFilter);
  if(S.inStockFilter==='yes') arr=arr.filter(p=>p.instock);
  if(S.inStockFilter==='no') arr=arr.filter(p=>!p.instock);
  if(S.colorFilter!=='all') arr=arr.filter(p=>(p.color||'')===S.colorFilter);
  if(S.stateFilter!=='all') arr=arr.filter(p=>pigeonStateName(p)===S.stateFilter);
  if(S.racingFilter==='yes') arr=arr.filter(p=>p.ontrip===true);
  if(S.racingFilter==='no')  arr=arr.filter(p=>p.ontrip!==true);

  // Fallback-Sortierung nur wenn KEIN Scoring aktiv war
  if(!q || !((/^\d/.test(q)) || q.match(/^(\d{2,4})[\/\-\s](\d{1,6})$/))){
    arr.sort((a,b)=>{
      let av,bv;
      if(S.sortCol==='ringnumber'){av=ring(a);bv=ring(b);}
      else if(S.sortCol==='name'){av=a.name||'';bv=b.name||'';}
      else if(S.sortCol==='gender'){av=sex_(a);bv=sex_(b);}
      else if(S.sortCol==='year'){av=a.date_year||0;bv=b.date_year||0;}
      else if(S.sortCol==='color'){av=a.color||'';bv=b.color||'';}
      else if(S.sortCol==='strain'){av=a.strain||'';bv=b.strain||'';}
      else{av='';bv='';}
      if(av<bv) return -1*S.sortDir;
      if(av>bv) return 1*S.sortDir;
      return 0;
    });
  }

  S.filtered=arr;
  const totalPages=Math.max(1,Math.ceil(S.filtered.length/S.pageSize));
  if(S.page>totalPages-1) S.page=0;
  if(S.tab==='tauben'&&!S.selected){
    if(document.getElementById('table-wrap')) renderTableOnly();
    else render();
  } else { render(); }
}

function sortBy(col){ S.sortCol===col ? S.sortDir*=-1 : (S.sortCol=col,S.sortDir=1); applyFilter(); }

// ── Navigation ─────────────────────────────────────────────────
function showTab(t){
  S.tab=t; S.selected=null;
  document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',['tauben','stammbaum','paarung','neu','scan','nachkommen','statistik'][i]===t));
  render();
}
function selectPigeon(id){ S.selected=findById(id); S.tab='tauben'; document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',i===0)); render(); window.scrollTo(0,0); }
function showPedigree(id){ S.selectedPed=id; S.tab='stammbaum'; document.querySelectorAll('nav button').forEach((b,i)=>b.classList.toggle('active',i===1)); render(); window.scrollTo(0,0); }

// ── RENDER ─────────────────────────────────────────────────────
function render(){
  const m=document.getElementById('main');
  if(S.loading){ m.innerHTML='<div class="loading"><div class="spinner"></div>Lade Tauben…</div>'; return; }
  if(S.tab==='tauben')     m.innerHTML=S.selected ? renderDetail(S.selected) : renderList();
  else if(S.tab==='stammbaum')  m.innerHTML=S.selectedPed ? renderPedigree(S.selectedPed) : renderPedSearch();
  else if(S.tab==='nachkommen') m.innerHTML=S.selectedNach ? renderNachkommen(S.selectedNach) : renderNachSearch();
  else if(S.tab==='paarung')    m.innerHTML=renderPaarung();
  else if(S.tab==='neu')        m.innerHTML=renderNeu();
  else if(S.tab==='scan')       m.innerHTML=renderScan();
  else                          m.innerHTML=renderStats();
  bindAutocomplete();
  bindPedSearch();
  bindNachSearch();
}

async function saveEdit(id){
  const msg=document.getElementById('edit-msg');
  const g=id=>document.getElementById(id);
  const val=id=>{const el=g(id);return el?el.value.trim():'';};
  const row={
    ringnumber:     val('e_ringnumber'),
    ringnumberold:  val('e_ringnumberold'),
    name:           val('e_name'),
    date_year:      val('e_date_year')?Number(val('e_date_year')):null,
    gender:         val('e_gender')||null,
    color:          val('e_color'),
    race:           val('e_race'),
    strain:         val('e_strain'),
    breeder:        val('e_breeder'),
    owner:          val('e_owner'),
    countrycode:    val('e_countrycode'),
    associationno:  val('e_associationno'),
    birthday:       val('e_birthday')||null,
    died:           val('e_died')||null,
    bought:         val('e_bought')||null,
    sold:           val('e_sold')||null,
    instock:        val('e_instock')==='true',
    ontrip:         (()=>{ const el=document.getElementById('e_ontrip'); return el ? el.value==='true' : (p.ontrip||false); })(),
    pigeonstateid:  (()=>{ const el=document.getElementById('e_pigeonstateid'); return el&&el.value?el.value:null; })(),
    info:           val('e_info'),
    internalinfo:   val('e_internalinfo'),
    fatherid:       g('e_father_id')&&g('e_father_id').value ? g('e_father_id').value : null,
    motherid:       g('e_mother_id')&&g('e_mother_id').value ? g('e_mother_id').value : null,
  };
  // Leere Strings als null
  Object.keys(row).forEach(k=>{ if(row[k]==='') row[k]=null; });
  if(msg){ msg.style.display='block'; msg.style.background='var(--bg3)'; msg.style.color='var(--text2)'; msg.textContent='Speichern…'; }
  try{
    await apiPatch('pigeons', id, row);
    // Lokalen State aktualisieren
    const idx=S.pigeons.findIndex(p=>p.pigeonid===id);
    if(idx!==-1){ S.pigeons[idx]=Object.assign({},S.pigeons[idx],row,{pigeonid:id}); }
    S.selected=S.pigeons.find(p=>p.pigeonid===id)||null;
    if(S.selected) delete S.selected._editMode;
    applyFilter();
    render();
  } catch(err){
    if(msg){ msg.style.background='#2a0f0f'; msg.style.color='#e07070'; msg.textContent='❌ Fehler: '+err.message; }
  }
}

    </div>
    <div id="ped-results" style="border:1px solid var(--border);border-radius:0 0 var(--radius-sm) var(--radius-sm);overflow:hidden;max-width:500px;display:none"></div>
  </div>
  <div class="empty-state"><div class="icon">🌳</div>Stammbaum-Suche: Tippe einen Namen oder eine Ringnummer ein</div>`;

function bindPedSearch(){
  const inp=document.getElementById('ped-inp');
  const res=document.getElementById('ped-results');
  if(!inp||!res) return;
  inp.addEventListener('input',()=>{
    const q=inp.value.trim();
    if(q.length<1){ res.style.display='none'; res.innerHTML=''; return; }
    // Intelligente Suche wie im Tauben-Reiter
    function pedSegs(rn){ return (rn||'').split(/[^\d]+/).filter(s=>s); }
    function pedStripZ(v){ return v.replace(/^0+/,'')||'0'; }
    const modeA = q.match(/^(\d{2,4})[\/\-](\d{1,6})$/);
    const isNum  = /^\d+$/.test(q);
    let hits;
    if(modeA){
      const p1=modeA[1],p2=modeA[2];
      const isYear=v=>(v.length===4&&parseInt(v)>=1900)||(v.length===2);
      const yr=isYear(p1)?p1:p2, num=isYear(p1)?p2:p1;
      const yrFull=yr.length===2?'20'+yr:yr;
      hits=S.pigeons.filter(p=>{
        if(String(p.date_year)!==yrFull) return false;
        const segs=pedSegs(p.ringnumber||p.ringnumberold||'');
        const last=segs[segs.length-1]||'';
        return pedStripZ(last)===pedStripZ(num);
      }).sort((a,b)=>(ring(a)||'').localeCompare(ring(b))).slice(0,12);
    } else if(isNum){
      const scored=[];
      S.pigeons.forEach(p=>{
        const segs=pedSegs(p.ringnumber||p.ringnumberold||'');
        const last=segs[segs.length-1]||'';
        const lastEx=pedStripZ(last)===pedStripZ(q);
        const nameEx=(p.name||'').split(/\s+/).some(w=>w===q);
        const rnCont=(p.ringnumber||'').replace(/[^\d]/g,'').includes(q);
        if(lastEx) scored.push({p,s:1});
        else if(nameEx) scored.push({p,s:2});
        else if(rnCont) scored.push({p,s:3});
      });
      scored.sort((a,b)=>a.s!==b.s?a.s-b.s:(b.p.date_year||0)-(a.p.date_year||0));
      hits=scored.map(x=>x.p).slice(0,12);
    } else {
      const ql=q.toLowerCase();
      const mixM=q.match(/^(.+?)\s+(\d{1,6})$/) || q.match(/^(\d{1,6})\s+(.+)$/);
      if(mixM){
        const numP=mixM[1].match(/^\d+$/)?mixM[1]:mixM[2];
        const txtP=(mixM[1].match(/^\d+$/)?mixM[2]:mixM[1]).toLowerCase();
        const scored=[];
        S.pigeons.forEach(p=>{
          const nM=((p.name||'').toLowerCase()).includes(txtP);
          const segs=pedSegs(p.ringnumber||''); const last=segs[segs.length-1]||'';
          const numM=pedStripZ(last)===pedStripZ(numP)||segs.some(s=>s===numP);
          if(nM&&numM) scored.push({p,s:1});
          else if(nM)  scored.push({p,s:2});
          else if(numM)scored.push({p,s:3});
        });
        scored.sort((a,b)=>a.s!==b.s?a.s-b.s:(b.p.date_year||0)-(a.p.date_year||0));
        hits=scored.map(x=>x.p).slice(0,12);
      } else {
        hits=S.pigeons.filter(p=>(p.ringnumber||'').toLowerCase().includes(ql)
          ||(p.name||'').toLowerCase().includes(ql)
          ||(p.color||'').toLowerCase().includes(ql)
          ||(p.strain||'').toLowerCase().includes(ql)
          ||(p.breeder||'').toLowerCase().includes(ql)).slice(0,12);
      }
    }
    res.style.display='block';
    res.innerHTML=hits.length ? hits.map(p=>`
      <div class="ped-result" onclick="showPedigree('${p.pigeonid}')">
        <span class="ring">${escH(ring(p))}</span>
        ${p.name?`<span style="color:var(--text)">${escH(p.name)}</span>`:''}
        <span style="color:var(--text3);font-size:12px;margin-left:auto">${sex_(p)==='M'?'♂':sex_(p)==='F'?'♀':'?'} ${p.date_year||''}</span>
      </div>`).join('')
    : '<div style="padding:12px;color:var(--text3);font-size:13px">Keine Tauben gefunden</div>';
  });
}

// ── DRUCK / PDF ────────────────────────────────────────────────
function printPedigree(pid, gens){
  try{
    gens = parseInt(gens)||4;
    const root = findById(pid);
    if(!root){ alert('Taube nicht gefunden'); return; }

    const _esc    = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const _ring   = p => p?(p.ringnumber||p.ringnumberold||'—'):'—';
    const _sex    = p => { if(!p) return '?'; const g=(p.gender||p.sex||'').toUpperCase(); return g==='M'||g==='MALE'||g==='COCK'?'M':g==='F'||g==='FEMALE'||g==='HEN'?'F':'?'; };
    const _father = p => { if(!p) return null; if(p.fatherid) return S.pigeons.find(x=>x.pigeonid===p.fatherid)||null; if(p.ringnumberfather) return S.pigeons.find(x=>x.ringnumber===p.ringnumberfather)||null; return null; };
    const _mother = p => { if(!p) return null; if(p.motherid) return S.pigeons.find(x=>x.pigeonid===p.motherid)||null; if(p.ringnumbermother) return S.pigeons.find(x=>x.ringnumber===p.ringnumbermother)||null; return null; };

    // Baum aufbauen
    function buildTree(p, gen, pos, arr){
      if(!arr[gen]) arr[gen]=[];
      arr[gen][pos]=p||null;
      if(gen>=gens-1) return;
      buildTree(_father(p), gen+1, pos*2,   arr);
      buildTree(_mother(p), gen+1, pos*2+1, arr);
    }
    const tree=[];
    buildTree(root, 0, 0, tree);

    const rows   = Math.pow(2, gens-1);   // 8 (4gen) oder 16 (5gen)
    const rowHmm = Math.floor(272/rows);  // volle Seitenhöhe nutzen
    // Spaltenbreiten: kein Header-Overhead mehr → volle Breite für Daten
    // Verbinder: 5mm, Rest gleichmäßig auf Datenspalten
    const totalConn = (gens-1)*5;
    const datWmm    = Math.floor((190 - totalConn) / gens);
    const conWmm    = 5;

    // Box-HTML — Infomenge abhängig von Generation und verfügbarem Platz
    function box(p, gen){
      if(!p) return `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:7pt">–</div>`;
      const sx   = _sex(p);
      const col  = sx==='M'?'#3a7bd5':sx==='F'?'#8e44ad':'#888';
      const tags = [p.color, p.strain, p.breeder?'Z: '+p.breeder:null].filter(Boolean);
      const info = (p.info||'').trim();
      const rn   = _ring(p);

      // Schriftgrößen je nach Generation
      const szRing = gen===0?'8pt':gen===1?'7.5pt':gen===2?'7pt':'6.5pt';
      const szName = gen===0?'9pt':gen===1?'8pt':gen===2?'7.5pt':'6.5pt';
      const szTag  = gen===0?'7pt':gen===1?'6.5pt':'6pt';
      const szInfo = gen===0?'7.5pt':gen===1?'7pt':gen===2?'6.5pt':'6pt';
      const showTags = gen<=3;
      const showInfo = gen<=2 && info;  // Info nur bei Proband, Eltern, Großeltern

      // Info-Feld bekommt flex:1 → füllt restliche Box-Höhe vollständig aus
      // kein max-height, kein Zeichenlimit → voller Text
      return `<div style="border-left:2mm solid ${col};padding:1.5mm 2mm;background:#fafafa;border-radius:.8mm;width:100%;height:100%;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column">
        <div style="font-family:monospace;font-size:${szRing};font-weight:700;color:#1a6b1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0">
          ${sx==='M'?'♂':sx==='F'?'♀':'?'} ${_esc(rn)}</div>
        ${p.name?`<div style="font-size:${szName};font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.3mm;flex-shrink:0">${_esc(p.name)}</div>`:''}
        ${showTags&&tags.length?`<div style="font-size:${szTag};color:#666;margin-top:.4mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0">${tags.map(_esc).join(' · ')}</div>`:''}
        ${showInfo?`<div style="font-size:${szInfo};color:#333;margin-top:1mm;border-top:.2mm solid #ddd;padding-top:.5mm;line-height:1.45;overflow:hidden;flex:1;word-break:break-word">${_esc(info)}</div>`:''}
      </div>`;
    }


    // Grid-Template ohne Header-Zeile
    let gtc='';
    for(let g=0;g<gens;g++){ gtc+=datWmm+'mm'; if(g<gens-1) gtc+=' '+conWmm+'mm '; }
    const gtr = 'repeat('+rows+','+rowHmm+'mm)';  // keine Header-Zeile!

    let cells='';
    for(let g=0;g<gens;g++){
      const count  = Math.pow(2,g);
      const span   = rows/count;
      const gridCol= g*2+1;
      for(let i=0;i<count;i++){
        const p   = tree[g]?tree[g][i]:null;
        const rs  = i*span+1;  // +1 (kein Header)
        const re  = rs+span;
        cells+=`<div style="grid-column:${gridCol};grid-row:${rs}/${re};padding:.5mm;border-bottom:.15mm solid #e8e8e8;border-right:.15mm solid #e8e8e8;box-sizing:border-box">${box(p,g)}</div>`;
      }
      // Verbinder
      if(g<gens-1){
        const cc=g*2+2;
        for(let i=0;i<count;i++){
          const rs=i*span+1, mid=rs+span/2, re=rs+span;
          cells+=`<div style="grid-column:${cc};grid-row:${rs}/${mid};position:relative">
            <svg style="position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible" preserveAspectRatio="none">
              <line x1="0" y1="50%" x2="100%" y2="50%" stroke="#aaa" stroke-width=".3mm"/>
              <line x1="0" y1="50%" x2="0" y2="100%" stroke="#aaa" stroke-width=".3mm"/>
            </svg></div>`;
          cells+=`<div style="grid-column:${cc};grid-row:${mid}/${re};position:relative">
            <svg style="position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible" preserveAspectRatio="none">
              <line x1="0" y1="50%" x2="100%" y2="50%" stroke="#aaa" stroke-width=".3mm"/>
              <line x1="0" y1="0" x2="0" y2="50%" stroke="#aaa" stroke-width=".3mm"/>
            </svg></div>`;
        }
      }
    }

    const sx=_sex(root);
    const today=new Date().toLocaleDateString('de-DE');

    const html=`<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8">
<title>Stammbaum – ${_esc(root.name||_ring(root))}</title>
<style>
  @page{size:A4 portrait;margin:8mm 8mm 8mm 8mm}
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
  body{width:194mm;background:#fff;color:#111}
  @media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head><body>
<div style="margin-bottom:2.5mm;border-bottom:.3mm solid #ccc;padding-bottom:2mm;display:flex;justify-content:space-between;align-items:flex-end">
  <div>
    <div style="font-size:12pt;font-weight:700">🕊 ${_esc(root.name||_ring(root))}</div>
    <div style="font-size:7pt;color:#555;margin-top:.5mm">
      ${_esc(_ring(root))} &nbsp;·&nbsp;
      ${sx==='M'?'♂ Täuber':sx==='F'?'♀ Täubin':'?'} &nbsp;·&nbsp;
      Jg. ${root.date_year||'—'}
      ${root.color?' &nbsp;·&nbsp; '+_esc(root.color):''}
      &nbsp;·&nbsp; ${gens} Generationen
    </div>
  </div>
  <div style="font-size:7pt;color:#aaa">${today} · Brieftauben-Verwaltung</div>
</div>
<div style="display:grid;grid-template-columns:${gtc};grid-template-rows:${gtr};border:.3mm solid #ccc;width:194mm">
  ${cells}
</div>
</body></html>`;

    const blob=new Blob([html],{type:'text/html;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.target='_blank'; a.rel='noopener';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),15000);
  } catch(e){
    alert('Druckfehler: '+e.message+'\n'+e.stack);
  }
}

function setPaarungVogel(id){
  const p=findById(id);
  if(!p) return;
  if(sex_(p)==='M') S.paarungM=p;
  else if(sex_(p)==='F') S.paarungF=p;
  showTab('paarung');
}

function renderPaarung(){
  const ib = S.paarungM && S.paarungF ? calcInbreedingPair(S.paarungM, S.paarungF) : null;
  const ibClass = ib===null?'':ib<0.03?'low':ib<0.1?'mid':'high';
  const sharedAnc = S.paarungM && S.paarungF ? (() => {
    const fa=getAncestors(S.paarungM,4), ma=getAncestors(S.paarungF,4);
    const shared=[...fa].filter(x=>ma.has(x)).filter(id=>![S.paarungM.pigeonid,S.paarungF.pigeonid].includes(id));
    return shared.map(id=>S.pigeons.find(p=>p.pigeonid===id)).filter(Boolean);
  })() : [];

  function birdPicker(role, current, label, sx){
    const id_prefix = role+'_';
    return `<div class="card">
      <div class="card-title">${label}</div>
      ${current?`
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">

            <div style="font-size:15px;font-weight:500">${escH(current.name||ring(current))}</div>
            <div style="font-family:monospace;font-size:12px;color:var(--green)">${escH(ring(current))}</div>
            <div style="font-size:11px;color:var(--text3);margin-top:2px">${current.date_year||''} ${current.color?'· '+escH(current.color):''}</div>
          </div>
          <button class="btn btn-outline btn-sm" onclick="S.${role}=null;render()">✕ Ändern</button>
        </div>`
      :`<div class="autocomplete-wrap" style="margin-bottom:8px">
        <div class="search-wrap"><span class="search-icon">🔍</span>
          <input id="${id_prefix}inp" type="text" placeholder="Ringnummer oder Name…" autocomplete="off">
        </div>
        <div class="autocomplete-drop" id="${id_prefix}drop"></div>
      </div>
      <div style="font-size:12px;color:var(--text3)">Nur ${sx==='M'?'Täuber':'Täubin'} werden angezeigt</div>`}
    </div>`;
  }

  return `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
      ${birdPicker('paarungM', S.paarungM, '♂ Täuber wählen','M')}
      ${birdPicker('paarungF', S.paarungF, '♀ Täubin wählen','F')}
    </div>
    ${S.paarungM && S.paarungF ? `
    <div class="card">
      <div class="card-title serif" style="font-size:18px">Ergebnis: ${escH(label_(S.paarungM))} × ${escH(label_(S.paarungF))}</div>
      <div class="ibc-result">
        <div class="ibc-num ${ibClass}">${(ib*100).toFixed(2)} %</div>
        <div class="ibc-label">Berechneter Inzuchtkoeffizient der Nachkommen (5 Generationen)</div>
        <div style="margin-top:10px;font-size:12px;color:var(--text3)">
          ${ib<0.01?'✅ Sehr gering — unbedenklich':ib<0.03?'✅ Gering — akzeptabel':ib<0.065?'⚠️ Moderat — mit Bedacht einsetzen':ib<0.1?'⚠️ Erhöht — kritisch prüfen':'🚫 Hoch — Paarung nicht empfohlen'}
        </div>
      </div>
      ${sharedAnc.length?`
      <div class="section-label">Gemeinsame Vorfahren (bis 4. Generation)</div>
      <div class="tag-list">
        ${sharedAnc.map(p=>`<div class="tag">${escH(ring(p))}${p.name?`<strong>${escH(p.name)}</strong>`:''}</div>`).join('')}
      </div>`:'<div style="margin-top:12px;font-size:13px;color:var(--text3)">Keine gemeinsamen Vorfahren in 4 Generationen gefunden.</div>'}
    </div>` : `<div class="empty-state"><div class="icon">💑</div>Wähle einen Täuber und eine Täubin, um den Inzuchtkoeffizienten der Nachkommen zu berechnen.</div>`}`;
}

// Alle Generationsschlüssel in Reihenfolge (Urgroßeltern zuerst → Proband zuletzt speichern)

  'ff','fm','mf','mm',                               // Großeltern

      : `<select onchange="SCAN.actions['${k}']=this.value;render()"

    // Diff-Vorschau bei Update

      if(diffs.length){
        diffPreview=`<div style="margin-top:6px;font-size:11px;color:var(--text3)">

            <span style="color:var(--text3)">${f.l}:</span>

        diffPreview=`<div style="margin-top:4px;font-size:11px;color:var(--text3)">Keine neuen Felder</div>`;
      }
    }

    return `<tr>

/* ── Datei einlesen ── */
function handleScanFile(file){
  if(!file) return;
  if(file.size>10*1024*1024){ alert('Datei zu groß (max. 10 MB)'); return; }
  SCAN.imageMediaType = file.type||'image/jpeg';
  const reader = new FileReader();
  reader.onload = e => {
    SCAN.imageData    = e.target.result.split(',')[1];
    SCAN.imagePreview = e.target.result;
    SCAN.step = 'analyzing';
    render();
    runScanAI();
  };
  reader.readAsDataURL(file);
}

/* ── KI-Analyse ── */
async function runScanAI(){
  const setS = t => { const el=document.getElementById('scan-status'); if(el) el.textContent=t; };
  try {
    setS('Verbinde mit KI-Service…');
    const resp = await fetch(EDGE_SCAN_URL, {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+(AUTH.token||SUPA_KEY),
        'apikey':SUPA_KEY
      },
      body: JSON.stringify({imageData:SCAN.imageData, mediaType:SCAN.imageMediaType})
    });
    const json = await resp.json();
    if(!resp.ok||!json.ok) throw new Error(json.error||`HTTP ${resp.status}`);

    // Ergebnis in SCAN.pigeons speichern
    const d = json.data||{};
    PED_KEYS.forEach(k => { if(d[k]?.ringnumber) SCAN.pigeons[k]=d[k]; });

    setS('Abgleich mit Datenbank…');
    // DB-Abgleich für alle gefundenen Tauben
    const norm = s => String(s||'').trim().toLowerCase().replace(/[\s\-.]/g,'');
    PED_KEYS.forEach(k => {
      const p = SCAN.pigeons[k];
      if(!p) return;
      SCAN.matches[k] = S.pigeons.find(x =>
        norm(x.ringnumber)===norm(p.ringnumber) ||
        norm(x.ringnumberold)===norm(p.ringnumber)
      ) || null;
      // Standard-Aktion setzen
      SCAN.actions[k] = SCAN.matches[k] ? 'update' : 'new';
    });

    SCAN.step = 'result';
    render();
  } catch(err){
    SCAN.pigeons = { proband:{ _error:err.message, ringnumber:'' } };
    SCAN.step = 'result';
    render();
  }
}

/* ── Speichern ── */
async function executeScanSave(){
  SCAN.step = 'saving';
  render();
  const setS = t => { const el=document.getElementById('scan-save-status'); if(el) el.textContent=t; };

  // UUID-Map aufbauen: ringnumber → pigeonid (für Elternverknüpfung)
  const uuidMap = {}; // ringnumber → uuid
  S.pigeons.forEach(p => { if(p.ringnumber) uuidMap[p.ringnumber]=p.pigeonid; });

  // Eltern-Beziehungen aus dem Scan-Baum ableiten
  const parentMap = {
    proband:  { f:'father',   m:'mother'   },
    father:   { f:'ff',       m:'fm'       },
    mother:   { f:'mf',       m:'mm'       },
    ff:       { f:'fff',      m:'ffm'      },
    fm:       { f:'fmf',      m:'fmm'      },
    mf:       { f:'mff',      m:'mfm'      },
    mm:       { f:'mmf',      m:'mmm'      },
  };

  // Urgroßeltern → Großeltern → Eltern → Proband
  for(const k of PED_KEYS){
    const p   = SCAN.pigeons[k];
    const act = SCAN.actions[k];
    if(!p?.ringnumber || act==='skip') continue;

    setS(`Verarbeite: ${p.ringnumber}…`);

    // Eltern-UUIDs nachschlagen
    const par = parentMap[k];
    let fatherid=null, motherid=null;
    if(par){
      const fKey=par.f, mKey=par.m;
      const fP=SCAN.pigeons[fKey], mP=SCAN.pigeons[mKey];
      if(fP?.ringnumber) fatherid = uuidMap[fP.ringnumber] || null;
      if(mP?.ringnumber) motherid = uuidMap[mP.ringnumber] || null;
    }
    // Auch aus ringnumberfather/mother des Scans
    if(!fatherid && p.ringnumberfather) fatherid = uuidMap[p.ringnumberfather]||null;
    if(!motherid && p.ringnumbermother) motherid = uuidMap[p.ringnumbermother]||null;

    const row = {
      ringnumber:       p.ringnumber||null,
      name:             p.name||null,
      date_year:        p.date_year?Number(p.date_year):null,
      gender:           p.gender||null,
      color:            p.color||null,
      race:             p.race||null,
      strain:           p.strain||null,
      breeder:          p.breeder||null,
      owner:            p.owner||null,
      countrycode:      p.countrycode||null,
      associationno:    p.associationno||null,
      ringnumberfather: p.ringnumberfather||null,
      ringnumbermother: p.ringnumbermother||null,
      fatherid, motherid,
    };
    // Null-Felder entfernen
    Object.keys(row).forEach(k2=>{ if(row[k2]===null) delete row[k2]; });

    try {
      if(act==='new'){
        const newId = crypto.randomUUID();
        row.pigeonid = newId;
        row.deleted  = false;
        row.instock  = true;
        await apiPost('pigeons', row);
        uuidMap[p.ringnumber] = newId;
      } else if(act==='update'){
        const m = SCAN.matches[k];
        // Nur Felder die leer sind oder sich geändert haben
        const updates={};
        Object.keys(row).forEach(f2=>{
          if(f2==='pigeonid') return;
          if(row[f2]!==undefined && String(row[f2])!==String(m[f2]||'')) updates[f2]=row[f2];
        });
        if(Object.keys(updates).length) await apiPatch('pigeons', m.pigeonid, updates);
        uuidMap[p.ringnumber] = m.pigeonid;
      }
    } catch(e){ console.warn('Fehler bei '+p.ringnumber+':', e.message); }
  }

  setS('Lade Datenbank neu…');
  await loadData();

  // Zum Probanden navigieren
  const probandRing = SCAN.pigeons['proband']?.ringnumber;
  scanReset();
  if(probandRing){
    const found = S.pigeons.find(p=>p.ringnumber===probandRing);
    if(found) { selectPigeon(found.pigeonid); return; }
  }
  showTab('tauben');
}

async function submitNeu(e){
  e.preventDefault();
  const fd=new FormData(e.target);
  const row={};
  for(const [k,v] of fd.entries()){ if(v!=='') row[k]=v; }
  if(!row.pigeonid) row.pigeonid=crypto.randomUUID();
  if(row.date_year) row.date_year=Number(row.date_year);
  row.deleted=false; row.instock=true;
  if(row.ontrip) row.ontrip=(row.ontrip==='true');
  if(!row.pigeonstateid) delete row.pigeonstateid;
  const msg=document.getElementById('form-msg');
  msg.style.display='block';
  msg.className='form-msg';
  msg.textContent='Speichern…';
  try{
    await apiPost('pigeons',row);
    msg.className='form-msg ok';
    msg.textContent='✅ Taube erfolgreich gespeichert!';
    e.target.reset();
    await loadData();
  } catch(err){
    msg.className='form-msg err';
    msg.textContent='❌ Fehler: '+err.message;
  }
}

  const instock=S.pigeons.filter(p=>p.instock).length;
  const withBoth=S.pigeons.filter(p=>(p.fatherid||p.ringnumberfather)&&(p.motherid||p.ringnumbermother)).length;

    <div class="card">

function bindAC(inpId, dropId, filterSex, onSelect){
  const inp=document.getElementById(inpId);
  const drop=document.getElementById(dropId);
  if(!inp||!drop) return;
  inp.addEventListener('input',()=>{
    const q=inp.value.trim().toLowerCase();
    if(q.length<2){ drop.classList.remove('open'); drop.innerHTML=''; return; }
    let hits=S.pigeons.filter(p=>(p.ringnumber||'').toLowerCase().includes(q)||(p.name||'').toLowerCase().includes(q));
    if(filterSex) hits=hits.filter(p=>sex_(p)===filterSex);
    hits=hits.slice(0,8);
    drop.innerHTML=hits.length ? hits.map(p=>`
      <div class="ac-item" onclick="(${onSelect.toString()})('${p.pigeonid}')">
        <span class="ac-ring">${escH(ring(p))}</span>
        ${p.name?`<span>${escH(p.name)}</span>`:''}
        <span style="color:var(--text3);font-size:11px;margin-left:auto">${p.date_year||''}</span>
      </div>`).join('')
    : '<div class="ac-item" style="cursor:default;color:var(--text3)">Keine Treffer</div>';
    drop.classList.toggle('open', hits.length>0||true);
  });
  document.addEventListener('click', e=>{ if(!inp.contains(e.target)&&!drop.contains(e.target)) drop.classList.remove('open'); });
}

function statusStyle(p){
  if(p.died) return {label:'Verstorben',color:'#e07070',bg:'#1e0f0f'};
  if(p.sold) return {label:'Verkauft',color:'var(--orange)',bg:'#2a1a0a'};
  if(p.instock===false) return {label:'Nicht im Bestand',color:'#c8883a',bg:'#2a1a0a'};
  if(sex_(p)==='M') return {label:'Täuber (aktiv)',color:'#7ab3e0',bg:'#1a2d4a'};
  if(sex_(p)==='F') return {label:'Täubin (aktiv)',color:'#c97fd4',bg:'#2d1a3d'};
  return {label:'Im Bestand',color:'var(--green)',bg:'color-mix(in srgb,var(--green) 10%,var(--bg3))'};
}

function birdCard(p){
  var via=p._via?findById(p._via):null;
  return '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;cursor:pointer;transition:border-color .15s"'
    +' onmouseover="this.style.borderColor=\'var(--green)\'" onmouseout="this.style.borderColor=\'var(--border)\'"'
    +' onclick="selectPigeon(\''+p.pigeonid+'\')">'
    +'<div style="font-family:monospace;font-size:11px;color:var(--green)">'+escH(ring(p))+'</div>'
    +(p.name?'<div style="font-size:13px;font-weight:500;color:var(--text);margin-top:2px">'+escH(p.name)+'</div>':'')
    +'<div style="font-size:11px;color:var(--text3);margin-top:3px">'
    +[p.date_year,p.color,p.strain].filter(Boolean).map(escH).join(' · ')
    +'</div>'
    +(via?'<div style="font-size:10px;color:var(--text3);margin-top:3px">via <span style="font-family:monospace;color:var(--blue)">'+escH(ring(via))+'</span></div>':'')
    +'<div style="display:flex;gap:6px;margin-top:7px">'
    +'<span onclick="event.stopPropagation();showPedigree(\''+p.pigeonid+'\')" style="font-size:11px;color:var(--text3);cursor:pointer;padding:2px 7px;border:1px solid var(--border);border-radius:4px"'
    +' onmouseover="this.style.color=\'var(--green)\'" onmouseout="this.style.color=\'var(--text3)\'">🌳 Stamm</span>'
    +'<span onclick="event.stopPropagation();showNachkommen(\''+p.pigeonid+'\')" style="font-size:11px;color:var(--text3);cursor:pointer;padding:2px 7px;border:1px solid var(--border);border-radius:4px"'
    +' onmouseover="this.style.color=\'var(--green)\'" onmouseout="this.style.color=\'var(--text3)\'">🐣 Kinder</span>'
    +'</div></div>';
}

function renderGen(arr,gen){
  if(!arr.length) return '<div style="color:var(--text3);font-size:13px;padding:8px 0">Keine '+gen+' in der Datenbank erfasst.</div>';
  var groups={};
  arr.forEach(function(p){
    var st=statusStyle(p);
    if(!groups[st.label]) groups[st.label]={style:st,birds:[]};
    groups[st.label].birds.push(p);
  });
  return Object.values(groups).map(function(g){
    return '<div style="margin-bottom:14px">'
      +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'
      +'<span style="background:'+g.style.bg+';color:'+g.style.color+';padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500">'+g.style.label+'</span>'
      +'<span style="font-size:12px;color:var(--text3)">'+g.birds.length+' Taube'+(g.birds.length!==1?'n':'')+'</span>'
      +'</div>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px">'
      +g.birds.map(birdCard).join('')
      +'</div></div>';
  }).join('');
}

function renderNachkommen(pid){
  var root=findById(pid);
  if(!root) return '<div style="padding:20px;color:var(--text3)">Taube nicht gefunden.</div>';
  function dedup(arr){var seen=new Set();return arr.filter(function(p){if(seen.has(p.pigeonid))return false;seen.add(p.pigeonid);return true;});}
  var children=findChildren(pid);
  var gc=dedup(children.flatMap(function(c){return findChildren(c.pigeonid).map(function(g){return Object.assign({},g,{_via:c.pigeonid});});}));
  var ggc=dedup(gc.flatMap(function(g){return findChildren(g.pigeonid).map(function(gg){return Object.assign({},gg,{_via:g.pigeonid});});}));
  var allDesc=dedup(children.concat(gc).concat(ggc));
  var total=allDesc.length;
  var active=allDesc.filter(function(p){return p.instock;}).length;
  var died=allDesc.filter(function(p){return p.died;}).length;
  var sold=allDesc.filter(function(p){return p.sold;}).length;
  var sx=sex_(root);

  var kpis=[['Nachkommen',total,'var(--green)'],['Kinder',children.length,'var(--blue)'],['Enkel',gc.length,'var(--purple)'],['Urenkel',ggc.length,'var(--text2)'],['Im Bestand',active,'var(--green)'],['Verstorben',died,'#e07070'],['Verkauft',sold,'var(--orange)']];
  var kpiHtml=kpis.map(function(k){
    return '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;text-align:center">'
      +'<div style="font-family:\'Playfair Display\',serif;font-size:24px;color:'+k[2]+';font-weight:600">'+k[1]+'</div>'
      +'<div style="font-size:11px;color:var(--text3);margin-top:3px">'+k[0]+'</div></div>';
  }).join('');

  var gens=[['🐣 Kinder (1. Generation)',children,'Kinder'],['🐓 Enkel (2. Generation)',gc,'Enkel'],['🥚 Urenkel (3. Generation)',ggc,'Urenkel']];
  var genHtml=gens.map(function(g){
    return '<div class="card" style="margin-bottom:12px">'
      +'<div class="card-title">'+g[0]+' <span style="color:var(--text3);font-weight:400">('+g[1].length+')</span></div>'
      +renderGen(g[1],g[2])+'</div>';
  }).join('');

  return '<button class="back-btn" onclick="S.selectedNach=null;render()">← Nachkommen-Suche</button>'
    +'<div class="card" style="margin-bottom:12px">'
    +'<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px">'
    +'<div>'
    +'<div class="serif" style="font-size:22px">'+escH(root.name||ring(root))+'</div>'
    +'<div style="font-family:monospace;font-size:13px;color:var(--green);margin-top:4px">'
    +escH(ring(root))+' · '+(sx==='M'?'♂ Täuber':sx==='F'?'♀ Täubin':'?')+' · Jg. '+(root.date_year||'—')
    +'</div></div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap">'
    +'<button class="btn btn-outline btn-sm" onclick="selectPigeon(\''+root.pigeonid+'\')">Details</button>'
    +'<button class="btn btn-outline btn-sm" onclick="showPedigree(\''+root.pigeonid+'\')">🌳 Stammbaum</button>'
    +'</div></div>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px">'+kpiHtml+'</div>'
    +'</div>'+genHtml;
}

function bindNachSearch(){
  var inp=document.getElementById('nach-inp');
  var res=document.getElementById('nach-results');
  if(!inp||!res) return;
  inp.addEventListener('input',function(){
    var q=inp.value.trim();
    if(q.length<2){res.style.display='none';res.innerHTML='';return;}
    var hits=S.pigeons.filter(function(p){
      return (p.ringnumber||'').toLowerCase().indexOf(q.toLowerCase())!==-1
          ||(p.name||'').toLowerCase().indexOf(q.toLowerCase())!==-1;
    }).slice(0,10);
    res.style.display='block';
    res.innerHTML=hits.length?hits.map(function(p){
      return '<div class="ped-result" onclick="showNachkommen(\''+p.pigeonid+'\')">'
        +'<span class="ring">'+escH(ring(p))+'</span>'
        +(p.name?'<span style="color:var(--text)">'+escH(p.name)+'</span>':'')
        +'<span style="color:var(--text3);font-size:12px;margin-left:auto">'+(sex_(p)==='M'?'♂':'♀')+' '+(p.date_year||'')+'</span>'
        +'</div>';
    }).join(''):'<div style="padding:12px;color:var(--text3);font-size:13px">Keine Treffer</div>';
  });
}

// ── App-Start: Session prüfen ─────────────────────────────────
(async function(){
  const ok = await restoreSession();
  if(ok){
    startApp();
  } else {
    renderLogin();
  }
})();
</script>
