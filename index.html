function renderNachkommen(pid){
  var root=findById(pid);
  if(!root) return '<div style="padding:20px;color:var(--text3)">Taube nicht gefunden.</div>';
  function dedup(arr){var seen=new Set();return arr.filter(function(p){if(seen.has(p.pigeonid))return false;seen.add(p.pigeonid);return true;});}
  var children=findChildren(pid);
  var gc=dedup(children.flatMap(function(c){return findChildren(c.pigeonid).map(function(g){return Object.assign({},g,{_via:c.pigeonid});});}));
  var ggc=dedup(gc.flatMap(function(g){return findChildren(g.pigeonid).map(function(gg){return Object.assign({},gg,{_via:g.pigeonid});});}));
  var allDesc=dedup(children.concat(gc).concat(ggc));
  var total=allDesc.length;
  var active=allDesc.filter(function(p){return p.instock;}).length;
  var died=allDesc.filter(function(p){return p.died;}).length;
  var sold=allDesc.filter(function(p){return p.sold;}).length;
  var sx=sex_(root);

  var kpis=[['Nachkommen',total,'var(--green)'],['Kinder',children.length,'var(--blue)'],['Enkel',gc.length,'var(--purple)'],['Urenkel',ggc.length,'var(--text2)'],['Im Bestand',active,'var(--green)'],['Verstorben',died,'#e07070'],['Verkauft',sold,'var(--orange)']];
  var kpiHtml=kpis.map(function(k){
    return '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;text-align:center">'
      +'<div style="font-family:\'Playfair Display\',serif;font-size:24px;color:'+k[2]+';font-weight:600">'+k[1]+'</div>'
      +'<div style="font-size:11px;color:var(--text3);margin-top:3px">'+k[0]+'</div></div>';
  }).join('');

  var gens=[['🐣 Kinder (1. Generation)',children,'Kinder'],['🐓 Enkel (2. Generation)',gc,'Enkel'],['🥚 Urenkel (3. Generation)',ggc,'Urenkel']];
  var genHtml=gens.map(function(g){
    return '<div class="card" style="margin-bottom:12px">'
      +'<div class="card-title">'+g[0]+' <span style="color:var(--text3);font-weight:400">('+g[1].length+')</span></div>'
      +renderGen(g[1],g[2])+'</div>';
  }).join('');

  return '<button class="back-btn" onclick="S.selectedNach=null;render()">← Nachkommen-Suche</button>'
    +'<div class="card" style="margin-bottom:12px">'
    +'<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px">'
    +'<div>'
    +'<div class="serif" style="font-size:22px">'+escH(root.name||ring(root))+'</div>'
    +'<div style="font-family:monospace;font-size:13px;color:var(--green);margin-top:4px">'
    +escH(ring(root))+' · '+(sx==='M'?'♂ Täuber':sx==='F'?'♀ Täubin':'?')+' · Jg. '+(root.date_year||'—')
    +'</div></div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap">'
    +'<button class="btn btn-outline btn-sm" onclick="selectPigeon(\''+root.pigeonid+'\')">Details</button>'
    +'<button class="btn btn-outline btn-sm" onclick="showPedigree(\''+root.pigeonid+'\')">🌳 Stammbaum</button>'
    +'</div></div>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px">'+kpiHtml+'</div>'
    +'</div>'+genHtml;
}

function bindNachSearch(){
  var inp=document.getElementById('nach-inp');
  var res=document.getElementById('nach-results');
  if(!inp||!res) return;
  inp.addEventListener('input',function(){
    var q=inp.value.trim();
    if(q.length<2){res.style.display='none';res.innerHTML='';return;}
    var hits=S.pigeons.filter(function(p){
      return (p.ringnumber||'').toLowerCase().indexOf(q.toLowerCase())!==-1
          ||(p.name||'').toLowerCase().indexOf(q.toLowerCase())!==-1;
    }).slice(0,10);
    res.style.display='block';
    res.innerHTML=hits.length?hits.map(function(p){
      return '<div class="ped-result" onclick="showNachkommen(\''+p.pigeonid+'\')">'
        +'<span class="ring">'+escH(ring(p))+'</span>'
        +(p.name?'<span style="color:var(--text)">'+escH(p.name)+'</span>':'')
        +'<span style="color:var(--text3);font-size:12px;margin-left:auto">'+(sex_(p)==='M'?'♂':'♀')+' '+(p.date_year||'')+'</span>'
        +'</div>';
    }).join(''):'<div style="padding:12px;color:var(--text3);font-size:13px">Keine Treffer</div>';
  });
}

// ── App-Start: Session prüfen ─────────────────────────────────
(async function(){
  const ok = await restoreSession();
  if(ok){
    startApp();
  } else {
    renderLogin();
  }
})();
</script>
