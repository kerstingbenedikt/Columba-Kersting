async function loadTrips(){
  try{ RT.trips = await apiGet('/trips?order=tripdate.desc,number.asc&limit=500')||[]; }
  catch(e){ RT.trips=[]; }
}
async function loadTripResults(tripid){
  try{ RT.results = await apiGet('/pigeontrips?tripid=eq.'+tripid+'&order=placement.asc&limit=500')||[]; }
  catch(e){ RT.results=[]; }
}

// ── Reiseleistung je Taube (Detailseite) ─────────────────────────
const PT_CACHE={}; // pigeonid -> array of pigeontrips rows (enriched with vintage/tripnumber/location)
// Manuell erfasste Jahresleistungen (Ergänzung für Saisons ohne importierte
// Einzelflüge, siehe Tabelle pigeon_manual_seasons) — komplett im Voraus
// geladen (kleine Tabelle) und nach pigeonid gruppiert, siehe loadData().
let MANUAL_SEASONS_BY_PIGEON={};
// PT_CACHE hält pro Taube die geladenen Reise-Ergebnisse im Speicher (für die Dauer
// der Sitzung), damit nicht jede Ansicht neu vom Server lädt. Nach Änderungen, die
// diese Daten betreffen (RV-Zuordnung eines Züchters, RV-Ranglisten neu berechnen),
// MUSS der Cache geleert werden — sonst zeigen Stammbaumdruck & Reiseleistung einer
// bereits geöffneten Taube weiterhin die alten (falschen) Werte an.
function clearPTCache(){ Object.keys(PT_CACHE).forEach(k=>delete PT_CACHE[k]); }
async function loadPigeonTrips(pigeonid){
  if(PT_CACHE[pigeonid]) return PT_CACHE[pigeonid];
  try{
    const rows=await apiGet('/pigeontrips?pigeonid=eq.'+pigeonid+'&order=placement.asc&limit=1000')||[];
    if(!RT.trips.length) await loadTrips();
    const tripById={}; RT.trips.forEach(t=>{ tripById[t.tripid]=t; });
    const enriched=rows.map(r=>{
      const t=tripById[r.tripid]||{};
      return {...r, vintage:t.vintage||null, tripnumber:t.number||null, location:t.location||null,
        tripdate:t.tripdate||null, pigeonsset:t.pigeonsset||null,
        pigeonsset_rv:t.pigeonsset_rv||null, pigeonsset_rv_calc:t.pigeonsset_rv_calc||null, pigeonsset_reggr:t.pigeonsset_reggr||null, pigeonsset_reg:t.pigeonsset_reg||null,
        distance:t.averagedistance3!=null?Number(t.averagedistance3):null};
    });
    PT_CACHE[pigeonid]=enriched;
    return enriched;
  } catch(e){ PT_CACHE[pigeonid]=[]; return []; }
}

// Batch-Ladung der Reisedaten für mehrere Tauben auf einmal (z.B. eine Tabellenseite
// der Tauben-Übersicht) statt einer Einzelabfrage pro Taube.
async function loadPigeonTripsBatch(pigeonids){
  const missing=[...new Set(pigeonids.filter(id=>id && !PT_CACHE[id]))];
  if(!missing.length) return;
  try{
    if(!RT.trips.length) await loadTrips();
    const tripById={}; RT.trips.forEach(t=>{ tripById[t.tripid]=t; });
    const idsParam=missing.map(id=>`"${id}"`).join(',');
    const rows=await apiGet('/pigeontrips?pigeonid=in.('+idsParam+')&order=placement.asc&limit=20000')||[];
    const byPigeon={}; missing.forEach(id=>{ byPigeon[id]=[]; });
    rows.forEach(r=>{
      const t=tripById[r.tripid]||{};
      const enriched={...r, vintage:t.vintage||null, tripnumber:t.number||null, location:t.location||null,
        tripdate:t.tripdate||null, pigeonsset:t.pigeonsset||null,
        pigeonsset_rv:t.pigeonsset_rv||null, pigeonsset_rv_calc:t.pigeonsset_rv_calc||null, pigeonsset_reggr:t.pigeonsset_reggr||null, pigeonsset_reg:t.pigeonsset_reg||null,
        distance:t.averagedistance3!=null?Number(t.averagedistance3):null};
      if(!byPigeon[r.pigeonid]) byPigeon[r.pigeonid]=[];
      byPigeon[r.pigeonid].push(enriched);
    });
    missing.forEach(id=>{ PT_CACHE[id]=byPigeon[id]||[]; });
  }catch(e){ missing.forEach(id=>{ if(!PT_CACHE[id]) PT_CACHE[id]=[]; }); }
}
// Wie loadPigeonTripsBatch, aber in Häppchen (z.B. für CSV/PDF-Export über
// tausende Tauben hinweg oder die Vererbungsstärke-Auswertung), um die
// Query-URL nicht zu sprengen. Die Häppchen liefen vorher sequenziell
// (ein Chunk nach dem anderen) — bei vielen hundert/tausend Tauben summierte
// sich das schnell auf 20-30s+. Jetzt laufen mehrere Chunks parallel
// (begrenzte Nebenläufigkeit, damit wir das Backend nicht fluten).
async function loadPigeonTripsBatchChunked(pigeonids, chunkSize=150, concurrency=6){
  const missing=[...new Set(pigeonids.filter(id=>id && !PT_CACHE[id]))];
  if(!missing.length) return;
  // Referenztabelle (RT.trips) einmal vorab laden statt jeden Chunk einzeln
  // prüfen zu lassen — sonst würden mehrere parallele Chunks gleichzeitig
  // versuchen, sie zu laden.
  if(!RT.trips.length) await loadTrips();
  const chunks=[];
  for(let i=0;i<missing.length;i+=chunkSize) chunks.push(missing.slice(i,i+chunkSize));
  let next=0;
  async function worker(){
    while(next<chunks.length){
      const my=chunks[next++];
      await loadPigeonTripsBatch(my);
    }
  }
  await Promise.all(Array.from({length:Math.min(concurrency, chunks.length)}, worker));
}

// Kompakte Reiseleistungs-Kennzahlen einer Taube für die Tauben-Übersicht.
// Gibt null zurück, solange die Daten noch nicht geladen sind (Aufrufer zeigt "Lade…").
// Anzeigename der Listenkategorie eines manuell erfassten Einzelfluges.
const MANUAL_CATEGORY_LABELS={rv:'RV', regional:'Regional', reggr:'RegGr', zone:'Zone', national:'National', fg:'FG'};
function manualCategoryLabel(cat){ return MANUAL_CATEGORY_LABELS[cat]||cat||'—'; }

function pigeonReiseSummary(pigeonid){
  const rows=PT_CACHE[pigeonid];
  if(!rows) return null;
  if(!rows.length) return {gesetzt:0,preise:0,asSum:0,top10:0};
  let gesetzt=0,preise=0,asSum=0;
  rows.forEach(r=>{
    gesetzt++;
    const hasPreis=rvField(r,'prize_rv')!=null || r.prize_reggr!=null || r.prize_reg!=null || r.prize_fg!=null || r.manual_prize!=null;
    if(hasPreis) preise++;
    const asVals=[rvField(r,'as_rv'),r.as_fg,r.as_reg,r.as_nat,r.manual_as].filter(v=>v!=null && v!=='');
    if(asVals.length) asSum+=Math.max(...asVals.map(Number));
  });
  return {gesetzt, preise, asSum, top10:getTop10Placements(rows).length};
}

function groupPigeonTripsByYear(rows){
  const byYear={};
  rows.forEach(r=>{
    const yr=r.vintage||'—';
    if(!byYear[yr]) byYear[yr]={gesetzt:0,preise:0,asSum:0,top10:[]};
    byYear[yr].gesetzt++;
    const hasPreis = rvField(r,'prize_rv')!=null || r.prize_reggr!=null || r.prize_reg!=null || r.prize_fg!=null || r.manual_prize!=null;
    if(hasPreis) byYear[yr].preise++;
    const asVals=[rvField(r,'as_rv'),r.as_fg,r.as_reg,r.as_nat,r.manual_as].filter(v=>v!=null && v!=='');
    if(asVals.length) byYear[yr].asSum += Math.max(...asVals.map(Number));
    // Top10 je Flug nur einmal zählen (bester Platz der 3 Kategorien + manuell)
    const platzVals=[rvField(r,'prize_rv'),r.prize_reggr,r.prize_reg,r.manual_prize].filter(v=>v!=null && v>0 && v<=10);
    if(platzVals.length) byYear[yr].top10.push(Math.min(...platzVals));
  });
  return Object.keys(byYear).sort((a,b)=>b-a).map(yr=>({yr, ...byYear[yr],
    top10Str: byYear[yr].top10.length ? byYear[yr].top10.sort((a,b)=>a-b).join(', ') : ''}));
}

// Liest ein RV-Feld (prize_rv / as_rv / pigeonsset_rv) mit Fallback auf die
// selbst berechnete Variante (_calc-Spalte, siehe computeRVFallback/backfillRVFallback),
// falls das Feld aus dem echten Import leer ist. Für alle anderen Felder (RegGr/Reg)
// entspricht das einfach r[field] — dort gibt es keine berechnete Alternative, weil
// diese Listen nie fehlen.
function rvField(r, field){
  if(!r) return null;
  const calcField = field==='prize_rv'?'prize_rv_calc' : field==='as_rv'?'as_rv_calc' : field==='pigeonsset_rv'?'pigeonsset_rv_calc' : null;
  if(!calcField) return r[field];
  return r[field]!=null ? r[field] : r[calcField];
}
// Ermittelt die "gesetzt"-Zahl für die RV-Kategorie einer Ergebniszeile: echter
// Import (pigeonsset_rv) > eindeutig berechnet (pigeonsset_rv_calc) > bei einem
// Flug mit mehreren beteiligten RVs (gemeinsamer Auflass, siehe backfillRVFallback)
// die Zahl der als Standard markierten RV (siehe standardRVGesetztForTrip) > als
// letzter Rückfall die Gesamt-Teilnehmerzahl des Flugs in unserer DB (r.pigeonsset)
// — dieser letzte Fall ist nur eine grobe Notlösung und sollte dank Standard-RV
// kaum noch vorkommen.
function rvGesetzt(r){
  if(!r) return null;
  const v=rvField(r,'pigeonsset_rv');
  if(v!=null) return v;
  const std=standardRVGesetztForTrip(r.tripid);
  if(std!=null) return std;
  return r.pigeonsset;
}
// Top10-Platzierungen (RV/RegGr/Reg) über alle Kategorien, sortiert nach Platz
function getTop10Placements(rows){
  const CATS=[
    ['prize_rv','RV','pigeonsset_rv'],
    ['prize_reggr','RegGr','pigeonsset_reggr'],
    ['prize_reg','Reg','pigeonsset_reg']
  ];
  const out=[];
  rows.forEach(r=>{
    CATS.forEach(([field,label,gesetztField])=>{
      const platz=rvField(r,field);
      if(platz!=null && platz>0 && platz<=10){
        out.push({platz, kategorie:label+(field==='prize_rv'&&r.prize_rv==null?' *':''), tripnumber:r.tripnumber, location:r.location,
          tripdate:r.tripdate, vintage:r.vintage,
          gesetzt: field==='prize_rv' ? rvGesetzt(r) : (rvField(r,gesetztField)!=null?rvField(r,gesetztField):r.pigeonsset),
          distance:r.distance});
      }
    });
    if(r.manual_prize!=null && r.manual_prize>0 && r.manual_prize<=10){
      out.push({platz:r.manual_prize, kategorie:manualCategoryLabel(r.manual_category)+' (manuell)', tripnumber:r.tripnumber, location:r.location,
        tripdate:r.tripdate, vintage:r.vintage, gesetzt:r.manual_participants!=null?r.manual_participants:r.pigeonsset, distance:r.distance});
    }
  });
  return out.sort((a,b)=> a.platz-b.platz || String(b.tripdate).localeCompare(String(a.tripdate)));
}

// Wie getTop10Placements, aber max. 1 Haupteintrag pro Flug — dabei wird unter den
// Top-10-Platzierungen dieses Flugs NICHT einfach die niedrigste Platznummer gewählt,
// sondern die gegen die höchste Taubenzahl (eine Top-10-Platzierung gegen eine große
// Regionalverbands-Liste zählt mehr als ein besserer Platz in einer kleinen Liste).
// Qualifizieren sich für denselben Flug mehrere Kategorien (z.B. 1. RV UND 6. Reg),
// wird das nicht verworfen, sondern als Dopplung an den Haupteintrag angehängt
// (t.duplicates) und beim Druck mit ausgewiesen. Konfigurierbare Obergrenze für den
// Gesamt-Pool (Abstammungsdruck: Top-Liste je Taube).
function getTopPlacementsDeduped(rows, n){
  n = n||20;
  const CATS=[['prize_rv','pigeonsset_rv','RV'],['prize_reggr','pigeonsset_reggr','RegGr'],['prize_reg','pigeonsset_reg','Reg']];
  const out=[];
  rows.forEach(r=>{
    const candidates=[];
    CATS.forEach(([field,gesetztField,label])=>{
      const platz=rvField(r,field);
      if(platz!=null && platz>0){
        const kategorie = (field==='prize_rv' && r.prize_rv==null) ? label+' *' : label;
        candidates.push({platz, kategorie, gesetzt: field==='prize_rv' ? rvGesetzt(r) : (rvField(r,gesetztField)!=null?rvField(r,gesetztField):r.pigeonsset)});
      }
    });
    if(r.manual_prize!=null && r.manual_prize>0){
      candidates.push({platz:r.manual_prize, kategorie:manualCategoryLabel(r.manual_category)+' (manuell)', gesetzt:r.manual_participants!=null?r.manual_participants:r.pigeonsset});
    }
    if(!candidates.length) return;
    const top10=candidates.filter(c=>c.platz<=10);
    // Innerhalb der Top10 gewinnt die höchste Taubenzahl (bei Gleichstand die
    // niedrigere Platznummer); außerhalb der Top10 zählt weiterhin schlicht der
    // beste (niedrigste) Platz.
    const best = top10.length
      ? top10.slice().sort((a,b)=> (b.gesetzt||0)-(a.gesetzt||0) || a.platz-b.platz)[0]
      : candidates.slice().sort((a,b)=>a.platz-b.platz)[0];
    const duplicates = top10.filter(c=>c!==best).sort((a,b)=>a.platz-b.platz)
      .map(c=>({platz:c.platz, kategorie:c.kategorie}));
    if(best.platz<=n){
      out.push({platz:best.platz, kategorie:best.kategorie, gesetzt:best.gesetzt, tripnumber:r.tripnumber,
        location:r.location, tripdate:r.tripdate, vintage:r.vintage, distance:r.distance,
        duplicates:duplicates.length?duplicates:null});
    }
  });
  return out.sort((a,b)=> a.platz-b.platz || String(b.tripdate).localeCompare(String(a.tripdate))).slice(0,n);
}

// Kompakte Jahreszeilen für die Stammbaum-Boxen im Druck, z.B. "2025: 13/11 Preise 1.-2.-3.-Preis"
// (gesetzt/Preise je Jahr, plus die erzielten 1.-3. Plätze desselben Jahres, falls vorhanden).
function pigeonTravelCompactLines(pigeonid, maxYears){
  const rows = PT_CACHE[pigeonid];
  if(!rows || !rows.length) return [];
  const years = groupPigeonTripsByYear(rows).slice(0, maxYears);
  return years.map(y=>{
    const top3 = y.top10.filter(v=>v<=3).sort((a,b)=>a-b);
    const top3Str = top3.length ? ' '+top3.map(v=>v+'.').join('-')+'-Preis' : '';
    return `${y.yr}: ${y.gesetzt}/${y.preise} Preise${top3Str}`;
  });
}

// Auswahl der Platzierungen für den Druck: normalerweise die 5 besten. Gibt es darüber
// hinaus weitere einstellige Plätze (1.-9.) gegen hohe Taubenzahlen, werden bis zu
// insgesamt 10 Platzierungen gezeigt. "Hohe Taubenzahl" = ab HIGH_PIGEON_COUNT (aktuell
// 1000 gesetzte Tauben — bei Bedarf einfach anpassen).
const HIGH_PIGEON_COUNT = 1000;
function selectPrintPlacements(list){
  const top5 = list.slice(0,5);
  const bonus = list.slice(5).filter(t=>t.platz<=9 && t.gesetzt!=null && t.gesetzt>=HIGH_PIGEON_COUNT);
  return top5.concat(bonus).slice(0,10);
}

// Kompakte Top-Platzierungszeilen für die Stammbaum-Box (max. 1 Zeile pro Flug), z.B.
// "1. 450km 2356Tb. (Reg) · zugl. 6. RegGr" — Kategorie und ggf. eine Dopplung
// (Platzierung in einer weiteren Liste desselben Flugs) werden mit ausgewiesen.
function pigeonTopPlacementsCompactLines(pigeonid){
  const rows = PT_CACHE[pigeonid];
  if(!rows || !rows.length) return [];
  const full = getTopPlacementsDeduped(rows, 50);  // großzügiger Pool für die Auswahl
  return selectPrintPlacements(full).map(t=>
    `${t.platz}. ${t.distance!=null?Math.round(t.distance)+'km ':''}${t.gesetzt!=null?t.gesetzt+'Tb. ':''}${t.kategorie?'('+t.kategorie+')':''}`.trim()+
    `${t.duplicates?' · zugl. '+t.duplicates.map(d=>d.platz+'. '+d.kategorie).join(', '):''}`
  );
}

// Diese Gewichte steuern EINHEITLICH sowohl die Eigenleistung als auch die

// Anzeige im Stammbaum/Details, in der Nachkommen-Ansicht, im Paarungscheck

const SCORE_CFG_DEFAULT = {

  gewichtBestaendigkeit: 60,  // Gewichtung Beständigkeit (Preisquote) — von 100 Punkten je Teilscore

// Sättigungs-Schwellen für die "Gesamt"-Boni in computeQuoteScore: ab dieser
// absoluten Summe gilt der jeweilige Bonus als ausgereizt (100 Punkte). Die
// sqrt-Skalierung sorgt für spürbaren Anstieg schon bei kleineren Werten,
// statt (wie zuvor bei der Top-AS-Quote) hart bei einem winzigen Prozentwert
// zu sättigen.
const SCORE_PREISE_SAETTIGUNG = 20;    // Gesamtzahl Preise für vollen Beständigkeits-Bonus
const SCORE_AS_SUM_SAETTIGUNG = 800;   // Summe AS-Punkte für vollen Schnelligkeits-Bonus

// Rechnet Beständigkeit (Preisquote + Gesamtzahl Preise) und Schnelligkeit
// (Top-AS-Quote + durchschnittliche AS-Punkte + Summe AS-Punkte) nach den
// aktuell eingestellten Gewichten (SCORE_CFG.gewichtBestaendigkeit/
// -Schnelligkeit) in einen Teilscore von 0-100 um. Wird identisch für die
// Eigenleistung EINER Taube und für die gepoolten Werte ihrer Nachkommen
// verwendet, damit beide Seiten vergleichbar bleiben.
// stats = {preisquote, topASquote, preise, gesetzt, asSum, asCount}
function computeQuoteScore(stats){
  var wB = SCORE_CFG.gewichtBestaendigkeit, wS = SCORE_CFG.gewichtSchnelligkeit;
  var sum = wB+wS; if(!(sum>0)) sum=100;
  var wBn = wB/sum*100, wSn = wS/sum*100; // auf 100 normalisiert, falls Nutzer nicht exakt 100 einstellt

  // Beständigkeit: Preisquote bleibt der Hauptfaktor, zusätzlich ein Bonus
  // für die absolute Anzahl Preise — eine Taube mit 15 Preisen aus 25 Flügen
  // ist beständiger belegt als eine mit 2 von 3 Flügen, auch wenn beide eine
  // ähnliche oder höhere Preisquote haben.
  var preiseBonus = Math.min(100, Math.sqrt((stats.preise||0)/SCORE_PREISE_SAETTIGUNG)*100);
  var bestRaw = (stats.preisquote||0)*0.7 + preiseBonus*0.3;

  // Schnelligkeit: Anteil Flüge >90 AS-Punkte OHNE die frühere harte Deckelung
  // bei nur 10% Quote, ergänzt um die durchschnittliche AS-Punktzahl und die
  // aufsummierten AS-Punkte über alle Flüge — eine Taube mit vielen UND hohen
  // AS-Ergebnissen hebt sich so klar von einer ab, die nur knapp über der
  // Schwelle liegt.
  var quoteComp = Math.min(100, (stats.topASquote||0)*3);
  var avgComp = Math.min(100, stats.asCount ? (stats.asSum/stats.asCount) : 0);
  var totalComp = Math.min(100, Math.sqrt((stats.asSum||0)/SCORE_AS_SUM_SAETTIGUNG)*100);
  var schnellRaw = quoteComp*0.5 + avgComp*0.3 + totalComp*0.2;

  var bestPunkte = bestRaw/100 * wBn;
  var schnellPunkte = schnellRaw/100 * wSn;
  return Math.min(100, bestPunkte + schnellPunkte);
}

// ── Vererbungsstärke nach Flügen ─────────────────────────────────────────
// Misst, wie gut eine Taube ihre Flugleistung an ihre Nachkommen (Kinder +
// Enkel) weitergibt. Grundlage: die gepoolten Flugergebnisse aller Kinder
// und Enkel aus `pigeontrips` (über PT_CACHE, gleiche Quelle wie die
// Reiseleistung einer einzelnen Taube).
//
// In die Wertung fließen NUR Nachkommen ein, die überhaupt an mind. einem
// Flug teilgenommen haben (nie geflogene Nachkommen werden ignoriert, nicht
// als "schlecht" gewertet). Ein Nachkomme gilt als "erfolgreich", wenn er
// mind. SCORE_CFG.minFluegePreisquote Flüge absolviert hat UND eine
// Preisquote von mind. VERERBER_ERFOLG_MIN_PREISQUOTE% aufweist UND
// davon mind. VERERBER_ERFOLG_MIN_TOPAS Preise mit mehr als
// VERERBER_ELITE_AS_SCHWELLE AS-Punkten erflogen hat (ein einzelner Preis
// reicht also nicht mehr). Von diesen "erfolgreichen" Nachkommen müssen
// mindestens VERERBER_MIN_ERFOLGREICHE noch im eigenen Bestand sein — sonst
// ist die Datenbasis zu dünn bzw. nicht (mehr) im Bestand nachweisbar, und
// die Taube gilt (noch) nicht als Vererber.
//   Preisquote   = Anteil der Flüge (der geflogenen Nachkommen) mit Preis
//   Top-Quote    = Anteil der Flüge mit mehr als 90 AS-Punkten. Ein Flug
//                  zählt dabei nur einmal (bestes AS je Flug über RV/
//                  RegGr./Reg. — keine Dopplung desselben Fluges).
//   Aktivenanteil = Anteil aller Nachkommen (inkl. nie geflogener), die
//                  überhaupt geflogen sind
//   Elite-Bonus  = honoriert Nachkommen, die sich bereits als besonders
//                  wertvoll für den eigenen Bestand erwiesen haben. Ein
//                  Nachkomme zählt als "herausragend", wenn er (a) noch im
//                  Bestand ist, (b) keinen Status hat (also aktiv, nicht
//                  verkauft/verstorben/etc.), (c) mind. 5 Preise erzielt hat,
//                  (d) eine Preisquote von mind. 55% aufweist und (e) davon
//                  mind. 2 Preise mit mehr als 80 AS-Punkten erflogen hat.
//                  Je mehr Nachkommen diese Bedingungen erfüllen, desto
//                  höher der Bonus (gedeckelt).
// Score (0–100) = 0.5·Preisquote + min(6·Top-Quote,18) + 0.12·Aktivenanteil
//                 + min(7·Elite-Nachkommen,20)
// — bewusst einfach & transparent gehalten, Einzelwerte werden immer mit
// angezeigt, damit die Zahl nachvollziehbar bleibt (kein Blackbox-Ranking).
function getVererbungDescendants(pigeonid){
  // Wird pro Render sowohl für die "neededIds"-Ermittlung als auch nochmal
  // in computeVererbungsstaerke() aufgerufen -> cachen statt doppelt rechnen.
  if(DESC_CACHE.has(pigeonid)) return DESC_CACHE.get(pigeonid);
  var children = findChildren(pigeonid);
  var seen = {}; children.forEach(function(c){ seen[c.pigeonid]=true; });
  var out = children.slice();
  children.forEach(function(c){
    findChildren(c.pigeonid).forEach(function(g){
      if(!seen[g.pigeonid] && g.pigeonid!==pigeonid){ seen[g.pigeonid]=true; out.push(g); }
    });
  });
  DESC_CACHE.set(pigeonid, out);
  return out;
}
const VER_RANK = { loading:false, error:null, total:0, expandBestand:false, expandNichtBestand:false };
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise(function(_,reject){ setTimeout(function(){ reject(new Error('Zeitüberschreitung beim Laden der Flugdaten')); }, ms); })
  ]);
}
function retryVererberRanking(){ VER_RANK.error=null; render(); }
// Grober Vorfilter, bevor überhaupt Flugdaten geladen werden: weniger als 2
// Nachkommen können die eigentliche Regel (mind. 2 erfolgreiche Flieger)
// ohnehin nie erfüllen. Die genaue Prüfung passiert erst in
// computeVererbungsstaerke(), sobald die Flugdaten da sind.
const VERERBER_MIN_NACHKOMMEN = 2;
// Für die Übersicht wird nur eine kurze Top-Liste gezeigt (die Tabelle ist
// bereits nach Score sortiert) — bei Bedarf über "Alle anzeigen" ausklappbar,
// damit man beim Scrollen durch die Statistik nicht an langen Tabellen
// vorbeiscrollen muss, aber trotzdem sieht, dass mehr Daten vorhanden sind.
const VERERBER_OVERVIEW_LIMIT = 10;
function renderVererberTable(results, expandKey){
  if(!results.length) return '<div style="color:var(--text3);font-size:13px;padding:8px 0 4px">Keine Tauben mit Flugergebnissen bei den Nachkommen gefunden.</div>';
  var expanded = !!(expandKey && VER_RANK[expandKey]);
  var shown = (expanded || results.length<=VERERBER_OVERVIEW_LIMIT) ? results : results.slice(0,VERERBER_OVERVIEW_LIMIT);
  var rows = shown.map(function(r,i){
    var p=r.pigeon, sx=sex_(p);
    return '<tr onclick="selectPigeon(\''+p.pigeonid+'\')" style="cursor:pointer">'
      +'<td style="text-align:center;font-weight:600;color:'+(i<3?'var(--green)':'var(--text3)')+'">'+(i+1)+'</td>'
      +'<td style="font-family:monospace;font-size:12px">'+escH(ring(p))+' '+(sx==='M'?'♂':sx==='F'?'♀':'')+'</td>'
      +'<td>'+escH(p.name||'—')+'</td>'
      +'<td style="text-align:center;font-weight:700;color:'+(r.score>=60?'var(--green)':r.score>=35?'var(--orange)':'#e07070')+';text-decoration:underline dotted;text-underline-offset:3px" onclick="event.stopPropagation();showVererbungDetail(\''+p.pigeonid+'\')" title="Details zur Berechnung anzeigen">'+r.score+'</td>'
      +'<td style="text-align:center;font-weight:600">'+r.erfolgreicheCount+'/'+r.activeCount+' <span style="color:var(--text3);font-weight:400">('+r.erfolgsquote.toFixed(0)+'%)</span></td>'
      +'<td style="text-align:center">'+r.preisquote.toFixed(1)+'%</td>'
      +'<td style="text-align:center">'+r.topASquote.toFixed(1)+'%</td>'
      +'<td style="text-align:center">'+r.activeCount+'/'+r.totalDescendants+'</td>'
      +'<td style="text-align:center;font-weight:'+(r.eliteCount>0?'700':'400')+';color:'+(r.eliteCount>0?'var(--green)':'var(--text3)')+'">'+(r.eliteCount||0)+'</td>'
      +'</tr>';
  }).join('');
  var toggle = (!expandKey || results.length<=VERERBER_OVERVIEW_LIMIT) ? '' :
    '<div style="text-align:center;padding:8px 0 2px">'
    +'<button class="btn btn-outline btn-sm" onclick="VER_RANK.'+expandKey+'='+(!expanded)+';render()">'
    +(expanded ? '▴ Weniger anzeigen' : '▾ Alle '+results.length+' anzeigen')
    +'</button></div>';
  return (expandKey && results.length>VERERBER_OVERVIEW_LIMIT && !expanded
      ? '<div style="font-size:11px;color:var(--text3);margin-bottom:4px">Top '+VERERBER_OVERVIEW_LIMIT+' von '+results.length+', sortiert nach Score.</div>' : '')
    +'<div class="table-wrap"><table style="width:100%;border-collapse:collapse;font-size:13px">'
    +'<thead><tr><th>#</th><th>Ring</th><th>Name</th><th>Score</th><th>Erfolgsquote</th><th>Preisquote</th><th>Top (&gt;90 AS)</th><th>Nachk. geflogen</th><th>Elite-Nachk.</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table></div>'+toggle;
}
function renderVererberRanking(){
  // Nur Tauben mit mind. VERERBER_MIN_NACHKOMMEN Nachkommen (Kinder+Enkel) gelten
  // überhaupt als "Vererber" — und nur deren Nachkommen brauchen Flugdaten, nicht
  // der komplette Bestand. Das reduziert die zu ladende Datenmenge erheblich.
  var candidates = S.pigeons.filter(function(p){ return getVererbungDescendants(p.pigeonid).length>=VERERBER_MIN_NACHKOMMEN; });
  var neededIds = {};
  candidates.forEach(function(p){
    getVererbungDescendants(p.pigeonid).forEach(function(d){ neededIds[d.pigeonid]=true; });
  });
  var idList = Object.keys(neededIds);
  var missing = idList.filter(function(id){return !PT_CACHE[id];});

  if(VER_RANK.error){
    return '<div class="card"><div style="color:#e07070;font-size:13px">Fehler beim Laden der Flugdaten: '+escH(VER_RANK.error)+'</div>'
      +'<button class="btn btn-sm" style="margin-top:10px" onclick="retryVererberRanking()">Erneut versuchen</button></div>';
  }
  if(!idList.length){
    return '<div class="card"><div style="color:var(--text3);font-size:13px">Noch keine Tauben mit ausreichend geflogenen Nachkommen gefunden.</div></div>';
  }
  if(missing.length){
    if(!VER_RANK.loading){
      VER_RANK.loading = true; VER_RANK.total = idList.length;
      withTimeout(loadPigeonTripsBatchChunked(idList), 45000)
        .then(function(){ VER_RANK.loading=false; render(); })
        .catch(function(e){ VER_RANK.loading=false; VER_RANK.error=(e&&e.message)||'Unbekannter Fehler'; render(); });
    }
    return '<div class="loading"><div class="spinner"></div>Lade Flugdaten für die Vererbungsauswertung… ('+idList.length+' Nachkommen)</div>';
  }
  VER_RANK.loading=false;
  var results = candidates.map(function(p){
    var r = computeVererbungsstaerke(p.pigeonid);
    r.pigeon = p;
    return r;
  }).filter(function(r){ return r.ready && r.score!=null; });
  results.sort(function(a,b){ return b.score-a.score; });

  var bestand = results.filter(function(r){ return !!r.pigeon.instock; });
  var nichtBestand = results.filter(function(r){ return !r.pigeon.instock; });

  return '<div class="card">'
    +'<div class="card-title" style="display:flex;align-items:center;gap:8px">🧬 Vererbungsstärke nach Flügen (reine Nachkommen-Wertung) <span onclick="showScoreSettingsModal()" title="Score-Einstellungen" style="cursor:pointer;color:var(--text3);font-size:14px;font-weight:400">⚙️</span></div>'
    +'<div style="font-size:11px;color:var(--text3);margin-bottom:6px">Diese Liste bewertet reine Vererbung (nur Nachkommen). Der Erfolgs-Score einer einzelnen Taube (Details/Stammbaum, Paarungscheck) mischt zusätzlich die Eigenleistung mit ein.</div>'
    +'<div style="font-size:12px;color:var(--text3);margin-bottom:12px">Bewertet Tauben, deren Nachkommen (Kinder + Enkel) geflogen sind — mind. '+VERERBER_MIN_ERFOLGREICHE+' davon müssen "erfolgreich" (Preisquote ≥'+VERERBER_ERFOLG_MIN_PREISQUOTE+'%, davon mind. '+VERERBER_ERFOLG_MIN_TOPAS+' Preise über '+VERERBER_ELITE_AS_SCHWELLE+' AS-Punkten, mind. '+SCORE_CFG.minFluegePreisquote+' Flüge) und noch im Bestand sein. Wichtigster Faktor ist die Erfolgsquote (Anteil der geflogenen Nachkommen, die "erfolgreich" sind) — wenige erfolgreiche Nachkommen unter vielen geflogenen drücken den Score deutlich. Hinzu kommen der einstellbare Beständigkeits-/Schnelligkeits-Teilscore der erfolgreichen Nachkommen, ein kleiner Bonus für den Anteil überhaupt geflogener Nachkommen sowie ein Bonus für Nachkommen im eigenen Bestand ohne Status mit mind. '+VERERBER_ELITE_MIN_PREISE+' Preisen, mind. '+VERERBER_ELITE_MIN_PREISQUOTE+'% Preisquote und mind. '+VERERBER_ELITE_MIN_TOPAS+' Preisen über '+VERERBER_ELITE_AS_SCHWELLE+' AS-Punkten. Höherer Score = stärkere Vererbung. Auf den Score klicken zeigt die Details.</div>'
    +'<div style="font-size:12px;font-weight:600;color:var(--text2);margin:14px 0 6px">Bestandstauben</div>'
    +renderVererberTable(bestand,'expandBestand')
    +'<div style="font-size:12px;font-weight:600;color:var(--text2);margin:18px 0 6px">Nicht im Bestand</div>'
    +renderVererberTable(nichtBestand,'expandNichtBestand')
    +'</div>';
}

  // Übersicht: standardmäßig nur die Top-Zeilen der aktuellen Sortierung

    +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
    +'<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);cursor:pointer">'
    +'<input type="checkbox" '+(ESLIST.onlyElite?'checked':'')+' onchange="toggleESListElite()"> ⭐ Nur Elite</label>'
    +'<button class="btn btn-outline btn-sm" onclick="exportErfolgsScoreCSV()">⬇️ CSV</button>'

    +'<div style="font-size:11px;color:var(--text3);margin:6px 0 10px">Jede Bestandstaube mit individuellem Erfolgs-Score (Eigenleistung + Vererbung, einstellbar über ⚙) und eigenen Flugkennzahlen. Spalten anklicken zum Sortieren, Zeile anklicken öffnet die Taube. ⭐ Elite = eigene Preise/Preisquote/Top-AS erfüllen die Elite-Kriterien (mind. '+VERERBER_ELITE_MIN_PREISE+' Preise, ≥'+VERERBER_ELITE_MIN_PREISQUOTE+'% Preisquote, mind. '+VERERBER_ELITE_MIN_TOPAS+' Preise über '+VERERBER_ELITE_AS_SCHWELLE+' AS-Punkten, ohne Status).</div>'
    +(list.length>ESLIST_OVERVIEW_LIMIT && !ESLIST.expanded ? '<div style="font-size:11px;color:var(--text3);margin-bottom:4px">Top '+ESLIST_OVERVIEW_LIMIT+' von '+list.length+' (aktuelle Sortierung). Komplette Liste über "Alle anzeigen" oder CSV-Export.</div>' : '')
    +(list.length?'<div class="table-wrap"><table style="width:100%;border-collapse:collapse;font-size:13px">'

        +'</button></div>' : '')
      : '<div style="color:var(--text3);font-size:13px;padding:8px 0">Keine Tauben erfüllen den aktuellen Filter.</div>')

function exportErfolgsScoreCSV(){
  if(!ESLIST.results || !ESLIST.results.length){ alert('Noch keine Daten geladen — bitte Liste erst anzeigen lassen.'); return; }
  var list = ESLIST.onlyElite ? ESLIST.results.filter(function(x){ return x.eliteOwn; }) : ESLIST.results;
  var header = ['Ring','Name','Geschlecht','Jahrgang','Erfolgs-Score','Eigenleistung','Vererbung','Erfolgsquote %','Flüge (eigen)','Preisquote % (eigen)','Top>90 AS (eigen)','Top>80 AS (eigen)','Elite'];
  var rows = list.map(function(x){
    var sx=sex_(x.p);
    return [
      ring(x.p)||'', x.p.name||'', sx==='M'?'Täuber':sx==='F'?'Täubin':'',
      x.p.date_year||'',
      x.er.score!=null?x.er.score:'',
      (x.own.ready&&!x.own.noFlights)?x.own.score:'',
      (x.ver.ready&&x.ver.score!=null)?x.ver.score:'',
      (x.ver.ready&&x.ver.erfolgsquote!=null)?x.ver.erfolgsquote.toFixed(1):'',
      (x.own.ready&&!x.own.noFlights)?x.own.gesetzt:'',
      (x.own.ready&&!x.own.noFlights)?x.own.preisquote.toFixed(1):'',
      (x.own.ready&&!x.own.noFlights)?x.own.topAS:'',
      (x.own.ready&&!x.own.noFlights)?x.own.topAS80:'',
      x.eliteOwn?'Ja':''
    ];
  });
  var csv = [header,...rows].map(function(r){ return r.map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(';'); }).join('\n');
  var blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href=url; a.download='erfolgs-score-liste'+(ESLIST.onlyElite?'-elite':'')+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },5000);
}

const VER_LOADING = new Set();
function ensureVererbungLoaded(pigeonid){
  if(VER_LOADING.has(pigeonid)) return;
  var ids = getVererbungDescendants(pigeonid).map(function(d){return d.pigeonid;});
  if(!ids.length) return;
  VER_LOADING.add(pigeonid);
  loadPigeonTripsBatchChunked(ids)
    .then(function(){ VER_LOADING.delete(pigeonid); render(); })
    .catch(function(){ VER_LOADING.delete(pigeonid); ids.forEach(function(id){ if(!PT_CACHE[id]) PT_CACHE[id]=[]; }); render(); });
}
function hasPrizeRow(r){ return r.prize_rv!=null||r.prize_reggr!=null||r.prize_reg!=null||r.prize_fg!=null||r.manual_prize!=null; }
// Bestes AS (Ass-Punkte) eines einzelnen Fluges über die drei Listen
// (Verein/RV, Regionalgruppe, Region) sowie ein evtl. manuell erfasstes
// Ergebnis — dieselbe "ein Flug = ein Wert"-Logik wie an anderer Stelle in
// der App (Rekordflüge), damit ein Flug nicht mehrfach gezählt wird, nur
// weil er in mehreren Listen platziert war.
function getFlightAS(r){
  var vals=[r.as_rv,r.as_fg,r.as_nat,r.as_reg,r.manual_as].filter(function(v){ return v!=null && v!==''; }).map(Number).filter(function(v){ return !isNaN(v); });
  return vals.length ? Math.max.apply(null, vals) : null;
}
// Mindestanzahl "erfolgreicher" Nachkommen (siehe VERERBER_ERFOLG_* unten),
// die noch im eigenen Bestand sein müssen, damit eine Taube überhaupt als
// Vererber gilt.
const VERERBER_MIN_ERFOLGREICHE = 2;
// Schwellenwerte, ab wann ein Nachkomme als "erfolgreich" gilt: Preisquote
// von mind. VERERBER_ERFOLG_MIN_PREISQUOTE%, davon mind.
// VERERBER_ERFOLG_MIN_TOPAS Preise mit mehr als VERERBER_ELITE_AS_SCHWELLE
// AS-Punkten (die AS-Schwelle wird mit dem Elite-Kriterium geteilt).
const VERERBER_ERFOLG_MIN_PREISQUOTE = 50;
const VERERBER_ERFOLG_MIN_TOPAS = 2;
// Schwellenwerte für "herausragende" Nachkommen im eigenen Bestand (Elite-Bonus,
// siehe Formel-Erklärung oben). Ein Nachkomme zählt als herausragend, wenn er
// noch im Bestand ist, keinen Status hat, und mind. VERERBER_ELITE_MIN_PREISE
// Preise bei mind. VERERBER_ELITE_MIN_PREISQUOTE% Preisquote erzielt hat,
// davon mind. VERERBER_ELITE_MIN_TOPAS Preise mit mehr als
// VERERBER_ELITE_AS_SCHWELLE AS-Punkten.
const VERERBER_ELITE_MIN_PREISE = 5;
const VERERBER_ELITE_MIN_PREISQUOTE = 55;
const VERERBER_ELITE_MIN_TOPAS = 2;
const VERERBER_ELITE_AS_SCHWELLE = 80;
function computeVererbungsstaerke(pigeonid){
  var desc = getVererbungDescendants(pigeonid);
  if(!desc.length) return {ready:true, noDescendants:true};
  var missing = desc.some(function(d){ return !PT_CACHE[d.pigeonid]; });
  if(missing) return {ready:false};

  var perDescendant = desc.map(function(d){
    var rows = PT_CACHE[d.pigeonid]||[];
    var gesetzt=rows.length, preise=0, topAS=0, topAS80=0, asSum=0, asCount=0;
    rows.forEach(function(r){
      if(hasPrizeRow(r)) preise++;
      var as=getFlightAS(r);
      if(as!=null){
        asSum+=as; asCount++; // für Durchschnitt/Summe im Schnelligkeits-Teilscore
        if(as>90) topAS++; // ein Flug zählt max. 1x (bestes AS über RV/RegGr/Reg)
        if(as>VERERBER_ELITE_AS_SCHWELLE) topAS80++;
      }
    });
    var preisquoteD = gesetzt>0 ? preise/gesetzt*100 : 0;
    // Zu wenige Flüge -> Preisquote dieses Nachkommen statistisch nicht
    // belastbar, zählt nicht als "erfolgreich"/"elite" (gleiche Schwelle wie
    // bei der Eigenleistung, siehe SCORE_CFG.minFluegePreisquote).
    var qualifiziert = gesetzt>=SCORE_CFG.minFluegePreisquote;
    var elite = qualifiziert && !!d.instock && !d.pigeonstateid
      && preise>=VERERBER_ELITE_MIN_PREISE
      && preisquoteD>=VERERBER_ELITE_MIN_PREISQUOTE
      && topAS80>=VERERBER_ELITE_MIN_TOPAS;
    var erfolgreich = qualifiziert && preisquoteD>=VERERBER_ERFOLG_MIN_PREISQUOTE && topAS80>=VERERBER_ERFOLG_MIN_TOPAS;
    return {pigeon:d, gesetzt:gesetzt, preise:preise, topAS:topAS, topAS80:topAS80, asSum:asSum, asCount:asCount,
      preisquoteD:preisquoteD, flown:gesetzt>0, erfolgreich:erfolgreich, elite:elite};
  });

  // Nur Nachkommen, die grundsätzlich geflogen sind, fließen in die Wertung ein.
  var flown = perDescendant.filter(function(d){ return d.flown; });
  if(!flown.length) return {ready:true, noFlights:true, totalDescendants:desc.length, perDescendant:perDescendant};

  // Von den "erfolgreichen" Nachkommen zählen nur die, die noch im Bestand sind.
  var erfolgreicheCount = flown.filter(function(d){ return d.erfolgreich && d.pigeon.instock; }).length;
  if(erfolgreicheCount<VERERBER_MIN_ERFOLGREICHE) return {ready:true, notEnough:true, totalDescendants:desc.length,
    flownCount:flown.length, erfolgreicheCount:erfolgreicheCount, perDescendant:perDescendant};

  var totalGesetzt=0, totalPreise=0, totalTopAS=0, totalAsSum=0, totalAsCount=0;
  flown.forEach(function(d){ totalGesetzt+=d.gesetzt; totalPreise+=d.preise; totalTopAS+=d.topAS; totalAsSum+=d.asSum; totalAsCount+=d.asCount; });
  var preisquote = totalPreise/totalGesetzt*100;
  var topASquote = totalTopAS/totalGesetzt*100;
  var aktivenanteil = flown.length/desc.length*100;
  // Anteil der geflogenen Nachkommen, die tatsächlich "erfolgreich" sind (s.o.).
  // Das ist der entscheidende Beständigkeits-Indikator einer Vererbung: bringt
  // eine Taube z.B. 19 fliegende Nachkommen hervor, von denen nur 1-2 wirklich
  // erfolgreich sind, ist die Vererbung schwach — auch wenn dieser eine
  // Nachkomme selbst sehr gut fliegt. Ohne diesen Faktor würde die gepoolte
  // Preisquote/Top-AS-Quote (unten) einen einzelnen starken Nachkommen zu stark
  // durchschlagen lassen und eine in Wirklichkeit dünne Vererbung verschleiern.
  var erfolgsquote = erfolgreicheCount/flown.length*100;
  var eliteDescendants = perDescendant.filter(function(d){ return d.elite; });
  var eliteCount = eliteDescendants.length;
  var eliteBonus = Math.min(7*eliteCount, 20);
  // Erfolgsquote ist der mit Abstand größte Faktor (max. 45 von 100 Punkten) —
  // erst danach folgt die gepoolte Beständigkeit/Geschwindigkeit (computeQuoteScore,
  // nach den einstellbaren Gewichten SCORE_CFG.gewichtBestaendigkeit/-Schnelligkeit,
  // auf ein Budget von max. 37 Punkten skaliert), ein kleiner Aktivenanteil-Bonus
  // (nur Teilnahme, kein Erfolg) und der bestandsgebundene Elite-Bonus.
  var qualityScore = computeQuoteScore({preisquote:preisquote, topASquote:topASquote, preise:totalPreise, gesetzt:totalGesetzt, asSum:totalAsSum, asCount:totalAsCount}); // 0-100
  var score = Math.round(Math.min(100,
    erfolgsquote*0.45
    + qualityScore*0.37
    + aktivenanteil*0.06
    + eliteBonus*0.6
  ));
  return {ready:true, score:score, preisquote:preisquote, topASquote:topASquote, aktivenanteil:aktivenanteil,
    erfolgsquote:erfolgsquote, erfolgreicheCount:erfolgreicheCount,
    eliteCount:eliteCount, eliteDescendants:eliteDescendants, eliteBonus:eliteBonus,
    totalDescendants:desc.length, activeCount:flown.length, totalGesetzt:totalGesetzt, totalPreise:totalPreise, totalTopAS:totalTopAS,
    perDescendant:perDescendant};
}

// ── Erfolgs-Prognose eines Probanden (Beständigkeit + Geschwindigkeit,
// jeweils sowohl aus der EIGENEN Flugleistung der Eltern als auch aus deren
// Nachkommen, kombiniert nach SCORE_CFG.eigenAnteil) ──────────────────────
const OWN_TRIPS_LOADING = new Set();

// Eigenleistung EINER Taube (nicht deren Nachkommen): Beständigkeit =
// Preisquote, Geschwindigkeit = Anteil Flüge mit >90 AS-Punkten — dieselbe
// Formel (computeQuoteScore, nach SCORE_CFG gewichtet) wie bei
// computeVererbungsstaerke(), nur auf die eigenen Flüge statt auf die der
// Nachkommen angewendet.
function computeEigenleistung(pigeonid){
  const rows = PT_CACHE[pigeonid];
  if(!rows) return {ready:false};
  let gesetzt=rows.length, preise=0, topAS=0, topAS80=0, asSum=0, asCount=0;
  rows.forEach(r=>{
    if(hasPrizeRow(r)) preise++;
    const as=getFlightAS(r);
    if(as!=null){
      asSum+=as; asCount++;
      if(as>90) topAS++;
      if(as>VERERBER_ELITE_AS_SCHWELLE) topAS80++;
    }
  });
  // Manuell erfasste Jahresleistungen (siehe pigeon_manual_seasons) ergänzen
  // die Statistik NUR für Saisons, für die keine echten Einzelflüge in
  // pigeontrips vorliegen — sonst würde dieselbe Saison doppelt gezählt. Da
  // nur die AS-Summe (nicht die Verteilung je Flug) bekannt ist, fließen
  // manuelle Jahre in Flüge/Preise/Ø-AS/Σ-AS ein, aber NICHT in die
  // Top-AS-Quote (topAS/topAS80 bleiben unverändert — dadurch verwässert
  // sich diese Quote automatisch etwas, statt Daten vorzutäuschen, die wir
  // nicht haben).
  const coveredVintages = new Set(rows.map(r=>String(r.vintage||'')));
  const manualSeasons = MANUAL_SEASONS_BY_PIGEON[pigeonid]||[];
  manualSeasons.forEach(ms=>{
    if(coveredVintages.has(String(ms.vintage))) return; // Jahr schon durch echte Flüge abgedeckt
    gesetzt += ms.gesetzt||0;
    preise += ms.preise||0;
    if(ms.as_sum!=null){ asSum += Number(ms.as_sum)||0; asCount += ms.gesetzt||0; }
  });
  if(!gesetzt) return {ready:true, noFlights:true};
  // Zu wenige Flüge -> Quote statistisch nicht belastbar, wird wie "keine
  // eigenen Flugdaten" behandelt (der Erfolgs-Score stützt sich dann allein
  // auf die Vererbung, sofern dafür genug Nachkommen-Daten vorliegen).
  if(gesetzt<SCORE_CFG.minFluegePreisquote) return {ready:true, noFlights:true, gesetzt, tooFewFlights:true};
  const preisquote = preise/gesetzt*100;
  const topASquote = topAS/gesetzt*100;
  const score = Math.round(computeQuoteScore({preisquote, topASquote, preise, gesetzt, asSum, asCount}));
  return {ready:true, gesetzt, preise, topAS, topAS80, asSum, asCount, preisquote, topASquote, score};
}

// Erfolgs-Score EINER Taube: gewichteter Mix aus Eigenleistung (eigene
// Preisquote + Geschwindigkeit) und Vererbungsstärke (Preisquote +
// Geschwindigkeit der Nachkommen, siehe computeVererbungsstaerke oben) nach
// SCORE_CFG.eigenAnteil. Ist nur eine der beiden Seiten verfügbar (z.B. junge
// Taube ohne eigene Flüge, oder alte Taube ohne im Bestand verbliebene
// Nachkommen), zählt diese Seite allein. Dieser Score wird identisch im
// Stammbaum/Details, in der Nachkommen-Ansicht UND im Paarungscheck verwendet.
function computeErfolgsScore(pigeonid){
  const ver = computeVererbungsstaerke(pigeonid);
  if(!ver.ready) ensureVererbungLoaded(pigeonid);
  const own = computeEigenleistung(pigeonid);
  if(!own.ready && !OWN_TRIPS_LOADING.has(pigeonid)){
    OWN_TRIPS_LOADING.add(pigeonid);
    loadPigeonTrips(pigeonid).then(()=>{ OWN_TRIPS_LOADING.delete(pigeonid); render(); })
      .catch(()=>{ OWN_TRIPS_LOADING.delete(pigeonid); render(); });
  }
  const ownScore = (own.ready && !own.noFlights) ? own.score : null;
  const verScore = (ver.ready && ver.score!=null) ? ver.score : null;
  let score=null, note='';
  const wEigen = SCORE_CFG.eigenAnteil/100;
  if(ownScore!=null || verScore!=null){
    // Beide Seiten werden STRIKT nach der eingestellten Gewichtung
    // (SCORE_CFG.eigenAnteil) kombiniert. Fehlt eine Seite (keine eigenen
    // Flüge bzw. keine bewertbare Nachzucht), geht sie mit 0 in ihren
    // Gewichtsanteil ein — vorher wurde die volle Gewichtung stillschweigend
    // auf die vorhandene Seite verschoben, wodurch z.B. "0% Eigenleistung"
    // bei fehlender Nachzucht wirkungslos blieb, obwohl der Regler das
    // Gegenteil signalisierte.
    score = Math.round((ownScore!=null?ownScore:0)*wEigen + (verScore!=null?verScore:0)*(1-wEigen));
    if(ownScore!=null && verScore==null) note = `Vererbung geht mit 0 ein (${100-SCORE_CFG.eigenAnteil}% Gewicht) — keine bewertbare Nachzucht vorhanden`;
    else if(ownScore==null && verScore!=null) note = `Eigenleistung geht mit 0 ein (${SCORE_CFG.eigenAnteil}% Gewicht) — keine eigenen Flugdaten`;
  }
  const stillLoading = !own.ready || !ver.ready;
  return {ready: own.ready && ver.ready, score, own, ver, note, stillLoading};
}

// Erfolgs-Prognose eines Probanden (aus den Erfolgs-Scores von Vater und
// Mutter, kombiniert per Durchschnitt) — jeder Elternscore selbst ist schon
// eine Mischung aus Eigenleistung und Vererbung an die eigenen Nachkommen.
function computePaarungsprognose(father, mother){
  const ef = father ? computeErfolgsScore(father.pigeonid) : null;
  const em = mother ? computeErfolgsScore(mother.pigeonid) : null;
  const sF = (ef && ef.score!=null) ? ef.score : null;
  const sM = (em && em.score!=null) ? em.score : null;
  let combined=null, note='';
  if(sF!=null && sM!=null) combined = Math.round((sF+sM)/2);
  else if(sF!=null){ combined=sF; note=' (nur Vater — Mutter ohne ausreichende Datenbasis)'; }
  else if(sM!=null){ combined=sM; note=' (nur Mutter — Vater ohne ausreichende Datenbasis)'; }
  const stillLoading = (father && ef && ef.stillLoading) || (mother && em && em.stillLoading);
  return {ef, em, sF, sM, combined, note, stillLoading};
}

// Kompaktes Ergebnis für einen Elternteil innerhalb der Prognose-Karte:
// zeigt den Erfolgs-Score sowie die Aufschlüsselung Eigenleistung/Nachkommen.
function _pp_parentLine(p, er){
  if(!p) return `<div style="color:var(--text3);font-size:12px">unbekannt</div>`;
  const rg = escH(ring(p))+(p.name?' · '+escH(p.name):'');
  if(!er || er.score==null){
    const msg = (er && er.stillLoading) ? 'wird geladen…' : 'keine ausreichende Datenbasis';
    return `<div style="color:var(--text3);font-size:12px">${rg} — ${msg}</div>`;
  }
  const c = er.score>=60?'var(--green)':er.score>=35?'var(--orange)':'#e07070';
  const ownPart = (er.own && er.own.ready && !er.own.noFlights)
    ? `Eigen: Preisq. ${er.own.preisquote.toFixed(0)}% · Top-AS ${er.own.topASquote.toFixed(0)}%`
    : (er.own && er.own.tooFewFlights)
      ? `Eigen: zu wenige Flüge (${er.own.gesetzt}/${SCORE_CFG.minFluegePreisquote})`
      : 'Eigen: keine eigenen Flugdaten';
  const verPart = (er.ver && er.ver.ready && er.ver.score!=null)
    ? `Nachk.: Erfolgsq. ${er.ver.erfolgsquote.toFixed(0)}% (${er.ver.erfolgreicheCount}/${er.ver.activeCount}) · Preisq. ${er.ver.preisquote.toFixed(0)}% · Top-AS ${er.ver.topASquote.toFixed(0)}%`
    : 'Nachk.: keine ausreichende Datenbasis';
  return `<div style="cursor:pointer" onclick="event.stopPropagation();showVererbungDetail('${p.pigeonid}')">
    <span style="font-weight:700;color:${c};font-size:15px">${er.score}</span>
    <span style="font-size:11px;color:var(--text3)"> · ${rg}</span>
    <div style="font-size:10px;color:var(--text3);margin-top:1px">${ownPart}</div>
    <div style="font-size:10px;color:var(--text3)">${verPart}</div>
  </div>`;
}

// Erfolgs-Prognose-Karte fürs Stammbaum-Proband (echte Taube ODER virtueller
// Nachkomme aus dem Paarungscheck) — zeigt Ø-Score sowie beide Einzelwerte,
// plus Button zum Speichern in der Paarungsliste.
function renderPaarungsprognoseCard(father, mother){
  if(!father && !mother) return '';
  const pp = computePaarungsprognose(father, mother);
  const combinedHtml = pp.combined!=null
    ? `<div style="font-size:26px;font-weight:700;color:${pp.combined>=60?'var(--green)':pp.combined>=35?'var(--orange)':'#e07070'}">${pp.combined}</div>
       <div style="font-size:11px;color:var(--text3)">Ø Erfolgs-Score der Eltern${pp.note}</div>`
    : `<div style="font-size:13px;color:var(--text3)">${pp.stillLoading?'Daten werden geladen…':'Noch keine ausreichende Datenbasis bei den Eltern'}</div>`;
  const saveBtn = (father && mother) ? `<button class="btn btn-outline btn-sm" style="margin-top:10px" onclick="savePairingToList('${father.pigeonid}','${mother.pigeonid}')">💾 Paarung speichern</button>` : '';
  return `<div class="card" style="margin-bottom:14px">
    <div class="card-title" style="display:flex;align-items:center;gap:8px">🏆 Erfolgs-Prognose <span onclick="showScoreSettingsModal()" title="Score-Einstellungen" style="cursor:pointer;color:var(--text3);font-size:14px;font-weight:400">⚙️</span></div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:10px">Prognose für die Nachzucht dieses Probanden, aus zwei Faktoren je Elternteil: Beständigkeit (Preisquote) und Geschwindigkeit (Anteil Preise über 90 AS-Punkten) — jeweils sowohl aus der eigenen Flugleistung als auch aus der der eigenen Nachkommen (Kinder + Enkel).</div>
    <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start">
      <div style="min-width:150px">${combinedHtml}</div>
      <div style="display:flex;gap:24px;flex-wrap:wrap">
        <div>${_pp_parentLine(father,pp.ef)}</div>
        <div>${_pp_parentLine(mother,pp.em)}</div>
      </div>
    </div>
    ${saveBtn}
  </div>`;
}

// ── Paarungsliste (Supabase-Tabelle "matings") ──────────────────────────
// WICHTIG: Diese Tabelle muss einmalig in Supabase angelegt werden (SQL
// siehe Antworttext) — ohne sie schlägt savePairingToList()/loadMatings()
// mit einer verständlichen Fehlermeldung fehl.
function loadMatingsIfNeeded(){
  if(S.matings!==null || S.matingsLoading) return;
  S.matingsLoading=true; S.matingsError=null;
  apiGet('/matings?order=created_at.desc&limit=200')
    .then(rows=>{ S.matings=rows||[]; S.matingsLoading=false; render(); })
    .catch(e=>{ S.matingsError=e.message; S.matingsLoading=false; S.matings=[]; render(); });
}
async function savePairingToList(fatherId, motherId){
  const f=findById(fatherId), m=findById(motherId);
  if(!f || !m) return;
  // Duplikatsprüfung direkt gegen die DB (nicht nur gegen S.matings — die Liste
  // ist evtl. in dieser Sitzung noch gar nicht geladen worden).
  try{
    const existing = await apiGet('/matings?fatherid=eq.'+fatherId+'&motherid=eq.'+motherId+'&select=id&limit=1');
    if(existing && existing.length){
      alert('Diese Paarung ('+ring(f)+' × '+ring(m)+') ist bereits in der Paarungsliste gespeichert.');
      return;
    }
  }catch(e){ /* Prüfung fehlgeschlagen — Speichern trotzdem versuchen */ }
  const pp = computePaarungsprognose(f,m);
  const ib = calcInbreedingPair(f,m);
  const body = {
    fatherid: fatherId, motherid: motherId,
    father_ring: ring(f), father_name: f.name||null,
    mother_ring: ring(m), mother_name: m.name||null,
    inzucht: ib!=null ? Math.round(ib*10000)/100 : null,
    score_father: pp.sF, score_mother: pp.sM, score_combined: pp.combined
  };
  try{
    await apiPost('matings', body);
    S.matings=null; // beim nächsten Öffnen der Liste neu laden
    alert('Paarung gespeichert.');
    render();
  }catch(e){
    alert('Speichern fehlgeschlagen: '+e.message+'\n\nWurde die Tabelle "matings" in Supabase bereits angelegt?');
  }
}
async function deleteMating(id){
  if(!confirm('Diese gespeicherte Paarung wirklich löschen?')) return;
  try{
    await apiDeleteBy('matings','id=eq.'+id);
    S.matings = (S.matings||[]).filter(r=>r.id!==id);
    render();
  }catch(e){ alert('Löschen fehlgeschlagen: '+e.message); }
}
// Lädt eine gespeicherte Paarung wieder in den Paarungscheck (falls beide
// Tauben noch lokal geladen sind — Archiv ggf. vorher per Suche nachladen).
function loadMatingIntoCheck(fatherId, motherId){
  const f=findById(fatherId), m=findById(motherId);

  S.paarungM=f; S.paarungF=m; S.tab='paarung'; setActiveNav('paarung'); render(); window.scrollTo(0,0);
}

  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:2px">
      <div class="card-title" style="margin-bottom:0">📋 Gespeicherte Paarungen</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline btn-sm" onclick="printMatingsList()">🖨 Drucken</button>
        <button class="btn btn-outline btn-sm" onclick="exportMatingsCSV()">⬇️ CSV</button>
      </div>
    </div>
    <div style="font-size:11px;color:var(--text3);margin:6px 0 10px">Zeile anklicken lädt die Paarung in den Rechner oben. Score-Spalten = Erfolgs-Score (Beständigkeit/Preisquote + Geschwindigkeit/Top-AS-Quote, jeweils aus Eigenleistung und Nachkommen).</div>
    <div class="table-wrap"><table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr><th>Vater</th><th>Mutter</th><th>Inzucht</th><th>Score V</th><th>Score M</th><th>Score Ø</th><th>Datum</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>

function exportMatingsCSV(){
  if(!S.matings || !S.matings.length){ alert('Keine gespeicherten Paarungen zum Exportieren.'); return; }
  const header = ['Vater Ring','Vater Name','Mutter Ring','Mutter Name','Inzucht %','Score Vater','Score Mutter','Score Ø','Datum'];
  const rows = S.matings.map(r=>[
    r.father_ring||'', r.father_name||'', r.mother_ring||'', r.mother_name||'',
    r.inzucht!=null?r.inzucht.toFixed(2):'', r.score_father??'', r.score_mother??'', r.score_combined??'',
    r.created_at?new Date(r.created_at).toLocaleDateString('de'):''
  ]);
  const csv = [header, ...rows].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href=url; a.download='paarungsliste.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}

// ── Automatische Paarungsempfehlungen ─────────────────────────────────────
// Bildet aus allen Bestandstäubern × Bestandstäubinnen sämtliche möglichen
// Paare, berechnet je Paar den Erfolgs-Score (computePaarungsprognose, s.o. —
// Ø aus Beständigkeit/Preisquote und Geschwindigkeit/Top-AS-Quote, jeweils
// aus Eigenleistung UND Nachkommen beider Elternteile) sowie den Inzucht-
// koeffizienten der Nachkommen, blendet zu eng verwandte Paare aus und
// sortiert absteigend nach Score. Jede Zeile lässt sich direkt in den
// Paarungsrechner laden oder per Klick in die Paarungsliste übernehmen.
// Weitere Kriterien pro Taube (z.B. Formfaktor, Ausstellungsnoten, Wetter-
// leistung) können später einfach als zusätzlicher Summand in den Score
// von computePaarungsprognose() einfließen, ohne dass sich an dieser Stelle
// etwas ändern muss.
const PAIR_REC = { loading:false, error:null, results:null, total:0 };
function invalidatePairRec(){ PAIR_REC.results=null; PAIR_REC.error=null; }

function pairRecCandidates(){
  // Fokus liegt auf Zuchttauben — das sind die Tiere, die tatsächlich verpaart
  // werden. Reisetauben können optional dazugenommen werden (S.pairRecIncludeReise),
  // Heimtauben und Tauben ohne Typ bleiben immer außen vor. Nur Bestandstiere.
  function relevant(p){
    if(!p.instock) return false;
    if(p.pigeontype==='Zuchttaube') return true;
    if(S.pairRecIncludeReise && p.pigeontype==='Reisetaube') return true;
    return false;
  }
  var males   = S.pigeons.filter(function(p){ return relevant(p) && sex_(p)==='M'; });
  var females = S.pigeons.filter(function(p){ return relevant(p) && sex_(p)==='F'; });
  return {males:males, females:females};
}

function renderPairingRecommendations(){
  var cand = pairRecCandidates();
  var reiseToggle = '<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);cursor:pointer;white-space:nowrap">'
    +'<input type="checkbox" '+(S.pairRecIncludeReise?'checked':'')+' onchange="S.pairRecIncludeReise=this.checked;PAIR_REC.results=null;render()"> Reisetauben mit einbeziehen</label>';
  if(!cand.males.length || !cand.females.length){
    return '<div class="card"><div class="card-title">🏆 Top-Paarungsempfehlungen</div>'
      +'<div style="font-size:13px;color:var(--text3);margin-bottom:10px">Es werden mindestens ein Täuber und eine Täubin als Zuchttaube im Bestand benötigt'+(S.pairRecIncludeReise?' (Reisetauben werden bereits einbezogen)':'')+'.</div>'
      +reiseToggle+'</div>';
  }
  if(!S.pairRecOpen){
    return '<div class="card">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">'
      +'<div><div class="card-title" style="margin-bottom:2px">🏆 Top-Paarungsempfehlungen</div>'
      +'<div style="font-size:12px;color:var(--text3)">Automatischer Vorschlag der besten Paarungen aus '+cand.males.length+' Zucht'+(S.pairRecIncludeReise?'-/Reise':'')+'täubern × '+cand.females.length+' Zucht'+(S.pairRecIncludeReise?'-/Reise':'')+'täubinnen im Bestand — bewertet nach Beständigkeit (Preisquote) und Geschwindigkeit (AS-Punkte).</div></div>'
      +'<button class="btn btn-outline btn-sm" onclick="S.pairRecOpen=true;render()">Empfehlungen berechnen</button>'
      +'</div>'
      +'<div style="margin-top:10px">'+reiseToggle+'</div>'
      +'</div>';
  }

  // Benötigte Flugdaten (Eigenleistung der Kandidaten + Flugdaten ihrer
  // Nachkommen für die Vererbungsstärke) einmalig gebündelt nachladen.
  var all = cand.males.concat(cand.females);
  var neededIds = {};
  all.forEach(function(p){
    neededIds[p.pigeonid]=true;
    getVererbungDescendants(p.pigeonid).forEach(function(d){ neededIds[d.pigeonid]=true; });
  });
  var idList = Object.keys(neededIds);
  var missing = idList.filter(function(id){ return !PT_CACHE[id]; });

  if(PAIR_REC.error){
    return '<div class="card"><div style="color:#e07070;font-size:13px">Fehler beim Laden der Flugdaten: '+escH(PAIR_REC.error)+'</div>'
      +'<button class="btn btn-sm" style="margin-top:10px" onclick="PAIR_REC.error=null;render()">Erneut versuchen</button></div>';
  }
  if(missing.length){
    if(!PAIR_REC.loading){
      PAIR_REC.loading=true; PAIR_REC.total=idList.length;
      withTimeout(loadPigeonTripsBatchChunked(idList), 60000)
        .then(function(){ PAIR_REC.loading=false; render(); })
        .catch(function(e){ PAIR_REC.loading=false; PAIR_REC.error=(e&&e.message)||'Unbekannter Fehler'; render(); });
    }
    return '<div class="card"><div class="card-title">🏆 Top-Paarungsempfehlungen</div>'
      +'<div class="loading"><div class="spinner"></div>Lade Flugdaten für '+idList.length+' Tauben…</div></div>';
  }
  PAIR_REC.loading=false;

  if(!PAIR_REC.results){
    var list=[];
    cand.males.forEach(function(m){
      cand.females.forEach(function(f){
        var pp = computePaarungsprognose(m,f);
        // WICHTIG: Beide Elternteile müssen eine eigene Datenbasis haben (Score
        // aus eigenen Flügen ODER aus Nachkommen). Sonst würde z.B. eine junge
        // Taube ganz ohne eigene Flugdaten und ohne Nachkommen allein deshalb
        // top platziert, weil der Partner einen hohen Score mitbringt — der
        // kombinierte Score wäre dann de facto nur die Bewertung einer Seite.
        if(pp.sF==null || pp.sM==null) return;
        var ib = calcInbreedingPair(m,f);
        list.push({m:m, f:f, pp:pp, ib:ib});
      });
    });
    list.sort(function(a,b){ return b.pp.combined-a.pp.combined; });
    PAIR_REC.results=list;
  }

  var maxInzucht = S.pairRecMaxInzucht/100;
  var minScore = S.pairRecMinScore||0;
  var filtered = PAIR_REC.results.filter(function(r){
    return (r.ib==null || r.ib<=maxInzucht) && r.pp.combined>=minScore;
  });
  var excluded = PAIR_REC.results.length - filtered.length;
  var shown = filtered.slice(0, S.pairRecTopN);

  var rows = shown.map(function(r,i){
    var c = r.pp.combined>=60?'var(--green)':r.pp.combined>=35?'var(--orange)':'#e07070';
    var ibPct = r.ib!=null ? (r.ib*100).toFixed(2)+' %' : '—';
    var ibColor = r.ib==null?'var(--text3)':r.ib<0.03?'var(--green)':r.ib<0.065?'var(--orange)':'#e07070';
    return '<tr>'
      +'<td style="text-align:center;color:var(--text3)">'+(i+1)+'</td>'
      +'<td style="font-family:monospace;font-size:12px;cursor:pointer" onclick="selectPigeon(\''+r.m.pigeonid+'\')" title="Details anzeigen">♂ '+escH(ring(r.m))+(r.m.name?'<br><span style="color:var(--text3)">'+escH(r.m.name)+'</span>':'')+'</td>'
      +'<td style="font-family:monospace;font-size:12px;cursor:pointer" onclick="selectPigeon(\''+r.f.pigeonid+'\')" title="Details anzeigen">♀ '+escH(ring(r.f))+(r.f.name?'<br><span style="color:var(--text3)">'+escH(r.f.name)+'</span>':'')+'</td>'
      +'<td style="text-align:center;font-weight:700;color:'+c+'">'+r.pp.combined+'</td>'
      +'<td style="text-align:center;color:'+ibColor+'">'+ibPct+'</td>'
      +'<td style="text-align:center;white-space:nowrap">'
      +'<button class="btn btn-outline btn-sm" title="In den Paarungsrechner laden" onclick="S.paarungM=findById(\''+r.m.pigeonid+'\');S.paarungF=findById(\''+r.f.pigeonid+'\');render();window.scrollTo(0,0)">👁</button> '
      +'<button class="btn btn-outline btn-sm" title="In der Paarungsliste speichern" onclick="savePairingToList(\''+r.m.pigeonid+'\',\''+r.f.pigeonid+'\')">💾</button></td>'
      +'</tr>';
  }).join('');

  return '<div class="card">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:2px">'
    +'<div class="card-title" style="margin-bottom:0;display:flex;align-items:center;gap:8px">🏆 Top-Paarungsempfehlungen <span onclick="showScoreSettingsModal()" title="Score-Einstellungen" style="cursor:pointer;color:var(--text3);font-size:14px;font-weight:400">⚙️</span></div>'
    +'<button class="btn btn-outline btn-sm" onclick="S.pairRecOpen=false;render()">✕ Einklappen</button>'
    +'</div>'
    +'<div style="font-size:11px;color:var(--text3);margin:6px 0 10px">Alle '+PAIR_REC.results.length+' möglichen Paare aus '+cand.males.length+' Zucht'+(S.pairRecIncludeReise?'-/Reise':'')+'täubern × '+cand.females.length+' Zucht'+(S.pairRecIncludeReise?'-/Reise':'')+'täubinnen im Bestand, sortiert nach Erfolgs-Score (Ø aus Beständigkeit/Preisquote und Geschwindigkeit/Top-AS-Quote — jeweils aus Eigenleistung und Nachkommen beider Eltern). Für die eigene Preisquote zählen nur Tauben mit mind. '+SCORE_CFG.minFluegePreisquote+' geflogenen Wettflügen, und es werden nur Paare gelistet, bei denen beide Elternteile eine eigene Datenbasis (Flüge oder bewertete Nachkommen) haben. Zu eng verwandte Paare werden nach der eingestellten Inzuchtgrenze automatisch ausgeblendet'+(excluded?' ('+excluded+' Paare aktuell gefiltert)':'')+'.</div>'
    +'<div class="qe-quickbar" style="margin-bottom:10px">'
    +'<div class="qe-group"><span class="qe-group-label">Anzahl</span><select onchange="S.pairRecTopN=parseInt(this.value);render()">'
    +[10,15,25,50,100].map(function(n){ return '<option value="'+n+'"'+(S.pairRecTopN===n?' selected':'')+'>Top '+n+'</option>'; }).join('')
    +'</select></div>'
    +'<div class="qe-group"><span class="qe-group-label">Max. Inzucht</span><select onchange="S.pairRecMaxInzucht=parseFloat(this.value);render()">'
    +[3,6.5,10,100].map(function(n){ return '<option value="'+n+'"'+(S.pairRecMaxInzucht===n?' selected':'')+'>'+(n===100?'ohne Grenze':'≤ '+n+' %')+'</option>'; }).join('')
    +'</select></div>'
    +'<div class="qe-group"><span class="qe-group-label">Mindest-Score</span><select onchange="S.pairRecMinScore=parseInt(this.value);render()">'
    +[0,35,50,60].map(function(n){ return '<option value="'+n+'"'+(S.pairRecMinScore===n?' selected':'')+'>'+(n===0?'alle':'≥ '+n)+'</option>'; }).join('')
    +'</select></div>'
    +'<div class="qe-group" style="justify-content:center">'+reiseToggle+'</div>'
    +'</div>'
    +(shown.length ? '<div class="table-wrap"><table style="width:100%;border-collapse:collapse;font-size:13px">'
      +'<thead><tr><th>#</th><th>♂ Täuber</th><th>♀ Täubin</th><th>Score</th><th>Inzucht</th><th></th></tr></thead>'
      +'<tbody>'+rows+'</tbody></table></div>'
      : '<div style="color:var(--text3);font-size:13px;padding:8px 0">Keine Paarungen erfüllen die aktuellen Filter — Mindest-Score senken oder Inzuchtgrenze anheben.</div>')
    +'</div>';
}

// ── Detail-Overlay: zeigt die Formel und pro Nachkomme, wie gut geflogen wurde ──
// Baut den eigentlichen Inhalt (Erklärung + Score-Aufschlüsselung + Nachkommen-
// Tabelle) OHNE Modal-Rahmen — wird sowohl vom Modal (showVererbungDetail, für
// die Statistik-Tabelle und den Paarungscheck) als auch von der aufklappbaren
// Inline-Ansicht in der Tauben-Detailseite (renderVererbungCard) genutzt.
function renderVererbungDetailBody(pigeonid){
  var p = findById(pigeonid); if(!p) return '';
  var er = computeErfolgsScore(pigeonid);
  var r = er.ver;
  if(!er.ready){ return '<div style="color:var(--text3);font-size:13px">Lade Flugdaten…</div>'; }

  var body, banner='';
  if(r.noDescendants){
    body = '<div style="color:var(--text3);font-size:13px">Keine Nachkommen (Kinder/Enkel) vorhanden.</div>';
  } else if(!r.ready){
    body = '<div style="color:var(--text3);font-size:13px">Lade Flugdaten der Nachkommen…</div>';
  } else {
    if(r.notEnough){
      banner = '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--text2)">'
        +'Kein Nachkommen-Score: '+r.flownCount+' Nachkommen sind geflogen, davon '+r.erfolgreicheCount+' erfolgreich und im Bestand (mind. '+VERERBER_MIN_ERFOLGREICHE+' nötig).</div>';
    } else if(r.noFlights){
      banner = '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--text2)">'
        +r.totalDescendants+' Nachkommen (Kinder+Enkel), aber noch keine Flugergebnisse erfasst.</div>';
    }
    var directChildIds = new Set(findChildren(pigeonid).map(function(c){return c.pigeonid;}));
    var rowsHtml = r.perDescendant.slice().sort(function(a,b){
      return (b.elite-a.elite) || (b.flown-a.flown) || (b.topAS-a.topAS) || (b.preise-a.preise);
    }).map(function(d){
      var dp=d.pigeon, sx=sex_(dp);
      var gen = directChildIds.has(dp.pigeonid) ? 'Kind' : 'Enkel';
      return '<tr onclick="closeVererbungDetail();selectPigeon(\''+dp.pigeonid+'\')" style="cursor:pointer">'
        +'<td style="font-family:monospace;font-size:12px">'+escH(ring(dp))+' '+(sx==='M'?'♂':sx==='F'?'♀':'')+'</td>'
        +'<td>'+escH(dp.name||'—')+'</td>'
        +'<td style="text-align:center;color:var(--text3);font-size:12px">'+gen+'</td>'
        +'<td style="text-align:center">'+(d.flown?d.gesetzt:'—')+'</td>'
        +'<td style="text-align:center">'+(d.flown?d.preise:'—')+'</td>'
        +'<td style="text-align:center">'+(d.flown?d.topAS:'—')+'</td>'
        +'<td style="text-align:center">'+(d.flown?d.topAS80:'—')+'</td>'
        +'<td style="text-align:center;color:'+(d.flown?(d.erfolgreich?'var(--green)':'var(--text2)'):'var(--text3)')+'">'+(d.flown?(d.erfolgreich?'✓ erfolgreich':'geflogen, nicht erfolgreich'):'– keine Flüge')+'</td>'
        +'<td style="text-align:center">'+(d.elite?'<span style="color:var(--green);font-weight:700" title="Herausragender Nachkomme im Bestand">★</span>':'')+'</td>'
        +'</tr>';
    }).join('');
    body = '<div class="table-wrap"><table style="width:100%;border-collapse:collapse;font-size:13px">'
      +'<thead><tr><th>Ring</th><th>Name</th><th>Generation</th><th>Flüge</th><th>Preise</th><th>Top (&gt;90 AS)</th><th>Top (&gt;'+VERERBER_ELITE_AS_SCHWELLE+' AS)</th><th>Status</th><th>Elite</th></tr></thead>'
      +'<tbody>'+rowsHtml+'</tbody></table></div>';
  }

  var combinedLine = er.score!=null
    ? '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:10px;font-size:13px;color:var(--text2)">'
      +'<strong style="font-size:16px;color:'+(er.score>=60?'var(--green)':er.score>=35?'var(--orange)':'#e07070')+'">'+er.score+' / 100</strong> Erfolgs-Score = '+SCORE_CFG.eigenAnteil+'% × Eigenleistung ('+(er.own.score!=null?er.own.score:'—')+') + '+(100-SCORE_CFG.eigenAnteil)+'% × Vererbung ('+(r.score!=null?r.score:'—')+')'
      +(er.note?'<div style="color:var(--text3);font-size:11px;margin-top:4px">'+er.note+'</div>':'')
      +'</div>'
    : '';
  var verScoreLine = r.score!=null
    ? '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--text2)">'
      +'Vererbung ('+r.score+') = 0,45 × Erfolgsquote ('+r.erfolgsquote.toFixed(1)+'%) + 0,37 × Beständigkeits-/Schnelligkeits-Teilscore + 0,06 × Aktivenanteil ('+r.aktivenanteil.toFixed(1)+'%) + 0,6 × Elite-Bonus (Elite-Nachkommen: '+r.eliteCount+')'
      +'</div>'
    : banner;
  var ownLine = (er.own && er.own.ready && !er.own.noFlights)
    ? '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--text2)">'
      +'Eigenleistung ('+er.own.score+') = Preisquote '+er.own.preisquote.toFixed(1)+'% + Top-AS-Quote '+er.own.topASquote.toFixed(1)+'% (mind. '+SCORE_CFG.minFluegePreisquote+' Flüge, '+er.own.gesetzt+' vorhanden), gewichtet nach Beständigkeit/Schnelligkeit-Einstellung.</div>'
    : (er.own && er.own.tooFewFlights)
      ? '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--text2)">Eigenleistung: zu wenige Flüge ('+er.own.gesetzt+'/'+SCORE_CFG.minFluegePreisquote+') für eine belastbare Preisquote.</div>'
      : '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--text2)">Eigenleistung: keine eigenen Flugdaten erfasst.</div>';

  return '<div style="font-size:12px;color:var(--text3);margin-bottom:14px">Derselbe Erfolgs-Score wie im Paarungscheck: ein einstellbarer Mix aus Eigenleistung (eigene Flüge) und Vererbung (Flugleistung von Kindern + Enkeln). Gewichtung über das ⚙-Symbol einstellbar. Erfolgsquote (größter Faktor der Vererbung) = Anteil der geflogenen Nachkommen, die "erfolgreich" sind (Preisquote ≥'+VERERBER_ERFOLG_MIN_PREISQUOTE+'%, davon mind. '+VERERBER_ERFOLG_MIN_TOPAS+' Preise über '+VERERBER_ELITE_AS_SCHWELLE+' AS-Punkten, mind. '+SCORE_CFG.minFluegePreisquote+' Flüge, noch im Bestand) — bringt eine Taube z.B. 19 fliegende Nachkommen hervor, von denen nur 1-2 wirklich erfolgreich sind, bleibt der Score trotz dieser guten Einzeltiere niedrig. Elite-Nachkommen (★) = im Bestand, ohne Status, mind. '+VERERBER_ELITE_MIN_PREISE+' Preise bei mind. '+VERERBER_ELITE_MIN_PREISQUOTE+'% Preisquote, davon mind. '+VERERBER_ELITE_MIN_TOPAS+' über '+VERERBER_ELITE_AS_SCHWELLE+' AS-Punkten.</div>'
    + combinedLine + ownLine + verScoreLine + body;
}
function closeVererbungDetail(){
  var el=document.querySelector('.veret-detail-overlay');
  if(el) el.remove();
}
function showVererbungDetail(pigeonid){
  var p = findById(pigeonid); if(!p) return;
  var er = computeErfolgsScore(pigeonid);
  if(!er.ready){ return; } // wird beim nächsten render() automatisch neu versucht, sobald Daten da sind

  var overlay=document.createElement('div');
  overlay.className='lightbox-overlay veret-detail-overlay';
  overlay.style.cursor='default';
  overlay.onclick=function(e){ if(e.target===overlay) overlay.remove(); };
  var panel=document.createElement('div');
  panel.style.cssText='background:var(--bg2);border:1px solid var(--border);border-radius:12px;max-width:640px;width:92vw;max-height:86vh;overflow-y:auto;padding:20px;cursor:default';
  panel.onclick=function(e){ e.stopPropagation(); };
  panel.innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px">'
      +'<div class="card-title" style="margin:0">🧬 Erfolgs-Score — '+escH(ring(p))+(p.name?' · '+escH(p.name):'')+'</div>'
      +'<div style="display:flex;align-items:center;gap:10px">'
      +'<span onclick="closeVererbungDetail();S.tab=\'tauben\';S.selected=null;S.taubenView=\'statistik\';render();window.scrollTo(0,0)" title="Vollständige, exportierbare Tabelle aller Bestandstauben in der Statistik" style="cursor:pointer;color:var(--text3);font-size:16px">📋</span>'
      +'<span onclick="showScoreSettingsModal()" title="Score-Einstellungen" style="cursor:pointer;color:var(--text3);font-size:16px">⚙️</span>'
      +'<span onclick="closeVererbungDetail()" style="cursor:pointer;color:var(--text3);font-size:20px;line-height:1;padding:2px 6px">×</span>'
      +'</div>'
    +'</div>'
    + renderVererbungDetailBody(pigeonid);
  overlay.appendChild(panel);
  document.body.appendChild(overlay);
}
// Kompakte Karte für die Tauben-Detailseite und für andere Views wiederverwendbar.
// Zeigt denselben Erfolgs-Score wie der Paarungscheck (Eigenleistung + Vererbung,
// nach SCORE_CFG gewichtet) — Details/Stammbaum und Paarungscheck sind damit
// konsistent.
// Zeigt bei Bedarf inline (statt als Modal) auf, welche Tauben aktuell
// aufgeklappt sind — pigeonid-basiert, damit z.B. im Paarungscheck zwei
// Karten (Vater-/Mutter-Kandidat) unabhängig voneinander aufklappbar sind.
let VERET_EXPANDED_IDS = new Set();
function toggleVererbungDetail(pigeonid){
  if(VERET_EXPANDED_IDS.has(pigeonid)) VERET_EXPANDED_IDS.delete(pigeonid);
  else VERET_EXPANDED_IDS.add(pigeonid);
  render();
}
function renderVererbungCard(pigeonid, erArg){
  var er = erArg || computeErfolgsScore(pigeonid);
  var label = '<div class="section-label" style="margin-top:14px;display:flex;align-items:center;gap:8px">'
    +'<span class="clickable" style="cursor:pointer" onclick="toggleVererbungDetail(\''+pigeonid+'\')" title="Details zur Berechnung anzeigen">🧬 Erfolgs-Score (Eigenleistung + Vererbung)</span>'
    +'<span onclick="showScoreSettingsModal()" title="Score-Einstellungen" style="cursor:pointer;color:var(--text3);font-size:13px">⚙️</span>'
    +'</div>';
  if(!er.ready){
    return label + `<div style="color:var(--text3);font-size:13px;padding:8px 0">Lade Flugdaten…</div>`;
  }
  var expanded = VERET_EXPANDED_IDS.has(pigeonid);
  // Aufklappbarer Detailbereich unterhalb der Score-Box — dieselben Inhalte
  // wie zuvor im Modal, jetzt direkt in der Seite statt in einem separaten
  // Overlay-Fenster.
  var detailSection = expanded
    ? '<div style="border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-top:8px">'
      + '<div style="display:flex;justify-content:flex-end;margin-bottom:8px">'
      + '<span onclick="toggleVererbungDetail(\''+pigeonid+'\')" style="cursor:pointer;color:var(--text3);font-size:12px">▴ Details ausblenden</span>'
      + '</div>'
      + renderVererbungDetailBody(pigeonid)
      + '</div>'
    : '';
  if(er.score==null){
    var ver=er.ver;
    var msg = ver.noDescendants ? 'Keine Nachkommen (Kinder/Enkel) vorhanden und keine eigenen Flugdaten.'
      : ver.notEnough ? ver.flownCount+' Nachkommen geflogen, '+ver.erfolgreicheCount+' davon erfolgreich (mind. '+VERERBER_MIN_ERFOLGREICHE+' nötig) — und keine eigenen Flugdaten.'
      : 'Keine ausreichende Datenbasis (weder eigene Flüge noch bewertete Nachkommen).';
    return label + `<div style="color:var(--text3);font-size:13px;padding:8px 0;cursor:pointer" onclick="toggleVererbungDetail('${pigeonid}')">${msg} ${expanded?'Details ausblenden ▴':'Details anzeigen →'}</div>` + detailSection;
  }
  var col = er.score>=60?'var(--green)':er.score>=35?'var(--orange)':'#e07070';
  var own=er.own, ver=er.ver;
  var ownBadge = (own.ready && !own.noFlights)
    ? own.score+' <span style="color:var(--text3);font-weight:400">(Preisq. '+own.preisquote.toFixed(0)+'% · Top-AS '+own.topASquote.toFixed(0)+'%)</span>'
    : (own.tooFewFlights ? '<span style="color:var(--text3)">zu wenige Flüge ('+own.gesetzt+'/'+SCORE_CFG.minFluegePreisquote+')</span>' : '<span style="color:var(--text3)">keine eigenen Flugdaten</span>');
  var verBadge = (ver.ready && ver.score!=null)
    ? ver.score+' <span style="color:var(--text3);font-weight:400">(Erfolgsq. '+ver.erfolgsquote.toFixed(0)+'% · '+ver.erfolgreicheCount+'/'+ver.activeCount+')</span>'
    : (ver.notEnough ? '<span style="color:var(--text3)">'+ver.flownCount+' geflogen, '+ver.erfolgreicheCount+' erfolgreich</span>'
      : ver.noDescendants ? '<span style="color:var(--text3)">keine Nachkommen</span>'
      : ver.noFlights ? '<span style="color:var(--text3)">Nachkommen noch ohne Flugdaten</span>'
      : '<span style="color:var(--text3)">keine ausreichende Datenbasis</span>');
  return label
    +`<div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;display:flex;gap:18px;flex-wrap:wrap;align-items:center;cursor:pointer" onclick="toggleVererbungDetail('${pigeonid}')" title="Details zur Berechnung anzeigen">
      <div style="text-align:center">
        <div style="font-family:'Playfair Display',serif;font-size:32px;font-weight:700;color:${col}">${er.score}</div>
        <div style="font-size:10px;color:var(--text3)">Erfolgs-Score / 100</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text2)">
        <div><span style="color:var(--text3)">Eigenleistung (${SCORE_CFG.eigenAnteil}%):</span> <strong>${ownBadge}</strong></div>
        <div><span style="color:var(--text3)">Vererbung (${100-SCORE_CFG.eigenAnteil}%):</span> <strong>${verBadge}</strong></div>
        ${er.note?`<div style="color:var(--text3);font-size:11px">${er.note}</div>`:''}
      </div>
      <div style="margin-left:auto;color:var(--text3);font-size:12px">${expanded?'▴':'▾'}</div>
    </div>`
    + detailSection;
}

async function saveManualSeason(pigeonid, existingId){
  const val=id=>{ const el=document.getElementById(id); return el?el.value.trim():''; };
  const vintage=parseInt(val('ms-vintage'));
  const gesetzt=parseInt(val('ms-gesetzt'))||0;
  const preise=parseInt(val('ms-preise'))||0;
  const asSum=val('ms-assum')?parseFloat(val('ms-assum')):null;
  const kmSum=val('ms-kmsum')?parseFloat(val('ms-kmsum')):null;
  if(!vintage){ alert('Bitte ein gültiges Reisejahr angeben.'); return; }
  if(preise>gesetzt){ alert('Die Anzahl Preise kann nicht größer als die Anzahl Flüge sein.'); return; }
  const btn=document.getElementById('ms-save-btn');
  if(btn){ btn.disabled=true; btn.textContent='Speichere…'; }
  try{
    const row={pigeonid, vintage, gesetzt, preise, as_sum:asSum, km_sum:kmSum};
    let saved;
    const already = existingId ? null : (MANUAL_SEASONS_BY_PIGEON[pigeonid]||[]).find(s=>String(s.vintage)===String(vintage));
    const targetId = existingId || (already?already.id:null);
    if(targetId){
      await apiPatchBy('pigeon_manual_seasons','id=eq.'+targetId, row);
      saved = {...row, id:targetId};
    } else {
      saved = {...row, id:crypto.randomUUID()};
      await apiPost('pigeon_manual_seasons', saved);
    }
    MANUAL_SEASONS_BY_PIGEON[pigeonid] = (MANUAL_SEASONS_BY_PIGEON[pigeonid]||[]).filter(s=>s.id!==saved.id).concat([saved]);
    document.querySelectorAll('.manual-season-overlay').forEach(o=>o.remove());
    render();
  }catch(e){
    alert('Speichern fehlgeschlagen: '+e.message+'\n\nHinweis: Dafür muss in Supabase die Tabelle "pigeon_manual_seasons" angelegt sein (siehe Dokumentation).');
    if(btn){ btn.disabled=false; btn.textContent='Speichern'; }
  }
}

async function deleteManualSeason(pigeonid, id){
  if(!confirm('Diese manuell erfasste Jahresleistung wirklich löschen?')) return;
  try{
    await apiDeleteBy('pigeon_manual_seasons','id=eq.'+id);
    MANUAL_SEASONS_BY_PIGEON[pigeonid] = (MANUAL_SEASONS_BY_PIGEON[pigeonid]||[]).filter(s=>s.id!==id);
    render();
  }catch(e){ alert('Löschen fehlgeschlagen: '+e.message); }
}
