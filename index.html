async function saveManualFlight(pigeonid){
  const val=id=>{ const el=document.getElementById(id); return el?el.value.trim():''; };
  const datum=val('mf-date'), flugnr=val('mf-number'), ort=val('mf-location'), flugtyp=val('mf-type'),
    entfernung=val('mf-distance'), preis=val('mf-prize'), asPkt=val('mf-as'), teilnehmer=val('mf-participants'),
    kategorie=val('mf-category');
  if(!datum || !ort){ alert('Bitte mindestens Datum und Auflassort angeben.'); return; }
  const vintage=parseInt(datum.substring(0,4));
  const tripNumber=flugnr?parseInt(flugnr):null;
  const tripDistance=entfernung?parseFloat(entfernung):null;
  const btn=document.getElementById('mf-save-btn');
  if(btn){ btn.disabled=true; btn.textContent='Speichere…'; }
  try{
    if(!RT.trips.length) await loadTrips();
    let match = RT.trips.find(t=>normL(t.location)===normL(ort) && t.tripdate===datum);
    let tripid;
    if(match){
      tripid=match.tripid;
    } else {
      // RT.trips ist auf die letzten 500 Reisen begrenzt — zur Sicherheit
      // zusätzlich live prüfen, um doppelte Reise-Datensätze zu vermeiden.
      const existing = await apiGet('/trips?location=eq.'+encodeURIComponent(ort)+'&tripdate=eq.'+datum+'&limit=1');
      if(existing && existing.length){ match=existing[0]; tripid=match.tripid; RT.trips.push(match); }
      else{
        tripid=crypto.randomUUID();
        match={tripid, vintage, number:tripNumber, location:ort, tripdate:datum, flighttype:flugtyp||null, averagedistance3:tripDistance};
        await apiPost('trips', match);
        RT.trips.push(match);
      }
    }
    const p=findById(pigeonid);
    const newRow={
      id:crypto.randomUUID(), tripid, pigeonid,
      ringnumber:p?p.ringnumber:null, sex:sex_(p)||null,
      is_manual:true, manual_category:kategorie||null,
      manual_prize:preis?parseInt(preis):null,
      manual_as:asPkt?parseFloat(asPkt):null,
      manual_participants:teilnehmer?parseInt(teilnehmer):null
    };
    await apiPost('pigeontrips', newRow);
    const enriched={...newRow, vintage:match.vintage||vintage, tripnumber:match.number||tripNumber,
      location:match.location||ort, tripdate:match.tripdate||datum, pigeonsset:match.pigeonsset||null,
      distance:match.averagedistance3!=null?Number(match.averagedistance3):tripDistance};
    PT_CACHE[pigeonid] = (PT_CACHE[pigeonid]||[]).concat([enriched]);
    document.querySelectorAll('.manual-flight-overlay').forEach(o=>o.remove());
    render();
  }catch(e){
    alert('Speichern fehlgeschlagen: '+e.message+'\n\nHinweis: Dafür müssen in Supabase die Spalten trips.flighttype sowie pigeontrips.is_manual/manual_category/manual_prize/manual_as/manual_participants angelegt sein (siehe Dokumentation).');
    if(btn){ btn.disabled=false; btn.textContent='Speichern'; }
  }
}

// ── Datensicherung: Logik ─────────────────────────────────────────
function backupFilename(){
  const d=new Date(); const p=n=>String(n).padStart(2,'0');
  return 'Datensicherung-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())+'.json';
}
async function collectBackupData(onProgress){
  const tables={};
  onProgress&&onProgress('Tauben…');       tables.pigeons        = await apiGetAll('/pigeons?select=*');
  onProgress&&onProgress('Reisen…');       tables.trips          = await apiGetAll('/trips?select=*');
  onProgress&&onProgress('Flugergebnisse…');tables.pigeontrips    = await apiGetAll('/pigeontrips?select=*');
  onProgress&&onProgress('Züchter…');      tables.breedersdata   = await apiGetAll('/breedersdata?select=*');
  tables.breederprofile = await apiGetAll('/breederprofile?select=*');
  onProgress&&onProgress('Referenzdaten…'); tables.pigeonstates   = await apiGetAll('/pigeonstates?select=*');
  const counts={}; Object.entries(tables).forEach(([k,v])=>counts[k]=v.length);
  return {
    meta:{ app:'Columba-Kersting', created:new Date().toISOString(), version:1, counts },
    tables,
    settings:{
      rven: RVEN,
      taubenCols: JSON.parse(localStorage.getItem('taubenCols')||'null'),
      bestenlisteCols: JSON.parse(localStorage.getItem('bestenlisteCols')||'null'),
      lang: LANG
    }
  };
}
function downloadBackupFile(data, filename){
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },1000);
}
function totalRows(counts){ return Object.values(counts||{}).reduce((a,b)=>a+b,0); }

async function runLocalBackup(){
  BK.busy=true; BK.error=null; BK.lastResult=null; BK.progress='Sammle Daten…'; render();

    const data = await collectBackupData(msg=>{ BK.progress=msg; render(); });
    downloadBackupFile(data, backupFilename());
    BK.lastResult = '💾 Backup heruntergeladen — '+totalRows(data.meta.counts).toLocaleString('de')+' Datensätze.';
  }catch(e){ BK.error='Fehler beim Erstellen der Datensicherung: '+e.message; }
  BK.busy=false; BK.progress=null; render();
}
async function runServerBackup(){
  BK.busy=true; BK.error=null; BK.lastResult=null; BK.progress='Sammle Daten…'; render();
  try{
    const data = await collectBackupData(msg=>{ BK.progress=msg; render(); });
    const filename = backupFilename();
    BK.progress='Lade auf Server hoch…'; render();
    await storageUpload(BACKUP_BUCKET, filename, JSON.stringify(data), 'application/json');
    BK.lastResult = '☁️ Backup auf dem Server gespeichert: '+filename+' ('+totalRows(data.meta.counts).toLocaleString('de')+' Datensätze).';

  }catch(e){
    const notFound = /bucket not found/i.test(e.message);
    BK.error = 'Fehler beim Server-Backup: '+e.message+(notFound?' — der Storage-Bucket "backups" muss einmalig angelegt werden (siehe Hinweis unten).':'');
  }
  BK.busy=false; BK.progress=null; render();
}
async function loadServerBackups(){

async function deleteServerBackup(name){

async function restoreFromServer(name){

async function handleRestoreFile(file){

  catch(e){ alert('Datei konnte nicht gelesen werden — ist es eine gültige Datensicherung? ('+e.message+')'); }
}
function startRestoreFlow(data, sourceLabel){
  if(!data || !data.tables){ alert('Diese Datei sieht nicht wie eine Columba-Kersting-Datensicherung aus.'); return; }
  BK.restoreData=data; BK.restoreSource=sourceLabel; BK.restoreMode='merge'; render();
}
function cancelRestoreFlow(){ BK.restoreData=null; BK.restoreSource=null; BK.restoreLog=[]; render(); }

// Reihenfolge wichtig: Eltern-Tabellen vor abhängigen Tabellen (Reisen vor
// Flugergebnissen usw.). "pigeons" referenziert Vater/Mutter aber innerhalb
// derselben Tabelle — dafür gibt es unten einen zweiten Versuch.
// Spalten, die beim Wiederherstellen NICHT mitgeschickt werden dürfen: sie
// haben serverseitige Defaults (z.B. createdby = auth.uid()), die von RLS-
// Policies durchgesetzt werden. Der ursprüngliche Wert aus der Sicherung
// kann von der aktuell eingeloggten Nutzer-ID abweichen (z.B. bei Zeilen,
// die vor Einführung des Logins angelegt wurden) und würde sonst die
// gesamte Charge mit "new row violates row-level security policy" scheitern
// lassen. Ohne die Spalte greift beim Insert der DB-Default (= aktueller
// Nutzer), beim Update bleibt der bestehende Wert einfach unangetastet.
const RESTORE_STRIP_COLUMNS = { breedersdata:['createdby'] };
function stripRestoreRows(table, rows){
  const cols = RESTORE_STRIP_COLUMNS[table];
  if(!cols || !rows) return rows;
  return rows.map(row=>{ const copy=Object.assign({},row); cols.forEach(c=>delete copy[c]); return copy; });
}
function restorePlan(tables){
  return [
    ['breederprofile', stripRestoreRows('breederprofile', tables.breederprofile), 'id'],
    ['breedersdata',   stripRestoreRows('breedersdata',   tables.breedersdata),   'breederdataid'],
    ['pigeons',        stripRestoreRows('pigeons',        tables.pigeons),        'pigeonid'],
    ['trips',          stripRestoreRows('trips',          tables.trips),          'tripid'],
    ['pigeontrips',    stripRestoreRows('pigeontrips',    tables.pigeontrips),    'id'],
  ];
}
async function runRestore(){
  const data = BK.restoreData; if(!data||!data.tables) return;
  const mode = BK.restoreMode;
  if(mode==='replace'){
    if(!confirm('ACHTUNG: Dies löscht ALLE aktuellen Daten (Tauben, Reisen, Ergebnisse, Züchter) unwiderruflich und ersetzt sie durch den Inhalt von "'+BK.restoreSource+'".\n\nWirklich fortfahren?')) return;
    if(!confirm('Letzte Sicherheitsabfrage: Alle aktuellen Daten werden GELÖSCHT. Bist du sicher?')) return;
  } else {
    if(!confirm('Daten aus "'+BK.restoreSource+'" werden mit den aktuellen Daten zusammengeführt (Datensätze mit gleicher ID werden überschrieben, nichts wird gelöscht). Fortfahren?')) return;
  }

  BK.restoring=true; BK.restoreLog=[]; BK.error=null; render();
  const log=(m)=>{ BK.restoreLog.push(m); render(); };

  try{
    if(mode==='replace'){
      log('Lösche vorhandene Daten…');
      const dels=[['pigeontrips','id'],['trips','tripid'],['pigeons','pigeonid'],['breedersdata','breederdataid'],['breederprofile','id']];
      for(const [table,pk] of dels){
        try{ await apiDeleteBy(table, pk+'=not.is.null'); }
        catch(e){ log('⚠ '+table+' konnte nicht vollständig geleert werden: '+e.message); }
      }
    }
    const plan = restorePlan(data.tables);
    const allFailed=[];
    for(const [table, rows, pk] of plan){
      if(!rows||!rows.length) continue;
      log('Importiere '+table+' ('+rows.length.toLocaleString('de')+')…');
      const failed = await apiUpsertBatch(table, rows, pk);
      if(failed.length) allFailed.push({table,pk,failed});
    }
    if(allFailed.length){
      const n=allFailed.reduce((a,f)=>a+f.failed.length,0);
      log('Zweiter Versuch für '+n+' zunächst fehlgeschlagene Batches (meist Reihenfolge bei Eltern-Referenzen)…');
      for(const f of allFailed){
        const rows2=f.failed.flatMap(x=>x.chunk);
        const stillFailed=await apiUpsertBatch(f.table, rows2, f.pk);
        if(stillFailed.length) log('❌ '+f.table+': '+stillFailed.length+' Batch(es) weiterhin fehlgeschlagen — Details: '+stillFailed[0].error.slice(0,200));
      }
    }
    if(data.settings){
      log('Übernehme Einstellungen (RVen, Spalten)…');
      try{
        if(data.settings.rven){ RVEN=data.settings.rven; saveRVen(); RVEN.forEach(v=>syncRVToServer(v)); }
        else if(data.settings.vereine){
          // Backup aus einer älteren Version (Einzelverein-Verwaltung) —
          // als grobe RVen übernehmen (prefix/regv+rv+verein -> code).
          RVEN = data.settings.vereine.map(v=>({id:v.id, label:v.label, code:v.prefix||v.code||((v.regv||'')+(v.rv||'')+(v.verein||''))}));
          saveRVen();
          RVEN.forEach(v=>syncRVToServer(v));
        }
        if(data.settings.taubenCols) localStorage.setItem('taubenCols', JSON.stringify(data.settings.taubenCols));
        if(data.settings.bestenlisteCols) localStorage.setItem('bestenlisteCols', JSON.stringify(data.settings.bestenlisteCols));
      }catch(e){ log('⚠ Einstellungen: '+e.message); }
    }
    log('✅ Wiederherstellung abgeschlossen. Lade Daten neu…');
    BREEDER_PROFILE_LOADED=false; BREEDERSDATA_CACHE=null; ZT.loaded=false; RT.trips=[]; RT.collapsedSeasonsInited=false;
    await loadData();
    await loadTrips();
    log('✅ Fertig.');
  }catch(e){
    log('❌ Fehler: '+e.message);
  }
  BK.restoring=false; render();
}

function humanFileSize(bytes){
  if(bytes==null) return '—';
  if(bytes<1024) return bytes+' B';
  const units=['KB','MB','GB']; let i=-1;
  do{ bytes/=1024; i++; }while(bytes>=1024 && i<units.length-1);
  return bytes.toFixed(1)+' '+units[i];
}

// Kurzes Datum ohne Jahr, z.B. "2026-05-30" -> "30.05." (Jahr steht bereits
// in der Saison-Überschrift und muss hier nicht wiederholt werden).
function shortTripDate(iso){
  if(!iso) return '?';
  const m=String(iso).match(/^\d{4}-(\d{2})-(\d{2})/);
  return m ? m[2]+'.'+m[1]+'.' : iso;
}

function renderTripsList(){
  if(!ZT.loaded){ loadZuechterData().then(render); }
  if(!RT.collapsedSeasons) RT.collapsedSeasons=new Set();

  // außer der aktuellsten (höchstes Jahr) standardmäßig einklappen. Danach
  // bleibt der individuell vom Nutzer gewählte Zustand (toggleTripSeason)
  // maßgeblich, auch wenn zwischendurch neu gerendert wird.
  if(!RT.collapsedSeasonsInited && RT.trips.length){
    const years=[...new Set(RT.trips.map(t=>String(t.vintage||'?')))].sort((a,b)=>b-a);
    years.slice(1).forEach(y=>RT.collapsedSeasons.add(y));
    RT.collapsedSeasonsInited=true;
  }
  if(!RT.expandedTripBreeders) RT.expandedTripBreeders=new Set();
  const anyComputedRV = RT.trips.some(t=>!t.pigeonsset_rv && t.pigeonsset_rv_calc>0);
  const grouped={};
  RT.trips.forEach(t=>{ const yr=t.vintage||'?'; if(!grouped[yr]) grouped[yr]=[]; grouped[yr].push(t); });
  const cards=Object.keys(grouped).sort((a,b)=>b-a).map(yr=>{
    const seasonCollapsed=RT.collapsedSeasons.has(String(yr));
    const rows=grouped[yr].map(tr=>{
      const breeders=ZT.loaded?tripBreederRows(tr.tripid):[];

      const rvCalc=tr.pigeonsset_rv_calc>0?tr.pigeonsset_rv_calc:null;
      const rvStd=(rvReal==null && rvCalc==null)?standardRVGesetztForTrip(tr.tripid):null;
      const rvN=rvReal!=null?rvReal:(rvCalc!=null?rvCalc:rvStd);
      const reggrN=tr.pigeonsset_reggr>0?tr.pigeonsset_reggr:null;

      return `

          <td style="text-align:right;color:var(--text3)">${regN!=null?regN+' Tb.':'—'}</td>
          <td style="text-align:center;white-space:nowrap">${breeders.length>1?`<span onclick="event.stopPropagation();toggleTripBreeders('${tr.tripid}')" style="cursor:pointer;color:var(--text3)" title="${breeders.length} Züchter anzeigen">🧑‍🌾 ${breeders.length} ${breedersOpen?'▴':'▾'}</span>`:''}</td>
        </tr>
        ${breedersOpen&&breeders.length>1?`<tr onclick="event.stopPropagation()" style="cursor:default"><td colspan="8" style="background:var(--bg2);padding:8px 12px">
          <div style="display:flex;flex-direction:column;gap:5px">
            ${breeders.map(b=>`
              <div onclick="openTrip('${tr.tripid}',${jsAttr(b.key)})" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;background:var(--bg3);border-radius:8px;padding:5px 9px" title="Nur Tauben von ${escH(b.name)} anzeigen (Ankunftsreihenfolge)">

                </span>
              </div>`).join('')}
          </div>
        </td></tr>`:''}`;
    }).join('');
    return `
    <div style="margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:8px;user-select:none" onclick="toggleTripSeason('${yr}')">
        <span style="font-size:11px;color:var(--text3);transition:transform .15s;transform:rotate(${seasonCollapsed?'-90':'0'}deg);display:inline-block">▾</span>
        <span style="font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.5px">${t('season')} ${yr}</span>
        <span style="font-size:11px;color:var(--text3)">(${grouped[yr].length})</span>
      </div>
      ${seasonCollapsed?'':`<div class="table-wrap"><table>
        <thead><tr><th>${t('trip_word')}-Nr.</th><th>Datum</th><th>Auflassort</th><th style="text-align:right">KM</th><th style="text-align:right">RV</th><th style="text-align:right">RegGr</th><th style="text-align:right">Reg</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`}
    </div>`;
  }).join('');

  return '<div><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px"><div class="serif" style="font-size:20px">🏁 '+RT.trips.length+' '+t('trips_word')+'</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-outline" title="Findet Reisen, die versehentlich mehrfach angelegt wurden (gleicher Jahrgang/Ort/Datum) und führt sie zusammen." onclick="showDuplicateTripsModal()">🧹 Duplikate bereinigen</button><button class="btn btn-outline" title="Gleicht Flugergebnisse ohne Taubenzuordnung (z.B. weil die Taube erst nach dem Import angelegt wurde) erneut per Ringnummer mit der Tauben-Datenbank ab." onclick="runBackfillMissingPigeonLinks(event)">🔗 Fehlende Verknüpfungen reparieren</button><button class="btn btn-outline" title="Für alle bereits importierten Flüge ohne eigene RV-Liste (zu wenig Tauben) die RV-Rangliste selbst berechnen und speichern — einmalig nötig für Altbestand, neue Importe machen das automatisch." onclick="runBackfillRVFallbackAll(event)">🧮 RV-Ranglisten nachrechnen</button><button class="btn" onclick="RT.step=\'import\';RT.imp={step:\'upload\',rows:[],breeders:[],vereinId:defaultVereinId(),stats:{trips:0,tripsUpdated:0,results:0,resultsNew:0,resultsUpdated:0,err:0,rlsBlocked:0}};render()">📥 '+t('import_perf')+'</button></div></div>'
    +(anyComputedRV?'<div style="font-size:11px;color:var(--text3);margin:-8px 0 12px">* RV-Taubenzahl selbst berechnet, da für diesen Flug keine eigene RV-Liste importiert wurde (zu geringe Taubenzahl auf RV-Ebene).</div>':'')
    +(RT.trips.length===0?'<div style="text-align:center;padding:48px;color:var(--text3)">'+t('no_trips')+'<br><button class="btn" style="margin-top:14px" onclick="RT.step=\'import\';render()">📥 '+t('import_now')+'</button></div>':cards)+'</div>';
}
function toggleTripSeason(yr){ const k=String(yr); if(RT.collapsedSeasons.has(k)) RT.collapsedSeasons.delete(k); else RT.collapsedSeasons.add(k); render(); }
function toggleTripBreeders(tripid){ if(RT.expandedTripBreeders.has(tripid)) RT.expandedTripBreeders.delete(tripid); else RT.expandedTripBreeders.add(tripid); render(); }

// Fasst die je Reise importierten Züchter mit gesetzten Tauben und Preisen zusammen
function tripBreederRows(tripid){
  const g={};
  ZT.rows.filter(r=>r.tripid===tripid).forEach(r=>{
    const key=zuechterKey(r);
    if(!g[key]) g[key]={key, name:r.breedername||'Unbekannt', number:r.breedernumber||null, gesetzt:0, rv:0, reggr:0, reg:0};
    const b=g[key];
    if(r.breedername && r.breedername.length>b.name.length) b.name=r.breedername;
    if(!b.number && r.breedernumber) b.number=r.breedernumber;
    b.gesetzt++;
    if(r.prize_rv) b.rv++;
    if(r.prize_reggr) b.reggr++;
    if(r.prize_reg) b.reg++;
  });
  return Object.values(g).sort((a,b)=>a.name.localeCompare(b.name));
}

// breederKey: zuechterKey() eines Züchters (nicht mehr der rohe Name) — siehe
// distinctBreeders()/tripBreederRows().
async function openTrip(tripid,breederKey){
  RT.selected=RT.trips.find(t=>t.tripid===tripid);
  RT.step='detail'; RT.results=[]; RT.breederFilter=breederKey||null; RT.rvFilter=null; render();
  await loadTripResults(tripid); render();
}

// Ergebnisse einer Reise ggf. auf einen Züchter gefiltert, sortiert nach
// Ankunftsreihenfolge = Geschwindigkeit (m/min) absteigend.
// "Pl." (r.placement) ist die Gesamtreihenfolge über alle Züchter der Reise.
// Zusätzlich wird hier je Ergebnis die Platzierung INNERHALB des jeweiligen
// Züchters berechnet (r._breederRank), unabhängig vom aktuellen Filter.
function tripDetailRows(){
  const byBreeder={};
  RT.results.forEach(r=>{
    const key=zuechterKey(r);
    (byBreeder[key]=byBreeder[key]||[]).push(r);
  });
  Object.values(byBreeder).forEach(list=>{
    list.sort((a,b)=>(Number(b.speed)||-Infinity)-(Number(a.speed)||-Infinity));
    list.forEach((r,i)=>{ r._breederRank=i+1; });
  });
  let base=RT.results;
  if(RT.breederFilter) base=base.filter(r=>zuechterKey(r)===RT.breederFilter);
  if(RT.rvFilter==='__none__') base=base.filter(r=>!rvForNumber(r.breedernumber));
  else if(RT.rvFilter) base=base.filter(r=>{ const rv=rvForNumber(r.breedernumber); return rv && rv.id===RT.rvFilter; });
  return base.slice().sort((a,b)=>(Number(b.speed)||-Infinity)-(Number(a.speed)||-Infinity));
}
// RT.breederFilter speichert seit Kurzem den kanonischen zuechterKey() statt
// des rohen Namenstextes (siehe distinctBreeders/tripBreederRows) — der
// Parametername "key" macht das explizit.
function setTripBreederFilter(key){ RT.breederFilter=key||null; render(); }
function setTripRVFilter(id){ RT.rvFilter=id||null; render(); }

// Zellendarstellung für Vorbenennungs-Flags: mit Platz (1.-3.) farblich
// hervorgehoben, ohne Platz nur ein dezentes Häkchen, sonst leer.
function tripFlagCell(r, key, label){
  if(!r[key+'_flag']) return '<span style="color:var(--text3)">—</span>';
  const platz=r[key+'_platz'];
  if(platz) return `<span class="badge badge-u" title="${label} — Platz ${platz} der Vorbenennung">${label}${platz}</span>`;
  return `<span style="color:var(--text2)" title="${label} vorbenannt">${label}</span>`;
}

function renderTripDetail(){
  const trip=RT.selected; if(!trip) return renderTripsList();
  const sorted=tripDetailRows();
  const rvFallback = computeRVFallback(trip, RT.results);
  const rvCellFor = r => {
    if(r.prize_rv!=null) return String(r.prize_rv);
    // Bevorzugt die bereits dauerhaft gespeicherte Berechnung (prize_rv_calc/as_rv_calc,
    // siehe backfillRVFallback) — nur direkt nach einem Import, bevor die Hintergrund-
    // Berechnung durchgelaufen ist, wird live nachgerechnet (rvFallback).
    const rang = r.prize_rv_calc!=null ? r.prize_rv_calc : (rvFallback && rvFallback.get(r)?.rang);
    const as   = r.as_rv_calc!=null ? r.as_rv_calc : (rvFallback && rvFallback.get(r)?.as);
    if(rang==null) return '—';
    const gesetzt = trip.pigeonsset_rv_calc!=null?trip.pigeonsset_rv_calc:(rvFallback && rvFallback.get(r)?.gesetzt);
    return '<span style="font-style:italic;color:var(--text2)" title="Berechnet: für diesen Flug liegt keine eigene RV-Liste aus dem Import vor (zu wenig Tauben). Rang '+rang+(gesetzt?' von '+gesetzt+' Tauben dieser RV':'')+', AS '+(as!=null?Number(as).toFixed(2):'—')+'">'+rang+' *</span>';
  };
  const rows=sorted.map(r=>{
    const p=S.pigeons.find(x=>x.pigeonid===r.pigeonid||(r.ringnumber&&x.ringnumber===r.ringnumber));
    return '<tr onclick="'+(p?'selectPigeon(\''+p.pigeonid+'\')':'')+'" style="'+(p?'cursor:pointer':'')+'">'
      +'<td style="font-weight:600;color:var(--green);font-size:12px">'+(r.placement||'—')+'</td>'
      +'<td style="font-weight:600;color:var(--text2);font-size:12px">'+(r._breederRank||'—')+'</td>'
      +'<td style="font-family:monospace;font-size:11px'+(p?';color:var(--green);cursor:pointer':'')+'"'+(p?' onclick="event.stopPropagation();selectPigeon(\''+p.pigeonid+'\')"':'')+'>'+escH(r.ringnumber||'—')+'</td>'
      +'<td>'+(p?escH(p.name||'—'):'<span style="color:var(--text3)">—</span>')+'</td>'
      +(RT.breederFilter?'':'<td style="color:var(--text2)">'+escH(r.breedername||'—')+'</td>')
      +'<td>'+(r.speed?Number(r.speed).toFixed(3):'—')+'</td>'
      +'<td>'+rvCellFor(r)+'</td><td>'+(r.prize_fg||'—')+'</td>'
      +'<td>'+(r.prize_reggr||'—')+'</td><td>'+(r.prize_reg||'—')+'</td>'
      +'<td>'+(r.as_reg>0?Number(r.as_reg).toFixed(2):'—')+'</td>'
      +'<td style="text-align:center">'+tripFlagCell(r,'v','V')+'</td>'
      +'<td style="text-align:center">'+tripFlagCell(r,'j','J')+'</td>'
      +'<td style="text-align:center">'+tripFlagCell(r,'m','M')+'</td></tr>';
  }).join('');

  // Züchter-Chips zum Umschalten des Filters (inkl. "Alle Züchter") — nach
  // Züchternummer dedupliziert (distinctBreeders), damit abweichende
  // Namens-Schreibweisen derselben Nummer nicht als getrennte Chips auftauchen.
  const breederChips=distinctBreeders(RT.results);
  const chips=breederChips.length>1?'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">'
    +'<span class="badge'+(!RT.breederFilter?' badge-u':'')+'" style="cursor:pointer'+(!RT.breederFilter?'':';opacity:.6')+'" onclick="setTripBreederFilter(null)">'+t('all_breeders')+'</span>'
    +breederChips.map(b=>'<span class="badge'+(RT.breederFilter===b.key?' badge-u':'')+'" style="cursor:pointer'+(RT.breederFilter===b.key?'':';opacity:.6')+'" onclick="setTripBreederFilter('+jsAttr(b.key)+')">🧑‍🌾 '+escH(b.name)+'</span>').join('')
    +'</div>':'';

  // RV-Filter-Chips: nur RVen anzeigen, die unter den Züchtern dieser Reise
  // tatsächlich vorkommen (über rvForNumber ermittelt) — plus "Alle RV" und,
  // falls vorhanden, "Nicht zugeordnet" für Züchter ohne erkannte RV.
  const rvIdsInTrip=new Set();
  let hasUnmapped=false;
  RT.results.forEach(r=>{ const rv=rvForNumber(r.breedernumber); if(rv) rvIdsInTrip.add(rv.id); else hasUnmapped=true; });
  const rvOptions=RVEN.filter(v=>rvIdsInTrip.has(v.id));
  const rvChips=(rvOptions.length>1||(rvOptions.length===1&&hasUnmapped))?'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">'
    +'<span class="badge'+(!RT.rvFilter?' badge-u':'')+'" style="cursor:pointer'+(!RT.rvFilter?'':';opacity:.6')+'" onclick="setTripRVFilter(null)">Alle RV</span>'
    +rvOptions.map(v=>'<span class="badge'+(RT.rvFilter===v.id?' badge-u':'')+'" style="cursor:pointer'+(RT.rvFilter===v.id?'':';opacity:.6')+'" onclick="setTripRVFilter('+jsAttr(v.id)+')">🏳️ '+escH(v.label)+'</span>').join('')
    +(hasUnmapped?'<span class="badge'+(RT.rvFilter==='__none__'?' badge-u':'')+'" style="cursor:pointer'+(RT.rvFilter==='__none__'?'':';opacity:.6')+'" onclick="setTripRVFilter(\'__none__\')">Nicht zugeordnet</span>':'')
    +'</div>':'';

  // Summe passend zum aktuell gewählten Züchter-/RV-Filter (oder über alle
  // Züchter, wenn kein Filter aktiv ist) — reagiert auf die Chips.
  const rvCount=sorted.filter(r=>r.prize_rv!=null || r.prize_rv_calc!=null || (rvFallback && rvFallback.has(r))).length;
  const reggrCount=sorted.filter(r=>r.prize_reggr!=null).length;
  const regCount=sorted.filter(r=>r.prize_reg!=null).length;
  // Gesetzte Taubenzahl je Liste = vereinsweiter Wert der ganzen Reise
  // (pigeonsset_xx), unabhängig vom Züchter-Filter. Für RegGr/Reg gilt das
  // unverändert. Für RV: falls die echte Liste im Import fehlt, wird die
  // berechnete Taubenzahl verwendet — aber NUR für die gerade über den
  // RV-Filter ausgewählte (oder, falls eindeutig, die einzige vorkommende)
  // RV, NIE eine über mehrere RVs hinweg vermischte Zahl (siehe Bug-Report:
  // "242 gesetzt" zeigte fälschlich alle importierten Züchter zusammen an).
  const rvSet=trip.pigeonsset_rv, reggrSet=trip.pigeonsset_reggr, regSet=trip.pigeonsset_reg;
  let rvFallbackTotal=null, rvFallbackAmbiguous=false;
  if(rvFallback){
    if(RT.rvFilter && RT.rvFilter!=='__none__'){
      const entry=[...rvFallback.values()].find(f=>f.rvId===RT.rvFilter);
      rvFallbackTotal = entry ? entry.gesetzt : null;
    } else if(rvIdsInTrip.size===1){
      rvFallbackTotal = [...rvFallback.values()][0].gesetzt;
    } else {
      rvFallbackAmbiguous = true; // mehrere RVs in dieser Reise — ohne Filter keine einzelne Zahl anzeigen
    }
  }

  return '<div><button class="back-btn" onclick="RT.step=\'list\';RT.breederFilter=null;RT.rvFilter=null;render()">← '+t('all_trips')+'</button>'
    +'<div class="card"><div style="margin-bottom:14px">'
    +'<div class="serif" style="font-size:22px;cursor:pointer" onclick="setTripBreederFilter(null)" title="'+t('show_all_breeders')+'">'+I18N[LANG].trip_word+' '+trip.number+' — '+escH(trip.location||'')+'</div>'
    +'<div style="color:var(--text3);font-size:13px;margin-top:4px">'+(trip.tripdate||'')+' · '+t('season')+' '+(trip.vintage||'')+(RT.breederFilter?' · '+t('filtered_on')+' 🧑‍🌾 '+escH(breederNameForKey(RT.breederFilter)):'')+'</div>'
    +'<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:8px">'
    +'<span class="badge badge-u">'+sorted.length+' '+t('pigeons_set')+'</span>'
    +(rvCount?'<span class="badge badge-u" title="'+(rvSet>0?'Preise / gesamte gesetzte Taubenzahl der Reise in dieser Liste':(rvFallbackAmbiguous?'Mehrere RVs bei diesem Flug (gemeinsamer Auflass) — bitte oben eine RV auswählen, um die gesetzte Taubenzahl dieser RV zu sehen.':'Keine eigene RV-Liste im Import — Rang/AS-Punkte hier selbst berechnet (Rang nach Geschwindigkeit unter allen Tauben dieser RV, AS-Punkte wie üblich über calcAS)'))+'">RV: '+rvCount+(rvSet>0?' / '+rvSet+' ges.':(rvFallbackTotal?' / '+rvFallbackTotal+' ges. (berechnet) *':(rvFallbackAmbiguous?' · RV wählen für Taubenzahl':'')))+'</span>':'')
    +(reggrCount?'<span class="badge badge-u" title="Preise / gesamte gesetzte Taubenzahl der Reise in dieser Liste">RegGr: '+reggrCount+(reggrSet>0?' / '+reggrSet+' ges.':'')+'</span>':'')
    +(regCount?'<span class="badge badge-u" title="Preise / gesamte gesetzte Taubenzahl der Reise in dieser Liste">Reg: '+regCount+(regSet>0?' / '+regSet+' ges.':'')+'</span>':'')
    +(trip.averagedistance3?'<span class="badge badge-u">⌀ '+Number(trip.averagedistance3).toFixed(1)+' km</span>':'')
    +'</div>'
    +chips
    +rvChips
    +(rvFallback?'<div style="font-size:11px;color:var(--text3);margin-top:8px">* RV-Rang/AS-Punkte für diesen Flug selbst berechnet, da hierfür keine eigene RV-Liste importiert wurde (zu geringe Taubenzahl auf RV-Ebene) — Rang nach Geschwindigkeit unter allen Tauben dieser RV.</div>':'')
    +'</div>'
    +(RT.results.length===0
      ?'<div style="text-align:center;padding:24px;color:var(--text3)">'+t('loading_results')+'</div>'
      :'<div class="table-wrap"><table style="width:100%;border-collapse:collapse;font-size:13px">'
      +'<thead><tr><th>'+t('th_placement')+'</th><th>'+t('th_placement_breeder')+'</th><th>'+t('th_ring')+'</th><th>'+t('th_name')+'</th>'+(RT.breederFilter?'':'<th>'+t('th_breeder')+'</th>')+'<th>'+t('th_speed')+'</th>'
      +'<th>'+t('th_prize')+'RV</th><th>'+t('th_prize')+'FG</th><th>'+t('th_prize')+'RegGr</th><th>'+t('th_prize')+'Reg</th><th>'+t('th_as')+' Reg</th>'
      +'<th title="Verbandsmeisterschaft-Vorbenennung">V</th><th title="Jährige">J</th><th title="Medaillen-Vorbenennung">M</th></tr></thead>'
      +'<tbody>'+rows+'</tbody></table></div>')
    +'</div></div>';
}

function renderTripsParsing(){
  const p = RT.imp.parseProgress || {done:0,total:1,file:''};
  const pct = p.total?Math.round(p.done/p.total*100):0;
  return `<div class="card" style="text-align:center;padding:40px">
    <div class="imp-progress" style="max-width:400px;margin:0 auto 12px">
      <div class="imp-progress-bar" style="width:${pct}%"></div>
    </div>
    <div style="color:var(--text2);font-size:14px">Lese Dateien… (${p.done} von ${p.total})</div>
    <div style="color:var(--text3);font-size:12px;margin-top:4px">${escH(p.file||'')}</div>
  </div>`;
}

async function handleTripsFiles(fileList){
  const files = Array.from(fileList||[]).filter(Boolean);
  if(!files.length) return;
  RT.imp.step='parsing';
  RT.imp.parseProgress={done:0,total:files.length,file:files[0].name};
  render();

  let combined = RT.imp.rows && RT.imp.rows.length ? RT.imp.rows : [];
  // RV, die der Nutzer für diesen Import manuell erzwungen hat (Dropdown).
  // Ohne Auswahl wird pro Datei automatisch aus dem Dateinamen erkannt
  // (siehe autoDetectRV) — z.B. "L4050515.009" = Reg 405, RV 05, Verein 15.
  const forcedRV = RT.imp.vereinId ? getRV(RT.imp.vereinId) : null;
  // Nummer -> kanonischer Name (erster gesehener Name für diese Züchternummer
  // in diesem Import-Vorgang). Verhindert, dass leicht unterschiedliche
  // Schreibweisen derselben Züchternummer (z.B. "Kersting-tauben.de" vs. einer
  // Variante) als separate Züchter im Import auftauchen.
  const nameByNumber = RT.imp.breederNameByNumber || (RT.imp.breederNameByNumber = {});
  const breeders = RT.imp.breeders ? [...RT.imp.breeders] : [];
  const errors = [];

  for(const file of files){
    RT.imp.parseProgress.file = file.name;
    render();
    try{
      const m = file.name.match(/\.(\d{2,4})$/);
      const parsed = m ? await parseKrausRows(file, m[1]) : await parseXlsxRows(file);
      if(parsed.breedername){
        const lfd = m ? m[1] : null;
        const rv = forcedRV || autoDetectRV(file.name);
        // Vereins-/Züchternummer = [RV-Code (erkannt/gewählt)] + [Verein+
        // Züchter-Block aus dem Dateiinhalt, konstant & zuverlässig — siehe
        // parseKrausRows]. Fällt bei Excel-Importen (kein vz) auf die
        // laufende Nummer aus dem Dateinamen zurück.
        const vz = parsed.vz || lfd;
        const rawNum = vz!=null ? ((rv?rv.code:'') + vz) : null;
        // Direkt beim Import vereinheitlichen (siehe canonicalizeZuechternummer) —
        // verhindert, dass künftige Importe erneut uneinheitlich formatierte
        // Vereins-/Züchternummern (z.B. 3-stelliger statt 2-stelliger Verein) anlegen.
        const num = rawNum!=null ? canonicalizeZuechternummer(rawNum) : null;
        let canonicalName = parsed.breedername;
        if(num){
          if(nameByNumber[num]) canonicalName = nameByNumber[num];
          else nameByNumber[num] = canonicalName;
          // Alle Ergebniszeilen dieser Datei auf den kanonischen Namen und die
          // vollständige Züchternummer normalisieren, bevor sie gespeichert
          // werden — das ist die eigentliche Deduplizierung.
          parsed.rows.forEach(item=>item.results.forEach(res=>{ res.breedername = canonicalName; res.breedernumber = num; }));
        }
        const label = zuechterLabel(canonicalName, num);
        if(!breeders.includes(label)) breeders.push(label);
      }
      combined = mergeTripRows(combined, parsed.rows);
    }catch(e){
      errors.push(file.name+': '+e.message);
    }
    RT.imp.parseProgress.done++;
  }

  // Ergebnisse je Reise nach Geschwindigkeit sortieren und Platzierung neu
  // durchnummerieren — wichtig, sobald mehrere Züchter-Dateien für dieselbe
  // Reise zusammengeführt wurden (sonst würde jeder Züchter bei Platz 1 starten).
  combined.forEach(item=>{
    item.results.sort((a,b)=>{
      if(a.speed!=null && b.speed!=null) return b.speed-a.speed;
      if(a.speed!=null) return -1;
      if(b.speed!=null) return 1;
      return 0;
    });
    item.results.forEach((r,i)=>{ r.placement=i+1; });
  });

  RT.imp.rows = combined;
  RT.imp.breeders = breeders;
  // Vollständige Reisenliste (nicht die auf 500 gedeckelte RT.trips) laden,
  // damit die "bereits vorhanden"-Markierung in der Vorschau auch ältere
  // Flüge zuverlässig erkennt und nicht fälschlich als "neu" anzeigt.
  try{ RT.imp.allTrips = await apiGetAll('/trips?select=tripid,vintage,location,tripdate'); }
  catch(e){ RT.imp.allTrips = null; }
  RT.imp.step='preview';
  if(errors.length) alert('Einige Dateien konnten nicht gelesen werden:\n'+errors.join('\n'));
  render();
}

// Führt neu geparste Reisen/Ergebnisse mit bereits vorhandenen (aus zuvor in
// diesem Import-Vorgang gelesenen Dateien) zusammen. Abgleich über
// Jahrgang+Ort+Datum (NICHT Reisenummer — die "0xx"-Nummer im EDV-Kraus-
// Export ist die züchtereigene, fortlaufende Zählung seiner eigenen Reisen
// und kann bei zwei Züchtern für dieselbe physische Reise unterschiedlich
// ausfallen, z.B. wenn einer eine frühere Reise ausgelassen hat). Kopfdaten
// werden nur ergänzt, wenn noch leer; Ergebnisse werden dedupliziert über
// Ringnummer+Züchtername.
function mergeTripRows(existing, incoming){
  const normL = s => String(s||'').toLowerCase().trim().replace(/\s+/g,' ');
  const keyOf = t => (t.vintage||'')+'|'+normL(t.location)+'|'+(t.tripdate||'');
  const list = [...existing];
  const byKey = {};
  list.forEach(item=>{ byKey[keyOf(item.trip)] = item; });
  (incoming||[]).forEach(item=>{
    const k = keyOf(item.trip);
    const cur = byKey[k];
    if(cur){
      ['tripdate','prices1','prices2','prices3','prices4','prices5','averagedistance3','g_rv','g_reggr','g_reg']
        .forEach(f=>{ if((cur.trip[f]==null||cur.trip[f]==='') && item.trip[f]!=null && item.trip[f]!=='') cur.trip[f]=item.trip[f]; });
      const seen = new Set(cur.results.map(r=>normRing(r.ringnumber)+'|'+(r.breedername||'')));
      item.results.forEach(r=>{
        const rk = normRing(r.ringnumber)+'|'+(r.breedername||'');
        if(!seen.has(rk)){ cur.results.push(r); seen.add(rk); }
      });
    } else {
      byKey[k]=item;
      list.push(item);
    }
  });
  return list.sort((a,b)=>a.trip.number-b.trip.number);
}

// ── RVen (Reisevereinigungen) ─────────────────────────────────────────────
// Bewusst NUR eine RV-Ebene, keine Einzelverein-Verwaltung: der Nutzer will
// höchstens zwischen wenigen RVen unterscheiden (z.B. RV 05, RV 02) und
// Vereins-/Züchternummer als einen zusammengehörigen Block betrachten, ohne
// pro Verein etwas pflegen zu müssen.
//
// Damit zwei Züchter mit derselben laufenden Nummer aus unterschiedlichen
// Vereinen INNERHALB derselben RV trotzdem nicht kollidieren, wird intern
// weiterhin automatisch die in der Datei enthaltene Vereinsringnummer (vrnr)
// mit eingerechnet — der Nutzer sieht/verwaltet das aber nicht, es passiert
// unsichtbar beim Import (siehe handleTripsFiles). Gespeicherte Nummer =
// RV-Code + Vereins-/Züchternummer-Block aus dem Dateiinhalt.
let RVEN = (function(){
  try{
    const saved = JSON.parse(localStorage.getItem('pigeonRVen')||'null');
    if(Array.isArray(saved)) return saved;
  }catch(e){}
  // Migration von einer Vorversion (Einzelverein-Verwaltung, per Taubenring
  // automatisch erkannt) — nur manuell angelegte Einträge übernehmen, die
  // damals automatisch erkannten (unzuverlässig, je nach Zukaufs-Herkunft
  // der einzelnen Taube) bewusst NICHT, um kein neues Chaos zu importieren.
  try{
    const old = JSON.parse(localStorage.getItem('pigeonVereine')||'null');
    if(Array.isArray(old) && old.length) return old.filter(v=>!v.auto).map(v=>({id:v.id, label:v.label, code:v.prefix||v.code}));
  }catch(e){}
  return [];
})();
// RVen liegen jetzt zusätzlich serverseitig in der Supabase-Tabelle "rven" (Migration
// erforderlich, siehe Hinweis in der Doku/Chat) — damit die RV-Verwaltung auf allen
// Geräten sichtbar ist, statt nur im localStorage des jeweiligen Browsers zu stecken.
// localStorage bleibt als Sofort-Anzeige-Cache erhalten (kein Warten auf den Server
// beim App-Start), wird aber beim Laden vom Server überschrieben.
async function loadRVenFromServer(){
  try{
    const rows = await apiGetAll('/rven?select=*&order=label.asc');
    RVEN = rows.map(r=>({id:r.id, label:r.label, code:r.code, auto:!!r.auto}));
    saveRVen();
    render();
  }catch(e){
    console.warn('RVen konnten nicht vom Server geladen werden, nutze lokalen Stand:', e.message);
  }
}
function saveRVen(){ try{ localStorage.setItem('pigeonRVen', JSON.stringify(RVEN)); }catch(e){} }
// Persistiert eine einzelne RV serverseitig (Insert/Update per Upsert). Läuft im
// Hintergrund, ohne dass die UI auf die Serverantwort warten muss.
async function syncRVToServer(v){
  try{ await apiUpsertBatch('rven', [{id:v.id, label:v.label, code:v.code, auto:!!v.auto}], 'id'); }
  catch(e){ console.warn('RV konnte nicht auf dem Server gespeichert werden:', e.message); }
}
async function deleteRVFromServer(id){
  try{ await apiDeleteBy('rven', 'id=eq.'+encodeURIComponent(id)); }
  catch(e){ console.warn('RV konnte nicht auf dem Server gelöscht werden:', e.message); }
}
function getRV(id){ return RVEN.find(v=>v.id===id) || null; }
// Die vom Nutzer als "seine eigene"/Standard-RV markierte RV (rein lokale
// Anzeige-Einstellung, kein Server-Feld nötig) — wird in der Flugliste genutzt,
// um bei Flügen mit gemeinsamem Auflass mehrerer RVs trotzdem eine sinnvolle
// Taubenzahl statt "—" anzuzeigen (siehe standardRVGesetztForTrip()).
function getStandardRVId(){
  try{ const id=localStorage.getItem('pigeonStandardRVId'); return (id && getRV(id)) ? id : null; }catch(e){ return null; }
}
function setStandardRV(id){
  const current=getStandardRVId();
  try{ localStorage.setItem('pigeonStandardRVId', current===id ? '' : (id||'')); }catch(e){}
  const panel=document.getElementById('verein-manager-panel');
  if(panel) renderVereinManagerInto(panel);
  render();
}
// Erkennt RV automatisch aus dem EDV-Kraus-Dateinamen (Format "L" + Reg(3) +
// RV(2) + Verein(2), z.B. "L4050515...009" = Reg 405, RV 05, Verein 15).
// Reg+RV zusammen ergeben den internen Code (5-stellig) — so bleiben RVen
// mit gleicher Nummer aus unterschiedlichen Regionalverbänden trotzdem
// eindeutig, auch wenn nur "RV 05" angezeigt wird. Legt beim ersten
// Auftreten automatisch einen (umbenennbaren) RV-Eintrag an.
function autoDetectRV(fileName){
  const m = /^L(\d{3})(\d{2})(\d{2})/i.exec(fileName||'');
  if(!m) return null;
  const [, reg, rvNr] = m;
  const code = reg+rvNr;
  let v = RVEN.find(x=>x.code===code);
  if(!v){
    v = {id:'auto-'+code, label:'RV '+rvNr+' (Reg '+reg+')', code, auto:true};
    RVEN.push(v);
    saveRVen();
    syncRVToServer(v);
  }
  return v;
}
// Ordnet eine (ggf. bereits RV-qualifizierte) Züchternummer, falls möglich, einer RV zu.
function rvForNumber(breedernumber){
  if(!breedernumber) return null;
  const s=String(breedernumber);
  return RVEN.find(v=>v.code && s.indexOf(v.code)===0) || null;
}
// Liefert die Anzahl gesetzter Tauben der als Standard markierten RV für einen
// Flug mit mehreren beteiligten RVs (gemeinsamer Auflass) — für genau diese
// Flüge kann trips.pigeonsset_rv_calc nicht eindeutig gefüllt werden (siehe
// backfillRVFallback), daher hier live aus dem bereits geladenen ZT.rows-Cache
// berechnet (keine zusätzliche Serveranfrage nötig). Gibt null zurück, wenn
// keine Standard-RV markiert ist, die Daten noch nicht geladen sind oder diese
// RV bei diesem Flug gar nicht vertreten ist.
function standardRVGesetztForTrip(tripid){
  const stdId = getStandardRVId();
  if(!stdId || !ZT.loaded) return null;
  const count = ZT.rows.filter(r=>r.tripid===tripid && (rvForNumber(r.breedernumber)||{}).id===stdId).length;
  return count || null;
}

// Manche Flüge (z.B. weil die Taubenzahl auf RV-Ebene zu gering war) haben in den
// Importdateien gar keine eigene RV-Liste — trip.pigeonsset_rv ist dann null, und
// alle Ergebniszeilen haben prize_rv=null. Der Verband führt in diesem Fall aber
// oft trotzdem eine eigene RV-Rangliste (siehe Beispiel Flug 11 Parsberg): alle
// Tauben ALLER Züchter derselben RV werden nach Geschwindigkeit geordnet, Rang und
// AS-Punkte ergeben sich exakt wie überall sonst über calcAS(Rang, gesetzt) — mit
// "gesetzt" = Anzahl der (in unserer DB vorliegenden) Ergebniszeilen dieser RV für
// genau diesen Flug. Rechnet NUR nach, wenn trip.pigeonsset_rv fehlt — eine echte
// RV-Liste aus dem Import hat immer Vorrang und wird nie überschrieben.
// Rückgabe: Map von Ergebniszeile -> {rang, gesetzt, as}, oder null wenn die
// echte Liste bereits vorhanden ist (dann ist keine Berechnung nötig/erlaubt).
function computeRVFallback(trip, results){
  if(!trip || trip.pigeonsset_rv) return null;
  const groups={};
  (results||[]).forEach(r=>{
    const rv=rvForNumber(r.breedernumber);
    if(!rv) return; // Züchter ohne bekannte RV-Zuordnung NIE zu einer Pseudo-Gruppe zusammenfassen
    (groups[rv.id]=groups[rv.id]||[]).push(r);
  });
  const map=new Map();
  Object.entries(groups).forEach(([rvId,list])=>{
    const gesetzt=list.length;
    list.slice().sort((a,b)=>(Number(b.speed)||-Infinity)-(Number(a.speed)||-Infinity))
      .forEach((r,i)=>{
        const rang=i+1, as=calcAS(rang, gesetzt);
        // Wie bei den echten Importlisten bekommt nur die vorderste Preiszone
        // (oberstes Drittel, siehe calcAS) einen ausgewiesenen Rang — der Rest
        // bleibt ohne Platzierung (kein "hasPreis").
        if(as!=null) map.set(r, {rang, gesetzt, as, rvId});
      });
  });
  return map.size ? map : null;
}
// Schreibt die berechnete RV-Rangliste dauerhaft in prize_rv_calc/as_rv_calc
// (pigeontrips) sowie pigeonsset_rv_calc (trips), damit sie NICHT nur in der
// Flug-Detailansicht, sondern überall dort wirkt, wo prize_rv/as_rv gelesen
// werden (Bestenliste, Stammbaum-Top10, Reiseleistung je Taube — siehe rvField()).
// Voraussetzung: die Spalten müssen einmalig per SQL angelegt werden (siehe Chat).
// Läuft im Hintergrund; Fehler (z.B. Spalten fehlen noch) werden nur geloggt.
async function backfillRVFallback(tripid){
  const trip = RT.trips.find(t=>t.tripid===tripid);
  if(!trip || trip.pigeonsset_rv) return {status:'skip'};
  try{
    const results = await apiGetAll('/pigeontrips?tripid=eq.'+tripid);
    const map = computeRVFallback(trip, results);
    if(!map || !map.size) return {status:'keine_rv_erkannt'};
    const upsertRows=[];
    const rvIdsSeen=new Set();
    let gesetzt=null;
    map.forEach((f,r)=>{ upsertRows.push({id:r.id, prize_rv_calc:f.rang, as_rv_calc:f.as}); rvIdsSeen.add(f.rvId); gesetzt=f.gesetzt; });
    const failed = await apiUpsertBatch('pigeontrips', upsertRows, 'id');
    if(failed.length){ console.warn('RV-Fallback: '+failed.length+' Chunk(s) fehlgeschlagen (fehlen evtl. die Spalten prize_rv_calc/as_rv_calc?)', failed[0].error); return {status:'fehler', error:failed[0].error}; }
    // trips.pigeonsset_rv_calc ist EIN Skalarfeld für die ganze Reise — bei einem
    // Flug mit mehreren RVs (gemeinsamer Auflass) wäre ein einzelner Wert
    // irreführend (siehe Bug-Report), deshalb nur schreiben, wenn eindeutig genau
    // eine RV beteiligt ist. Bei mehreren RVs bleibt das Feld leer; die korrekte,
    // RV-spezifische Zahl liefert weiterhin computeRVFallback() live pro Filter.
    await apiPatchBy('trips', 'tripid=eq.'+encodeURIComponent(tripid), {pigeonsset_rv_calc: rvIdsSeen.size===1 ? gesetzt : null});
    return rvIdsSeen.size===1 ? {status:'ok', gesetzt} : {status:'mehrdeutig', rvCount:rvIdsSeen.size};
  }catch(e){ console.warn('RV-Fallback konnte nicht gespeichert werden (fehlen evtl. die Spalten in Supabase?):', e.message); return {status:'fehler', error:e.message}; }
}
// Für alle bereits importierten Flüge ohne eigene RV-Liste einmalig nachrechnen
// (z.B. nach dem Anlegen der _calc-Spalten, für Altbestand). Für neu importierte
// Flüge geschieht das automatisch direkt nach dem Import.
async function backfillRVFallbackAll(){
  if(!RT.trips.length) await loadTrips();
  const candidates = RT.trips.filter(t=>!t.pigeonsset_rv);
  const stats={geprueft:candidates.length, ok:0, mehrdeutig:0, keine_rv_erkannt:0, fehler:0};
  let firstError=null;
  for(const t of candidates){
    const r = await backfillRVFallback(t.tripid);
    if(stats[r.status]!=null) stats[r.status]++;
    if(r.status==='fehler' && !firstError) firstError=r.error;
  }
  stats.firstError=firstError;
  return stats;
}
// Verknüpft Flugergebnisse ohne Taubenzuordnung (pigeontrips.pigeonid IS NULL)
// nachträglich mit der Tauben-Datenbank — z.B. weil die Taube erst NACH dem
// Reise-Import angelegt wurde (beim Import selbst wird nur gegen den zu dem
// Zeitpunkt bereits vorhandenen Bestand abgeglichen, siehe parseXlsxRows/
// parseTripsFile) oder weil die Ringnummer im Import leicht anders geschrieben
// war (normRing gleicht das i.d.R. aus: führende Nullen, Trennzeichen, 2-
// vs. 4-stelliger Jahrgang).
// WICHTIG: bewusst NICHT gegen S.pigeons abgeglichen — das enthält beim Start
// nur den aktiven Bestand (instock/Reisetauben) + deren Ahnen bis 5. Generation
// (siehe loadData()), nicht abgegebene/verstorbene/sonstige Tauben. Für den
// Rückgleich wird stattdessen einmalig die komplette (nicht gelöschte)
// Tauben-Tabelle direkt aus Supabase geladen.
// Wie normRing(), aber ohne führendes Länderkürzel (z.B. "de"/"be"/"nl") —
// manche Alt-Datensätze speichern die Ringnummer OHNE Länderpräfix (das
// "DE-" wird nur bei der ANZEIGE ergänzt, siehe fmtRingnumber()), während
// der Reise-Import die Ringnummer MIT "DE-" abspeichert (siehe parseXlsxRows/
// parseTripsFile). Für den Rückgleich müssen daher beide Varianten als
// gleichwertig gelten.
function normRingCore(s){
  return normRing(s).replace(/^[a-z]{1,3}(?=\d)/,'');
}
async function backfillMissingPigeonLinks(){
  const [allTrips, allPigeons] = await Promise.all([
    // Bisher wurden NUR Zeilen mit pigeonid IS NULL als "kaputt" behandelt.
    // Der Selbsttest hat aber gezeigt: eine Zeile kann auch eine GESETZTE
    // pigeonid haben, die auf keine (mehr) gültige Taube zeigt (z.B. Rest
    // einer gelöschten Dublette) — die taucht dann NIE in der pigeonid=is.null
    // Abfrage auf, obwohl sie in der App weiterhin als "nicht in DB" erscheint.
    // Deshalb jetzt ALLE Flugergebnisse mit Ringnummer laden und selbst
    // gegen die aktuell gültigen Tauben-IDs prüfen.
    apiGetAll('/pigeontrips?ringnumber=not.is.null&select=id,ringnumber,breedername,pigeonid&order=id.asc'),
    apiGetAll('/pigeons?or=(deleted.is.null,deleted.eq.false)&select=pigeonid,ringnumber,ringnumberold&order=pigeonid.asc')
  ]);
  const byRing = {};
  const addKey=(k,p)=>{ if(k) (byRing[k]=byRing[k]||[]).push(p); };
  allPigeons.forEach(p=>{
    [p.ringnumber, p.ringnumberold].forEach(raw=>{
      if(!raw) return;
      addKey(normRing(raw), p);
      addKey(normRingCore(raw), p);
    });
  });
  const validPigeonIds = new Set(allPigeons.map(p=>p.pigeonid));
  const orphans = allTrips.filter(row=>!row.pigeonid || !validPigeonIds.has(row.pigeonid));
  // Eingebauter Selbsttest mit einer Ringnummer, von der wir sicher wissen,
  // dass die Taube existiert (siehe Chat) — zeigt bei jedem Lauf exakt, an
  // welcher Stelle es hakt: Lädt "allPigeons" sie überhaupt? Stimmt der
  // exakte String? Der normalisierte Schlüssel? Der Index-Lookup selbst?
  const TEST_RING = 'DE-06559-24-4241';
  const testExact = allPigeons.find(p=>p.ringnumber===TEST_RING || p.ringnumberold===TEST_RING);
  const testNormScan = allPigeons.find(p=>normRing(p.ringnumber||'')===normRing(TEST_RING) || normRing(p.ringnumberold||'')===normRing(TEST_RING));
  const testIndexHit = byRing[normRing(TEST_RING)];
  // Jetzt gegen ALLE Flüge (nicht nur "orphans") prüfen, um zu sehen, ob die
  // Zeile eine (falsche/verwaiste) pigeonid gesetzt hat.
  const tripHitsForTest = allTrips.filter(r=>(r.ringnumber||'').toLowerCase().includes('4241'));
  const selbsttest = {
    exaktGefunden: !!testExact,
    exaktesRingnumberFeld: testExact?testExact.ringnumber:null,
    normalisiertPerScanGefunden: !!testNormScan,
    normalisiertPerIndexGefunden: !!(testIndexHit && testIndexHit.length),
    normalisierterSchluessel: normRing(TEST_RING),
    byRingKeyAnzahl: Object.keys(byRing).length,
    allTripsGeladen: allTrips.length,
    orphanTreffer: tripHitsForTest.map(r=>({
      ringnumber: r.ringnumber,
      pigeonidGesetzt: r.pigeonid||null,
      pigeonidGueltig: r.pigeonid?validPigeonIds.has(r.pigeonid):null,
      normalisiert: normRing(r.ringnumber||''),
      matchtIndex: !!(byRing[normRing(r.ringnumber||'')] && byRing[normRing(r.ringnumber||'')].length),
      zeichencodes: [...(r.ringnumber||'')].map(c=>c+'(U+'+c.codePointAt(0).toString(16).padStart(4,'0')+')').join(' ')
    }))
  };
  let linked=0; const noMatch=[]; const updateFailed=[];
  await runWithConcurrency(orphans, 6, async row=>{
    if(!row.ringnumber){ noMatch.push(row); return; }
    const matches = byRing[normRing(row.ringnumber)] || byRing[normRingCore(row.ringnumber)];
    if(matches && matches.length){
      try{ await apiPatchBy('pigeontrips','id=eq.'+row.id, {pigeonid:matches[0].pigeonid}); linked++; }
      catch(e){ updateFailed.push({row, error:(e&&e.message)||String(e)}); }
    } else noMatch.push(row);
  });
  return {geprueft:orphans.length, linked, noMatch, updateFailed, pigeonsGeladen:allPigeons.length, selbsttest};
}
async function runBackfillMissingPigeonLinks(ev){
  const btn = ev && ev.target;
  if(btn){ btn.disabled=true; btn.textContent='⏳ Prüfe …'; }
  try{
    const r = await backfillMissingPigeonLinks();
    if(!r.geprueft){ alert('Keine Flugergebnisse ohne Taubenzuordnung gefunden.'); return; }
    let msg='Tauben-Tabelle geladen: '+r.pigeonsGeladen+' Tauben\n'
      +'Flugergebnisse (mit Ringnummer) geladen: '+r.selbsttest.allTripsGeladen+'\n\n'
      +'🔎 SELBSTTEST (DE-06559-24-4241):\n'
      +'• In allPigeons per exaktem String gefunden: '+(r.selbsttest.exaktGefunden?'JA':'NEIN')+(r.selbsttest.exaktesRingnumberFeld?' (gespeichert als "'+r.selbsttest.exaktesRingnumberFeld+'")':'')+'\n'
      +'• Per normalisiertem Scan gefunden: '+(r.selbsttest.normalisiertPerScanGefunden?'JA':'NEIN')+'\n'
      +'• Per Index-Lookup gefunden: '+(r.selbsttest.normalisiertPerIndexGefunden?'JA':'NEIN')+'\n'
      +'• Normalisierter Schlüssel: "'+r.selbsttest.normalisierterSchluessel+'"\n'
      +'• Anzahl unterschiedlicher Schlüssel im Index: '+r.selbsttest.byRingKeyAnzahl+'\n'
      +'• Passende Flugergebnis-Zeilen (enthalten "4241") gefunden: '+r.selbsttest.orphanTreffer.length+'\n'
      +r.selbsttest.orphanTreffer.map(o=>'   - Ringnummer: "'+o.ringnumber+'" → normalisiert "'+o.normalisiert+'" → Index-Treffer: '+(o.matchtIndex?'JA':'NEIN')+'\n     pigeonid gesetzt: '+(o.pigeonidGesetzt?o.pigeonidGesetzt:'NEIN (null)')+(o.pigeonidGesetzt?' — gültig: '+(o.pigeonidGueltig?'JA':'NEIN, zeigt ins Leere!'):'')+'\n     Zeichencodes: '+o.zeichencodes).join('\n')+'\n\n'

// Vereinheitlicht eine Züchternummer auf das feste Schema
// RV-Code(5=Reg 3+RV 2) + Verein(2-stellig) + Züchternummer(3-stellig),
// z.B. "40505"+"15"+"009" = "4050515009". Ältere Importe legen den
// Vereins-/Züchter-Block teils uneinheitlich ab (Verein 3-stellig mit
// führender 0 statt 2-stellig, z.B. "015" statt "15", oder Züchternummer
// nur 2-stellig statt 3-stellig) — dadurch landet ein und derselbe Züchter
// unter mehreren verschiedenen Nummern in der DB (siehe Züchterübersicht:
// "KERSTING-Tauben.de" mehrfach mit 10- bzw. 11-stelligen Varianten).
// Wird sowohl live bei Anzeige/Gruppierung als auch beim Bereinigen
// (siehe cleanupZuechterNumbers) genutzt, damit beides konsistent bleibt.
function canonicalizeZuechternummer(breedernumber){
  if(breedernumber==null || breedernumber==='') return breedernumber;
  const s=String(breedernumber).trim();
  const rv=rvForNumber(s);
  if(!rv) return s; // keine bekannte RV (Reg+RV-Code) — nicht sicher zerlegbar, unverändert lassen
  const rest=s.slice(rv.code.length);
  if(/^\d{5}$/.test(rest)) return s; // bereits korrekt: 2(Verein)+3(Züchter)
  if(/^\d{6}$/.test(rest)){
    // Verein 3-stellig mit führender 0 (z.B. "015") + Züchter 3-stellig — die
    // führende 0 des Vereins-Blocks entfernen, Züchternummer bleibt 3-stellig.
    const verein=rest.slice(0,3).replace(/^0/,'').padStart(2,'0');
    return rv.code+verein+rest.slice(3);
  }
  if(/^\d{4}$/.test(rest)){
    // Verein 2-stellig + Züchter nur 2-stellig -> auf 3 Stellen auffüllen
    return rv.code+rest.slice(0,2)+rest.slice(2).padStart(3,'0');
  }
  return s; // unbekanntes Format — lieber unverändert lassen als falsch umbauen
}
function zuechterFullNumber(breedernumber){ return breedernumber!=null && breedernumber!=='' ? canonicalizeZuechternummer(breedernumber) : null; }
function zuechterNumberBreakdown(breedernumber){
  if(breedernumber==null || breedernumber==='') return null;
  const s=canonicalizeZuechternummer(breedernumber);
  const v=rvForNumber(s);
  // Vereins-/Züchternummer bewusst nicht weiter aufgeschlüsselt (nur intern
  // zur Kollisionsvermeidung genutzt) — der Nutzer will nur die RV sehen.
  if(v) return v.label+' · Vereins-/Züchternummer '+s.slice(v.code.length);
  return 'Nummer '+s+' (keiner RV zugeordnet)';
}
// Kanonischer Gruppierungs-Schlüssel für einen pigeontrips-Datensatz: die
// Züchternummer ist eindeutig, der Freitext-Züchtername aus der Import-Datei
// kann je nach Export leicht unterschiedlich geschrieben sein (z.B. mit/ohne
// Bindestrich oder Domain-Zusatz) und würde beim reinen Namensabgleich
// fälschlich als mehrere verschiedene Züchter auftauchen. Gruppierung
// erfolgt daher bevorzugt über die vereinheitlichte (canonicalizeZuechternummer)
// Züchternummer, damit uneinheitlich abgelegte Varianten (siehe dort) in der
// Übersicht als EIN Züchter erscheinen; nur ohne Nummer wird auf den Namen
// zurückgefallen.
function zuechterKey(r){
  const num=canonicalizeZuechternummer(r.breedernumber);
  return (num!=null && num!=='') ? 'nr:'+num : 'name:'+(r.breedername||'Unbekannt');
}
function zuechterLabel(name, breedernumber){
  const full = zuechterFullNumber(breedernumber);
  return full ? (name||'Unbekannt')+' · '+full : (name||'Unbekannt');
}
// Eindeutige Züchter-Liste (kanonischer Schlüssel + Anzeige-Name) aus einer
// Menge von pigeontrips-Zeilen — für Dropdowns/Chips/Filter. Nutzt
// zuechterKey(), damit dieselbe Züchternummer mit leicht unterschiedlicher
// Namens-Schreibweise (z.B. "KERSTING PIGEONS" vs. "KERSTING BNAC Pigeon")
// nicht als zwei getrennte Züchter auftaucht — die Züchternummer ist die
// eindeutige Kennung, der Name ist nur Anzeigetext und kann variieren.
function distinctBreeders(rows){
  const g={};
  (rows||[]).forEach(r=>{
    const key=zuechterKey(r);
    if(!g[key]) g[key]={key, name:r.breedername||'Unbekannt', number:r.breedernumber||null};
    // Längsten/vollständigsten Namen als Anzeige-Namen verwenden (siehe zuechterAgg)
    if(r.breedername && r.breedername.length>g[key].name.length) g[key].name=r.breedername;
    if(!g[key].number && r.breedernumber) g[key].number=r.breedernumber;
  });
  return Object.values(g).sort((a,b)=>a.name.localeCompare(b.name));
}
// Löst einen zuechterKey() zurück in den (kanonischen) Anzeige-Namen auf —
// z.B. um einen aktiven Filter (der intern als Key gespeichert wird)
// lesbar darzustellen.
function breederNameForKey(key){
  if(!key) return '';
  const rows = ZT.rows.filter(r=>zuechterKey(r)===key);
  if(!rows.length) return key;
  let name = rows[0].breedername||'Unbekannt';
  rows.forEach(r=>{ if(r.breedername && r.breedername.length>name.length) name=r.breedername; });
  return name;
}

async function parseKrausRows(file, breedernumber){
  const buf   = await file.arrayBuffer();
  const text  = decodeLatin1(new Uint8Array(buf));
  const lines = text.split('\n').map(l=>l.replace(/\r$/,''));

  const reiseMap={}, zuechterMap={};
  let breedername=null;
  // Häufigkeit des Vereins-/Züchternummer-Blocks (5-stellig: 2-stellige
  // Vereinsnummer + 3-stellige laufende Züchternummer, z.B. "15009" =
  // Verein 15, Züchter 009) — steht in JEDER 2xx-Zeile an fester Position
  // direkt nach dem Zeilen-Präfix und ist über die ganze Datei konstant.
  // Zuverlässiger als die Vereinsringnummer aus der Taubenringnummer (vrnr):
  // die kann von Taube zu Taube abweichen, wenn Tauben von anderen
  // Züchtern/Vereinen zugekauft wurden — genau das führte vorher zu
  // fälschlich aufgesplitteten Züchtern.
  const vzCount={};

  lines.forEach(line=>{
    if(line.length<18) return;
    const prefix=line.substring(0,3);

    if(/^0[0-9][0-9]$/.test(prefix) && prefix!=='000'){
      const rNr=parseInt(prefix);
      const tag =line.substring(4,6).trim();
      const mon =line.substring(6,8).trim();
      const yr  =line.substring(8,10).trim();
      const ort =fixUmlauts(line.substring(18,38));
      const date=(tag&&mon&&yr)?`20${yr}-${mon.padStart(2,'0')}-${tag.padStart(2,'0')}`:null;
      const mR=line.match(/R\s+(\d+)\s+(\d+)\s+(\d{1,3})/);
      const mG=line.match(/G\s+(\d+)\s+(\d+)\s+(\d{1,3})/);
      const mA=line.match(/A\s+(\d+)\s+(\d+)\s+(\d{1,3})/);
      // Format je Liste: "<Buchstabe> <gesetzt> <Preise> <Entfernung-km>".
      // "R" = RV-Gesamt (übergeordnete, für ALLE Züchter des Reisevereins
      // gültige Liste) — das ist die "mittlere Entfernung des Fluges in der
      // Gesamt-Konkurrenz". "A" (Reg-Liste) und "G" (RegGr-Liste) sind nur
      // Untergruppen mit einer EIGENEN, meist abweichenden Distanz (z.B.
      // Erlangen-Baiersdorf: A=313km, G=310km, aber R/RV-gesamt=278km — nur
      // R stimmt mit der offiziellen Reiseplan-Distanz überein). Ist R für
      // einen Flug nicht gesetzt (kommt vor, z.B. wenn dort kein RV-weiter
      // Wettbewerb ausgetragen wurde), fällt man auf A, sonst auf G zurück.
      const distRv   = mR ? parseInt(mR[3]) : null;
      const distReg  = mA ? parseInt(mA[3]) : null;
      const distReggr= mG ? parseInt(mG[3]) : null;
      reiseMap[rNr]={number:rNr, vintage:yr?2000+parseInt(yr):null,
        location:ort, tripdate:date, results:[],
        g_rv:  mR?parseInt(mR[1]):0,
        g_reggr:mG?parseInt(mG[1]):0,
        g_reg:  mA?parseInt(mA[1]):0,
        distRv, distReg, distReggr};
    }

    if(/^1[0-9][0-9]$/.test(prefix)){
      const rNr=parseInt(prefix.substring(1));
      const g  =parseInt(line.substring(9,12).trim())||0;
      const p1 =parseInt(line.substring(12,15).trim())||0;
      const p2 =parseInt(line.substring(15,18).trim())||0;
      const p3 =parseInt(line.substring(18,21).trim())||0;
      const p4 =parseInt(line.substring(21,24).trim())||0;
      const p5 =parseInt(line.substring(24,27).trim())||0;
      const d  =parseInt(line.substring(27,34).trim())||0;
      zuechterMap[rNr]={gesetztg:g,p1,p2,p3,p4,p5,dist:d};
      if(!breedername){
        const nm=fixUmlauts(line.substring(33,53).trim());
        if(nm) breedername=nm;
      }
    }

    if(/^2[0-9][0-9]$/.test(prefix)){
      const rNr=parseInt(prefix.substring(1));
      if(!reiseMap[rNr]) return;
      const yr   =line.substring(10,12).trim();
      const vrnr =line.substring(12,16).trim();
      const endnr=line.substring(16,20).trim();
      const geschl=line.substring(20,21).trim();
      const gRaw =line.substring(32,41).trim();
      const speed=(gRaw&&gRaw!=='0')?parseInt(gRaw)/10000:null;
      // 5 Kategorie-Slots je Taube, siehe Kommentar oben (verifiziert an 4241W/F06).
      const pFg =parseInt(line.substring(41,46).trim())||0;
      const pReg=parseInt(line.substring(46,51).trim())||0;
      const pRgg=parseInt(line.substring(51,56).trim())||0;
      const pNat=parseInt(line.substring(56,61).trim())||0;
      const pRv =parseInt(line.substring(61,66).trim())||0;
      if(!vrnr||!endnr||!yr) return;
      // Vereins-/Züchternummer-Block direkt nach dem Zeilen-Präfix (5 Stellen,
      // z.B. "15009" = Verein 15 + Züchter 009) — konstant für die ganze Datei.
      const vz = line.substring(3,8).trim();
      if(vz) vzCount[vz]=(vzCount[vz]||0)+1;
      const ring=`DE-${vrnr.padStart(5,'0')}-${yr.padStart(2,'0')}-${endnr}`;
      // p_rv=Platz RV (kleine Liste) | p_rgg=Platz RegGr (G-Liste, mittel) |
      // p_reg=Platz Reg/RegV (A-Liste, große Liste)
      const _h = reiseMap[rNr];
      const prv = pRv!==0 ?pRv :null;
      const prg = pRgg!==0?pRgg:null;  // RegGr = G-Liste
      const pre = pReg!==0?pReg:null;  // Reg   = A-Liste (große Liste)
      const pfg = pFg!==0?pFg:null;    // bei diesem Verein bislang stets 0/unbenutzt
      // Vorbenennungs-/Ass-Flags, siehe FLAG_COL-Kommentar oben
      const flagAt = c => c!=null && line.length>c && line[c]!==' ' ? line[c] : null;
      const vFlag = flagAt(FLAG_COL.v)==='V';
      const jFlag = flagAt(FLAG_COL.j)==='J';
      const mFlag = flagAt(FLAG_COL.m)==='M';
      const assA  = flagAt(FLAG_COL.a)==='A';
      const assB  = flagAt(FLAG_COL.b)==='B';
      const assC  = flagAt(FLAG_COL.c)==='C';
      const assD  = flagAt(FLAG_COL.d)==='D';
      reiseMap[rNr].results.push({
        ringnumber:ring, sex:geschl==='W'?'F':'M',
        speed,
        prize_rv:prv, prize_fg:pfg, prize_reggr:prg, prize_reg:pre,
        as_rv:calcAS(prv,_h.g_rv||0), as_reg:calcAS(pre,_h.g_reg||0), as_nat:calcAS(prg,_h.g_reggr||0),
        v_flag:vFlag, j_flag:jFlag, m_flag:mFlag,
        ass_a:assA, ass_b:assB, ass_c:assC, ass_d:assD
      });
    }
  });

  const rows=Object.values(reiseMap)
    .filter(r=>r.results.length>0)
    .sort((a,b)=>a.number-b.number)
    .map(trip=>{
      const h=zuechterMap[trip.number]||{};
      // Top-3-Nummerierung je Flug+Züchter für V/J/M/P: von den jeweils
      // gekennzeichneten Tauben zählen nur die schnellsten 3 (analog zur
      // üblichen Vorbenennungs-Wertung, bei der nur die besten 3 der
      // gemeldeten Tauben in die Wertung kommen).
      const rankTop3 = flagKey => {
        const flagged = trip.results
          .map((res,i)=>({i, speed:res[flagKey+'_flag']?res.speed:null}))
          .filter(x=>trip.results[x.i][flagKey+'_flag']);
        flagged.sort((a,b)=>{
          if(a.speed!=null && b.speed!=null) return b.speed-a.speed;
          if(a.speed!=null) return -1;
          if(b.speed!=null) return 1;
          return 0;
        });
        const platz={};
        flagged.slice(0,3).forEach((x,rank)=>{ platz[x.i]=rank+1; });
        return platz;
      };
      const vPlatz=rankTop3('v'), jPlatz=rankTop3('j'), mPlatz=rankTop3('m');
      const results=trip.results.map((res,i)=>{
        const dbP=S.pigeons.find(p=>normRing(p.ringnumber)===normRing(res.ringnumber));
        return {...res, placement:i+1, pigeonid:dbP?.pigeonid||null, found:!!dbP,
          breedername:breedername||null, breedernumber:breedernumber||null,
          v_platz:vPlatz[i]||null, j_platz:jPlatz[i]||null, m_platz:mPlatz[i]||null};
      });
      return {
        trip:{...trip, pigeonsset:results.length,
          prices1:h.p1||null, prices2:h.p2||null, prices3:h.p3||null,
          prices4:h.p4||null, prices5:h.p5||null,
          averagedistance3:(trip.distRv!=null?trip.distRv:(trip.distReg!=null?trip.distReg:trip.distReggr))},
        results
      };
    });
  // Häufigster (praktisch immer einziger) Vereins-/Züchternummer-Block dieser
  // Datei = zuverlässiges automatisches Erkennungsmerkmal.
  const vz = Object.keys(vzCount).sort((a,b)=>vzCount[b]-vzCount[a])[0] || null;
  return {rows, breedername, vz};
}

async function parseXlsxRows(file){
  if(!window.XLSX){
    await new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload=res; s.onerror=()=>rej(new Error('SheetJS nicht geladen'));
      document.head.appendChild(s);
    });
  }
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array',cellDates:true});
  const raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false})
    .filter(r=>String(r['Taube']||'').trim()!=='');
  const parseTaube=t=>{
    const m=String(t).match(/^(\d{4,5})-(\d{2})-(\d+)\s*[A-Z]?$/);
    return m?`DE-${m[1].padStart(5,'0')}-${m[2]}-${m[3]}`:null;
  };
  const tripMap={};
  raw.forEach(r=>{
    const key=(r['Nr.']||r['Nr']||0)+'|'+String(r['Datum']||'').substring(0,10);
    if(!tripMap[key]) tripMap[key]={number:parseInt(r['Nr.']||r['Nr']||'0')||0,
      vintage:parseInt(r['Jahr']||'0')||0,location:String(r['Ort']||'?').trim(),
      tripdate:String(r['Datum']||'').substring(0,10),rows:[]};
    tripMap[key].rows.push(r);
  });
  const rows=Object.values(tripMap).sort((a,b)=>a.number-b.number).map(trip=>{
    const results=trip.rows.map((r,i)=>{
      const ring=parseTaube(r['Taube']||'');
      const dbP=ring?S.pigeons.find(p=>normRing(p.ringnumber)===normRing(ring)):null;
      // Optionale Spalten V/J/M/P (Vorbenennungs-Platz je Flug) und A/B/C/D
      // (Ass-Kategorie, wird an der Taube gespeichert): Zelle leer/0 → kein
      // Flag; eine Zahl → Platz direkt übernehmen; ein sonstiger Wert (z.B.
      // "x") → Flag gesetzt, aber ohne Platz.
      const flagCell = key => {
        const raw = String(r[key]||'').trim();
        if(!raw) return {flag:false, platz:null};
        const n = parseInt(raw.replace(',','.'));
        if(!isNaN(n) && /^\d+$/.test(raw)) return {flag:true, platz:n};
        return {flag:true, platz:null};
      };
      const vC=flagCell('V'), jC=flagCell('J'), mC=flagCell('M');
      return {ringnumber:ring||String(r['Taube']||''),pigeonid:dbP?.pigeonid||null,found:!!dbP,
        placement:i+1,
        speed:parseFloat(String(r['Geschwindigkeit']||'0').replace(',','.'))||null,
        maxkm:parseFloat(String(r['Max. Km']||'0').replace(',','.'))||null,
        prize_rv:parseInt(r['RV']||'0')||null,prize_fg:parseInt(r['FG']||'0')||null,
        prize_reggr:parseInt(r['RegGr']||'0')||null,prize_reg:parseInt(r['REG']||r['Reg']||'0')||null,
        as_rv:parseFloat(String(r['AS RV']||'0').replace(',','.'))||null,
        as_fg:parseFloat(String(r['AS FG']||'0').replace(',','.'))||null,
        as_reg:parseFloat(String(r['AS Reg']||'0').replace(',','.'))||null,
        as_nat:parseFloat(String(r['AS Nat']||'0').replace(',','.'))||null,
        v_flag:vC.flag, v_platz:vC.platz, j_flag:jC.flag, j_platz:jC.platz,
        m_flag:mC.flag, m_platz:mC.platz,
        ass_a:!!String(r['A']||'').trim(), ass_b:!!String(r['B']||'').trim(),
        ass_c:!!String(r['C']||'').trim(), ass_d:!!String(r['D']||'').trim(),
      };
    });
    return {trip:{...trip,pigeonsset:results.length},results};
  });
  return {rows, breedername:null};
}

// Import) schon ein Eintrag in RT.trips existiert. Grundlage für die

  const normL=s=>(s||'').toLowerCase().trim().replace(/\s+/g,' ');
  const list = RT.imp.allTrips || RT.trips || [];
  return list.find(x=>
    x.vintage===item.trip.vintage && normL(x.location)===normL(item.trip.location) &&
    (x.tripdate||'')===(item.trip.tripdate||'')
  );
}
