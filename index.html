<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brieftauben-Verwaltung</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0F1117;--bg2:#161B22;--bg3:#1C2333;--bg4:#242B3D;
  --green:#5B8659;--green2:#4a6e48;--green3:#3d5c3b;
  --text:#E8EAF0;--text2:#9BA3AF;--text3:#6B7280;
  --border:#2A3347;--border2:#3A4560;
  --blue:#4A90D9;--purple:#a855f7;--orange:#e8893a;--amber:#d4a843;
  --radius:12px;--radius-sm:8px;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh}
.serif{font-family:'Playfair Display',serif}

/* ── Header ── */
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:13px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;background:var(--green3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
header h1{font-family:'Playfair Display',serif;font-size:18px;font-weight:600}
.db-status{font-size:11px;color:var(--text3);margin-top:1px}
.header-right{display:flex;align-items:center;gap:8px}
.stat-pill{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--text2);white-space:nowrap}
.stat-pill span{color:var(--green);font-weight:500;font-family:monospace}

/* ── Nav ── */
nav{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;padding:0 16px;overflow-x:auto}
nav button{background:none;border:none;border-bottom:2px solid transparent;color:var(--text2);padding:11px 16px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;white-space:nowrap;transition:color .15s,border-color .15s}
nav button:hover{color:var(--text)}
nav button.active{color:var(--green);border-bottom-color:var(--green);font-weight:500}

/* ── Subnav (Kontext-Reiter innerhalb einer Gruppe, z.B. Tauben/Stammbaum/Nachkommen/Paarungscheck) ── */
.subnav{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:14px;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-bottom:1px solid var(--border)}
.subnav::-webkit-scrollbar{display:none}
.subnav-btn{background:var(--bg2);border:1px solid var(--border);color:var(--text2);padding:7px 14px;border-radius:20px;cursor:pointer;font-size:12.5px;font-family:'DM Sans',sans-serif;white-space:nowrap;transition:all .15s;display:inline-flex;align-items:center;gap:5px;flex-shrink:0}
.subnav-btn:hover{border-color:var(--green);color:var(--text)}
.subnav-btn.active{background:var(--green3);border-color:var(--green2);color:#e8f0e8;font-weight:500}
.subnav-btn.ghost{background:none;border-style:dashed}

/* ── Main ── */
main{padding:18px 20px;max-width:1300px;margin:0 auto}

/* ── Cards ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.card-title{font-weight:500;font-size:14px;margin-bottom:14px;display:flex;align-items:center;gap:8px}

/* ── Suche & Filter ── */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-wrap input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px 9px 36px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--green)}
.search-wrap input::placeholder{color:var(--text3)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}
.search-wrap input{padding-right:30px}
.search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;display:none;align-items:center;justify-content:center;color:var(--text3);font-size:13px;cursor:pointer;background:none;border:none;line-height:1}
.search-clear:hover{background:var(--bg4);color:var(--text)}
select{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:8px 10px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;cursor:pointer;height:36px}
select:focus{border-color:var(--green)}
.count-label{font-size:12px;color:var(--text3);white-space:nowrap}
/* Filter & Werkzeuge: eingeklappt per Default, damit die Ergebnisliste auf mobilen
   Geräten sofort sichtbar ist statt hinter langen Filterreihen zu verschwinden. */
.filter-panel{border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:14px;background:var(--bg2)}
.filter-panel summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);user-select:none}
.filter-panel summary::-webkit-details-marker{display:none}
.filter-panel summary::before{content:'▸';display:inline-block;color:var(--text3);transition:transform .15s;font-size:11px}
.filter-panel[open] summary::before{transform:rotate(90deg)}
.filter-panel-body{padding:2px 14px 14px;border-top:1px solid var(--border)}
.filter-badge{background:var(--green3);color:#e8f0e8;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:600}

/* ── Tabelle ── */
.table-wrap{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--border)}
.pigeon-cards{display:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg3);color:var(--text3);font-weight:500;text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
th:hover{color:var(--text2)}
td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3);color:var(--text);cursor:pointer}
.ring{font-family:monospace;font-size:11.5px;color:var(--text);background:var(--bg3);padding:2px 7px;border-radius:4px;border:1px solid var(--border)}
.ring-sm{font-family:monospace;font-size:11px;color:var(--green);background:color-mix(in srgb,var(--green) 10%,var(--bg3));padding:1px 6px;border-radius:3px;cursor:pointer;transition:background .15s}
.ring-sm:hover{background:color-mix(in srgb,var(--green) 20%,var(--bg3))}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500}
.badge-m{background:#1a2d4a;color:#7ab3e0}
.badge-f{background:#2d1a3d;color:#c97fd4}
.badge-u{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}

/* ── Pagination ── */
.pagination{display:flex;align-items:center;gap:6px;margin-top:12px;justify-content:flex-end;flex-wrap:wrap}
.pagination button{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:5px 11px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;transition:all .15s}
.pagination button:hover:not(:disabled){border-color:var(--green);color:var(--text)}
.pagination button:disabled{opacity:.3;cursor:default}
.pagination span{font-size:12px;color:var(--text3)}

/* ── Detail ── */
.back-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:7px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;margin-bottom:14px;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.back-btn:hover{border-color:var(--green);color:var(--text)}
.detail-name{font-family:'Playfair Display',serif;font-size:26px;margin-bottom:3px}
.detail-ring{font-family:monospace;font-size:14px;color:var(--green);margin-bottom:14px}
.section-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin:18px 0 10px}
.parent-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;cursor:pointer;transition:border-color .15s,background .15s}
.parent-card:hover{border-color:var(--green);background:var(--bg4)}
.parent-card.male{border-left:3px solid var(--blue)}
.parent-card.female{border-left:3px solid var(--purple)}
.parent-card.unknown{cursor:default;opacity:.5}
.parent-card.unknown:hover{border-color:var(--border);background:var(--bg3)}
.field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.field-item label{display:block;font-size:10px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.field-item span{font-size:13px;color:var(--text)}

/* ── Buttons ── */
.btn{background:var(--green3);border:1px solid var(--green2);color:#e8f0e8;padding:7px 15px;border-radius:var(--radius-sm);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;transition:background .15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--green2)}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text2)}
.btn-outline:hover{border-color:var(--green);color:var(--text);background:none}
.btn-sm{padding:5px 11px;font-size:12px}

/* ── Pedigree ── */
.ped-wrap{overflow-x:auto;padding:4px 0 8px}
/* ── Stammbaum-Grid ── */
.ped-tree{display:flex;flex-direction:row;align-items:stretch;gap:0;min-width:860px;overflow-x:auto}
.ped-col{display:flex;flex-direction:column;justify-content:space-around;position:relative;padding:0 6px}
.ped-col-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;text-align:center;padding:4px 0 8px;border-bottom:1px solid var(--border);margin-bottom:4px}
.ped-col-hdr{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;text-align:center;padding:4px 0;margin-bottom:6px}
.ped-cell{display:flex;align-items:center;flex:1;position:relative;min-height:60px}
.ped-cell-inner{width:100%}
/* Verbindungslinien */
.ped-col.has-lines .ped-cell::before{
  content:'';position:absolute;left:-6px;top:50%;
  width:6px;height:1px;background:var(--border);
}
.ped-col.has-lines .ped-cell::after{
  content:'';position:absolute;left:-6px;
  width:1px;background:var(--border);
}
/* Obere Hälfte des Paares */
.ped-cell.pair-top::after{top:50%;bottom:0}
/* Untere Hälfte des Paares */
.ped-cell.pair-bottom::after{top:0;bottom:50%}
/* Einzelkind (Proband) */
.ped-cell.solo::after{display:none}
.ped-col-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.ped-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 10px;cursor:pointer;transition:border-color .15s,background .15s}
.ped-box:hover{border-color:var(--green);background:var(--bg4)}
.ped-box.male{border-left:3px solid var(--blue)}
.ped-box.female{border-left:3px solid var(--purple)}
.ped-box.empty{opacity:.3;cursor:default;border-style:dashed}
.ped-box.empty:hover{border-color:var(--border);background:var(--bg3)}
.ped-box.root{border-color:var(--green2);background:color-mix(in srgb,var(--green) 8%,var(--bg3))}
.ped-ring{font-family:monospace;font-size:11px;color:var(--green);font-weight:600}
.ped-name{font-size:12px;color:var(--text);margin-top:2px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ped-info{font-size:11px;color:var(--text3);margin-top:1px}

/* ── Stammbaum Suche ── */
.ped-result{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;display:flex;align-items:center;gap:10px}
.ped-result:hover{background:var(--bg3)}
.ped-result:last-child{border-bottom:none}

/* ── Statistik ── */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px;text-align:center}
.stat-num{font-family:'Playfair Display',serif;font-size:32px;color:var(--green);font-weight:600;line-height:1}
.stat-label{font-size:12px;color:var(--text3);margin-top:5px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.bar-label{font-size:12px;color:var(--text2);width:50px;flex-shrink:0;font-family:monospace;text-align:right}
.bar-track{flex:1;background:var(--bg3);border-radius:4px;height:18px;overflow:hidden}
.bar-fill{background:linear-gradient(90deg,var(--green3),var(--green2));height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;min-width:30px;transition:width .4s ease}
.bar-fill span{font-size:11px;color:#e8f0e8;white-space:nowrap}

/* ── Neue Taube / Formular ── */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.form-field{display:grid;gap:5px}
.form-field label{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.4px}
.form-field input,.form-field select,.form-field textarea{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:8px 10px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--green)}
.form-field textarea{min-height:80px;resize:vertical}
.form-full{grid-column:1 / -1}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.form-msg{font-size:12px;padding:8px 12px;border-radius:var(--radius-sm);margin-bottom:10px}
.form-msg.ok{background:color-mix(in srgb,var(--green) 10%,var(--bg3));color:var(--green);border:1px solid color-mix(in srgb,var(--green) 30%,var(--border))}
.form-msg.err{background:#1e0f0f;color:#e07070;border:1px solid #5a1f1f}
.autocomplete-wrap{position:relative}
.autocomplete-drop{position:absolute;top:100%;left:0;right:0;background:var(--bg2);border:1px solid var(--border2);border-top:none;border-radius:0 0 var(--radius-sm) var(--radius-sm);z-index:50;max-height:160px;overflow-y:auto;display:none}
.autocomplete-drop.open{display:block}
.ac-item{padding:7px 10px;cursor:pointer;font-size:12px;color:var(--text2);display:flex;align-items:center;gap:8px;transition:background .1s}
.ac-item:hover,.ac-item.selected{background:var(--bg3);color:var(--text)}
.ac-ring{font-family:monospace;font-size:11px;color:var(--green)}

/* ── Inzuchtrechner ── */
.ibc-result{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;text-align:center;margin-top:12px}
.ibc-num{font-family:'Playfair Display',serif;font-size:36px;font-weight:600}
.ibc-num.low{color:var(--green)}
.ibc-num.mid{color:var(--orange)}
.ibc-num.high{color:#e07070}
.ibc-label{font-size:12px;color:var(--text3);margin-top:4px}

/* ── Sonstige ── */
.loading{text-align:center;padding:48px;color:var(--text3)}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:#1e0f0f;border:1px solid #5a1f1f;color:#e07070;border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:14px;font-size:13px}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block}
.divider{border:none;border-top:1px solid var(--border);margin:14px 0}
.empty-state{text-align:center;padding:40px;color:var(--text3)}
.empty-state .icon{font-size:32px;margin-bottom:10px}
.tag-list{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:3px 11px;font-size:12px;color:var(--text2)}
.tag strong{color:var(--text);margin-left:5px}
@media(max-width:640px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .ped-grid{grid-template-columns:repeat(4,160px)}
  .header-right{display:none}
  header{padding:11px 14px}
  header h1{font-size:16px}
  .logo{width:30px;height:30px;font-size:15px}
  nav{padding:0 8px}
  nav button{padding:11px 12px;font-size:12.5px}
  main{padding:12px 12px 28px}
  .card{padding:13px;border-radius:12px}
  .subnav-btn{padding:8px 13px;font-size:12px}
  .toolbar{gap:6px}
  .search-wrap{min-width:0}
  .search-row{gap:6px}
  .count-label{font-size:11px}
  .filter-panel summary{padding:9px 12px;font-size:12.5px}
  .filter-panel-body{padding:2px 12px 12px}
  .btn,.btn-outline{padding:8px 13px}
  .form-grid{grid-template-columns:1fr}
  .field-grid{grid-template-columns:1fr 1fr}
  .detail-name{font-size:21px}
  .stat-num{font-size:26px}
  th,td{padding:8px 9px;font-size:12.5px}
  .ped-tree{min-width:0}
  /* Tauben-Übersicht: Tabelle → Karten, damit alle Spalten ohne horizontales
     Scrollen lesbar bleiben (Spaltenauswahl über "☰ Spalten" bleibt wirksam).
     Wichtig: nur die Haupt-Tabellenliste (#table-wrap) betreffen — andere Tabellen
     (z.B. Reiseleistung/Top10 auf der Detailseite) sollen weiterhin sichtbar bleiben. */
  #table-wrap{border:none;overflow-x:visible;border-radius:0}
  #table-wrap>table{display:none}
  .pigeon-cards{display:block}
}
/* ── Tauben-Karten (mobile Übersicht) ── */
.pigeon-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:border-color .15s}
.pigeon-card:active,.pigeon-card:hover{border-color:var(--green2)}
.pigeon-card.bulk-row-selected{border-color:var(--green);background:color-mix(in srgb,var(--green) 7%,var(--bg2))}
.pc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.pc-ring{font-family:monospace;font-weight:700;font-size:16px;color:var(--green)}
.pc-name{font-size:13px;color:var(--text2);font-style:italic;margin-top:2px}
.pc-check input{width:18px;height:18px}
.pc-body{display:flex;gap:12px}
.pc-icon{flex-shrink:0;width:64px;height:56px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:6px;border:1px solid var(--border);overflow:hidden}
.pc-icon img{width:100%;height:100%;object-fit:contain}

/* ── Foto-Lightbox (Klick zum Vergrößern) ── */
.lightbox-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:1000;cursor:zoom-out;padding:24px}
.lightbox-overlay img{max-width:92vw;max-height:92vh;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.5);background:#fff}
.pc-fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.pc-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px}
.pc-label{color:var(--text3);flex-shrink:0}
.pc-val{color:var(--text);font-weight:500;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:420px){
  .field-grid{grid-template-columns:1fr}
  header h1{font-size:15px}
  .db-status{display:none}
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">🕊</div>
    <div>
      <h1>Brieftauben-Verwaltung</h1>
      <div class="db-status" id="db-status">Verbinde mit Datenbank…</div>
    </div>
  </div>
  <div class="header-right" id="headerStats"></div>
</header>

<nav id="nav">
  <button data-group="tauben" class="active" onclick="showTab('tauben')">🐦 Tauben</button>
  <button data-group="add" onclick="showTab('neu')">＋ Hinzufügen</button>
  <button data-group="reisen" onclick="showTab('reisen')">🏁 Reisen</button>
</nav>

<main id="main">
  <div class="loading"><div class="spinner"></div>Lade Daten…</div>
</main>

<script>

// Auth-State
let AUTH = { token: null, user: null };
function authHeaders(){
  const tok = AUTH.token || SUPA_KEY;
  return {'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + tok,
          'Content-Type': 'application/json', 'Prefer': 'return=representation'};
}
// H als Funktion — liefert immer aktuellen Token
const H = authHeaders;

// ── Auth-Funktionen ────────────────────────────────────────────
async function signIn(email, pw){
  const r = await fetch(SUPA_AUTH_URL+'/token?grant_type=password', {
    method:'POST',
    headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
    body: JSON.stringify({email, password:pw})
  });
  const d = await r.json();
  if(!r.ok) throw new Error(d.error_description || d.msg || 'Login fehlgeschlagen');
  AUTH.token = d.access_token;
  AUTH.user  = d.user;
  // Session im localStorage speichern
  localStorage.setItem('bv_session', JSON.stringify({token:d.access_token, refresh:d.refresh_token, user:d.user}));
  return d;
}

async function refreshSession(refreshToken){
  const r = await fetch(SUPA_AUTH_URL+'/token?grant_type=refresh_token', {
    method:'POST',
    headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
    body: JSON.stringify({refresh_token: refreshToken})
  });
  if(!r.ok) return false;
  const d = await r.json();
  AUTH.token = d.access_token;
  AUTH.user  = d.user;
  localStorage.setItem('bv_session', JSON.stringify({token:d.access_token, refresh:d.refresh_token, user:d.user}));
  return true;
}

async function signOut(){
  try{
    await fetch(SUPA_AUTH_URL+'/logout', {
      method:'POST',
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+(AUTH.token||'')}
    });
  } catch(e){}
  AUTH = {token:null, user:null};
  localStorage.removeItem('bv_session');
  renderLogin();
}

async function restoreSession(){
  const raw = localStorage.getItem('bv_session');
  if(!raw) return false;
  try{
    const s = JSON.parse(raw);
    // Erst versuchen Token direkt zu verwenden
    AUTH.token = s.token;
    AUTH.user  = s.user;
    // Refresh versuchen falls Token abgelaufen
    const ok = await refreshSession(s.refresh);
    return ok || !!s.token;
  } catch(e){ return false; }
}

// Ringnummern einheitlich formatieren für die ANZEIGE (Übersicht, Listen, Pedigree).
// Rührt die gespeicherten Rohdaten NICHT an — Suche/Matching arbeitet weiterhin
// auf den unveränderten Originalfeldern.
//
// Deutsch (kein Länderkürzel ODER explizit "DE", 3 Zahlen-Segmente): Vereinsnr-Jahrgang-Endnummer
//   -> "DE-" Präfix, Vereinsnr auf 5, Jahrgang auf 2, Endnummer auf 3 Stellen aufgefüllt
// BE/NL/FR/... (mit Länderkürzel): nur laufende Nummer -> Länderkürzel-Jahrgang-Seriennr.
//   -> Länderkürzel-Aliase vereinheitlicht (z.B. "B" -> "BE"), Jahrgang auf 2 Stellen, Rest unverändert
const COUNTRY_ALIAS = { B:'BE', BEL:'BE', NED:'NL', GER:'DE', GERMANY:'DE', GE:'DE', DV:'DE' };

function fmtRingnumber(raw){
  let s = String(raw||'').trim();
  if(!s) return '';
  // Anhängende Geschlechts-Marker aus Stammbaum-Scans entfernen (z.B. "... 373 V" / "... 373 W")
  s = s.replace(/[\s\/]+[VW]$/i, '').trim();
  // Trenner vereinheitlichen
  s = s.replace(/[\s_\/]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
  if(!s) return '';

  const m = s.match(/^([A-Za-z]{1,3})-?(.*)$/);
  let country = '', rest = s;
  if(m && m[1] && m[2]){ country = m[1].toUpperCase(); rest = m[2]; }
  if(country) country = COUNTRY_ALIAS[country] || country;
  if(!country) country = 'DE'; // bare Format ohne Länderkürzel = Deutschland

  let segs = rest.split('-').filter(Boolean);
  if(!segs.length) return `${country}-${rest}`;

  if(country==='DE'){
    if(segs.length===3){
      // Vereinsnr/Jahrgang bleiben fest auf 5/2 Stellen, Endnummer OHNE führende Nullen
      const endnr = segs[2].replace(/^0+(?=\d)/, '');
      return `DE-${segs[0].padStart(5,'0')}-${segs[1].padStart(2,'0')}-${endnr}`;
    }
    return `DE-${segs.join('-')}`; // unbekannte Segmentanzahl, nur Präfix vereinheitlichen
  }
  // BE/NL/... : erstes Segment ist der Jahrgang -> 2-stellig auffüllen, Seriennr. unverändert
  segs[0] = segs[0].padStart(2,'0');
  return `${country}-${segs.join('-')}`;
}

function normCountryCode(raw){
  const s = String(raw||'').trim().toUpperCase();
  if(!s) return '';
  return COUNTRY_ALIAS[s] || s;
}

// Zerlegt eine eingegebene Ringnummer in Vereinsnr./Jahrgang/Land/Endnummer,
// damit diese bei der Schnellerfassung automatisch gesetzt werden können.
function yearFromYY(yy){
  const s = String(yy||'').trim();
  const n = parseInt(s,10);
  if(isNaN(n)) return null;
  if(s.length>=4) return n;          // bereits 4-stellig: 2025, 2026 etc.
  return n<=50 ? 2000+n : 1900+n;   // zweistellig: 25→2025, 26→2026
}
function parseRingComponents(raw){
  const formatted = fmtRingnumber(raw);
  if(!formatted) return null;
  const segs = formatted.split('-');
  if(segs.length<3) return null;
  const country = segs[0];
  if(country==='DE' && segs.length===4){
    return {
      ringnumber: formatted, countrycode: 'DE',
      associationno: segs[1], date_year: yearFromYY(segs[2]), endnumber: segs[3]
    };
  }
  if(segs.length===3){
    return {
      ringnumber: formatted, countrycode: country,
      associationno: null, date_year: yearFromYY(segs[1]), endnumber: segs[2]
    };
  }
  return { ringnumber: formatted, countrycode: country||null, associationno:null, date_year:null, endnumber:null };
}

// Endnummer: bevorzugt die separate DB-Spalte "number", sonst aus dem letzten
// Ringnummer-Segment abgeleitet (gleiche Logik wie ringSortParts).
function endNumberOf(p){
  if(p.number!=null && p.number!=='') { const n=Number(p.number); if(!isNaN(n)) return n; }
  const segs = String(ring(p)||'').split('-');
  if(segs.length){ const n=parseInt(segs[segs.length-1],10); if(!isNaN(n)) return n; }
  return null;
}

// Ringnummer in Segmente für die Sortierung zerlegen: alles bis auf das letzte
// Segment (Endnummer/Seriennr.) wird als String verglichen, das letzte Segment
// numerisch — damit z.B. bei gleichem Jahrgang "...26-2" vor "...26-15" kommt.
function ringSortParts(p){
  const r = String(ring(p)||'');
  const segs = r.split('-');
  if(!segs.length) return [r];
  return segs.map((s,i) => i===segs.length-1 ? (parseInt(s,10) || 0) : s);
}
function compareSortParts(a,b){
  const len = Math.max(a.length, b.length);
  for(let i=0; i<len; i++){
    const av=a[i], bv=b[i];
    if(av===undefined) return -1;
    if(bv===undefined) return 1;
    if(typeof av==='number' && typeof bv==='number'){
      if(av!==bv) return av-bv;
    } else {
      const as=String(av), bs=String(bv);
      if(as!==bs) return as<bs?-1:1;
    }
  }
  return 0;
}

  if(i>=0){ if(S.columns.length<=1) return; S.columns.splice(i,1); }
  else S.columns.push(key);
  try{ localStorage.setItem('taubenCols', JSON.stringify(S.columns)); }catch(e){}
  applyFilter();
  refreshColumnMenu();

function moveColumn(key, dir){
  const i = S.columns.indexOf(key);
  if(i<0) return;
  const j = i+dir;
  if(j<0 || j>=S.columns.length) return;
  [S.columns[i], S.columns[j]] = [S.columns[j], S.columns[i]];
  try{ localStorage.setItem('taubenCols', JSON.stringify(S.columns)); }catch(e){}
  applyFilter();
  refreshColumnMenu();

function toggleColumnMenu(btn){
  const m = document.getElementById('col-picker-menu');
  if(!m) return;
  if(m.style.display==='block'){ m.style.display='none'; return; }
  positionColumnMenu(btn, m);

}
function positionColumnMenu(btn, m){
  const r = btn.getBoundingClientRect();
  const menuWidth = 240;
  // Rechtsbündig zum Button ausrichten, aber innerhalb des Viewports halten
  // (mind. 8px Abstand zu beiden Rändern) — verhindert Abschneiden bei
  // horizontal scrollenden Filterleisten oder schmalen Mobil-Bildschirmen.
  let left = r.right - menuWidth;
  left = Math.max(8, Math.min(left, window.innerWidth - menuWidth - 8));
  let top = r.bottom + 4;
  const maxH = Math.max(150, Math.min(window.innerHeight - top - 12, 480));
  if(maxH < 200 && r.top > window.innerHeight - r.bottom){
    // Zu wenig Platz unten -> stattdessen oberhalb des Buttons öffnen
    top = Math.max(8, r.top - 4 - Math.min(r.top - 12, 480));
  }
  m.style.left = left+'px';
  m.style.top = top+'px';
  m.style.maxHeight = Math.max(150, Math.min(window.innerHeight - top - 12, 480))+'px';
}

function findFather(p){ return p.fatherid ? S.pigeons.find(x=>x.pigeonid===p.fatherid)||null : p.ringnumberfather ? S.pigeons.find(x=>x.ringnumber===p.ringnumberfather)||null : null; }
function findMother(p){ return p.motherid ? S.pigeons.find(x=>x.pigeonid===p.motherid)||null : p.ringnumbermother ? S.pigeons.find(x=>x.ringnumber===p.ringnumbermother)||null : null; }
function findById(id){ if(!id)return null; return S.pigeons.find(p=>p.pigeonid===id||p.ringnumber===String(id))||null; }
function getAncestors(p, depth=4){
  if(!p||depth===0) return new Set();
  const s = new Set([p.pigeonid]);
  const f = findFather(p), m = findMother(p);
  getAncestors(f,depth-1).forEach(x=>s.add(x));
  getAncestors(m,depth-1).forEach(x=>s.add(x));
  return s;
}

// ── Inzuchtberechnung (Wright-Koeffizient, 5 Gen.) ───────────
function calcInbreeding(bird, depth=5){
  function ancestors(b, gen, path){
    if(!b||gen>depth) return {};
    const res = {};
    if(gen>0){ if(!res[b.pigeonid]) res[b.pigeonid]=[]; res[b.pigeonid].push(gen); }
    const f=findFather(b), m=findMother(b);
    const fa=ancestors(f,gen+1,path+'-f'), ma=ancestors(m,gen+1,path+'-m');
    for(const [id,gens] of Object.entries(fa)){ if(!res[id])res[id]=[]; res[id].push(...gens); }
    for(const [id,gens] of Object.entries(ma)){ if(!res[id])res[id]=[]; res[id].push(...gens); }
    return res;
  }
  const f=findFather(bird), m=findMother(bird);
  if(!f||!m) return 0;
  const fa=ancestors(f,1,''), ma=ancestors(m,1,'');
  let coeff=0;
  for(const id of Object.keys(fa)){
    if(ma[id]){
      const fGens=fa[id], mGens=ma[id];
      for(const n of fGens) for(const p of mGens) coeff+=Math.pow(0.5,n+p+1);
    }
  }
  return coeff;
}

function calcInbreedingPair(male, female, depth=5){
  // Simuliere ein hypothetisches Nachkomme-Objekt
  const fake = { pigeonid: '__tmp__', fatherid: male.pigeonid, motherid: female.pigeonid };
  const origFind = (id) => S.pigeons.find(p=>p.pigeonid===id);
  // patching findFather/findMother lokal
  function anc(b, gen){
    if(!b||gen>depth) return {};
    const res={};
    if(gen>0){ if(!res[b.pigeonid])res[b.pigeonid]=[]; res[b.pigeonid].push(gen); }
    const fid = b===fake ? male.pigeonid : (b.fatherid||null);
    const mid = b===fake ? female.pigeonid : (b.motherid||null);
    const fb  = fid ? (S.pigeons.find(p=>p.pigeonid===fid)||null) : null;
    const mb  = mid ? (S.pigeons.find(p=>p.pigeonid===mid)||null) : null;
    const fa=anc(fb,gen+1), ma=anc(mb,gen+1);
    for(const [id,g] of Object.entries(fa)){ if(!res[id])res[id]=[]; res[id].push(...g); }
    for(const [id,g] of Object.entries(ma)){ if(!res[id])res[id]=[]; res[id].push(...g); }
    return res;
  }
  const fa=anc(male,1), ma=anc(female,1);
  let coeff=0;
  for(const id of Object.keys(fa)){
    if(ma[id]){
      for(const n of fa[id]) for(const p of ma[id]) coeff+=Math.pow(0.5,n+p+1);
    }
  }
  return coeff;
}

async function loadData(){
  S.loading=true; S._loadingMore=false; render();
  // Status-Tabelle laden
  try{ const ps=await apiGet('/pigeonstates?order=name.asc'); S.pigeonStates=ps||[]; } catch(e){ S.pigeonStates=[]; }
  const BATCH=500;
  try{
    // Erste Batch sofort laden → UI erscheint schnell
    const first = await apiGet('/pigeons?deleted=eq.false&limit='+BATCH+'&offset=0&order=date_year.desc,number.asc');
    S.pigeons = first||[];
    S.error=null;
    S.loading=false;
    updateHeaderStats();
    // Beim Start: komplettes render() damit DOM aufgebaut wird
    render();
    applyFilter();

    // Rest im Hintergrund nachladen
    if((first||[]).length===BATCH){
      S._loadingMore=true;
      updateHeaderStats();
      let offset=BATCH;
      while(true){
        const batch = await apiGet('/pigeons?deleted=eq.false&limit='+BATCH+'&offset='+offset+'&order=date_year.desc,number.asc');
        if(!batch||batch.length===0) break;
        S.pigeons = S.pigeons.concat(batch);
        updateHeaderStats();
        // Hintergrund-Batch: Tabelle still aktualisieren
        S.filtered=[...S.pigeons];
        if(document.getElementById('table-wrap')) renderTableOnly();
        if(batch.length<BATCH) break;
        offset+=BATCH;
      }
      S._loadingMore=false;
      updateHeaderStats();
      applyFilter();
      render(); // Filter-Dropdowns (Standort, Status, Farbe, Jahr…) mit vollständigen Daten neu aufbauen —
                // applyFilter() ruft bei bereits vorhandener Tabelle nur renderTableOnly() auf, das die
                // Dropdown-Optionen nicht neu berechnet. Erst nach kompletter Ladephase relevant, daher
                // performance-unkritisch.
    }
  } catch(e){
    S.loading=false;
    S._loadingMore=false;
    S.error=e.message;
    document.getElementById('db-status').textContent='Verbindungsfehler';
    render();
  }
}

// ── Farbfilter: Basis-Schlagworte statt exakter Einzelwerte ──────
// Die Datenbank enthält viele feine Farbvarianten (z.B. "Dunkelblau",
// "Blau gehämmert", "Blauscheck", "Blau-Spieß" …). Ein exakter Abgleich
// im Filter würde jede Variante als eigenen, isolierten Wert behandeln
// und dadurch viel zu wenige Treffer liefern. Stattdessen prüfen wir
// hier, ob ein Basis-Schlagwort (z.B. "Blau") im Farbtext ENTHALTEN ist
// - das findet dann automatisch alle Varianten mit.
const COLOR_FILTER_KEYWORDS = ['Blau','Rot','Fahl','Gehämmert','Scheck','Schimmel','Weiß','Schwarz','Gelb','Silber','Braun','Schalie'];
function colorMatchesKeyword(colorText, keyword){
  return (colorText||'').toLowerCase().includes((keyword||'').toLowerCase());
}

async function applyBulkEdit(){
  const ids=[...S.bulkSelected];
  if(!ids.length) return;
  const f = BULK_FIELD_BY_KEY[S.bulkField];
  if(!f) return;

  let value = S.bulkValue;
  if(f.type==='bool') value = value==='true';
  else if(value==='' || value===undefined) value = null;

  let label;
  if(f.type==='select'){ const opt=f.options().find(o=>String(o.v)===String(value)); label = opt ? opt.l : '— leer —'; }
  else if(f.type==='bool'){ label = value ? 'Ja' : 'Nein'; }
  else { label = value || '— leer —'; }

  if(!confirm(`${ids.length} Taube(n) aktualisieren?\n\nFeld: ${f.label}\nNeuer Wert: ${label}\n\nDas kann nicht automatisch zurückgenommen werden.`)) return;

  const applyBtn=document.getElementById('bulk-apply-btn'); if(applyBtn) applyBtn.disabled=true;
  const prog=document.getElementById('bulk-progress');
  if(prog){ prog.style.display='block'; prog.innerHTML=`<div class="imp-progress"><div class="imp-progress-bar" style="width:0%"></div></div><div style="font-size:12px;color:var(--text3)">0 / ${ids.length}</div>`; }

  let done=0, err=0; const errMsgs=[];
  for(const id of ids){
    try{
      await apiPatch('pigeons', id, {[f.key]: value});
      const idx=S.pigeons.findIndex(p=>p.pigeonid===id);
      if(idx!==-1) S.pigeons[idx][f.key]=value;
    } catch(e){ err++; errMsgs.push(e.message); }
    done++;
    if(prog){
      const pct=Math.round(done/ids.length*100);
      const bar=prog.querySelector('.imp-progress-bar'); if(bar) bar.style.width=pct+'%';
      const lbl=prog.querySelector('.imp-progress + div'); if(lbl) lbl.textContent=`${done} / ${ids.length}`;
    }
  }

  S.bulkSelected.clear();
  applyFilter();
  const bar=document.getElementById('bulk-bar'); if(bar) bar.innerHTML=renderBulkBar();
  alert(err ? `Fertig: ${done-err} aktualisiert, ${err} Fehler.` : `✅ ${done} Taube(n) aktualisiert.`);
}

function applyFilter(){
  let arr=[...S.pigeons];
  const q=S.search.trim();
  const ql=q.toLowerCase();

  if(q){
    /*
      Eingabe-Erkennung — 4 Modi:
      A) "26/1" oder "2026/1" oder "26-1" → Jahrgang + Endnummer
      B) "idefix 1" oder "1 idefix"       → Name + Nummer kombiniert
      C) Rein numerisch                   → Endnummer-Scoring
      D) Text                             → Freitext
    */

    // ── Modus A: Jahrgang/Endnummer z.B. "26/1", "2026-1", "25/455" ──
    const modeA = q.match(/^(\d{2,4})[\/\-\s](\d{1,6})$/) || q.match(/^(\d{1,6})[\/\-\s](\d{2,4})$/);
    // ── Modus B: Gemischt z.B. "idefix 1", "chef 333" ──
    const modeB_numWord = q.match(/^(\d{1,6})\s+(.+)$/) || q.match(/^(.+)\s+(\d{1,6})$/);

    if(modeA){
      // Beide Teile extrahieren — prüfe welcher der Jahrgang ist (2- oder 4-stellig ≥ 19xx/20xx)
      let part1 = modeA[1], part2 = modeA[2];
      let yr, num;
      const isYear = v => {
        const n=parseInt(v);
        if(v.length===4 && n>=1900 && n<=2100) return true;
        if(v.length===2 && n>=0 && n<=99) return true;
        return false;
      };
      if(isYear(part1) && !isYear(part2)){ yr=part1; num=part2; }
      else if(isYear(part2) && !isYear(part1)){ yr=part2; num=part1; }
      else { yr=part1; num=part2; }
      // Jahrgang normalisieren (2-stellig → 20xx)
      const yrFull = yr.length===2 ? '20'+yr : yr;
      arr = arr.filter(p=>{
        if(String(p.date_year) !== yrFull) return false;
        const segs = (p.ringnumber||p.ringnumberold||'').split(/[^\d]+/).filter(s=>s);
        const last = segs[segs.length-1]||'';
        const lastS = last.replace(/^0+/,'')||'0';
        const numS  = num.replace(/^0+/,'')||'0';
        const rnNoSp = (p.ringnumber||p.ringnumberold||'').replace(/\s+/g,'');
        const idxN = rnNoSp.lastIndexOf(num);
        const endsExact = rnNoSp.endsWith(num) && (idxN===0||!/\d/.test(rnNoSp[idxN-1]));
        return last===num || lastS===numS || endsExact;
      });
      arr.sort((a,b)=>(ring(a)||'').localeCompare(ring(b)));

    } else {
      const isNumeric = /^\d{1,}$/.test(q);

      if(isNumeric){
        // ── Modus C: Endnummer-Suche mit Relevanz-Scoring ──
        function getNumSegs(rn){
          return (rn||'').trim().split(/[^\d]+/).filter(s=>s.length>0);
        }
        const scored=[];
        S.pigeons.forEach(p=>{
          const rn       = (p.ringnumber||p.ringnumberold||'').trim();
          const rnNoSpace= rn.replace(/\s+/g,'');
          const rnC      = rn.replace(/[^\d]/g,'');
          const numSegs  = getNumSegs(rn);
          const lastSeg  = numSegs[numSegs.length-1]||'';
          const idxQ     = rnNoSpace.lastIndexOf(q);
          const endsExact= rnNoSpace.endsWith(q) && (idxQ===0||!/\d/.test(rnNoSpace[idxQ-1]));
          const lastExact= lastSeg===q;
          const nameWords= (p.name||'').trim().split(/\s+/);
          const nameExact= nameWords.some(w=>w===q);
          const nameCont = (p.name||'').includes(q);
          const rnCont   = rnC.includes(q);

          if(lastExact || endsExact){
            scored.push({p,score:1});
          } else if(numSegs.some(s=>s===q)){
            scored.push({p,score:2});
          } else if(nameExact){
            scored.push({p,score:3});
          } else if(rnCont){
            scored.push({p,score:4});
          } else if(nameCont){
            scored.push({p,score:5});
          }
        });
        scored.sort((a,b)=>{
          if(a.score!==b.score) return a.score-b.score;
          // Gleicher Score: neueste zuerst
          const yd=(b.p.date_year||0)-(a.p.date_year||0);
          if(yd!==0) return yd;
          return (ring(a.p)||'').localeCompare(ring(b.p));
        });
        arr=scored.map(x=>x.p);

      } else {
        // ── Modus D: Freitext + optionaler Name+Nummer-Kombi ──
        // Prüfe ob ein Zahlenanteil + Textanteil (z.B. "idefix 1")
        const mixMatch = q.match(/^(.+?)\s+(\d{1,6})$/) || q.match(/^(\d{1,6})\s+(.+)$/);
        if(mixMatch){
          const numPart  = (mixMatch[1].match(/^\d+$/) ? mixMatch[1] : mixMatch[2]);
          const textPart = (mixMatch[1].match(/^\d+$/) ? mixMatch[2] : mixMatch[1]).toLowerCase();
          const scored=[];
          S.pigeons.forEach(p=>{
            const nameMatch = (p.name||'').toLowerCase().includes(textPart);
            const segs = (p.ringnumber||p.ringnumberold||'').split(/[^\d]+/).filter(s=>s);
            const last = segs[segs.length-1]||'';
            const rnNoSp = (p.ringnumber||p.ringnumberold||'').replace(/\s+/g,'');
            const idxN = rnNoSp.lastIndexOf(numPart);
            const endsExact = rnNoSp.endsWith(numPart)&&(idxN===0||!/\d/.test(rnNoSp[idxN-1]));
            const numMatch = last===numPart||endsExact||segs.some(s=>s===numPart);
            if(nameMatch && numMatch) scored.push({p,score:1});
            else if(nameMatch)        scored.push({p,score:2});
            else if(numMatch)         scored.push({p,score:3});
          });
          scored.sort((a,b)=>{
            if(a.score!==b.score) return a.score-b.score;
            return (b.p.date_year||0)-(a.p.date_year||0);
          });
          arr=scored.map(x=>x.p);
        } else {
          arr=arr.filter(p=>(p.ringnumber||'').toLowerCase().includes(ql)
            ||(p.ringnumberold||'').toLowerCase().includes(ql)
            ||(p.name||'').toLowerCase().includes(ql)
            ||(p.color||'').toLowerCase().includes(ql)
            ||(p.strain||'').toLowerCase().includes(ql)
            ||(p.breeder||'').toLowerCase().includes(ql)
            ||(p.owner||'').toLowerCase().includes(ql)
            ||(p.ringnumberfather||'').toLowerCase().includes(ql)
            ||(p.ringnumbermother||'').toLowerCase().includes(ql));
        }
      }
    }
  }

  if(S.sexFilter!=='all') arr=arr.filter(p=>sex_(p)===S.sexFilter);
  if(S.yearFilter!=='all') arr=arr.filter(p=>String(p.date_year)===S.yearFilter);
  if(S.inStockFilter==='yes') arr=arr.filter(p=>p.instock);
  if(S.inStockFilter==='no') arr=arr.filter(p=>!p.instock);
  if(S.colorFilter!=='all') arr=arr.filter(p=>colorMatchesKeyword(p.color,S.colorFilter));
  if(S.stateFilter!=='all') arr=arr.filter(p=>pigeonStateName(p)===S.stateFilter);
  if(S.standortFilter!=='all') arr=arr.filter(p=>(p.standort||'')===S.standortFilter);
  if(S.typeFilter!=='all') arr=arr.filter(p=>p.pigeontype===S.typeFilter);

  // Fallback-Sortierung nur wenn KEIN Scoring aktiv war
  if(!q || !((/^\d/.test(q)) || q.match(/^(\d{2,4})[\/\-\s](\d{1,6})$/))){
    arr.sort((a,b)=>{
      const col = COLUMN_BY_KEY[S.sortCol] || COLUMN_DEFS.find(c=>c.sortKey===S.sortCol);
      if(!col) return 0;
      const av=(col.sortVal||col.val)(a), bv=(col.sortVal||col.val)(b);
      let cmp;
      if(Array.isArray(av) && Array.isArray(bv)) cmp = compareSortParts(av,bv);
      else if(av<bv) cmp=-1;
      else if(av>bv) cmp=1;
      else cmp=0;
      return cmp*S.sortDir;
    });
  }

  S.filtered=arr;
  const totalPages=Math.max(1,Math.ceil(S.filtered.length/S.pageSize));
  if(S.page>totalPages-1) S.page=0;
  if(S.tab==='tauben'&&!S.selected){
    if(document.getElementById('table-wrap')) renderTableOnly();
    else render();
  } else { render(); }
}

function sortBy(col){ S.sortCol===col ? S.sortDir*=-1 : (S.sortCol=col,S.sortDir=1); applyFilter(); }

// ── Navigation ─────────────────────────────────────────────────
// Die drei Hauptreiter bündeln thematisch zusammengehörige Unteransichten:
// 'tauben'  = Tauben-Übersicht + alles rund um eine ausgewählte Taube
//             (Details, Stammbaum, Nachkommen, Paarungscheck)
// 'add'     = alle Wege, neue Tauben ins System zu bringen (manuell/Scan/Import)
// 'reisen'  = alles rund um Flüge & Auswertungen (Reisen, Bestenliste, Züchter, Statistik)
const TAB_GROUP = {
  tauben:'tauben', stammbaum:'tauben', paarung:'tauben', nachkommen:'tauben',
  neu:'add', scan:'add', import:'add',
  reisen:'reisen', bestenliste:'reisen', zuechter:'reisen', statistik:'reisen'
};
function setActiveNav(tab){
  const grp = TAB_GROUP[tab] || tab;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.group===grp));
}
function showTab(t){
  S.tab=t; S.selected=null;
  setActiveNav(t);
  render();
}
function selectPigeon(id){ S.selected=findById(id); S.pigeonTripYear=null; S.tab='tauben'; setActiveNav('tauben'); render(); window.scrollTo(0,0); }
function showPedigree(id){ S.selectedPed=id; S.tab='stammbaum'; setActiveNav('stammbaum'); render(); window.scrollTo(0,0); }

// Subnav: Kontext-Reiter für eine ausgewählte Taube — Details/Stammbaum/Nachkommen/
// Paarungscheck sind bewusst KEINE eigenen Hauptreiter mehr, sondern nur erreichbar,
// nachdem man in der Tauben-Übersicht eine Taube ausgewählt hat.
function renderTaubenSubnav(active, p){
  const back = `<button class="subnav-btn" onclick="S.selected=null;S.tab='tauben';setActiveNav('tauben');render();window.scrollTo(0,0)">← Übersicht</button>`;
  if(!p) return `<div class="subnav">${back}</div>`;
  const btn=(key,label,icon,fn)=>`<button class="subnav-btn ${active===key?'active':''}" onclick="${fn}">${icon} ${label}</button>`;
  return `<div class="subnav">${back}
    ${btn('detail','Details','📋',`selectPigeon('${p.pigeonid}')`)}
    ${btn('stammbaum','Stammbaum','🌳',`showPedigree('${p.pigeonid}')`)}
    ${btn('nachkommen','Nachkommen','🐣',`showNachkommen('${p.pigeonid}')`)}
    ${btn('paarung','Paarungscheck','💑',`setPaarungVogel('${p.pigeonid}')`)}
  </div>`;
}
// Subnav: Reisen-Themenkreis (Flüge, Bestenliste, Züchter, Statistik)
function renderReisenSubnav(active){
  const btn=(key,label,icon)=>`<button class="subnav-btn ${active===key?'active':''}" onclick="showTab('${key}')">${icon} ${label}</button>`;
  return `<div class="subnav">
    ${btn('reisen','Reisen','🏁')}${btn('bestenliste','Bestenliste','🏆')}${btn('zuechter','Züchter','🧑‍🌾')}${btn('statistik','Statistik','📊')}
  </div>`;
}
// Subnav: Wege, eine neue Taube anzulegen (manuell, per Scan, per Datei-Import)
function renderAddSubnav(active){
  const btn=(key,label,icon)=>`<button class="subnav-btn ${active===key?'active':''}" onclick="showTab('${key}')">${icon} ${label}</button>`;
  return `<div class="subnav">
    ${btn('neu','Manuell','✏️')}${btn('scan','Scan','📷')}${btn('import','Import','📥')}
  </div>`;
}

// ── RENDER ─────────────────────────────────────────────────────
function render(){
  const m=document.getElementById('main');
  if(S.loading){ m.innerHTML='<div class="loading"><div class="spinner"></div>Lade Tauben…</div>'; return; }
  if(S.tab==='tauben')     m.innerHTML=S.selected ? renderTaubenSubnav('detail',S.selected)+renderDetail(S.selected) : renderList();
  else if(S.tab==='stammbaum')  m.innerHTML=S.selectedPed ? renderTaubenSubnav('stammbaum',findById(S.selectedPed))+renderPedigree(S.selectedPed) : (showTab('tauben'),'');
  else if(S.tab==='nachkommen') m.innerHTML=S.selectedNach ? renderTaubenSubnav('nachkommen',findById(S.selectedNach))+renderNachkommen(S.selectedNach) : renderTaubenSubnav('nachkommen',null)+renderNachSearch();

// Reihenfolge wichtig: spezifischere Muster (Scheck, Gehämmert) vor der
// allgemeinen 'blau'-Regel prüfen, damit z.B. "Blau Gehämmert" korrekt matched.
const PIGEON_COLOR_THUMB_MAP = [
  [/fahl.*scheck|scheck.*fahl/i, 'fahl'],
  [/scheck|gescheckt|getigert/i, 'blau-scheck'],
  [/gehämmert|hammerschlag/i,    'gehaemmert'],
  [/fahl/i,                      'fahl'],
  [/schimmel/i,                  'schimmel'],
  [/wei[ßs]/i,                   'schimmel'],
  [/rot|rost/i,                  'rot'],
  [/blau/i,                      'blau'],
];
function pigeonColorThumbKey(colorName){
  const c=(colorName||'').trim();
  for(const [re,key] of PIGEON_COLOR_THUMB_MAP) if(re.test(c)) return key;
  return 'leer';
}
// Liefert die Bildquelle für die Mini-Vorschau einer Taube: eigenes Foto (falls
// hochgeladen) hat Vorrang, sonst das Farbfoto passend zum Farbschlag, sonst 'leer'.
function pigeonThumbSrc(p){
  if(p && p.photo) return p.photo;
  return PIGEON_COLOR_THUMBS[pigeonColorThumbKey(p&&p.color)];
}

// ── Karten-Ansicht (mobil) ───────────────────────────────────────
// Zeigt dieselben aktiven Spalten (S.columns) wie die Tabelle, nur als
// beschriftete Zeilen statt Tabellenspalten — dadurch auf schmalen Bildschirmen
// ohne horizontales Scrollen lesbar, ohne dass die Spaltenauswahl verloren geht.
function buildCardsHTML(page){
  const cols = activeColumns().filter(c=>c.key!=='ringnumber' && c.key!=='name');
  return `<div class="pigeon-cards">${page.map(p=>{
    const sel = S.bulkMode && S.bulkSelected.has(p.pigeonid);
    const cardClick = S.bulkMode ? `toggleBulkRow('${p.pigeonid}')` : `selectPigeon('${p.pigeonid}')`;
    const bulkCb = S.bulkMode ? `<input type="checkbox" ${sel?'checked':''} onclick="event.stopPropagation()" onchange="toggleBulkRow('${p.pigeonid}')">` : '';
    const rows = cols.map(c=>`<div class="pc-row"><span class="pc-label">${escH(c.label)}</span><span class="pc-val">${(c.cell||(x=>escH(c.val(x))))(p)}</span></div>`).join('');
    return `<div class="pigeon-card ${sel?'bulk-row-selected':''}" onclick="${cardClick}">
      <div class="pc-head">
        <div>
          <div class="pc-ring">${escH(ring(p))}</div>
          ${p.name?`<div class="pc-name">„${escH(p.name)}"</div>`:''}
        </div>
        ${bulkCb?`<div class="pc-check">${bulkCb}</div>`:''}
      </div>
      <div class="pc-body">
        <div class="pc-icon"><img src="${pigeonThumbSrc(p)}" alt="" loading="lazy" onerror="this.onerror=null;this.src=PIGEON_COLOR_THUMBS.leer"></div>
        <div class="pc-fields">${rows}</div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function buildTableHTML(page, si){
  const cols = activeColumns();
  if(cols.some(c=>c.key==='reiseleistung'||c.key==='top10')){
    const missing=page.map(p=>p.pigeonid).filter(id=>id && !PT_CACHE[id]);
    if(missing.length){
      loadPigeonTripsBatch(missing).then(()=>{ if(S.tab==='tauben' && !S.selected) renderTableOnly(); });
    }
  }
  const allOnPageSelected = S.bulkMode && page.length>0 && page.every(p=>S.bulkSelected.has(p.pigeonid));
  const headCb = S.bulkMode ? `<th class="bulk-th"><input type="checkbox" id="bulk-select-all" ${allOnPageSelected?'checked':''} onclick="event.stopPropagation()" onchange="toggleBulkPage(this.checked)"></th>` : '';
  return buildCardsHTML(page) + `<table>
      <thead><tr>
        ${headCb}
        ${cols.map(c=>c.sortKey
          ? `<th onclick="sortBy('${c.sortKey}')">${escH(c.label)}${si(c.sortKey)}</th>`
          : `<th>${escH(c.label)}</th>`).join('')}
      </tr></thead>
      <tbody>${page.map(p=>{
        const sel = S.bulkMode && S.bulkSelected.has(p.pigeonid);
        const rowClick = S.bulkMode ? `toggleBulkRow('${p.pigeonid}')` : `selectPigeon('${p.pigeonid}')`;
        const rowCb = S.bulkMode ? `<td class="bulk-td"><input type="checkbox" ${sel?'checked':''} onclick="event.stopPropagation()" onchange="toggleBulkRow('${p.pigeonid}')"></td>` : '';
        return `<tr onclick="${rowClick}" class="${sel?'bulk-row-selected':''}">
          ${rowCb}
          ${cols.map(c=>`<td>${(c.cell||(x=>escH(c.val(x))))(p)}</td>`).join('')}
        </tr>`;
      }).join('')}
      </tbody>
    </table>`;
}

function buildPagination(totalPages){
  return `<div class="pagination">
      <button onclick="S.page=0;renderTableOnly()" ${S.page===0?'disabled':''}>«</button>
      <button onclick="S.page--;renderTableOnly()" ${S.page===0?'disabled':''}>‹</button>
      <span>Seite ${S.page+1} / ${totalPages}</span>
      <button onclick="S.page++;renderTableOnly()" ${S.page>=totalPages-1?'disabled':''}>›</button>
      <button onclick="S.page=totalPages-1;renderTableOnly()" ${S.page>=totalPages-1?'disabled':''}>»</button>
    </div>`;
}

function renderList(){
  const years=[...new Set(S.pigeons.map(p=>p.date_year).filter(Boolean))].sort((a,b)=>b-a);
  const si=c=>c===S.sortCol?(S.sortDir>0?' ↑':' ↓'):'';
  const start=S.page*S.pageSize, end=start+S.pageSize;
  const page=S.filtered.slice(start,end);
  const totalPages=Math.ceil(S.filtered.length/S.pageSize)||1;
  const activeFilterCount=[S.sexFilter,S.yearFilter,S.inStockFilter,S.colorFilter,S.stateFilter,S.typeFilter,S.standortFilter].filter(v=>v&&v!=='all').length;
  return `
    ${S.error?`<div class="error-box">⚠️ ${escH(S.error)}</div>`:''}
    <div class="search-row">
      <div class="search-wrap"><span class="search-icon">🔍</span>
        <input id="tauben-search" type="text" placeholder="Endnr. (1), Jahrg+Nr (26/1), Name+Nr (idefix 1), Text…" title="26/1 = Jahrgang 2026 Endnummer 1 | idefix 1 = Name + Nummer | 455 = Endnummer" value="${escH(S.search)}" oninput="S.search=this.value;toggleSearchClear('tauben-search-clear',this.value);applyFilter()">
        <button type="button" id="tauben-search-clear" class="search-clear" style="display:${S.search?'flex':'none'}" onclick="clearTaubenSearch()" title="Suche löschen" aria-label="Suche löschen">✕</button>
      </div>
      <span id="count-label" class="count-label">${S.filtered.length.toLocaleString('de')} / ${S.pigeons.length.toLocaleString('de')}</span>
    </div>
    <details class="filter-panel" id="filter-panel" ${S.filtersOpen?'open':''} ontoggle="S.filtersOpen=this.open">
      <summary>⚙️ Filter &amp; Werkzeuge${activeFilterCount?` <span class="filter-badge">${activeFilterCount}</span>`:''}</summary>
      <div class="filter-panel-body">
        <div class="toolbar">
          <select id="sex-filter" onchange="S.sexFilter=this.value;applyFilter()">

// ── Eigenes Foto pro Taube hochladen ────────────────────────────
// Verkleinert das Bild clientseitig (max. Kantenlänge, JPEG-Qualität) und
// speichert es als Data-URL in der Spalte "photo" der Tabelle "pigeons".
// Hinweis: Dafür muss in Supabase eine Text-Spalte "photo" auf der Tabelle
// "pigeons" existieren (z.B. type "text").
function compressImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Datei konnte nicht gelesen werden'));
    reader.onload = e=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('Bild konnte nicht geladen werden'));
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
        else    { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// Öffnet ein Foto vergrößert in einer Lightbox (Klick zum Schließen).
function openPhotoLightbox(src){
  if(!src) return;
  const overlay=document.createElement('div');
  overlay.className='lightbox-overlay';
  overlay.onclick=()=>overlay.remove();
  const img=document.createElement('img');
  img.src=src;
  overlay.appendChild(img);
  document.body.appendChild(overlay);
}

async function uploadPigeonPhoto(id, file){
  if(!file) return;
  if(file.size>15*1024*1024){ alert('Datei zu groß (max. 15 MB).'); return; }
  const imgEl = document.getElementById('detail-photo-img');
  const prevSrc = imgEl ? imgEl.src : null;
  try{
    if(imgEl) imgEl.style.opacity='.4';
    const dataUrl = await compressImageFile(file, 480, .82);
    await apiPatch('pigeons', id, {photo: dataUrl});
    const p = findById(id);
    if(p) p.photo = dataUrl;
    if(imgEl){ imgEl.src=dataUrl; imgEl.style.opacity='1'; }
    if(document.getElementById('table-wrap')) renderTableOnly();
  }catch(err){
    if(imgEl){ imgEl.style.opacity='1'; if(prevSrc) imgEl.src=prevSrc; }
    alert('Foto konnte nicht gespeichert werden: '+err.message+'\n\nHinweis: In Supabase muss die Tabelle "pigeons" eine Text-Spalte "photo" besitzen.');
  }
}

  const p = findById(id);
  if(!p) return;
  const label = (p.ringnumber||p.pigeonid) + (p.name?' · '+p.name:'');
  if(!confirm(`Taube "${label}" wirklich löschen?\n\nSie wird aus der Liste entfernt (Soft-Delete). Verknüpfungen als Vater/Mutter anderer Tauben bleiben über die Ringnummer-Textfelder erhalten, falls vorhanden.`)) return;
  try {
    await apiPatch('pigeons', id, {deleted:true, instock:false});
    S.pigeons = S.pigeons.filter(x=>x.pigeonid!==id);
    if(S.selected && S.selected.pigeonid===id) S.selected=null;
    applyFilter();
    render();
  } catch(e){
    alert('Fehler beim Löschen: '+e.message);
  }
}

function cancelEdit(id){
  const p=findById(id);
  if(p) delete p._editMode;
  render();
}

async function saveEdit(id){
  const msg=document.getElementById('edit-msg');
  const g=id=>document.getElementById(id);
  const val=id=>{const el=g(id);return el?el.value.trim():'';};
  const row={
    ringnumber:     fmtRingnumber(val('e_ringnumber')) || val('e_ringnumber'),
    ringnumberold:  fmtRingnumber(val('e_ringnumberold')) || val('e_ringnumberold'),
    name:           val('e_name'),
    date_year:      val('e_date_year')?Number(val('e_date_year')):null,
    gender:         val('e_gender')||null,
    color:          val('e_color'),
    race:           val('e_race'),
    strain:         val('e_strain'),
    breeder:        val('e_breeder'),
    owner:          val('e_owner'),
    standort:       val('e_standort'),
    countrycode:    normCountryCode(val('e_countrycode')),
    associationno:  val('e_associationno'),
    birthday:       val('e_birthday')||null,
    died:           val('e_died')||null,
    bought:         val('e_bought')||null,
    sold:           val('e_sold')||null,
    instock:        val('e_instock')==='true',
    pigeontype:     (()=>{ const el=document.getElementById('e_pigeontype'); return el&&el.value?el.value:null; })(),
    pigeonstateid:  (()=>{ const el=document.getElementById('e_pigeonstateid'); return el&&el.value?el.value:null; })(),
    info:           val('e_info'),
    internalinfo:   val('e_internalinfo'),
    fatherid:       g('e_father_id')&&g('e_father_id').value ? g('e_father_id').value : null,
    motherid:       g('e_mother_id')&&g('e_mother_id').value ? g('e_mother_id').value : null,
  };
  // Leere Strings als null
  Object.keys(row).forEach(k=>{ if(row[k]==='') row[k]=null; });
  if(msg){ msg.style.display='block'; msg.style.background='var(--bg3)'; msg.style.color='var(--text2)'; msg.textContent='Speichern…'; }
  try{
    await apiPatch('pigeons', id, row);
    // Lokalen State aktualisieren
    const idx=S.pigeons.findIndex(p=>p.pigeonid===id);
    if(idx!==-1){ S.pigeons[idx]=Object.assign({},S.pigeons[idx],row,{pigeonid:id}); }
    S.selected=S.pigeons.find(p=>p.pigeonid===id)||null;
    if(S.selected) delete S.selected._editMode;
    applyFilter();
    render();
  } catch(err){
    if(msg){ msg.style.background='#2a0f0f'; msg.style.color='#e07070'; msg.textContent='❌ Fehler: '+err.message; }
  }
}

// ── DRUCK / PDF ────────────────────────────────────────────────
function printPedigree(pid, gens){
  try{
    gens = parseInt(gens)||4;
    const root = findById(pid);
    if(!root){ alert('Taube nicht gefunden'); return; }

    const _esc    = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const _ring   = p => p?(p.ringnumber||p.ringnumberold||'—'):'—';
    const _sex    = p => { if(!p) return '?'; const g=(p.gender||p.sex||'').toUpperCase(); return g==='M'||g==='MALE'||g==='COCK'?'M':g==='F'||g==='FEMALE'||g==='HEN'?'F':'?'; };
    const _father = p => { if(!p) return null; if(p.fatherid) return S.pigeons.find(x=>x.pigeonid===p.fatherid)||null; if(p.ringnumberfather) return S.pigeons.find(x=>x.ringnumber===p.ringnumberfather)||null; return null; };
    const _mother = p => { if(!p) return null; if(p.motherid) return S.pigeons.find(x=>x.pigeonid===p.motherid)||null; if(p.ringnumbermother) return S.pigeons.find(x=>x.ringnumber===p.ringnumbermother)||null; return null; };

    // Baum aufbauen
    function buildTree(p, gen, pos, arr){
      if(!arr[gen]) arr[gen]=[];
      arr[gen][pos]=p||null;
      if(gen>=gens-1) return;
      buildTree(_father(p), gen+1, pos*2,   arr);
      buildTree(_mother(p), gen+1, pos*2+1, arr);
    }
    const tree=[];
    buildTree(root, 0, 0, tree);

    const rows   = Math.pow(2, gens-1);   // 8 (4gen) oder 16 (5gen)
    const rowHmm = Math.floor(272/rows);  // volle Seitenhöhe nutzen
    // Spaltenbreiten: kein Header-Overhead mehr → volle Breite für Daten
    // Verbinder: 5mm, Rest gleichmäßig auf Datenspalten
    const totalConn = (gens-1)*5;
    const datWmm    = Math.floor((190 - totalConn) / gens);
    const conWmm    = 5;

    // Box-HTML — Infomenge abhängig von Generation und verfügbarem Platz
    function box(p, gen){
      if(!p) return `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:7pt">–</div>`;
      const sx   = _sex(p);
      const col  = sx==='M'?'#3a7bd5':sx==='F'?'#8e44ad':'#888';
      const tags = [p.color, p.strain, p.breeder?'Z: '+p.breeder:null].filter(Boolean);
      const info = (p.info||'').trim();
      const rn   = _ring(p);

      // Schriftgrößen je nach Generation
      const szRing = gen===0?'8pt':gen===1?'7.5pt':gen===2?'7pt':'6.5pt';
      const szName = gen===0?'9pt':gen===1?'8pt':gen===2?'7.5pt':'6.5pt';
      const szTag  = gen===0?'7pt':gen===1?'6.5pt':'6pt';
      const szInfo = gen===0?'7.5pt':gen===1?'7pt':gen===2?'6.5pt':'6pt';
      const showTags = gen<=3;
      const showInfo = gen<=2 && info;  // Info nur bei Proband, Eltern, Großeltern

      // Info-Feld bekommt flex:1 → füllt restliche Box-Höhe vollständig aus
      // kein max-height, kein Zeichenlimit → voller Text

// ── SCAN-MODUL v3 ──────────────────────────────────────────────
const EDGE_SCAN_URL = 'https://vwdqqdmtjztduzqrdbpc.supabase.co/functions/v1/scan-pedigree';

const PED_KEYS = ['fff','ffm','fmf','fmm','mff','mfm','mmf','mmm','ff','fm','mf','mm','father','mother','proband'];
const PED_LABEL = {
  proband:'Proband', father:'Vater', mother:'Mutter',
  ff:'Großvater v.', fm:'Großmutter v.', mf:'Großvater m.', mm:'Großmutter m.',
  fff:'Urgroßvater v.v.', ffm:'Urgroßmutter v.v.', fmf:'Urgroßvater v.m.', fmm:'Urgroßmutter v.m.',
  mff:'Urgroßvater m.v.', mfm:'Urgroßmutter m.v.', mmf:'Urgroßvater m.m.', mmm:'Urgroßmutter m.m.'
};
const PARENT_MAP = {
  proband:{f:'father',m:'mother'}, father:{f:'ff',m:'fm'}, mother:{f:'mf',m:'mm'},
  ff:{f:'fff',m:'ffm'}, fm:{f:'fmf',m:'fmm'}, mf:{f:'mff',m:'mfm'}, mm:{f:'mmf',m:'mmm'}
};

// Jede Position hat ein festes Geschlecht: Schlüssel auf "f" = männlich, auf "m" = weiblich
function expectedGenderOf(key){
  if(key==='father') return 'M';
  if(key==='mother') return 'F';
  if(key==='proband') return null;
  return key.endsWith('f') ? 'M' : 'F';
}
// Geschwister-Slot mit vertauschtem Geschlecht (gleiche Eltern-Linie, andere Seite)
function siblingKeyOf(key){
  if(key==='father') return 'mother';
  if(key==='mother') return 'father';
  if(key.length<2) return null;
  return key.slice(0,-1) + (key.endsWith('f') ? 'm' : 'f');
}

// Alle Vorfahren-Positionen eines Schlüssels (Elternteil, Großeltern, …) ermitteln.
// Wird für die Plausibilitätsprüfung gebraucht: eine Taube darf nicht ihr eigener
// Vorfahre sein (z.B. Mutter == Großmutter wäre biologisch unmöglich).
function ancestorKeysOf(key){
  const out = [];
  let queue = [key];
  while(queue.length){
    const k = queue.shift();
    const par = PARENT_MAP[k];
    if(!par) continue;
    [par.f, par.m].forEach(pk => { out.push(pk); queue.push(pk); });
  }
  return out;
}

// Plausibilitätsprüfung nach dem Scan (und generell vor dem Speichern eines
// Stammbaums): identische Ringnummern an biologisch unmöglichen Positionen
// erkennen (z.B. Mutter == Großmutter, Vater == Vater der Mutter, Vater == Mutter),
// statt sie unbemerkt durchzuspeichern. Verdächtige aber theoretisch mögliche
// Fälle (z.B. Inzucht: gleicher Großvater auf beiden Seiten) werden nur als
// Warnung markiert, nicht blockiert — die Entscheidung bleibt beim Nutzer.
function checkScanPlausibility(){
  const keysWithRing = PED_KEYS.filter(k => SCAN.pigeons[k]?.ringnumber);
  keysWithRing.forEach(k => {
    delete SCAN.pigeons[k]._plausibilityError;
    delete SCAN.pigeons[k]._plausibilityWarn;
  });

  keysWithRing.forEach(k => {
    const ring1 = normRing(SCAN.pigeons[k].ringnumber);
    if(!ring1) return;
    const ancestors = new Set(ancestorKeysOf(k));

    keysWithRing.forEach(other => {
      if(other===k) return;
      const ring2 = normRing(SCAN.pigeons[other].ringnumber);
      if(ring1!==ring2) return;

      if(ancestors.has(other) || new Set(ancestorKeysOf(other)).has(k)){
        // k und other stehen in Abstammungslinie zueinander -> unmöglich
        SCAN.pigeons[k]._plausibilityError =
          `Identisch mit "${PED_LABEL[other]}" (${SCAN.pigeons[other].ringnumber}) — das ist als eigener Vorfahre biologisch unmöglich.`;
      } else if(k==='father' && other==='mother' || k==='mother' && other==='father'){
        SCAN.pigeons[k]._plausibilityError =
          `Vater und Mutter haben dieselbe Ringnummer (${SCAN.pigeons[other].ringnumber}) — bitte prüfen.`;
      } else if(!SCAN.pigeons[k]._plausibilityError){
        SCAN.pigeons[k]._plausibilityWarn =
          `Gleiche Ringnummer wie "${PED_LABEL[other]}" — nur plausibel bei starker Inzucht, sonst bitte im Original prüfen.`;
      }
    });

    // Fehlerhafte Positionen sicherheitshalber vom automatischen Speichern ausschließen,
    // bis der Nutzer die Angabe bestätigt/korrigiert hat.
    if(SCAN.pigeons[k]._plausibilityError) SCAN.actions[k] = 'skip';
  });
}

// Nach dem Scan: prüfen ob das erkannte Geschlecht zur festen Position passt.
// Falls genau das Geschwister-Paar vertauscht wurde (z.B. Großvater/Großmutter
// im Bild verwechselt), automatisch zurücktauschen. Sonst klar markieren,
// damit der Nutzer es im Ergebnis sofort sieht statt eine falsche Taube zu speichern.
function fixGenderSlotMismatches(){
  const checked = new Set();
  PED_KEYS.forEach(k => {
    if(k==='proband' || checked.has(k)) return;
    const p = SCAN.pigeons[k];
    const expected = expectedGenderOf(k);
    if(!p || !p.gender || !expected || p.gender===expected){ return; }

    const sibKey = siblingKeyOf(k);
    const sib = sibKey ? SCAN.pigeons[sibKey] : null;
    const sibExpected = sibKey ? expectedGenderOf(sibKey) : null;

    if(sib && sib.gender && sibExpected && sib.gender!==sibExpected && sib.gender===expected && p.gender===sibExpected){
      // Klassischer Vertauscher: beide Positionen haben jeweils das Geschlecht der anderen → zurücktauschen
      SCAN.pigeons[k] = sib;
      SCAN.pigeons[sibKey] = p;
      checked.add(sibKey);
    } else {
      // Kein eindeutiger Tausch möglich → klar markieren, NICHT automatisch raten
      p._genderMismatch = true;
    }
    checked.add(k);
  });
}

let SCAN_PROGRESS_TIMER = null;

  stopScanProgress();

function stopScanProgress(finalText){

// Ringnummer normalisieren für DB-Vergleich
function normRing(s){
  s = String(s||'').trim();
  if(!s) return '';
  // Pro Segment (durch Leerzeichen/Bindestrich/Punkt getrennt) führende Nullen
  // bei rein numerischen Teilen entfernen, damit "004" und "4" als gleich gelten.
  return s.split(/[\s\-\.]+/).filter(Boolean).map(function(seg){
    return /^\d+$/.test(seg) ? seg.replace(/^0+(?=\d)/,'') : seg.toLowerCase();
  }).join('');
}

// Taube in DB suchen (normalisiert)
function findInDb(ringnumber){
  if(!ringnumber) return null;
  const n = normRing(ringnumber);
  return S.pigeons.find(x => normRing(x.ringnumber)===n || normRing(x.ringnumberold||'')===n) || null;
}

function updateScanField(k, field, value){
  if(!SCAN.pigeons[k]) return;
  SCAN.pigeons[k][field] = value;
  if(field==='ringnumber'){
    // Bei geänderter Ringnummer DB-Treffer neu bestimmen
    SCAN.matches[k] = findInDb(value);
    if(SCAN.actions[k]!=='skip') SCAN.actions[k] = SCAN.matches[k] ? 'update' : 'new';
    // Plausibilität neu prüfen — eine Korrektur kann einen Fehler beheben oder neu erzeugen
    checkScanPlausibility();
  }
  if(field==='gender'){
    // Manuelle Korrektur entkräftet die Mismatch-Warnung
    delete SCAN.pigeons[k]._genderMismatch;
  }
}

function handleScanFile(file){
  if(!file) return;
  if(file.size>10*1024*1024){ alert('Datei zu groß (max. 10 MB)'); return; }
  SCAN.imageMediaType = file.type||'image/jpeg';
  const reader = new FileReader();
  reader.onload = e => {
    SCAN.imageData    = e.target.result.split(',')[1];
    SCAN.imagePreview = e.target.result;
    SCAN.step = 'analyzing';
    render();
    runScanAI();
  };
  reader.readAsDataURL(file);
}

function normalizePigeonData(d){
  return {
    ringnumber:       d.ringnumber||d.ring||null,
    name:             d.name||null,
    date_year:        d.date_year||d.year||d.vintage||d.jahrgang||null,
    gender:           d.gender||d.sex||d.geschlecht||null,
    color:            d.color||d.colour||d.farbe||null,
    race:             d.race||d.rasse||null,
    strain:           d.strain||d.linie||d.stamm||null,
    breeder:          d.breeder||d.züchter||d.zuchter||null,
    owner:            d.owner||d.besitzer||null,
    countrycode:      d.countrycode||d.country||d.land||null,
    associationno:    d.associationno||d.verband||null,
    ringnumberfather: d.ringnumberfather||d.father_ring||d.father?.ringnumber||null,
    ringnumbermother: d.ringnumbermother||d.mother_ring||d.mother?.ringnumber||null,
    info:             d.info||d.notes||d.notizen||d._raw_info||null,
  };
}

async function runScanAI(){
  startScanProgress();
  try {
    const resp = await fetch(EDGE_SCAN_URL, {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+(AUTH.token||SUPA_KEY),
        'apikey':SUPA_KEY
      },
      body: JSON.stringify({imageData:SCAN.imageData, mediaType:SCAN.imageMediaType})
    });
    const json = await resp.json();
    if(!resp.ok||!json.ok) throw new Error(json.error||`HTTP ${resp.status}`);

    const d = json.data||{};
    SCAN.rawResponse = d;

    // Format erkennen und parsen
    if(d.proband||d.father||d.mother||d.ff||d.fff){
      // Neues Multi-Gen-Format
      PED_KEYS.forEach(k => {
        if(d[k] && (d[k].ringnumber||d[k].ring)){
          SCAN.pigeons[k] = normalizePigeonData(d[k]);
        }
      });
    } else if(d.ringnumber||d.ring){
      // Altes flaches Format — Proband + Eltern aus ringnumberfather/mother
      SCAN.pigeons['proband'] = normalizePigeonData(d);
      if(d.ringnumberfather||d.father_ring)
        SCAN.pigeons['father'] = normalizePigeonData({ringnumber:d.ringnumberfather||d.father_ring});
      if(d.ringnumbermother||d.mother_ring)
        SCAN.pigeons['mother'] = normalizePigeonData({ringnumber:d.ringnumbermother||d.mother_ring});
    }

    stopScanProgress('Abgleich mit Datenbank…');
    fixGenderSlotMismatches();
    checkScanPlausibility();
    PED_KEYS.forEach(k => {
      const p = SCAN.pigeons[k];
      if(!p) return;
      if(p.ringnumber)       p.ringnumber       = fmtRingnumber(p.ringnumber) || p.ringnumber;
      if(p.ringnumberfather) p.ringnumberfather = fmtRingnumber(p.ringnumberfather) || p.ringnumberfather;
      if(p.ringnumbermother) p.ringnumbermother = fmtRingnumber(p.ringnumbermother) || p.ringnumbermother;
      if(p.countrycode)      p.countrycode      = normCountryCode(p.countrycode);
    });
    PED_KEYS.forEach(k => {
      const p = SCAN.pigeons[k];
      if(!p?.ringnumber) return;
      SCAN.matches[k] = findInDb(p.ringnumber);
      SCAN.actions[k] = p._genderMismatch ? 'skip' : (SCAN.matches[k] ? 'update' : 'new');
    });

    SCAN.step = 'result';
    render();
  } catch(err){
    stopScanProgress();
    SCAN.rawResponse = {error:err.message};
    SCAN.pigeons = {};
    SCAN.step = 'result';
    render();
  }
}

async function executeScanSave(){
  SCAN.step = 'saving'; render();
  const setS = t => { const el=document.getElementById('scan-save-status'); if(el) el.textContent=t; };

  // UUID-Map aufbauen (normalisiert)
  const uuidMap = {};
  S.pigeons.forEach(p => { if(p.ringnumber) uuidMap[normRing(p.ringnumber)]=p.pigeonid; });

  for(const k of PED_KEYS){
    const p   = SCAN.pigeons[k];
    const act = SCAN.actions[k];
    if(!p?.ringnumber || act==='skip') continue;

    setS(`Verarbeite ${PED_LABEL[k]}: ${p.ringnumber}…`);

    // Eltern-UUIDs aus Scan-Baum
    let fatherid=null, motherid=null;
    const par = PARENT_MAP[k];
    if(par){
      const fRing = SCAN.pigeons[par.f]?.ringnumber;
      const mRing = SCAN.pigeons[par.m]?.ringnumber;
      if(fRing) fatherid = uuidMap[normRing(fRing)]||null;
      if(mRing) motherid = uuidMap[normRing(mRing)]||null;
    }
    // Fallback: ringnumberfather/mother direkt suchen
    if(!fatherid && p.ringnumberfather) fatherid = uuidMap[normRing(p.ringnumberfather)]||null;
    if(!motherid && p.ringnumbermother) motherid = uuidMap[normRing(p.ringnumbermother)]||null;

    // Zeile aufbauen (nur gefüllte Felder)
    const row = {};
    const setIf = (key,val) => { if(val!==null&&val!==undefined&&val!=='') row[key]=val; };
    setIf('ringnumber',     fmtRingnumber(p.ringnumber) || p.ringnumber);
    setIf('name',           p.name);
    setIf('date_year',      p.date_year ? Number(p.date_year) : null);
    setIf('gender',         p.gender);
    setIf('color',          p.color);
    setIf('race',           p.race);
    setIf('strain',         p.strain);
    setIf('breeder',        p.breeder);
    setIf('owner',          p.owner);
    setIf('countrycode',    normCountryCode(p.countrycode));
    setIf('associationno',  p.associationno);
    setIf('ringnumberfather',fmtRingnumber(p.ringnumberfather) || p.ringnumberfather);
    setIf('ringnumbermother',fmtRingnumber(p.ringnumbermother) || p.ringnumbermother);
    setIf('info',            p.info);
    if(fatherid) row.fatherid = fatherid;
    if(motherid) row.motherid = motherid;

    try {
      if(act==='new'){
        const newId = crypto.randomUUID();
        row.pigeonid=newId; row.deleted=false; row.instock=true;
        await apiPost('pigeons', row);
        uuidMap[normRing(p.ringnumber)] = newId;
      } else if(act==='update'){
        const m = SCAN.matches[k];
        const updates={};
        Object.keys(row).forEach(f=>{
          if(row[f]!==undefined && String(row[f])!==String(m[f]||'')) updates[f]=row[f];
        });
        if(Object.keys(updates).length) await apiPatch('pigeons',m.pigeonid,updates);
        uuidMap[normRing(p.ringnumber)] = m.pigeonid;
      }
    } catch(e){ console.warn(`Fehler bei ${p.ringnumber}:`, e.message); }
  }

  setS('Lade Datenbank neu…');
  await loadData();
  const probandRing = SCAN.pigeons['proband']?.ringnumber;
  scanReset();
  if(probandRing){
    const found = S.pigeons.find(p=>normRing(p.ringnumber)===normRing(probandRing));
    if(found){ showPedigree(found.pigeonid); return; }
  }
  showTab('stammbaum');
}

async function submitNeu(){
  const rawRing = document.getElementById('neu_ring')?.value?.trim();
  if(!rawRing){ alert('Bitte eine Ringnummer eingeben.'); return; }
  if(NEU.dupMatch){ alert('Diese Ringnummer ist bereits vorhanden: '+ring(NEU.dupMatch)); return; }
  const parsed = parseRingComponents(rawRing);
  const g  = id => document.getElementById(id)?.value?.trim()||null;
  const gs = id => document.getElementById(id)?.value||null;
  const row = { pigeonid: crypto.randomUUID(), deleted:false };
  row.ringnumber    = parsed?.ringnumber || fmtRingnumber(rawRing) || rawRing;
  row.countrycode   = parsed?.countrycode   || null;
  row.associationno = parsed?.associationno || null;
  row.date_year     = parsed?.date_year     || null;
  if(g('neu_name'))          row.name          = g('neu_name');
  const gnd=gs('neu_gender'); if(gnd) row.gender=gnd;
  if(g('neu_color'))         row.color         = g('neu_color');
  if(g('neu_race'))          row.race          = g('neu_race');
  if(g('neu_strain'))        row.strain        = g('neu_strain');
  if(g('neu_breeder'))       row.breeder       = g('neu_breeder');
  if(g('neu_owner'))         row.owner         = g('neu_owner');
  if(g('neu_standort'))      row.standort      = g('neu_standort');
  if(g('neu_father_id'))     row.fatherid      = g('neu_father_id');
  if(g('neu_mother_id'))     row.motherid      = g('neu_mother_id');
  if(g('neu_info'))          row.info          = g('neu_info');
  if(g('neu_internalinfo'))  row.internalinfo  = g('neu_internalinfo');
  const stId=gs('neu_pigeonstateid'); if(stId) row.pigeonstateid=stId;
  row.instock = gs('neu_instock') !== 'false';
  const ptype = gs('neu_pigeontype'); if(ptype) row.pigeontype = ptype;
  // Eltern-Ringnummer aus Textfeld als Fallback
  const fInp=g('neu_father_inp');
  if(!row.fatherid && fInp){ const fp=findInDb(fInp); if(fp){row.fatherid=fp.pigeonid;row.ringnumberfather=ring(fp);}else{row.ringnumberfather=fmtRingnumber(fInp)||fInp;} }
  const mInp=g('neu_mother_inp');
  if(!row.motherid && mInp){ const mp=findInDb(mInp); if(mp){row.motherid=mp.pigeonid;row.ringnumbermother=ring(mp);}else{row.ringnumbermother=fmtRingnumber(mInp)||mInp;} }
  const msg=document.getElementById('form-msg');
  if(msg){msg.style.display='block';msg.className='form-msg';msg.textContent='Speichern…';}
  try{
    await apiPost('pigeons',row);
    await loadData();
    const saved=S.pigeons.find(p=>p.pigeonid===row.pigeonid);
    if(saved){ selectPigeon(saved.pigeonid); return; }
    if(msg){msg.className='form-msg ok';msg.textContent='✅ Gespeichert!';}
  } catch(err){
    if(msg){msg.className='form-msg err';msg.textContent='❌ Fehler: '+err.message;}
  }
}
