async function cleanupRingnumbers(){
  // Phase 1: Welche Tauben hätten nach Formatierung eine andere ringnumber/ringnumberold?
  const changes = [];
  S.pigeons.forEach(p => {
    const newRing = fmtRingnumber(p.ringnumber);
    const newOld  = fmtRingnumber(p.ringnumberold);
    const newFa   = fmtRingnumber(p.ringnumberfather);
    const newMo   = fmtRingnumber(p.ringnumbermother);
    const newCC   = normCountryCode(p.countrycode);
    const updates = {};
    if(newRing && newRing!==p.ringnumber) updates.ringnumber = newRing;
    if(newOld  && newOld!==p.ringnumberold) updates.ringnumberold = newOld;
    if(newFa   && newFa!==p.ringnumberfather) updates.ringnumberfather = newFa;
    if(newMo   && newMo!==p.ringnumbermother) updates.ringnumbermother = newMo;
    if(newCC   && newCC!==p.countrycode) updates.countrycode = newCC;
    if(Object.keys(updates).length) changes.push({p, updates});
  });

  // Phase 2: Duplikate erkennen — auf Basis der Ringnummer NACH der virtuellen Formatierung,
  // mit derselben toleranten Normalisierung (normRing) wie bei der Import-Dublettenprüfung,
  // damit z.B. "004" und "4" auch hier als dasselbe erkannt werden.
  const fmtOf = p => { const c = changes.find(c=>c.p===p); return (c && c.updates.ringnumber) || p.ringnumber || ''; };
  const groups = {};
  S.pigeons.forEach(p=>{
    const key = normRing(fmtOf(p));
    if(!key) return;
    (groups[key] = groups[key] || []).push(p);
  });
  const dupGroups = Object.values(groups).filter(g=>g.length>1);

  if(!changes.length && !dupGroups.length){
    alert('Alle Ringnummern sind bereits einheitlich formatiert — und es gibt keine Duplikate.');
    return;
  }

  let preview = '';
  if(changes.length){
    preview += 'Formatierung:\n' + changes.slice(0,5).map(c =>
      `${c.p.ringnumber||'—'} → ${c.updates.ringnumber||c.p.ringnumber}`
    ).join('\n') + (changes.length>5 ? `\n… und ${changes.length-5} weitere` : '');
  }
  if(dupGroups.length){
    if(preview) preview += '\n\n';
    preview += `Duplikate (${dupGroups.length} Gruppen):\n` + dupGroups.slice(0,5).map(g =>
      `${escH(ring(g[0]))}${g[0].name?' · '+g[0].name:''}  ×${g.length}`
    ).join('\n') + (dupGroups.length>5 ? `\n… und ${dupGroups.length-5} weitere Gruppen` : '');
  }

  const dupNote = dupGroups.length
    ? `\n\nBei Duplikaten bleibt der vollständigste Datensatz erhalten, fehlende Felder werden aus den anderen ergänzt. Verweise als Vater/Mutter bei anderen Tauben werden automatisch umgehängt. Die überflüssigen Datensätze werden als gelöscht markiert (Soft-Delete, kein Datenverlust rückwirkend nachvollziehbar in der DB).`
    : '';
  if(!confirm(`Folgende Änderungen werden ausgeführt:\n\n${preview}${dupNote}\n\nFortfahren?`)) return;

  // Schritt A: Formatierung anwenden
  let ok=0, fail=0;
  for(const c of changes){
    try {
      await apiPatch('pigeons', c.p.pigeonid, c.updates);
      Object.assign(c.p, c.updates);
      ok++;
    } catch(e){
      fail++;
      console.error('Bereinigung fehlgeschlagen für', c.p.pigeonid, e.message);
    }
  }

  // Schritt B: Duplikate zusammenführen
  let merged=0, mergeFail=0;
  for(const group of dupGroups){
    try {
      const removed = await mergeDuplicateGroup(group);
      merged += removed;
    } catch(e){
      mergeFail++;
      console.error('Merge fehlgeschlagen für', ring(group[0]), e.message);
    }
  }

  applyFilter();
  render();
  alert(
    `✅ ${ok} Ringnummer(n) formatiert.${fail?` ⚠️ ${fail} Formatierungs-Fehler.`:''}` +
    (merged ? ` 🔗 ${merged} Duplikat(e) zusammengeführt.` : '') +
    (mergeFail ? ` ⚠️ ${mergeFail} Merge-Fehler (siehe Konsole).` : '')
  );
}

// Führt eine Gruppe von Tauben mit derselben (normalisierten) Ringnummer zusammen:
// vollständigster Datensatz bleibt als "Primär" erhalten, fehlende Felder werden aus den
// Duplikaten ergänzt, Eltern-Verweise (fatherid/motherid) anderer Tauben werden umgehängt,
// und die überflüssigen Datensätze werden per Soft-Delete entfernt (gleiche Konvention wie deletePigeon()).
// Gibt die Anzahl der entfernten Duplikate zurück.
async function mergeDuplicateGroup(group){
  const FILL_KEYS = ['name','color','race','strain','breeder','owner','standort','pigeontype','countrycode','associationno',
    'birthday','died','bought','sold','info','internalinfo','pigeonstateid','gender','date_year',
    'ringnumberold','ringnumberfather','ringnumbermother','fatherid','motherid',
    'userdefined1','userdefined2','userdefined3'];
  const filled = v => v!==null && v!==undefined && v!=='';
  const score = p => FILL_KEYS.filter(k=>filled(p[k])).length + (p.instock?1:0);

  const sorted = [...group].sort((a,b)=>score(b)-score(a));
  const primary = sorted[0];
  const dups = sorted.slice(1);

  // Fehlende Felder im Primär-Datensatz aus den Duplikaten ergänzen (bestehende Werte bleiben unangetastet)
  const patch = {};
  dups.forEach(d=>{
    FILL_KEYS.forEach(k=>{
      if(!filled(primary[k]) && !filled(patch[k]) && filled(d[k])) patch[k]=d[k];
    });
  });
  if(group.some(p=>p.instock) && !primary.instock) patch.instock = true;

  if(Object.keys(patch).length){
    await apiPatch('pigeons', primary.pigeonid, patch);
    Object.assign(primary, patch);
  }

  // Andere Tauben, die eines der Duplikate als Vater/Mutter referenzieren, auf den Primär-Datensatz umhängen
  const dupIds = new Set(dups.map(d=>d.pigeonid));
  for(const other of S.pigeons){
    if(dupIds.has(other.pigeonid)) continue;
    const upd={};
    if(other.fatherid && dupIds.has(other.fatherid)) upd.fatherid = primary.pigeonid;
    if(other.motherid && dupIds.has(other.motherid)) upd.motherid = primary.pigeonid;
    if(Object.keys(upd).length){
      await apiPatch('pigeons', other.pigeonid, upd);
      Object.assign(other, upd);
    }
  }

  // Duplikate als gelöscht markieren (Soft-Delete)
  for(const d of dups){
    await apiPatch('pigeons', d.pigeonid, {deleted:true, instock:false});
  }

  S.pigeons = S.pigeons.filter(p=>!dupIds.has(p.pigeonid));
  return dups.length;
}

/* ── Datei verarbeiten ── */
async function handleImpFile(file){
  if(!file) return;
  if(file.size > 10*1024*1024){ alert('Datei zu groß (max. 10 MB)'); return; }

  const name = file.name.toLowerCase();
  try {
    if(name.endsWith('.xlsx') || name.endsWith('.xls')){
      await parseExcel(file);
    } else {
      await parseCsv(file);
    }
  } catch(e){
    alert('Fehler beim Lesen der Datei: '+e.message);
  }
}

/* ── CSV Parser ── */
async function parseCsv(file){
  const text = await file.text();
  // Trennzeichen erkennen: Tab > Semikolon > Komma
  const firstLine = text.split('\n')[0]||'';
  const sep = firstLine.includes('\t') ? '\t' : firstLine.includes(';') ? ';' : ',';

  const lines = text.split('\n').map(l=>l.replace(/\r$/,''));
  // Headerzeile finden (erste Zeile mit >= 3 nicht-leeren Spalten)
  let headerIdx = 0;
  for(let i=0;i<Math.min(5,lines.length);i++){
    const cols = lines[i].split(sep).filter(x=>x.trim());
    if(cols.length>=3){ headerIdx=i; break; }
  }
  const headers = lines[headerIdx].split(sep).map(h=>h.trim().replace(/^"|"$/g,''));
  const rows = [];
  for(let i=headerIdx+1;i<lines.length;i++){
    const line = lines[i].trim();
    if(!line) continue;
    const vals = line.split(sep).map(v=>v.trim().replace(/^"|"$/g,''));
    const row = {};
    headers.forEach((h,j)=>{ row[h] = vals[j]||''; });
    rows.push(row);
  }
  IMP.headers = headers;
  IMP.raw = rows;
  autoMapColumns();
  IMP.step = 'map';
  render();
}

/* ── Excel Parser (SheetJS via CDN) ── */
async function parseExcel(file){
  // Lade SheetJS dynamisch
  if(!window.XLSX){
    await new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload=res; s.onerror=rej;
      document.head.appendChild(s);
    });
  }
  const buf = await file.arrayBuffer();
  const wb  = XLSX.read(buf, {type:'array'});
  const ws  = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(ws, {defval:'', raw:false});
  if(!raw.length){ alert('Keine Daten in der Datei gefunden.'); return; }
  IMP.headers = Object.keys(raw[0]);
  IMP.raw = raw.map(r=>{ const o={}; IMP.headers.forEach(h=>o[h]=String(r[h]||'').trim()); return o; });
  autoMapColumns();
  IMP.step = 'map';
  render();
}

/* ── Auto-Mapping ── */
function autoMapColumns(){
  IMP.colMap = {};
  IMP.headers.forEach(h => {
    const key = h.toLowerCase().trim()
      .replace(/[äÄ]/g,'a').replace(/[öÖ]/g,'o').replace(/[üÜ]/g,'u').replace(/[^a-z0-9]/g,'');
    IMP.colMap[h] = IMP_AUTO[key] || '_ignore';
  });
}

function buildImpRows(){
  // Spaltenwerte nach Mapping lesen
  
  function val(row, fieldKey){
    const h = IMP.headers.find(h=>IMP.colMap[h]===fieldKey);
    return h ? String(row[h]||'').trim() : '';
  }
async function doImport() {
  const newRows = IMP.rows.filter(r => r.status === 'new');
  if (!newRows.length) return;

  IMP.step = 'importing';
  IMP.stats = { new: 0, dup: 0, err: 0, done: 0 };
  IMP.log = [];
  render();

  for (const row of newRows) {
    try {
      // pigeonid sicherstellen (falls noch nicht gesetzt)
      if (!row.row.pigeonid) row.row.pigeonid = crypto.randomUUID();

      await apiPost('pigeons', row.row);
      S.pigeons.push(row.row);
      IMP.stats.done++;
      IMP.stats.new++;
    } catch (e) {
      IMP.stats.err++;
      IMP.log.push({ ring: row.row.ringnumber, msg: e.message });
    }

    // Fortschrittsbalken aktualisieren
    const pct = Math.round((IMP.stats.done + IMP.stats.err) / newRows.length * 100);
    const bar = document.querySelector('.imp-progress-bar');
    const lbl = document.querySelector('#imp-progress-lbl');
    if (bar) bar.style.width = pct + '%';
    if (lbl) lbl.textContent = `${IMP.stats.done + IMP.stats.err} / ${newRows.length}`;
  }

  applyFilter();
  IMP.step = 'done';
  render();
}

  IMP.rows = IMP.raw.map((raw,idx) => {
    const vereinsnr  = val(raw,'associationno');
    const jahrgang   = val(raw,'date_year');
    const endnr      = val(raw,'endnumber');
    const land       = val(raw,'countrycode') || 'DE';
    const color      = val(raw,'color');
    const genderRaw  = val(raw,'gender');
    const name       = val(raw,'name');
    const strain     = val(raw,'strain');
    const breeder    = val(raw,'breeder');
    const owner      = val(raw,'owner');
    const info       = val(raw,'info');
    const fatherRaw  = val(raw,'ringnumberfather');
    const motherRaw  = val(raw,'ringnumbermother');
    let   ringRaw    = val(raw,'ringnumber');

    // Ringnummer aus Komponenten bauen falls keine direkte Ringnummer-Spalte
    if(!ringRaw && vereinsnr && jahrgang && endnr){
      const cc = normCountryCode(land) || 'DE';
      const yy = String(jahrgang).slice(-2).padStart(2,'0');
      if(cc==='DE'){
        ringRaw = `DE-${vereinsnr.padStart(5,'0')}-${yy}-${endnr}`;
      } else {
        ringRaw = `${cc}-${yy}-${endnr}`;
      }
    }

    if(!ringRaw) return { _idx:idx, _status:'err', _msg:'Keine Ringnummer', raw };

    const parsed = parseRingComponents(ringRaw) || {};
    const ringnumber = parsed.ringnumber || fmtRingnumber(ringRaw) || ringRaw;

    // Geschlecht normalisieren
    let gender = null;
    const gn = String(genderRaw).trim();
    if(['m','1','männlich','tauber','täuber','cock','male'].includes(gn.toLowerCase())) gender='M';
    else if(['f','2','w','weiblich','taubin','täubin','hen','female'].includes(gn.toLowerCase())) gender='F';
    else if(gn==='2') gender='F';

    // Duplikat prüfen
    const dup = findInDb(ringnumber);

    // Eltern-UUIDs nachschlagen
    let fatherid=null, motherid=null, ringnumberfather=null, ringnumbermother=null;
    if(fatherRaw){
      const fp = findInDb(fatherRaw);
      if(fp){ fatherid=fp.pigeonid; ringnumberfather=ring(fp); }
      else ringnumberfather = fmtRingnumber(fatherRaw)||fatherRaw;
    }
    if(motherRaw){
      const mp = findInDb(motherRaw);
      if(mp){ motherid=mp.pigeonid; ringnumbermother=ring(mp); }
      else ringnumbermother = fmtRingnumber(motherRaw)||motherRaw;
    }

    const row = {
      pigeonid: crypto.randomUUID(),
	  ringnumber,
      countrycode:   parsed.countrycode   || normCountryCode(land) || null,
      associationno: parsed.associationno || vereinsnr || null,
      date_year:     parsed.date_year     || (jahrgang?Number(jahrgang):null),
      endnumber:     parsed.endnumber     || (endnr?Number(endnr):null),
      gender, name:name||null, color:color||null, strain:strain||null,
      breeder:breeder||null, owner:owner||null, info:info||null,
      fatherid, motherid, ringnumberfather, ringnumbermother,
      instock:true, deleted:false,
    };
    // Null-Felder entfernen
    Object.keys(row).forEach(k=>{ if(row[k]===null||row[k]===''||row[k]===undefined) delete row[k]; });

    // Plausibilitätsprüfung: eine Taube kann nicht ihr eigener Elternteil sein,
    // und Vater/Mutter dürfen nicht dieselbe Ringnummer haben. Solche Zeilen
    // werden nicht automatisch blockiert (Tippfehler bei Ringnummern sind häufig),
    // aber deutlich markiert, damit sie vor dem Import geprüft werden.
    let plausibilityMsg = null;
    const rNorm = normRing(ringnumber);
    const fNorm = ringnumberfather ? normRing(ringnumberfather) : null;
    const mNorm = ringnumbermother ? normRing(ringnumbermother) : null;
    if(fNorm && rNorm===fNorm) plausibilityMsg = 'Ringnummer identisch mit Vater — das ist biologisch unmöglich.';
    else if(mNorm && rNorm===mNorm) plausibilityMsg = 'Ringnummer identisch mit Mutter — das ist biologisch unmöglich.';
    else if(fNorm && mNorm && fNorm===mNorm) plausibilityMsg = 'Vater und Mutter haben dieselbe Ringnummer — bitte prüfen.';

    return {
      _idx: idx,
      _status: plausibilityMsg ? 'err' : (dup ? 'dup' : 'new'),
      _dup: dup || null,
      _msg: plausibilityMsg || (dup ? `Bereits vorhanden: ${ring(dup)}` : 'Neu'),
      _action: plausibilityMsg ? 'skip' : (dup ? 'skip' : 'import'),
      _plausibilityError: plausibilityMsg || null,
      row,
    };
  });

  IMP.step = 'preview';
  render();
}

function renderImpProgress(){

  return `<div class="card">
    <div class="card-title serif" style="font-size:18px">📥 Import läuft…</div>

    <div style="font-size:13px;color:var(--text2);margin-bottom:8px">${IMP.stats.done} von ${total} · ${pct}%</div>
    <div style="font-size:12px;color:var(--text3)" id="imp-cur-status">Verarbeite…</div>
  </div>`;
}

/* ── Import ausführen ── */
async function runImport(){
  const toProcess = IMP.rows.filter(r=>r._action!=='skip' && r._status!=='err');
  IMP.stats = {new:0, dup:0, err:0, done:0};
  IMP.log   = [];
  IMP.step  = 'importing';
  render();

  const setS = t => { const el=document.getElementById('imp-cur-status'); if(el) el.textContent=t; };
  const updProg = () => {
    const total = toProcess.length;
    const pct = total ? Math.round(IMP.stats.done/total*100) : 0;
    const bar = document.querySelector('.imp-progress-bar');
    if(bar) bar.style.width=pct+'%';
    const lbl = document.querySelector('.imp-progress + div');
    if(lbl) lbl.textContent=`${IMP.stats.done} von ${total} · ${pct}%`;
  };

  for(const r of toProcess){
    setS(`Verarbeite: ${r.row?.ringnumber||'?'}…`);
    try {
      if(r._action==='import' && r._status==='new'){
        const newId = crypto.randomUUID();
        await apiPost('pigeons', {...r.row, pigeonid:newId});
        IMP.stats.new++;
      } else if((r._action==='update'||r._action==='import') && r._dup){
        // Nur Felder ergänzen die in DB leer sind (bei update) oder alle überschreiben (import)
        const updates = {};
        Object.keys(r.row).forEach(k=>{
          if(['pigeonid','deleted'].includes(k)) return;
          if(r._action==='update'){
            // Nur setzen wenn DB-Feld leer
            if(!r._dup[k] && r.row[k]) updates[k]=r.row[k];
          } else {
            // Alle überschreiben
            if(r.row[k]) updates[k]=r.row[k];
          }
        });
        if(Object.keys(updates).length) await apiPatch('pigeons', r._dup.pigeonid, updates);
        IMP.stats.dup++;
      }
    } catch(e){
      IMP.stats.err++;
      IMP.log.push({ring:r.row?.ringnumber, err:e.message});
    }
    IMP.stats.done++;
    updProg();
  }

  setS('Lade Datenbank neu…');
  await loadData();
  IMP.step = 'done';
  render();
}

// ── REISEN-MODUL ─────────────────────────────────────────────────
// .009 verified positions:
// Header  [0:3]=ReiseNr  [4:6]=Tag [6:8]=Mon [8:10]=Jahr  [18:38]=Ort
// Züchter [9:12]=Gesetzt [12:15]=P1(RV) [15:18]=P2(FG) [18:21]=P3(RegGr)
//         [21:24]=P4(Reg) [24:27]=P5(Nat) [27:34]=Dist*1000
// Taube   [10:12]=Jahr [12:16]=Verein [16:20]=Endnr [20]=Geschl(W=F)
//         [32:41]=Speed/10000
// Platzierungsfelder je Taube (5 Kategorie-Slots, Reihenfolge identisch zur
// Flug-Kopfzeile "A ... G ... [Nat] R ..."): [41:46]=FG (unbenutzt bei diesem
// Verein) [46:51]=Reg/RegV (A-Liste, große Liste) [51:56]=RegGr (G-Liste)
// [56:61]=Nat (unbenutzt) [61:66]=RV (kleine Liste, Reisevereinigung)
// Verifiziert anhand Taube 06559.24.4241W, Flug F06 (Würzburg 30.05.26):
// Datei liefert 0 / 458 / 175 / 0 / 33 → amtlicher Ausdruck bestätigt
// Reg=458, RegGr=175, RV=33 (vorher waren Reg/RegGr vertauscht und RV wurde
// gar nicht gelesen, stattdessen das immer-leere FG-Feld als RV interpretiert).
function calcAS(platz, g_aufgesetzt) {
  if (!platz || platz <= 0 || !g_aufgesetzt || g_aufgesetzt <= 0) return null;
  // Laut Reglement erhält nur jede 3. gesetzte Taube einen Preis (aufgerundet).
  // Die AS-Punkte werden auf Basis dieser Preis-Anzahl berechnet — nicht auf
  // Basis der Gesamtzahl gesetzter Tauben, sonst ergeben sich deutlich zu
  // niedrige Werte (Platz/Gesetzt statt echtem AS-Wert).
  // Verifiziert anhand Taube 06559.24.4241W, Flug F06 (Würzburg 30.05.26):
  //   RV:    Platz 33,  224 gesetzt → 75 Preise  → AS 57.33 ✓
  //   RegGr: Platz 175, 1641 gesetzt → 547 Preise → AS 68.19 ✓
  //   Reg:   Platz 458, 3673 gesetzt → 1225 Preise → AS 62.69 ✓
  const preise = Math.ceil(g_aufgesetzt / 3);
  if (!preise || platz > preise) return null;
  return Math.round((preise - platz + 1) / preise * 10000) / 100;
}


function decodeLatin1(buf){
  try{ return new TextDecoder('windows-1252').decode(buf); }
  catch(e){ try{ return new TextDecoder('iso-8859-1').decode(buf); } catch(e2){ return ''; } }
}

function fixUmlauts(s){
  // CP850/windows-1252 → Unicode
  return (s||'')
    .replace(/\u0081/g,'\xFC').replace(/\u0094/g,'\xF6').replace(/\u0084/g,'\xE4')
    .replace(/\u008E/g,'\xC4').replace(/\u0099/g,'\xD6').replace(/\u009A/g,'\xDC')
    .replace(/\xE1/g,'\xDF').replace(/\xFC/g,'ü').replace(/\xF6/g,'ö')
    .replace(/\xE4/g,'ä').replace(/\xC4/g,'Ä').replace(/\xD6/g,'Ö')
    .replace(/\xDC/g,'Ü').replace(/\xDF/g,'ß').trim();
}

const PT_CACHE={}; // pigeonid -> array of pigeontrips rows (enriched with vintage/tripnumber/location)
async function loadPigeonTrips(pigeonid){
  if(PT_CACHE[pigeonid]) return PT_CACHE[pigeonid];
  try{
    const rows=await apiGet('/pigeontrips?pigeonid=eq.'+pigeonid+'&order=placement.asc&limit=1000')||[];
    if(!RT.trips.length) await loadTrips();
    const tripById={}; RT.trips.forEach(t=>{ tripById[t.tripid]=t; });
    const enriched=rows.map(r=>{
      const t=tripById[r.tripid]||{};
      return {...r, vintage:t.vintage||null, tripnumber:t.number||null, location:t.location||null,
        tripdate:t.tripdate||null, pigeonsset:t.pigeonsset||null,
        pigeonsset_rv:t.pigeonsset_rv||null, pigeonsset_reggr:t.pigeonsset_reggr||null, pigeonsset_reg:t.pigeonsset_reg||null,
        distance:t.averagedistance3!=null?Number(t.averagedistance3):null};
    });
    PT_CACHE[pigeonid]=enriched;
    return enriched;
  } catch(e){ PT_CACHE[pigeonid]=[]; return []; }
}

// Batch-Ladung der Reisedaten für mehrere Tauben auf einmal (z.B. eine Tabellenseite
// der Tauben-Übersicht) statt einer Einzelabfrage pro Taube.
async function loadPigeonTripsBatch(pigeonids){
  const missing=[...new Set(pigeonids.filter(id=>id && !PT_CACHE[id]))];
  if(!missing.length) return;
  try{
    if(!RT.trips.length) await loadTrips();
    const tripById={}; RT.trips.forEach(t=>{ tripById[t.tripid]=t; });
    const idsParam=missing.map(id=>`"${id}"`).join(',');
    const rows=await apiGet('/pigeontrips?pigeonid=in.('+idsParam+')&order=placement.asc&limit=20000')||[];
    const byPigeon={}; missing.forEach(id=>{ byPigeon[id]=[]; });
    rows.forEach(r=>{
      const t=tripById[r.tripid]||{};
      const enriched={...r, vintage:t.vintage||null, tripnumber:t.number||null, location:t.location||null,
        tripdate:t.tripdate||null, pigeonsset:t.pigeonsset||null,
        pigeonsset_rv:t.pigeonsset_rv||null, pigeonsset_reggr:t.pigeonsset_reggr||null, pigeonsset_reg:t.pigeonsset_reg||null,
        distance:t.averagedistance3!=null?Number(t.averagedistance3):null};
      if(!byPigeon[r.pigeonid]) byPigeon[r.pigeonid]=[];
      byPigeon[r.pigeonid].push(enriched);
    });
    missing.forEach(id=>{ PT_CACHE[id]=byPigeon[id]||[]; });
  }catch(e){ missing.forEach(id=>{ if(!PT_CACHE[id]) PT_CACHE[id]=[]; }); }
}
// Wie loadPigeonTripsBatch, aber in Häppchen (z.B. für CSV/PDF-Export über
// tausende Tauben hinweg), um die Query-URL nicht zu sprengen.
async function loadPigeonTripsBatchChunked(pigeonids, chunkSize=150){
  const missing=[...new Set(pigeonids.filter(id=>id && !PT_CACHE[id]))];
  for(let i=0;i<missing.length;i+=chunkSize){
    await loadPigeonTripsBatch(missing.slice(i,i+chunkSize));
  }
}

// Kompakte Reiseleistungs-Kennzahlen einer Taube für die Tauben-Übersicht.
// Gibt null zurück, solange die Daten noch nicht geladen sind (Aufrufer zeigt "Lade…").
function pigeonReiseSummary(pigeonid){
  const rows=PT_CACHE[pigeonid];
  if(!rows) return null;
  if(!rows.length) return {gesetzt:0,preise:0,asSum:0,top10:0};
  let gesetzt=0,preise=0,asSum=0;
  rows.forEach(r=>{
    gesetzt++;
    const hasPreis=r.prize_rv!=null || r.prize_reggr!=null || r.prize_reg!=null || r.prize_fg!=null;
    if(hasPreis) preise++;
    const asVals=[r.as_rv,r.as_reg,r.as_nat].filter(v=>v!=null && v!=='');
    if(asVals.length) asSum+=Math.max(...asVals.map(Number));
  });
  return {gesetzt, preise, asSum, top10:getTop10Placements(rows).length};
}

function groupPigeonTripsByYear(rows){
  const byYear={};
  rows.forEach(r=>{
    const yr=r.vintage||'—';
    if(!byYear[yr]) byYear[yr]={gesetzt:0,preise:0,asSum:0,top10:[]};
    byYear[yr].gesetzt++;
    const hasPreis = r.prize_rv!=null || r.prize_reggr!=null || r.prize_reg!=null || r.prize_fg!=null;
    if(hasPreis) byYear[yr].preise++;
    const asVals=[r.as_rv,r.as_reg,r.as_nat].filter(v=>v!=null && v!=='');
    if(asVals.length) byYear[yr].asSum += Math.max(...asVals.map(Number));
    // Top10 je Flug nur einmal zählen (bester Platz der 3 Kategorien)
    const platzVals=[r.prize_rv,r.prize_reggr,r.prize_reg].filter(v=>v!=null && v>0 && v<=10);
    if(platzVals.length) byYear[yr].top10.push(Math.min(...platzVals));
  });
  return Object.keys(byYear).sort((a,b)=>b-a).map(yr=>({yr, ...byYear[yr],
    top10Str: byYear[yr].top10.length ? byYear[yr].top10.sort((a,b)=>a-b).join(', ') : ''}));
}

// Top10-Platzierungen (RV/RegGr/Reg) über alle Kategorien, sortiert nach Platz
function getTop10Placements(rows){
  const CATS=[
    ['prize_rv','RV','pigeonsset_rv'],
    ['prize_reggr','RegGr','pigeonsset_reggr'],
    ['prize_reg','Reg','pigeonsset_reg']
  ];
  const out=[];
  rows.forEach(r=>{
    CATS.forEach(([field,label,gesetztField])=>{
      const platz=r[field];
      if(platz!=null && platz>0 && platz<=10){
        out.push({platz, kategorie:label, tripnumber:r.tripnumber, location:r.location,
          tripdate:r.tripdate, vintage:r.vintage,
          gesetzt:r[gesetztField]!=null?r[gesetztField]:r.pigeonsset,
          distance:r.distance});
      }
    });
  });
  return out.sort((a,b)=> a.platz-b.platz || String(b.tripdate).localeCompare(String(a.tripdate)));
}

async function handleTripsFiles(fileList){
  const files = Array.from(fileList||[]).filter(Boolean);
  if(!files.length) return;
  RT.imp.step='parsing';
  RT.imp.parseProgress={done:0,total:files.length,file:files[0].name};
  render();

  let combined = RT.imp.rows && RT.imp.rows.length ? RT.imp.rows : [];
  const breeders = RT.imp.breeders ? [...RT.imp.breeders] : [];
  const errors = [];

  for(const file of files){
    RT.imp.parseProgress.file = file.name;
    render();
    try{
      const m = file.name.match(/\.(\d{2,4})$/);
      const parsed = m ? await parseKrausRows(file, m[1]) : await parseXlsxRows(file);
      if(parsed.breedername){
        const label = parsed.breedername + (m?(' (Nr. '+m[1]+')'):'');
        if(!breeders.includes(label)) breeders.push(label);
      }
      combined = mergeTripRows(combined, parsed.rows);
    }catch(e){
      errors.push(file.name+': '+e.message);
    }
    RT.imp.parseProgress.done++;
  }

  // Ergebnisse je Reise nach Geschwindigkeit sortieren und Platzierung neu
  // durchnummerieren — wichtig, sobald mehrere Züchter-Dateien für dieselbe
  // Reise zusammengeführt wurden (sonst würde jeder Züchter bei Platz 1 starten).
  combined.forEach(item=>{
    item.results.sort((a,b)=>{
      if(a.speed!=null && b.speed!=null) return b.speed-a.speed;
      if(a.speed!=null) return -1;
      if(b.speed!=null) return 1;
      return 0;
    });
    item.results.forEach((r,i)=>{ r.placement=i+1; });
  });

  RT.imp.rows = combined;
  RT.imp.breeders = breeders;
  RT.imp.step='preview';
  if(errors.length) alert('Einige Dateien konnten nicht gelesen werden:\n'+errors.join('\n'));
  render();
}

// Führt neu geparste Reisen/Ergebnisse mit bereits vorhandenen (aus zuvor in
// diesem Import-Vorgang gelesenen Dateien) zusammen. Abgleich über
// Jahrgang+Reisenummer+Ort; Kopfdaten werden nur ergänzt, wenn noch leer;
// Ergebnisse werden dedupliziert über Ringnummer+Züchtername.
function mergeTripRows(existing, incoming){
  const keyOf = t => (t.vintage||'')+'|'+t.number+'|'+String(t.location||'').toLowerCase().trim().replace(/\s+/g,' ');
  const list = [...existing];
  const byKey = {};
  list.forEach(item=>{ byKey[keyOf(item.trip)] = item; });
  (incoming||[]).forEach(item=>{
    const k = keyOf(item.trip);
    const cur = byKey[k];
    if(cur){
      ['tripdate','prices1','prices2','prices3','prices4','prices5','averagedistance3','g_rv','g_reggr','g_reg']
        .forEach(f=>{ if((cur.trip[f]==null||cur.trip[f]==='') && item.trip[f]!=null && item.trip[f]!=='') cur.trip[f]=item.trip[f]; });
      const seen = new Set(cur.results.map(r=>normRing(r.ringnumber)+'|'+(r.breedername||'')));
      item.results.forEach(r=>{
        const rk = normRing(r.ringnumber)+'|'+(r.breedername||'');
        if(!seen.has(rk)){ cur.results.push(r); seen.add(rk); }
      });
    } else {
      byKey[k]=item;
      list.push(item);
    }
  });
  return list.sort((a,b)=>a.trip.number-b.trip.number);
}

async function parseKrausRows(file, breedernumber){
  const buf   = await file.arrayBuffer();
  const text  = decodeLatin1(new Uint8Array(buf));
  const lines = text.split('\n').map(l=>l.replace(/\r$/,''));

  const reiseMap={}, zuechterMap={};
  let breedername=null;

  lines.forEach(line=>{
    if(line.length<18) return;
    const prefix=line.substring(0,3);

    if(/^0[0-9][0-9]$/.test(prefix) && prefix!=='000'){
      const rNr=parseInt(prefix);
      const tag =line.substring(4,6).trim();
      const mon =line.substring(6,8).trim();
      const yr  =line.substring(8,10).trim();
      const ort =fixUmlauts(line.substring(18,38));
      const date=(tag&&mon&&yr)?`20${yr}-${mon.padStart(2,'0')}-${tag.padStart(2,'0')}`:null;
      const mR=line.match(/R\s+(\d+)/);
      const mG=line.match(/G\s+(\d+)/);
      const mA=line.match(/A\s+(\d+)/);
      reiseMap[rNr]={number:rNr, vintage:yr?2000+parseInt(yr):null,
        location:ort, tripdate:date, results:[],
        g_rv:  mR?parseInt(mR[1]):0,
        g_reggr:mG?parseInt(mG[1]):0,
        g_reg:  mA?parseInt(mA[1]):0};
    }

    if(/^1[0-9][0-9]$/.test(prefix)){
      const rNr=parseInt(prefix.substring(1));
      const g  =parseInt(line.substring(9,12).trim())||0;
      const p1 =parseInt(line.substring(12,15).trim())||0;
      const p2 =parseInt(line.substring(15,18).trim())||0;
      const p3 =parseInt(line.substring(18,21).trim())||0;
      const p4 =parseInt(line.substring(21,24).trim())||0;
      const p5 =parseInt(line.substring(24,27).trim())||0;
      const d  =parseInt(line.substring(27,34).trim())||0;
      zuechterMap[rNr]={gesetztg:g,p1,p2,p3,p4,p5,dist:d};
      if(!breedername){
        const nm=fixUmlauts(line.substring(33,53).trim());
        if(nm) breedername=nm;
      }
    }

    if(/^2[0-9][0-9]$/.test(prefix)){
      const rNr=parseInt(prefix.substring(1));
      if(!reiseMap[rNr]) return;
      const yr   =line.substring(10,12).trim();
      const vrnr =line.substring(12,16).trim();
      const endnr=line.substring(16,20).trim();
      const geschl=line.substring(20,21).trim();
      const gRaw =line.substring(32,41).trim();
      const speed=(gRaw&&gRaw!=='0')?parseInt(gRaw)/10000:null;
      // 5 Kategorie-Slots je Taube, siehe Kommentar oben (verifiziert an 4241W/F06).
      const pFg =parseInt(line.substring(41,46).trim())||0;
      const pReg=parseInt(line.substring(46,51).trim())||0;
      const pRgg=parseInt(line.substring(51,56).trim())||0;
      const pNat=parseInt(line.substring(56,61).trim())||0;
      const pRv =parseInt(line.substring(61,66).trim())||0;
      if(!vrnr||!endnr||!yr) return;
      const ring=`DE-${vrnr.padStart(5,'0')}-${yr.padStart(2,'0')}-${endnr}`;
      // p_rv=Platz RV (kleine Liste) | p_rgg=Platz RegGr (G-Liste, mittel) |
      // p_reg=Platz Reg/RegV (A-Liste, große Liste)
      const _h = reiseMap[rNr];
      const prv = pRv!==0 ?pRv :null;
      const prg = pRgg!==0?pRgg:null;  // RegGr = G-Liste
      const pre = pReg!==0?pReg:null;  // Reg   = A-Liste (große Liste)
      const pfg = pFg!==0?pFg:null;    // bei diesem Verein bislang stets 0/unbenutzt
      reiseMap[rNr].results.push({
        ringnumber:ring, sex:geschl==='W'?'F':'M',
        speed,
        prize_rv:prv, prize_fg:pfg, prize_reggr:prg, prize_reg:pre,
        as_rv:calcAS(prv,_h.g_rv||0), as_reg:calcAS(pre,_h.g_reg||0), as_nat:calcAS(prg,_h.g_reggr||0)
      });
    }
  });

  const rows=Object.values(reiseMap)
    .filter(r=>r.results.length>0)
    .sort((a,b)=>a.number-b.number)
    .map(trip=>{
      const h=zuechterMap[trip.number]||{};
      const results=trip.results.map((res,i)=>{
        const dbP=S.pigeons.find(p=>normRing(p.ringnumber)===normRing(res.ringnumber));
        return {...res, placement:i+1, pigeonid:dbP?.pigeonid||null, found:!!dbP,
          breedername:breedername||null, breedernumber:breedernumber||null};
      });
      return {
        trip:{...trip, pigeonsset:results.length,
          prices1:h.p1||null, prices2:h.p2||null, prices3:h.p3||null,
          prices4:h.p4||null, prices5:h.p5||null,
          averagedistance3:h.dist?h.dist/1000:null},
        results
      };
    });
  return {rows, breedername};
}

async function parseXlsxRows(file){
  if(!window.XLSX){
    await new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload=res; s.onerror=()=>rej(new Error('SheetJS nicht geladen'));
      document.head.appendChild(s);
    });
  }
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array',cellDates:true});
  const raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false})
    .filter(r=>String(r['Taube']||'').trim()!=='');
  const parseTaube=t=>{
    const m=String(t).match(/^(\d{4,5})-(\d{2})-(\d+)\s*[A-Z]?$/);
    return m?`DE-${m[1].padStart(5,'0')}-${m[2]}-${m[3]}`:null;
  };
  const tripMap={};
  raw.forEach(r=>{
    const key=(r['Nr.']||r['Nr']||0)+'|'+String(r['Datum']||'').substring(0,10);
    if(!tripMap[key]) tripMap[key]={number:parseInt(r['Nr.']||r['Nr']||'0')||0,
      vintage:parseInt(r['Jahr']||'0')||0,location:String(r['Ort']||'?').trim(),
      tripdate:String(r['Datum']||'').substring(0,10),rows:[]};
    tripMap[key].rows.push(r);
  });
  const rows=Object.values(tripMap).sort((a,b)=>a.number-b.number).map(trip=>{
    const results=trip.rows.map((r,i)=>{
      const ring=parseTaube(r['Taube']||'');
      const dbP=ring?S.pigeons.find(p=>normRing(p.ringnumber)===normRing(ring)):null;
      return {ringnumber:ring||String(r['Taube']||''),pigeonid:dbP?.pigeonid||null,found:!!dbP,
        placement:i+1,
        speed:parseFloat(String(r['Geschwindigkeit']||'0').replace(',','.'))||null,
        maxkm:parseFloat(String(r['Max. Km']||'0').replace(',','.'))||null,
        prize_rv:parseInt(r['RV']||'0')||null,prize_fg:parseInt(r['FG']||'0')||null,
        prize_reggr:parseInt(r['RegGr']||'0')||null,prize_reg:parseInt(r['REG']||r['Reg']||'0')||null,
        as_rv:parseFloat(String(r['AS RV']||'0').replace(',','.'))||null,
        as_reg:parseFloat(String(r['AS Reg']||'0').replace(',','.'))||null,
        as_nat:parseFloat(String(r['AS Nat']||'0').replace(',','.'))||null,
      };
    });
    return {trip:{...trip,pigeonsset:results.length},results};
  });
  return {rows, breedername:null};
}

async function runTripsImport(){
  RT.imp.stats={trips:0,tripsUpdated:0,results:0,resultsNew:0,resultsUpdated:0,err:0};
  RT.imp.step='importing'; render();
  const setS=t=>{const el=document.getElementById('trips-status');if(el)el.textContent=t;};
  const updP=()=>{
    const total=RT.imp.rows.reduce((s,r)=>s+r.results.length,0);
    const pct=total?Math.round(RT.imp.stats.results/total*100):0;
    const bar=document.getElementById('trips-bar');
    if(bar)bar.style.width=pct+'%';
    const lbl=document.getElementById('trips-status');
    if(lbl)lbl.textContent=RT.imp.stats.results+' von '+total+' ('+pct+'%)';
  };

  // Sammle alle tripids dieser Session für Duplikat-Check
  const sessionTrips=[...RT.trips];

  for(const item of RT.imp.rows){
    const t=item.trip;
    setS('Reise '+t.number+' — '+t.location+'…');
    const normL=s=>(s||'').toLowerCase().trim().replace(/\s+/g,' ');
    const existing=sessionTrips.find(x=>
      x.vintage===t.vintage && x.number===t.number &&
      normL(x.location)===normL(t.location)
    );
    let tripid;
    if(existing){
      // Reise existiert bereits → aktualisieren statt doppelt anzulegen.
      // Nur Felder überschreiben, zu denen die neue Datei tatsächlich Werte liefert.
      tripid=existing.tripid;
      const upd={};
      if(t.tripdate) upd.tripdate=t.tripdate;
      ['prices1','prices2','prices3','prices4','prices5','averagedistance3'].forEach(k=>{ if(t[k]) upd[k]=t[k]; });
      if(t.g_rv)    upd.pigeonsset_rv=t.g_rv;
      if(t.g_reggr) upd.pigeonsset_reggr=t.g_reggr;
      if(t.g_reg)   upd.pigeonsset_reg=t.g_reg;
      if(Object.keys(upd).length){
        try{ await apiPatchBy('trips','tripid=eq.'+tripid,upd); }
        catch(e2){
          // Fallback: pigeonsset_rv/_reggr/_reg-Spalten evtl. noch nicht angelegt
          delete upd.pigeonsset_rv; delete upd.pigeonsset_reggr; delete upd.pigeonsset_reg;
          if(Object.keys(upd).length){ try{ await apiPatchBy('trips','tripid=eq.'+tripid,upd); }catch(e3){} }
        }
        Object.assign(existing,upd);
        RT.imp.stats.tripsUpdated++;
      }
    } else {
      tripid=crypto.randomUUID();
      try{
        const row={tripid,vintage:t.vintage||null,number:t.number||null,
          location:t.location||null,tripdate:t.tripdate||null,pigeonsset:t.pigeonsset||null};
        ['prices1','prices2','prices3','prices4','prices5','averagedistance3']
          .forEach(k=>{ if(t[k]) row[k]=t[k]; });
        const catRow={...row};
        if(t.g_rv)    catRow.pigeonsset_rv=t.g_rv;
        if(t.g_reggr) catRow.pigeonsset_reggr=t.g_reggr;
        if(t.g_reg)   catRow.pigeonsset_reg=t.g_reg;
        try{
          await apiPost('trips',catRow);
        } catch(e2){
          // Fallback: pigeonsset_rv/_reggr/_reg-Spalten evtl. noch nicht angelegt
          await apiPost('trips',row);
        }
        RT.imp.stats.trips++;
        sessionTrips.push(row); // sofort für nächste Iteration verfügbar
      } catch(e){
        console.error('Reise Fehler:',e.message);
        RT.imp.stats.err+=item.results.length;
        RT.imp.stats.results+=item.results.length;
        updP(); continue;
      }
    }

    // Vorhandene Ergebnisse dieser Reise laden, um Doppel-Einträge zu vermeiden
    // (Abgleich über Ringnummer + ggf. Züchtername, falls mehrere Züchter dieselbe Reise melden)
    let existingResults=[];
    try{
      existingResults = await apiGet('/pigeontrips?tripid=eq.'+tripid+'&select=id,ringnumber,breedername') || [];
    }catch(e){ existingResults=[]; }
    const existingByKey={};
    existingResults.forEach(r=>{
      const key=normRing(r.ringnumber)+'|'+(r.breedername||'');
      existingByKey[key]=r.id;
    });

    for(const res of item.results){
      try{
        const key=normRing(res.ringnumber)+'|'+(res.breedername||'');
        const existingId=existingByKey[key];
        const row={};
        const setIf=(k,v)=>{ if(v!=null) row[k]=v; };
        // Platzierungs- und AS-Felder IMMER explizit setzen (auch null) — sonst
        // bleiben bei einem Re-Import alte, fehlerhafte Werte aus einem früheren
        // Import (z.B. vor der RegGr/Reg-Korrektur) unbemerkt stehen, weil setIf
        // ein null einfach überspringen würde statt das Feld zu leeren.
        const setAlways=(k,v)=>{ row[k]=(v===undefined?null:v); };
        setIf('pigeonid',res.pigeonid); setIf('ringnumber',res.ringnumber);
        setIf('placement',res.placement); setIf('speed',res.speed);
        setIf('maxkm',res.maxkm);
        setAlways('prize_rv',res.prize_rv); setAlways('prize_fg',res.prize_fg);
        setAlways('prize_reggr',res.prize_reggr); setAlways('prize_reg',res.prize_reg);
        setAlways('as_rv',res.as_rv); setAlways('as_reg',res.as_reg); setAlways('as_nat',res.as_nat);
        setIf('breedername',res.breedername); setIf('breedernumber',res.breedernumber);
        setIf('sex',res.sex);
        const doWrite=async(r)=>{
          if(existingId) await apiPatchBy('pigeontrips','id=eq.'+existingId,r);
          else await apiPost('pigeontrips',{id:crypto.randomUUID(),tripid,...r});
        };
        try{
          await doWrite(row);
        }catch(e2){
          // Fallback: sex-Spalte evtl. noch nicht angelegt
          if(row.sex){ const r2={...row}; delete r2.sex; await doWrite(r2); }
          else throw e2;
        }
        if(existingId) RT.imp.stats.resultsUpdated++; else RT.imp.stats.resultsNew++;
        RT.imp.stats.results++;
      } catch(e){ RT.imp.stats.err++; }
      if(RT.imp.stats.results%25===0) updP();
    }
  }
  updP();
  await loadTrips();
  ZT.loaded=false;
  RT.imp.step='done'; render();
}

// ── ZÜCHTER-MODUL ─────────────────────────────────────────────────
// Aggregiert pigeontrips-Ergebnisse über alle importierten Züchter hinweg,
// unabhängig von den (Reise-bezogenen) prices1-4-Feldern auf trips —
// die stammen nur vom jeweils ERSTEN importierten Züchter einer Reise
// und sind daher bei mehreren Züchtern pro Reise nicht aussagekräftig.
let ZT = { rows:[], loaded:false, selected:null };

async function loadZuechterData(){
  try{
    ZT.rows = await apiGet('/pigeontrips?breedername=not.is.null&select=breedername,breedernumber,tripid,pigeonid,ringnumber,sex,prize_rv,prize_reggr,prize_reg,prize_fg,as_rv,as_reg,as_nat&limit=10000') || [];
  }catch(e){
    // Fallback: sex-Spalte evtl. noch nicht angelegt
    try{
      ZT.rows = await apiGet('/pigeontrips?breedername=not.is.null&select=breedername,breedernumber,tripid,pigeonid,ringnumber,prize_rv,prize_reggr,prize_reg,prize_fg,as_rv,as_reg,as_nat&limit=10000') || [];
    }catch(e2){ ZT.rows = []; }
  }
  ZT.loaded = true;
}

function zuechterAgg(){
  const tripById={}; RT.trips.forEach(t=>tripById[t.tripid]=t);
  const g={};
  ZT.rows.forEach(r=>{
    const key=r.breedername||'Unbekannt';
    if(!g[key]) g[key]={name:key, number:r.breedernumber||null, total:0, rvSet:0,rvWon:0, reggrSet:0,reggrWon:0, regSet:0,regWon:0, trips:new Set(), bestAS:0};
    const b=g[key];
    b.total++;
    if(r.tripid) b.trips.add(r.tripid);
    const trip=tripById[r.tripid];
    // Preisausbeute nur über Reisen berechnen, bei denen die jeweilige Liste (RV/RegGr/Reg)
    // überhaupt ausgewertet wurde (pigeonsset_xx>0) — sonst zählt "keine Liste erstellt" fälschlich als 0%.
    if(trip){
      if(trip.pigeonsset_rv>0)    { b.rvSet++;    if(r.prize_rv)    b.rvWon++; }
      if(trip.pigeonsset_reggr>0) { b.reggrSet++; if(r.prize_reggr) b.reggrWon++; }
      if(trip.pigeonsset_reg>0)   { b.regSet++;   if(r.prize_reg)   b.regWon++; }
    }
    [r.as_rv,r.as_reg].forEach(v=>{ if(v&&v>b.bestAS) b.bestAS=v; });
  });
  return Object.values(g).map(b=>({...b, tripCount:b.trips.size,
    pctRV:   b.rvSet    ? b.rvWon/b.rvSet*100       : null,
    pctRegGr:b.reggrSet ? b.reggrWon/b.reggrSet*100 : null,
    pctReg:  b.regSet   ? b.regWon/b.regSet*100     : null
  })).sort((a,b)=>b.total-a.total);
}

// ── BESTENLISTE ────────────────────────────────────────────────
// Rangliste der Tauben nach Anzahl Preise (ein Flug zählt als ein Preis, unabhängig
// davon in wie vielen Listen RV/RegGr/Reg gleichzeitig platziert wurde) und in
// zweiter Instanz nach Summe der besten AS-Punkte je Flug. Je Reisesaison (Jahr)
// getrennt ausgewertet, neueste Saison zuerst. Getrennt nach Vögel/Weibchen — das
// Geschlecht wird bevorzugt aus der Verbands-Importdatei gelesen, funktioniert also
// auch für Tauben ohne Zuordnung zur eigenen Datenbank — jeweils zusätzlich als
// einjährig (Jahrgang = Saison-Jahr minus 1) gefiltert. Die Kategorie "Alle Tauben"
// zeigt zusätzlich auch Tauben mit unbekanntem Geschlecht; deren Jahrgang wird bei
// fehlender DB-Zuordnung direkt aus der Ringnummer abgeleitet (mittleres Segment,
// z.B. DE 6559-23-3535 → Jahrgang 2023).
let BL = { breeder:'ALL', cat:'gesamt', expanded:new Set() };

function bestenliste(breederFilter){
  const tripById={}; RT.trips.forEach(t=>tripById[t.tripid]=t);
  // Schlüssel je Saison+Taube (Tauben ohne DB-Zuordnung werden über die Ringnummer gruppiert)
  const byKey={};
  ZT.rows.forEach(r=>{
    if(breederFilter && breederFilter!=='ALL' && (r.breedername||'Unbekannt')!==breederFilter) return;
    const trip=tripById[r.tripid];
    const yr=trip?trip.vintage:null;
    if(!yr) return; // ohne bekannte Reise/Saison keine Zuordnung möglich
    const pid=r.pigeonid || ('ring:'+normRing(r.ringnumber||''));
    const key=yr+'|'+pid;
    if(!byKey[key]) byKey[key]={year:yr, pigeonid:r.pigeonid||null, ringnumber:r.ringnumber||null, prizes:0, asSum:0, breedernames:new Set(), sexVotes:{M:0,F:0}, flights:[]};
    const b=byKey[key];
    const hasPreis = r.prize_rv!=null || r.prize_reggr!=null || r.prize_reg!=null || r.prize_fg!=null;
    if(hasPreis) b.prizes++;
    // Je Liste (RV/RegGr/Reg) ein Kandidatenpaar aus Platz+AS; das beste (höchste AS) gilt für den Flug
    const candidates=[
      {platz:r.prize_rv,    as:r.as_rv},
      {platz:r.prize_reggr, as:r.as_nat},
      {platz:r.prize_reg,   as:r.as_reg}
    ].filter(c=>c.as!=null && c.as!=='');
    const best = candidates.length ? candidates.reduce((a,c)=>Number(c.as)>Number(a.as)?c:a) : null;
    const flightAS = best ? Number(best.as) : null;
    if(flightAS!=null) b.asSum += flightAS;
    if(r.breedername) b.breedernames.add(r.breedername);
    if(r.sex==='M'||r.sex==='F') b.sexVotes[r.sex]++;
    b.flights.push({
      tripNumber: trip.number, location: trip.location, tripdate: trip.tripdate,
      platz: best?best.platz:null, as: flightAS, hasPreis
    });
  });

  const entries=Object.values(byKey).map(b=>{
    const p=b.pigeonid?S.pigeons.find(x=>x.pigeonid===b.pigeonid):null;
    // Geschlecht bevorzugt aus der Verbands-Importdatei (dort für jede Taube vermerkt,
    // funktioniert daher auch für Tauben, die nicht in der eigenen Datenbank stehen).
    // Nur wenn die Importdatei kein Geschlecht liefert (z.B. Excel-Import), auf die
    // eigene Datenbank zurückfallen.
    let sex = b.sexVotes.M>=b.sexVotes.F && b.sexVotes.M>0 ? 'M'
            : b.sexVotes.F>b.sexVotes.M ? 'F'
            : (p?sex_(p):'?');
    let birthYear=null, ring=b.ringnumber, name=null, inDb=!!p;
    if(p){ birthYear=p.date_year; ring=p.ringnumber||ring; name=p.name; }
    else { const parsed=parseRingComponents(b.ringnumber); birthYear=parsed?.date_year||null; }
    const flights=[...b.flights].sort((a,b2)=>(a.tripNumber||0)-(b2.tripNumber||0));
    return {...b, pigeon:p, inDb, sex, birthYear, ring, name, flights, breedername:[...b.breedernames].join(', ')};
  });

  const years=[...new Set(entries.map(e=>e.year))].sort((a,b)=>Number(b)-Number(a));
  const sortFn=(a,b)=> b.prizes-a.prizes || b.asSum-a.asSum;
  const build=(filterFn)=> years.map(yr=>({
    year:yr,
    rows: entries.filter(e=>e.year===yr && filterFn(e,yr)).sort(sortFn)
  })).filter(g=>g.rows.length);

  return {
    years,
    gesamt:      build(()=>true),
    tauber:      build(e=>e.sex==='M'),
    taubinnen:   build(e=>e.sex==='F'),
    tauberJg:    build((e,yr)=>e.sex==='M' && String(e.birthYear)===String(Number(yr)-1)),
    taubinnenJg: build((e,yr)=>e.sex==='F' && String(e.birthYear)===String(Number(yr)-1))
  };
}

function renderBestenliste(){
  if(!ZT.loaded){ loadZuechterData().then(render); return '<div class="loading"><div class="spinner"></div>Lade Leistungsdaten…</div>'; }
  if(!RT.trips.length){ loadTrips().then(render); return '<div class="loading"><div class="spinner"></div>Lade Reisen…</div>'; }
  const breeders=[...new Set(ZT.rows.map(r=>r.breedername).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const data=bestenliste(BL.breeder);

  const tabs=[
    ['gesamt','🐦 Alle Tauben'],
    ['tauber','♂ Vögel'],
    ['taubinnen','♀ Weibchen'],
    ['tauberJg','♂ Vögel (einjährig)'],
    ['taubinnenJg','♀ Weibchen (einjährig)']
  ];
  const groups=data[BL.cat]||[];
  if(!BL.expanded) BL.expanded=new Set();
  const rowKey=(yr,e)=> BL.cat+'|'+yr+'|'+(e.pigeonid||e.ring);
  function toggleBL(k){ if(BL.expanded.has(k)) BL.expanded.delete(k); else BL.expanded.add(k); render(); }
  window.toggleBL = toggleBL;

  const renderFlights=(e)=>{
    if(!e.flights.length) return '<div style="padding:10px;color:var(--text3);font-size:12px">Keine Flugdaten.</div>';
    const cells=e.flights.map((f,i)=>{
      return `<div style="text-align:center">
        <div style="font-size:10px;color:var(--text3);margin-bottom:2px">F${String(i+1).padStart(2,'0')}</div>
        <div style="font-size:12px;font-weight:500">${f.platz!=null?f.platz:'—'}</div>
        <div style="font-size:11px;color:var(--green)">${f.as!=null?f.as.toFixed(2):'—'}</div>
      </div>`;
    }).join('');
    const sumCheck=e.flights.reduce((s,f)=>s+(f.as||0),0);
    return `<div style="padding:10px 4px">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;background:var(--bg2);border-radius:8px;padding:10px">${cells}</div>
      <div style="font-size:11px;color:var(--text3);margin-top:8px">Summe geprüft: <strong style="color:var(--text2)">${sumCheck.toFixed(2)}</strong> ${Math.abs(sumCheck-e.asSum)<0.01?'✓ stimmt mit Σ AS überein':'⚠ weicht von Σ AS ab — bitte melden'}</div>
    </div>`;
  };

  const renderRow=(e,i,yr)=>{
    const k=rowKey(yr,e);
    const open=BL.expanded.has(k);
    return `
    <tr>
      <td style="text-align:center;font-weight:600;color:${i<3?'var(--green)':'var(--text3)'}">${i+1}</td>
      <td style="text-align:center"><button class="btn btn-outline" style="padding:2px 8px;font-size:11px;min-width:0" onclick="event.stopPropagation();toggleBL('${k}')">${open?'−':'+'}</button></td>
      <td style="font-family:monospace;font-size:12px;${e.pigeonid?'cursor:pointer':''}" ${e.pigeonid?`onclick="selectPigeon('${e.pigeonid}')"`:''}>${escH(e.ring||'—')}${!e.inDb?' <span style="color:var(--text3);font-size:10px">(nicht in DB)</span>':''}</td>
      <td>${escH(e.name||'—')}</td>
      <td style="font-size:12px;color:var(--text3)">${e.birthYear||'—'}</td>
      ${BL.breeder==='ALL'?'<td style="font-size:12px;color:var(--text3)">'+escH(e.breedername||'—')+'</td>':''}
      <td style="text-align:center;font-weight:600">${e.prizes}</td>
      <td style="text-align:center;font-weight:600;color:var(--green)">${e.asSum.toFixed(2)}</td>
    </tr>
    ${open?`<tr><td colspan="${BL.breeder==='ALL'?8:7}" style="padding:0">${renderFlights(e)}</td></tr>`:''}`;
  };

  const yearBlocks = groups.length ? groups.map(g=>`
    <div style="margin-bottom:16px">
      <div style="font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Saison ${g.year}</div>
      <div class="card"><div class="table-wrap"><table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr><th>#</th><th></th><th>Ring</th><th>Name</th><th>Jg.</th>${BL.breeder==='ALL'?'<th>Züchter</th>':''}<th style="text-align:center">Preise</th><th style="text-align:center">Σ AS</th></tr></thead>
        <tbody>${g.rows.map((e,i)=>renderRow(e,i,g.year)).join('')}</tbody>
      </table></div></div>
    </div>`).join('')
    : '<div class="card" style="text-align:center;padding:24px;color:var(--text3)">Keine Tauben in dieser Kategorie.</div>';

  return `<div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
      <div class="serif" style="font-size:20px">🏆 Bestenliste</div>
      <label style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text3)">
        Züchter:
        <select onchange="BL.breeder=this.value;render()" style="max-width:260px">
          <option value="ALL" ${BL.breeder==='ALL'?'selected':''}>Gesamt (alle Züchter)</option>
          ${breeders.map(b=>`<option value="${escH(b)}" ${BL.breeder===b?'selected':''}>${escH(b)}</option>`).join('')}
        </select>
      </label>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
      ${tabs.map(([k,label])=>`<button class="btn ${BL.cat===k?'':'btn-outline'}" style="font-size:12px;padding:7px 12px" onclick="BL.cat='${k}';render()">${label}</button>`).join('')}
    </div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:12px">
      Je Reisesaison getrennt sortiert nach Anzahl Preise (ein Flug zählt als ein Preis, egal in wie vielen Listen RV/RegGr/Reg platziert wurde), bei Gleichstand nach Summe der AS-Punkte (je Flug wird der offizielle, aus der Importdatei übernommene AS-Wert gewertet — nicht selbst nachgerechnet).
      ${BL.cat==='gesamt'?'Enthält auch Tauben ohne Zuordnung zur eigenen Datenbank (Jahrgang dann aus der Ringnummer abgeleitet).':'Das Geschlecht stammt aus der Verbands-Importdatei, daher erscheinen hier auch Tauben ohne Zuordnung zur eigenen Datenbank.'}
      Über „+" lässt sich jede Taube aufklappen und die einzelnen Flüge (Platz &amp; AS-Wert) zur Kontrolle gegen das DSE-Portal prüfen.
    </div>
    ${yearBlocks}
  </div>`;
}

// ── STATISTIK ──────────────────────────────────────────────────
function renderStats(){
  const total=S.pigeons.length,males=S.pigeons.filter(p=>sex_(p)==='M').length,females=S.pigeons.filter(p=>sex_(p)==='F').length;
  const instock=S.pigeons.filter(p=>p.instock).length;
  const withBoth=S.pigeons.filter(p=>(p.fatherid||p.ringnumberfather)&&(p.motherid||p.ringnumbermother)).length;
  const years={};S.pigeons.forEach(p=>{if(p.date_year)years[p.date_year]=(years[p.date_year]||0)+1;});
  const topYears=Object.entries(years).sort((a,b)=>b[0]-a[0]).slice(0,15);
  const maxY=Math.max(...topYears.map(y=>y[1]),1);
  const colors={};S.pigeons.forEach(p=>{if(p.color)colors[p.color]=(colors[p.color]||0)+1;});
  const topColors=Object.entries(colors).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const strains={};S.pigeons.forEach(p=>{if(p.strain)strains[p.strain]=(strains[p.strain]||0)+1;});
  const topStrains=Object.entries(strains).sort((a,b)=>b[1]-a[1]).slice(0,10);
  return `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num">${total.toLocaleString('de')}</div><div class="stat-label">Tauben gesamt</div></div>
      <div class="stat-card"><div class="stat-num">${males.toLocaleString('de')}</div><div class="stat-label">♂ Täuber</div></div>
      <div class="stat-card"><div class="stat-num">${females.toLocaleString('de')}</div><div class="stat-label">♀ Täubin</div></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px">
      <div class="stat-card"><div class="stat-num" style="font-size:24px">${instock.toLocaleString('de')}</div><div class="stat-label">Im Bestand</div></div>
      <div class="stat-card"><div class="stat-num" style="font-size:24px">${withBoth.toLocaleString('de')}</div><div class="stat-label">Mit beiden Eltern</div></div>
      <div class="stat-card"><div class="stat-num" style="font-size:24px">${Object.keys(years).length}</div><div class="stat-label">Jahrgänge</div></div>
    </div>
    <div class="card">
      <div class="card-title">Tauben pro Jahrgang</div>
      ${topYears.map(([y,n])=>`<div class="bar-row"><span class="bar-label">${y}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(n/maxY*100)}%"><span>${n}</span></div></div></div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      ${topColors.length?`<div class="card"><div class="card-title">Farben</div><div class="tag-list">${topColors.map(([c,n])=>`<div class="tag">${escH(c)}<strong>${n}</strong></div>`).join('')}</div></div>`:''}
      ${topStrains.length?`<div class="card"><div class="card-title">Linien / Stämme</div><div class="tag-list">${topStrains.map(([s,n])=>`<div class="tag">${escH(s)}<strong>${n}</strong></div>`).join('')}</div></div>`:''}
    </div>`;
}

function bindAC(inpId, dropId, filterSex, onSelect){
  const inp=document.getElementById(inpId);
  const drop=document.getElementById(dropId);
  if(!inp||!drop) return;
  inp.addEventListener('input',()=>{
    const q=inp.value.trim().toLowerCase();
    if(q.length<2){ drop.classList.remove('open'); drop.innerHTML=''; return; }
    let hits=S.pigeons.filter(p=>(p.ringnumber||'').toLowerCase().includes(q)||(p.name||'').toLowerCase().includes(q));
    if(filterSex) hits=hits.filter(p=>sex_(p)===filterSex);
    hits=hits.slice(0,8);
    drop.innerHTML=hits.length ? hits.map(p=>`
      <div class="ac-item" onclick="(${onSelect.toString()})('${p.pigeonid}')">
        <span class="ac-ring">${escH(ring(p))}</span>
        ${p.name?`<span>${escH(p.name)}</span>`:''}
        <span style="color:var(--text3);font-size:11px;margin-left:auto">${p.date_year||''}</span>
      </div>`).join('')
    : '<div class="ac-item" style="cursor:default;color:var(--text3)">Keine Treffer</div>';
    drop.classList.toggle('open', hits.length>0||true);
  });
  document.addEventListener('click', e=>{ if(!inp.contains(e.target)&&!drop.contains(e.target)) drop.classList.remove('open'); });
}

// ── UTIL ───────────────────────────────────────────────────────
function escH(s){ if(s===null||s===undefined)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }


// ── NACHKOMMEN ────────────────────────────────────────────────
function showNachkommen(id){
  S.selectedNach=id; S.tab='nachkommen';
  setActiveNav('nachkommen');
  render(); window.scrollTo(0,0);
}

function renderNachSearch(){
  return '<div class="card">'
    +'<div class="card-title serif" style="font-size:18px">🐣 Nachkommen-Suche</div>'
    +'<div class="search-wrap" style="max-width:500px">'
    +'<span class="search-icon">🔍</span>'
    +'<input id="nach-inp" type="text" placeholder="Endnr. (1), 26/1, Name+Nr (idefix 1), Text…" autocomplete="off">'
    +'</div>'
    +'<div id="nach-results" style="border:1px solid var(--border);border-radius:0 0 var(--radius-sm) var(--radius-sm);overflow:hidden;max-width:500px;display:none"></div>'
    +'</div>'
    +'<div class="empty-state"><div class="icon">🐣</div>Suche eine Taube, um alle Kinder, Enkel und Urenkel anzuzeigen</div>';
}

function findChildren(pigeonId){
  var p=S.pigeons.find(function(x){return x.pigeonid===pigeonId;});
  var rn=p?p.ringnumber:'';
  return S.pigeons.filter(function(c){
    return c.fatherid===pigeonId||c.motherid===pigeonId||(rn&&(c.ringnumberfather===rn||c.ringnumbermother===rn));
  });
}

function statusStyle(p){
  if(p.died) return {label:'Verstorben',color:'#e07070',bg:'#1e0f0f'};
  if(p.sold) return {label:'Verkauft',color:'var(--orange)',bg:'#2a1a0a'};
  if(p.instock===false) return {label:'Nicht im Bestand',color:'#c8883a',bg:'#2a1a0a'};
  if(sex_(p)==='M') return {label:'Täuber (aktiv)',color:'#7ab3e0',bg:'#1a2d4a'};
  if(sex_(p)==='F') return {label:'Täubin (aktiv)',color:'#c97fd4',bg:'#2d1a3d'};
  return {label:'Im Bestand',color:'var(--green)',bg:'color-mix(in srgb,var(--green) 10%,var(--bg3))'};
}

function birdCard(p){
  var via=p._via?findById(p._via):null;
  return '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;cursor:pointer;transition:border-color .15s"'
    +' onmouseover="this.style.borderColor=\'var(--green)\'" onmouseout="this.style.borderColor=\'var(--border)\'"'
    +' onclick="selectPigeon(\''+p.pigeonid+'\')">'
    +'<div style="font-family:monospace;font-size:11px;color:var(--green)">'+escH(ring(p))+'</div>'
    +(p.name?'<div style="font-size:13px;font-weight:500;color:var(--text);margin-top:2px">'+escH(p.name)+'</div>':'')
    +'<div style="font-size:11px;color:var(--text3);margin-top:3px">'
    +[p.date_year,p.color,p.strain].filter(Boolean).map(escH).join(' · ')
    +'</div>'
    +(via?'<div style="font-size:10px;color:var(--text3);margin-top:3px">via <span style="font-family:monospace;color:var(--blue)">'+escH(ring(via))+'</span></div>':'')
    +'<div style="display:flex;gap:6px;margin-top:7px">'
    +'<span onclick="event.stopPropagation();showPedigree(\''+p.pigeonid+'\')" style="font-size:11px;color:var(--text3);cursor:pointer;padding:2px 7px;border:1px solid var(--border);border-radius:4px"'
    +' onmouseover="this.style.color=\'var(--green)\'" onmouseout="this.style.color=\'var(--text3)\'">🌳 Stamm</span>'
    +'<span onclick="event.stopPropagation();showNachkommen(\''+p.pigeonid+'\')" style="font-size:11px;color:var(--text3);cursor:pointer;padding:2px 7px;border:1px solid var(--border);border-radius:4px"'
    +' onmouseover="this.style.color=\'var(--green)\'" onmouseout="this.style.color=\'var(--text3)\'">🐣 Kinder</span>'
    +'</div></div>';
}

function renderGen(arr,gen){
  if(!arr.length) return '<div style="color:var(--text3);font-size:13px;padding:8px 0">Keine '+gen+' in der Datenbank erfasst.</div>';
  var groups={};
  arr.forEach(function(p){
    var st=statusStyle(p);
    if(!groups[st.label]) groups[st.label]={style:st,birds:[]};
    groups[st.label].birds.push(p);
  });
  return Object.values(groups).map(function(g){
    return '<div style="margin-bottom:14px">'
      +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'
      +'<span style="background:'+g.style.bg+';color:'+g.style.color+';padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500">'+g.style.label+'</span>'
      +'<span style="font-size:12px;color:var(--text3)">'+g.birds.length+' Taube'+(g.birds.length!==1?'n':'')+'</span>'
      +'</div>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px">'
      +g.birds.map(birdCard).join('')
      +'</div></div>';
  }).join('');
}

function renderNachkommen(pid){
  var root=findById(pid);
  if(!root) return '<div style="padding:20px;color:var(--text3)">Taube nicht gefunden.</div>';
  function dedup(arr){var seen=new Set();return arr.filter(function(p){if(seen.has(p.pigeonid))return false;seen.add(p.pigeonid);return true;});}
  var children=findChildren(pid);
  var gc=dedup(children.flatMap(function(c){return findChildren(c.pigeonid).map(function(g){return Object.assign({},g,{_via:c.pigeonid});});}));
  var ggc=dedup(gc.flatMap(function(g){return findChildren(g.pigeonid).map(function(gg){return Object.assign({},gg,{_via:g.pigeonid});});}));
  var allDesc=dedup(children.concat(gc).concat(ggc));
  var total=allDesc.length;
  var active=allDesc.filter(function(p){return p.instock;}).length;
  var died=allDesc.filter(function(p){return p.died;}).length;
  var sold=allDesc.filter(function(p){return p.sold;}).length;
  var sx=sex_(root);

  var kpis=[['Nachkommen',total,'var(--green)'],['Kinder',children.length,'var(--blue)'],['Enkel',gc.length,'var(--purple)'],['Urenkel',ggc.length,'var(--text2)'],['Im Bestand',active,'var(--green)'],['Verstorben',died,'#e07070'],['Verkauft',sold,'var(--orange)']];
  var kpiHtml=kpis.map(function(k){
    return '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;text-align:center">'
      +'<div style="font-family:\'Playfair Display\',serif;font-size:24px;color:'+k[2]+';font-weight:600">'+k[1]+'</div>'
      +'<div style="font-size:11px;color:var(--text3);margin-top:3px">'+k[0]+'</div></div>';
  }).join('');

  var gens=[['🐣 Kinder (1. Generation)',children,'Kinder'],['🐓 Enkel (2. Generation)',gc,'Enkel'],['🥚 Urenkel (3. Generation)',ggc,'Urenkel']];
  var genHtml=gens.map(function(g){
    return '<div class="card" style="margin-bottom:12px">'
      +'<div class="card-title">'+g[0]+' <span style="color:var(--text3);font-weight:400">('+g[1].length+')</span></div>'
      +renderGen(g[1],g[2])+'</div>';
  }).join('');

  return '<div class="card" style="margin-bottom:12px">'
    +'<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px">'
    +'<div>'
    +'<div class="serif" style="font-size:22px">'+escH(root.name||ring(root))+'</div>'
    +'<div style="font-family:monospace;font-size:13px;color:var(--green);margin-top:4px">'
    +escH(ring(root))+' · '+(sx==='M'?'♂ Täuber':sx==='F'?'♀ Täubin':'?')+' · Jg. '+(root.date_year||'—')
    +'</div></div>'
    +'</div>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px">'+kpiHtml+'</div>'
    +'</div>'+genHtml;
}

function bindNachSearch(){
  var inp=document.getElementById('nach-inp');
  var res=document.getElementById('nach-results');
  if(!inp||!res) return;
  inp.addEventListener('input',function(){
    var q=inp.value.trim();
    if(q.length<2){res.style.display='none';res.innerHTML='';return;}
    var hits=S.pigeons.filter(function(p){
      return (p.ringnumber||'').toLowerCase().indexOf(q.toLowerCase())!==-1
          ||(p.name||'').toLowerCase().indexOf(q.toLowerCase())!==-1;
    }).slice(0,10);
    res.style.display='block';
    res.innerHTML=hits.length?hits.map(function(p){
      return '<div class="ped-result" onclick="showNachkommen(\''+p.pigeonid+'\')">'
        +'<span class="ring">'+escH(ring(p))+'</span>'
        +(p.name?'<span style="color:var(--text)">'+escH(p.name)+'</span>':'')
        +'<span style="color:var(--text3);font-size:12px;margin-left:auto">'+(sex_(p)==='M'?'♂':'♀')+' '+(p.date_year||'')+'</span>'
        +'</div>';
    }).join(''):'<div style="padding:12px;color:var(--text3);font-size:13px">Keine Treffer</div>';
  });
}
