async function runTripsImport(){
  RT.imp.stats={trips:0,tripsUpdated:0,results:0,resultsNew:0,resultsUpdated:0,err:0};
  // Nur die in der Vorschau angehakten Reisen werden tatsächlich importiert —
  // abgewählte (z.B. bereits vorhandene) Reisen werden komplett übersprungen,
  // damit ein Re-Import nicht jedes Mal wieder von vorne durch die ganze Datei läuft.
  const selectedRows = RT.imp.rows.filter(r=>r.selected!==false);
  RT.imp.step='importing'; render();
  const setS=t=>{const el=document.getElementById('trips-status');if(el)el.textContent=t;};
  const updP=()=>{
    const total=selectedRows.reduce((s,r)=>s+r.results.length,0);
    const pct=total?Math.round(RT.imp.stats.results/total*100):0;
    const bar=document.getElementById('trips-bar');
    if(bar)bar.style.width=pct+'%';
    const lbl=document.getElementById('trips-status');
    if(lbl)lbl.textContent=RT.imp.stats.results+' von '+total+' ('+pct+'%)';
  };

  // Sammle alle tripids dieser Session für Duplikat-Check. WICHTIG: Immer frisch
  // und VOLLSTÄNDIG (nicht die für die Reisen-Übersicht auf 500 Zeilen gedeckelte
  // RT.trips!) direkt aus der DB laden — sonst werden Reisen übersehen, die z.B.
  // schon in einer früheren Import-Sitzung (ohne Seiten-Neuladen dazwischen) oder
  // auf einem anderen Gerät angelegt wurden, und es entstehen doppelte Reisen,
  // wenn später eine weitere Züchter-Datei für dieselbe Reise nachgereicht wird.
  setS('Prüfe bereits vorhandene Reisen…');
  let sessionTrips;
  try{ sessionTrips = await apiGetAll('/trips?select=*'); }
  catch(e){ sessionTrips=[...RT.trips]; } // Fallback, falls apiGetAll scheitert
  const touchedTripIds=new Set();
  // Ass-Kategorie-Flags (A/B/C/D) werden nur EINMAL pro Jahr auf einem Flug
  // gesetzt. Sie werden am Flug-Ergebnis (pigeontrips) gespeichert, damit
  // sie auch für Tauben ohne Zuordnung zur eigenen DB verfügbar sind.

  for(const item of selectedRows){
    const t=item.trip;
    setS('Reise '+t.number+' — '+t.location+'…');
    const normL=s=>(s||'').toLowerCase().trim().replace(/\s+/g,' ');
    // Abgleich über Jahrgang+Ort+Datum, NICHT über die Reisenummer (die ist
    // je Züchter-Datei eine eigene, fortlaufende Zählung und kann für
    // dieselbe physische Reise zwischen Züchtern abweichen).
    const existing=sessionTrips.find(x=>
      x.vintage===t.vintage && normL(x.location)===normL(t.location) &&
      (x.tripdate||'')===(t.tripdate||'')
    );
    let tripid;
    if(existing){
      // Reise existiert bereits → aktualisieren statt doppelt anzulegen.
      // Nur Felder überschreiben, zu denen die neue Datei tatsächlich Werte liefert.
      tripid=existing.tripid;
      const upd={};
      if(t.tripdate) upd.tripdate=t.tripdate;
      ['prices1','prices2','prices3','prices4','prices5','averagedistance3'].forEach(k=>{ if(t[k]) upd[k]=t[k]; });
      // Immer setzen (auch auf null), NICHT nur wenn >0: sonst bleibt bei
      // Flügen, wo eine Liste zwischenzeitlich wegfällt (z.B. RV ab Flug 10/11,
      // weil zu wenig Tauben für eine eigene Auswertung), der alte/falsche Wert
      // aus einem früheren Import für immer stehen.
      if('g_rv' in t)    upd.pigeonsset_rv=t.g_rv||null;
      if('g_reggr' in t) upd.pigeonsset_reggr=t.g_reggr||null;
      if('g_reg' in t)   upd.pigeonsset_reg=t.g_reg||null;
      if(Object.keys(upd).length){
        try{ await apiPatchBy('trips','tripid=eq.'+tripid,upd); }
        catch(e2){
          // Fallback: pigeonsset_rv/_reggr/_reg-Spalten evtl. noch nicht angelegt
          delete upd.pigeonsset_rv; delete upd.pigeonsset_reggr; delete upd.pigeonsset_reg;
          if(Object.keys(upd).length){ try{ await apiPatchBy('trips','tripid=eq.'+tripid,upd); }catch(e3){} }
        }
        Object.assign(existing,upd);
        RT.imp.stats.tripsUpdated++;
      }
    } else {
      tripid=crypto.randomUUID();
      try{
        const row={tripid,vintage:t.vintage||null,number:t.number||null,
          location:t.location||null,tripdate:t.tripdate||null,pigeonsset:t.pigeonsset||null};
        ['prices1','prices2','prices3','prices4','prices5','averagedistance3']
          .forEach(k=>{ if(t[k]) row[k]=t[k]; });
        const catRow={...row};
        if('g_rv' in t)    catRow.pigeonsset_rv=t.g_rv||null;
        if('g_reggr' in t) catRow.pigeonsset_reggr=t.g_reggr||null;
        if('g_reg' in t)   catRow.pigeonsset_reg=t.g_reg||null;
        try{
          await apiPost('trips',catRow);
        } catch(e2){
          // Fallback: pigeonsset_rv/_reggr/_reg-Spalten evtl. noch nicht angelegt
          await apiPost('trips',row);
        }
        RT.imp.stats.trips++;
        sessionTrips.push(row); // sofort für nächste Iteration verfügbar
      } catch(e){
        console.error('Reise Fehler:',e.message);
        RT.imp.stats.err+=item.results.length;
        RT.imp.stats.results+=item.results.length;
        updP(); continue;
      }
    }

    // Vorhandene Ergebnisse dieser Reise laden, um Doppel-Einträge zu vermeiden.
    // Primärer Abgleich: NUR über die Ringnummer — die ist pro Taube eindeutig,
    // unabhängig davon, wie der Züchtername in der jeweiligen Import-Datei
    // geschrieben/kodiert ist. Fehlt die Ringnummer (z.B. nicht identifizierte
    // Taube), wird als Fallback die — vollständige, kanonisierte — Züchter-
    // NUMMER zur Unterscheidung herangezogen, NICHT der Züchtername: der
    // Name kam beim Re-Import schon mal mit einer anderen Zeichenkodierung
    // rein ("Kersting/Soehne" vs. "Kersting/S”hne" durch ein falsch kodiertes
    // "ö"), wodurch das Update nicht mehr griff und ungewollt Duplikate
    // angelegt wurden — die Züchternummer ist von so etwas nicht betroffen.
    // Nur falls auch keine Züchternummer vorhanden ist, zählt notgedrungen
    // der (tolerant normalisierte) Züchtername als letzter Fallback.
    const normBreeder=s=>(s||'').toLowerCase().trim().replace(/\s+/g,' ');
    const breederFallbackKey=r=>{
      const num=canonicalizeZuechternummer(r.breedernumber);
      return (num!=null && num!=='') ? 'num:'+num : 'name:'+normBreeder(r.breedername);
    };
    touchedTripIds.add(tripid);
    let existingResults=[];
    try{
      existingResults = await apiGet('/pigeontrips?tripid=eq.'+tripid+'&select=id,ringnumber,breedername,breedernumber') || [];
    }catch(e){ existingResults=[]; }
    const existingByRing={}, existingByKey={};
    existingResults.forEach(r=>{
      const rn=normRing(r.ringnumber);
      if(rn) existingByRing[rn]=r.id;
      existingByKey[rn+'|'+breederFallbackKey(r)]=r.id;
    });

    await runWithConcurrency(item.results, 8, async(res)=>{
      try{
        const rn=normRing(res.ringnumber);
        const existingId = (rn && existingByRing[rn]) || existingByKey[rn+'|'+breederFallbackKey(res)];
        const row={};
        const setIf=(k,v)=>{ if(v!=null) row[k]=v; };
        // Platzierungs- und AS-Felder IMMER explizit setzen (auch null) — sonst
        // bleiben bei einem Re-Import alte, fehlerhafte Werte aus einem früheren
        // Import (z.B. vor der RegGr/Reg-Korrektur) unbemerkt stehen, weil setIf
        // ein null einfach überspringen würde statt das Feld zu leeren.
        const setAlways=(k,v)=>{ row[k]=(v===undefined?null:v); };
        setIf('pigeonid',res.pigeonid); setIf('ringnumber',res.ringnumber);
        setIf('placement',res.placement); setIf('speed',res.speed);
        setIf('maxkm',res.maxkm);
        setAlways('prize_rv',res.prize_rv); setAlways('prize_fg',res.prize_fg);
        setAlways('prize_reggr',res.prize_reggr); setAlways('prize_reg',res.prize_reg);
        setAlways('as_rv',res.as_rv); setAlways('as_fg',res.as_fg); setAlways('as_reg',res.as_reg); setAlways('as_nat',res.as_nat);
        setIf('breedername',res.breedername); setIf('breedernumber',res.breedernumber);
        setIf('sex',res.sex);
        // Vorbenennungs-Flags (V/J/M), je Flug
        setAlways('v_flag',!!res.v_flag); setAlways('v_platz',res.v_platz);
        setAlways('j_flag',!!res.j_flag); setAlways('j_platz',res.j_platz);
        setAlways('m_flag',!!res.m_flag); setAlways('m_platz',res.m_platz);
        // Ass-Kategorien A-D: gehören inhaltlich zur Taube (nur 1x/Jahr
        // gesetzt), werden aber am Flug-Ergebnis gespeichert, damit sie
        // auch für Tauben ohne Zuordnung zur eigenen Datenbank verfügbar
        // sind (Bestenliste wertet ALLE geflogenen Tauben aus, nicht nur
        // die in der eigenen DB erfassten).
        setAlways('ass_a',!!res.ass_a); setAlways('ass_b',!!res.ass_b);
        setAlways('ass_c',!!res.ass_c); setAlways('ass_d',!!res.ass_d);
        const flagFields=['v_flag','v_platz','j_flag','j_platz','m_flag','m_platz','ass_a','ass_b','ass_c','ass_d','as_fg'];
        const doWrite=async(r)=>{
          if(existingId){
            // Supabase PATCH mit "Prefer: return=representation" liefert die
            // geänderten Zeilen zurück. Kommt hier ein LEERES Array, obwohl
            // wir die Zeile über existingByKey sicher gefunden hatten, dann
            // hat vermutlich eine RLS-Policy die UPDATE-Zeile (WHERE-Klausel)
            // gefiltert — typischerweise weil die Policy an pigeonid/eine
            // JOIN-Bedingung gekoppelt ist und bei pigeonid=NULL (Taube ohne
            // DB-Zuordnung) leer läuft. KEIN Fehler/Exception, daher sonst
            // unbemerkt — wir zählen das separat mit.
            const res2 = await apiPatchBy('pigeontrips','id=eq.'+existingId,r);
            if(Array.isArray(res2) && res2.length===0) RT.imp.stats.rlsBlocked++;
          } else {
            await apiPost('pigeontrips',{id:crypto.randomUUID(),tripid,...r});
          }
        };
        try{
          await doWrite(row);
        }catch(e2){
          // Fallback 1: V/J/M/Ass-Spalten evtl. noch nicht angelegt
          const r2={...row};
          flagFields.forEach(k=>delete r2[k]);
          try{
            await doWrite(r2);
          }catch(e3){
            // Fallback 2: sex-Spalte evtl. auch noch nicht angelegt
            if(r2.sex){ const r4={...r2}; delete r4.sex; await doWrite(r4); }
            else throw e3;
          }
        }
        if(existingId) RT.imp.stats.resultsUpdated++; else RT.imp.stats.resultsNew++;
        RT.imp.stats.results++;
      } catch(e){ RT.imp.stats.err++; }
      if(RT.imp.stats.results%25===0) updP();
    });

    // Gesamtreihenfolge ("Pl.") über ALLE Züchter dieser Reise neu berechnen —
    // nicht nur über die gerade importierte Sitzung. Sonst bekommt jede
    // getrennt importierte Züchter-Datei ihre eigene 1,2,3…-Zählung und die
    // Spalte "Pl." stimmt nicht mehr, sobald mehrere Züchter zu unterschied-
    // lichen Zeitpunkten importiert wurden.
    try{
      const allForTrip = await apiGet('/pigeontrips?tripid=eq.'+tripid+'&select=id,speed,placement&limit=2000') || [];
      const ranked = allForTrip.slice().sort((a,b)=>{
        if(a.speed!=null && b.speed!=null) return b.speed-a.speed;
        if(a.speed!=null) return -1;
        if(b.speed!=null) return 1;
        return 0;
      });
      const toUpdate = ranked.map((r,i)=>({id:r.id,newPl:i+1})).filter((r,i)=>r.newPl!==ranked[i].placement);
      await runWithConcurrency(toUpdate, 8, async(u)=>{
        try{ await apiPatchBy('pigeontrips','id=eq.'+u.id,{placement:u.newPl}); }catch(e2){}
      });
    }catch(e){ console.error('Gesamtplatzierung neu berechnen fehlgeschlagen:',e.message); }
  }
  updP();
  await loadTrips();
  ZT.loaded=false;
  // Für alle in diesem Import berührten Flüge OHNE eigene RV-Liste (zu wenig
  // Tauben) jetzt die RV-Rangliste selbst berechnen und dauerhaft speichern
  // (siehe computeRVFallback/backfillRVFallback) — wirkt dann automatisch in
  // Bestenliste, Stammbaum-Top10 und Flug-Detail.
  for(const tid of touchedTripIds){
    const tr = RT.trips.find(x=>x.tripid===tid);
    if(tr && !tr.pigeonsset_rv){ try{ await backfillRVFallback(tid); }catch(e){} }
  }
  clearPTCache();
  RT.imp.step='done'; render();
}

// ── Duplikate bereinigen ──────────────────────────────────────────────
// Findet Reisen, die versehentlich mehrfach angelegt wurden (gleicher
// Jahrgang, Ort und Datum) — das passiert typischerweise, wenn für dieselbe
// Reise Züchter-Dateien in getrennten Sitzungen nachimportiert werden.
// runTripsImport() gleicht seit Kurzem vor JEDEM Import frisch und
// vollständig (statt der auf 500 Zeilen gedeckelten Übersichtsliste) gegen
// die DB ab, um das künftig zu verhindern — dieses Werkzeug bereinigt
// bereits vorhandene Altfälle.
let DUPE = { scanning:false, groups:null, fuzzyGroups:null, resultGroups:null, resultScanning:false, resultError:null, error:null, merging:false, log:[] };

async function scanDuplicateTrips(){
  DUPE.scanning=true; DUPE.groups=null; DUPE.error=null; DUPE.log=[]; updateDupeModal();
  try{
    const all = await apiGetAll('/trips?select=*');
    const normL=s=>(s||'').toLowerCase().trim().replace(/\s+/g,' ');
    const map={};
    all.forEach(function(t){
      const key=(t.vintage||'?')+'|'+normL(t.location)+'|'+(t.tripdate||'?');
      (map[key]=map[key]||[]).push(t);
    });
    const groups = Object.values(map).filter(function(g){ return g.length>1; });
    const allIds = [];
    groups.forEach(function(g){ g.forEach(function(t){ allIds.push(t.tripid); }); });
    const counts = {};
    for(let i=0;i<allIds.length;i+=100){
      const chunk = allIds.slice(i,i+100);
      let rows=[];
      try{ rows = await apiGet('/pigeontrips?tripid=in.('+chunk.join(',')+')&select=id,tripid'); }catch(e){}
      (rows||[]).forEach(function(r){ counts[r.tripid]=(counts[r.tripid]||0)+1; });
    }
    // Je Gruppe: die "vollständigste" Reise zuerst (bleibt als Ziel bestehen) —
    // bevorzugt eine, für die bereits eine eigene RV-Liste importiert wurde,
    // sonst die mit den meisten erfassten Ergebnissen/gesetzten Tauben.
    groups.forEach(function(g){
      g.forEach(function(t){ t._resultCount = counts[t.tripid]||0; });
      g.sort(function(a,b){
        const rvA=a.pigeonsset_rv?1:0, rvB=b.pigeonsset_rv?1:0;
        if(rvB!==rvA) return rvB-rvA;
        if(b._resultCount!==a._resultCount) return b._resultCount-a._resultCount;
        return (b.pigeonsset||0)-(a.pigeonsset||0);
      });
    });
    groups.sort(function(a,b){ return (b[0].tripdate||'').localeCompare(a[0].tripdate||''); });
    DUPE.groups = groups;

    // Zweiter, weicherer Scan: Reisen mit gleichem Jahrgang + Datum, ÄHNLICHEM
    // Ortsnamen (Tippfehler/Zusatz) UND ähnlicher Durchschnittsdistanz.
    // WICHTIG: Nur Datum + abweichender Ortsname reicht NICHT als Kriterium —
    // wenn sich ein Reiseverein für einzelne Flüge in mehrere Teil-RVs
    // aufteilt (z.B. nur für die ersten Flüge der Saison getrennt geflogen
    // wird), gibt es am selben Tag mehrere ECHTE, unterschiedliche Reisen mit
    // unterschiedlichem Ort UND unterschiedlicher Distanz — das darf nicht als
    // Duplikat vorgeschlagen werden. Ein echtes Schreibweise-Duplikat betrifft
    // dagegen dieselbe physische Reise und hat daher eine (fast) identische
    // Durchschnittsdistanz. Diese Vorschläge werden trotzdem NIE automatisch
    // zusammengeführt, sondern nur zur manuellen Prüfung angezeigt.
    function levenshtein(a,b){
      a=a||''; b=b||''; const m=a.length, n=b.length;
      if(!m) return n; if(!n) return m;
      const dp=new Array(n+1); for(let j=0;j<=n;j++) dp[j]=j;
      for(let i=1;i<=m;i++){
        let prev=dp[0]; dp[0]=i;
        for(let j=1;j<=n;j++){
          const tmp=dp[j];
          dp[j]=Math.min(dp[j]+1, dp[j-1]+1, prev+(a[i-1]===b[j-1]?0:1));
          prev=tmp;
        }
      }
      return dp[n];
    }
    const byDate = {};
    all.forEach(function(t){
      if(!t.tripdate) return;
      const dk=(t.vintage||'?')+'|'+t.tripdate;
      (byDate[dk]=byDate[dk]||[]).push(t);
    });
    const fuzzyGroups = [];
    Object.values(byDate).forEach(function(g){
      if(g.length<2) return;
      // Union-Find, um innerhalb eines Tages nur wirklich ähnliche Paare zu clustern
      const parent = g.map(function(_,i){ return i; });
      function find(x){ while(parent[x]!==x){ x=parent[x]; } return x; }
      function union(x,y){ const rx=find(x), ry=find(y); if(rx!==ry) parent[rx]=ry; }
      for(let i=0;i<g.length;i++){
        for(let j=i+1;j<g.length;j++){
          const a=g[i], b=g[j];
          const la=normL(a.location), lb=normL(b.location);
          if(la===lb) continue; // exakte Übereinstimmung -> schon im ersten Scan erfasst
          const textSimilar = levenshtein(la,lb)<=3 || la.indexOf(lb)>=0 || lb.indexOf(la)>=0;
          if(!textSimilar) continue;
          const da=a.averagedistance3, db=b.averagedistance3;
          if(da==null || db==null) continue; // ohne Distanz keine verlässliche Aussage -> nicht vorschlagen
          const diff = Math.abs(Number(da)-Number(db));
          const distSimilar = diff<=10 || diff<=0.06*Math.max(Number(da),Number(db));
          if(!distSimilar) continue;
          union(i,j);
        }
      }
      const clusters={};
      g.forEach(function(t,i){ const r=find(i); (clusters[r]=clusters[r]||[]).push(t); });
      Object.values(clusters).forEach(function(c){ if(c.length>1) fuzzyGroups.push(c); });
    });
    fuzzyGroups.forEach(function(g){
      g.forEach(function(t){ t._resultCount = counts[t.tripid]!=null?counts[t.tripid]:null; });
    });
    // Ergebnis-Anzahl für die Fuzzy-Kandidaten separat nachladen (waren nicht
    // Teil der Ids oben, da nicht im exakten Duplikat-Scan enthalten)
    const fuzzyIds = [];
    fuzzyGroups.forEach(function(g){ g.forEach(function(t){ if(t._resultCount==null) fuzzyIds.push(t.tripid); }); });
    for(let i=0;i<fuzzyIds.length;i+=100){
      const chunk = fuzzyIds.slice(i,i+100);
      let rows=[];
      try{ rows = await apiGet('/pigeontrips?tripid=in.('+chunk.join(',')+')&select=id,tripid'); }catch(e){}
      const c2={}; (rows||[]).forEach(function(r){ c2[r.tripid]=(c2[r.tripid]||0)+1; });
      fuzzyGroups.forEach(function(g){ g.forEach(function(t){ if(fuzzyIds.indexOf(t.tripid)>=0 && c2[t.tripid]!=null) t._resultCount=c2[t.tripid]; }); });
    }
    fuzzyGroups.forEach(function(g){
      g.forEach(function(t){ if(t._resultCount==null) t._resultCount=0; });
      g.sort(function(a,b){
        const rvA=a.pigeonsset_rv?1:0, rvB=b.pigeonsset_rv?1:0;
        if(rvB!==rvA) return rvB-rvA;
        if(b._resultCount!==a._resultCount) return b._resultCount-a._resultCount;
        return (b.pigeonsset||0)-(a.pigeonsset||0);
      });
    });
    fuzzyGroups.sort(function(a,b){ return (b[0].tripdate||'').localeCompare(a[0].tripdate||''); });
    DUPE.fuzzyGroups = fuzzyGroups;
  }catch(e){ DUPE.error = e.message||'Unbekannter Fehler'; }
  DUPE.scanning=false; updateDupeModal();
}

// Führt eine Gruppe doppelter Reisen zusammen: group[0] bleibt bestehen (Ziel),
// alle weiteren werden hineingeführt und danach gelöscht. Ergebnisse (pigeontrips)
// werden verschoben — außer ein Ergebnis mit gleichem Ring+Züchter existiert
// bereits im Ziel (z.B. weil dieselbe Züchter-Datei versehentlich zweimal
// importiert wurde); dann wird die echte Dopplung gelöscht statt verschoben.
async function mergeDuplicateGroup(group){
  const primary = group[0];
  const dupes = group.slice(1);
  let movedResults=0, deletedDupeResults=0;
  for(const dup of dupes){
    let primRows=[], dupRows=[];
    try{ primRows = await apiGet('/pigeontrips?tripid=eq.'+primary.tripid+'&select=id,ringnumber,breedername')||[]; }catch(e){}
    try{ dupRows = await apiGet('/pigeontrips?tripid=eq.'+dup.tripid+'&select=id,ringnumber,breedername')||[]; }catch(e){}
    const key=function(r){ return (r.ringnumber||'')+'|'+(r.breedername||''); };
    const primKeys = new Set(primRows.map(key));
    for(const r of dupRows){
      if(primKeys.has(key(r))){
        try{ await apiDeleteBy('pigeontrips','id=eq.'+r.id); deletedDupeResults++; }catch(e){}
      } else {
        try{ await apiPatchBy('pigeontrips','id=eq.'+r.id,{tripid:primary.tripid}); movedResults++; primKeys.add(key(r)); }catch(e){}
      }
    }
    // Fehlende Felder der Ziel-Reise aus der Dublette auffüllen (nur wenn dort noch leer)
    const upd={};
    ['prices1','prices2','prices3','prices4','prices5','averagedistance3','pigeonsset_rv','pigeonsset_reggr','pigeonsset_reg'].forEach(function(k){
      if((primary[k]==null||primary[k]==='') && dup[k]!=null && dup[k]!=='') upd[k]=dup[k];
    });
    if(Object.keys(upd).length){
      try{ await apiPatchBy('trips','tripid=eq.'+primary.tripid,upd); Object.assign(primary,upd); }catch(e){}
    }
    try{ await apiDeleteBy('trips','tripid=eq.'+dup.tripid); }catch(e){}
  }
  try{
    const finalRows = await apiGet('/pigeontrips?tripid=eq.'+primary.tripid+'&select=id')||[];
    await apiPatchBy('trips','tripid=eq.'+primary.tripid,{pigeonsset:finalRows.length});
  }catch(e){}
  return {movedResults:movedResults, deletedDupeResults:deletedDupeResults, mergedTrips:dupes.length, location:primary.location, tripdate:primary.tripdate};
}

async function mergeOneDuplicateGroup(idx){
  if(DUPE.merging || !DUPE.groups || !DUPE.groups[idx]) return;
  DUPE.merging=true; updateDupeModal();
  const group = DUPE.groups[idx];
  try{
    const r = await mergeDuplicateGroup(group);
    DUPE.log.unshift((r.location||'?')+' · '+(r.tripdate||'?')+': '+r.mergedTrips+' Dublette(n) zusammengeführt, '+r.movedResults+' Ergebnisse übernommen'+(r.deletedDupeResults?', '+r.deletedDupeResults+' echte Dopplung(en) entfernt':'')+'.');
    DUPE.groups.splice(idx,1);
  }catch(e){ DUPE.log.unshift('Fehler: '+e.message); }
  DUPE.merging=false;
  await loadTrips(); clearPTCache(); ZT.loaded=false;
  updateDupeModal();
}
async function mergeAllDuplicateGroups(){
  if(DUPE.merging || !DUPE.groups || !DUPE.groups.length) return;
  DUPE.merging=true; updateDupeModal();
  while(DUPE.groups.length){
    const group = DUPE.groups[0];
    try{
      const r = await mergeDuplicateGroup(group);
      DUPE.log.unshift((r.location||'?')+' · '+(r.tripdate||'?')+': '+r.mergedTrips+' Dublette(n) zusammengeführt, '+r.movedResults+' Ergebnisse übernommen'+(r.deletedDupeResults?', '+r.deletedDupeResults+' echte Dopplung(en) entfernt':'')+'.');
    }catch(e){ DUPE.log.unshift('Fehler: '+e.message); }
    DUPE.groups.shift();
    updateDupeModal();
  }
  DUPE.merging=false;
  await loadTrips(); clearPTCache(); ZT.loaded=false;
  updateDupeModal();
}

// ── Ergebnis-Duplikate (dritter Scan, über die Flugzeit statt über Reise-
// Metadaten) ────────────────────────────────────────────────────────────
// Manche Duplikate entstehen nicht durch eine simple Doppel-Anlage derselben
// Reise, sondern dadurch, dass für denselben physischen Flug zwei
// verschiedene Ranglisten (z.B. Teil-RV-Liste und übergeordnete VO-/Reg-
// Gesamtliste) je einen EIGENEN Reise-Datensatz mit unterschiedlicher
// Distanzangabe erzeugt haben — Ort und/oder Datum können dabei leicht
// abweichen, weshalb weder der exakte noch der Fuzzy-Scan (der bewusst nur
// bei ÄHNLICHER Distanz anschlägt) das erkennt. Verlässlicher Fingerabdruck
// für "ist derselbe Flug": die Fluggeschwindigkeit (m/min) einer Taube ist
// auf 3 Nachkommastellen identisch — das ist bei zwei wirklich verschiedenen
// Flügen praktisch ausgeschlossen. Zählt man das über mehrere Tauben hinweg
// (mind. 2 Tauben mit exakt gleicher Geschwindigkeit auf zwei verschiedenen
// Reisen), ist das ein sehr starkes Duplikat-Signal für die beiden Reisen.
async function scanResultDuplicates(){
  DUPE.resultScanning=true; DUPE.resultGroups=null; DUPE.resultError=null; updateDupeModal();
  try{
    const allTrips = await apiGetAll('/trips?select=tripid,location,tripdate,vintage,pigeonsset_rv,pigeonsset');
    const tripById={}; allTrips.forEach(function(t){ tripById[t.tripid]=t; });
    const tripIds = allTrips.map(function(t){ return t.tripid; });
    const byRingSpeed={};
    for(let i=0;i<tripIds.length;i+=60){
      const chunk = tripIds.slice(i,i+60);
      let rows=[];
      try{ rows = await apiGetAll('/pigeontrips?tripid=in.('+chunk.join(',')+')&select=tripid,ringnumber,speed&speed=not.is.null'); }catch(e){}
      rows.forEach(function(r){
        if(r.speed==null || !r.ringnumber) return;
        const key = String(r.ringnumber).trim().toUpperCase()+'|'+Number(r.speed).toFixed(3);
        (byRingSpeed[key]=byRingSpeed[key]||new Set()).add(r.tripid);
      });
    }
    const pairVotes={};
    Object.values(byRingSpeed).forEach(function(set){
      const uniq=[...set];
      if(uniq.length<2) return;
      for(let i=0;i<uniq.length;i++) for(let j=i+1;j<uniq.length;j++){
        const key=[uniq[i],uniq[j]].sort().join('|');
        pairVotes[key]=(pairVotes[key]||0)+1;
      }
    });
    // Nur Paare, bei denen MINDESTENS 2 unterschiedliche Tauben dieselbe
    // Flugzeit auf beiden Reisen zeigen — ein einzelner Treffer könnte
    // theoretisch Zufall sein, zwei sind es praktisch nicht.
    const strongPairs = Object.entries(pairVotes).filter(function(e){ return e[1]>=2; });
    const parentMap={};
    function find(x){ if(!(x in parentMap)) parentMap[x]=x; while(parentMap[x]!==x){ x=parentMap[x]; } return x; }
    function union(x,y){ const rx=find(x),ry=find(y); if(rx!==ry) parentMap[rx]=ry; }
    strongPairs.forEach(function(e){ const parts=e[0].split('|'); union(parts[0],parts[1]); });
    const clusters={};
    Object.keys(parentMap).forEach(function(id){ const r=find(id); (clusters[r]=clusters[r]||[]).push(id); });
    const groups = Object.values(clusters).map(function(ids){
      let votes=0;
      for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++){
        const k=[ids[i],ids[j]].sort().join('|');
        votes=Math.max(votes,pairVotes[k]||0);
      }
      const trips = ids.map(function(id){ return tripById[id]; }).filter(Boolean).sort(function(a,b){
        const rvA=a.pigeonsset_rv?1:0, rvB=b.pigeonsset_rv?1:0;
        if(rvB!==rvA) return rvB-rvA;
        return (b.pigeonsset||0)-(a.pigeonsset||0);
      });
      trips._votes = votes;
      return trips;
    }).filter(function(g){ return g.length>1; });
    groups.sort(function(a,b){ return (b._votes||0)-(a._votes||0); });
    DUPE.resultGroups = groups;
  }catch(e){ DUPE.resultError = e.message||'Unbekannter Fehler'; }
  DUPE.resultScanning=false; updateDupeModal();
}

async function mergeOneResultGroup(idx){
  if(DUPE.merging || !DUPE.resultGroups || !DUPE.resultGroups[idx]) return;
  DUPE.merging=true; updateDupeModal();
  const group = DUPE.resultGroups[idx];
  try{
    const r = await mergeDuplicateGroup(group);
    DUPE.log.unshift((r.location||'?')+' · '+(r.tripdate||'?')+': '+r.mergedTrips+' Ergebnis-Dublette(n) zusammengeführt, '+r.movedResults+' Ergebnisse übernommen'+(r.deletedDupeResults?', '+r.deletedDupeResults+' echte Dopplung(en) entfernt':'')+'.');
    DUPE.resultGroups.splice(idx,1);
  }catch(e){ DUPE.log.unshift('Fehler: '+e.message); }
  DUPE.merging=false;
  await loadTrips(); clearPTCache(); ZT.loaded=false;
  updateDupeModal();
}

// Zeigt alle über runPedigreeScan() gefundenen Fälle (Selbstverknüpfung,
// zirkuläre Ahnenlinie, unplausibler Jahrgang) mit einer direkten
// "Vater/Mutter entfernen"-Aktion je Fall. Scannt NICHT automatisch beim
// Öffnen — zeigt stattdessen das letzte Ergebnis (falls vorhanden) sofort an,
// damit man den Dialog zum Abarbeiten der Liste beliebig oft öffnen/
// schließen kann, ohne jedes Mal neu zu scannen.
function renderPedigreeProblemsModalBody(){
  const years=[...new Set(S.pigeons.map(p=>p.date_year).filter(Boolean))].sort((a,b)=>Number(b)-Number(a));
  const yearOptions = `<option value="all"${PEDIGREE_SCAN.yearFilter==='all'?' selected':''}>Alle Jahrgänge (kann dauern)</option>`
    + years.map(y=>`<option value="${y}"${String(PEDIGREE_SCAN.yearFilter)===String(y)?' selected':''}>Nur Jahrgang ${y}</option>`).join('');
  const picker = `<div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
    <select id="pedigree-scan-year" style="min-width:200px" ${PEDIGREE_SCAN.scanning?'disabled':''}>${yearOptions}</select>
    <button class="btn btn-sm" ${PEDIGREE_SCAN.scanning?'disabled':''} onclick="runPedigreeScan(document.getElementById('pedigree-scan-year').value)">🔍 ${PEDIGREE_SCAN.problems?'Neu scannen':'Scannen'}</button>
  </div>`;
  if(PEDIGREE_SCAN.scanning){
    const pct = PEDIGREE_SCAN.total ? Math.round(PEDIGREE_SCAN.done/PEDIGREE_SCAN.total*100) : 0;
    return picker + `<div class="imp-progress" style="margin-bottom:8px"><div class="imp-progress-bar" style="width:${pct}%"></div></div>
    <div style="font-size:12px;color:var(--text3)">Prüfe … ${PEDIGREE_SCAN.done} von ${PEDIGREE_SCAN.total}</div>`;
  }
  if(!PEDIGREE_SCAN.problems){
    return picker + `<div style="color:var(--text3);font-size:13px">Noch nicht gescannt. Tipp: einzelne Jahrgänge nacheinander zu prüfen und abzuarbeiten geht spürbar schneller als "Alle Jahrgänge" auf einmal — die Seite bleibt in jedem Fall bedienbar, der Fortschritt wird angezeigt.</div>`;
  }
  const problems=PEDIGREE_SCAN.problems;
  const scannedLabel = PEDIGREE_SCAN.scannedYearFilter==='all' ? 'alle Jahrgänge' : 'Jahrgang '+PEDIGREE_SCAN.scannedYearFilter;
  if(!problems.length){
    return picker + `<div style="color:var(--text3);font-size:13px">✓ Keine unlogischen Eltern-Verknüpfungen gefunden (geprüft: ${scannedLabel}).</div>`;
  }
  const kindLabel = {self:'⚠ Selbstverknüpfung', cycle:'⚠ Zirkuläre Ahnenlinie', age:'ℹ Jahrgang unplausibel'};
  const rows = problems.map(pr=>{
    const p=pr.pigeon;
    const label = (ring(p)||p.pigeonid) + (p.name?' · '+escH(p.name):'');
    const sideLabel = pr.side==='father' ? 'Vater' : 'Mutter';
    return `<div style="border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px">
      <div style="font-size:12px;color:${pr.kind==='age'?'var(--text3)':'var(--amber)'}">${kindLabel[pr.kind]}</div>
      <div style="font-size:13px;margin:4px 0;cursor:pointer" onclick="document.querySelectorAll('.pedigree-problems-overlay').forEach(o=>o.remove());selectPigeon('${p.pigeonid}')">
        <strong>${label}</strong> — ${sideLabel}: ${escH(pr.detail)}
      </div>
      ${pr.kind!=='age' ? `<button class="btn btn-outline btn-sm" onclick="resolvePedigreeProblem('${p.pigeonid}','${pr.side}')">🗑 ${sideLabel} entfernen</button>` : ''}
    </div>`;
  }).join('');
  return picker + `<div style="font-size:12px;color:var(--text3);margin-bottom:12px">${problems.length} Fall/Fälle gefunden (geprüft: ${scannedLabel}). "Selbstverknüpfung" und "Zirkuläre Ahnenlinie" sind logisch unmöglich und sollten bereinigt werden; "Jahrgang unplausibel" ist nur ein Hinweis zur manuellen Prüfung.</div>${rows}`;
}
async function resolvePedigreeProblem(pigeonid, side){
  try{
    await clearPigeonParent(pigeonid, side);
    // Nur den soeben behobenen Fall aus dem Cache entfernen statt komplett neu
    // zu scannen — bei ~9.500 Tauben würde ein Rescan nach jedem Klick spürbar dauern.
    if(PEDIGREE_SCAN.problems) PEDIGREE_SCAN.problems = PEDIGREE_SCAN.problems.filter(pr=>!(pr.pigeon.pigeonid===pigeonid && pr.side===side));
    const body=document.getElementById('pedigree-problems-body');
    if(body) body.innerHTML=renderPedigreeProblemsModalBody();
    applyFilter(); render();
  }catch(e){ alert('Fehler beim Entfernen: '+e.message); }
}

// ── ZÜCHTER-MODUL ─────────────────────────────────────────────────
// Aggregiert pigeontrips-Ergebnisse über alle importierten Züchter hinweg,
// unabhängig von den (Reise-bezogenen) prices1-4-Feldern auf trips —
// die stammen nur vom jeweils ERSTEN importierten Züchter einer Reise
// und sind daher bei mehreren Züchtern pro Reise nicht aussagekräftig.
let ZT = { rows:[], loaded:false, selected:null, vereinFilter:undefined, yearFilter:null };

async function loadZuechterData(){
  const FULL='breedername,breedernumber,tripid,pigeonid,ringnumber,sex,speed,prize_rv,prize_reggr,prize_reg,prize_fg,as_rv,as_fg,as_reg,as_nat,ass_a,ass_b,ass_c,ass_d';
  const NO_ASS='breedername,breedernumber,tripid,pigeonid,ringnumber,sex,speed,prize_rv,prize_reggr,prize_reg,prize_fg,as_rv,as_fg,as_reg,as_nat';
  const NO_SEX_ASS='breedername,breedernumber,tripid,pigeonid,ringnumber,prize_rv,prize_reggr,prize_reg,prize_fg,as_rv,as_fg,as_reg,as_nat';
  // Letzter Fallback OHNE as_fg — falls die Spalte in Supabase noch nicht
  // angelegt wurde (siehe Migrations-SQL im Chat), bricht die Bestenliste
  // trotzdem nicht komplett weg, sondern rechnet vorübergehend ohne FG-Punkte.
  const NO_FG='breedername,breedernumber,tripid,pigeonid,ringnumber,prize_rv,prize_reggr,prize_reg,prize_fg,as_rv,as_reg,as_nat';
  try{
    ZT.rows = await apiGet('/pigeontrips?breedername=not.is.null&select='+FULL+'&limit=10000') || [];
  }catch(e){
    try{
      // Fallback: ass_a-d-Spalten evtl. noch nicht angelegt
      ZT.rows = await apiGet('/pigeontrips?breedername=not.is.null&select='+NO_ASS+'&limit=10000') || [];
    }catch(e2){
      try{
        // Fallback: sex-Spalte evtl. auch noch nicht angelegt
        ZT.rows = await apiGet('/pigeontrips?breedername=not.is.null&select='+NO_SEX_ASS+'&limit=10000') || [];
      }catch(e3){
        try{
          // Fallback: as_fg-Spalte evtl. noch nicht angelegt (siehe Migrations-SQL)
          ZT.rows = await apiGet('/pigeontrips?breedername=not.is.null&select='+NO_FG+'&limit=10000') || [];
        }catch(e4){ ZT.rows = []; }
      }
    }
  }
  ZT.loaded = true;
}

// yearFilter (optional): nur Ergebniszeilen aus Reisen mit diesem Jahrgang
// (trip.vintage) einbeziehen — genutzt vom Jahr-Filter in der Züchterübersicht.
// Ohne Angabe (Default) über alle Jahre, wie bisher — so bleibt das Verhalten
// für Admin-Aktionen (Umbenennen/Löschen/RV-Zuordnen), die immer auf dem
// GESAMTEN Datenbestand eines Züchters arbeiten müssen, unverändert.
function zuechterAgg(yearFilter){
  const tripById={}; RT.trips.forEach(t=>tripById[t.tripid]=t);
  const g={};
  ZT.rows.forEach(r=>{
    const trip=tripById[r.tripid];
    if(yearFilter!=null && String((trip||{}).vintage)!==String(yearFilter)) return;
    const key=zuechterKey(r);
    if(!g[key]) g[key]={key, name:r.breedername||'Unbekannt', number:r.breedernumber||null, rawNumbers:new Set(), total:0, rvSet:0,rvWon:0, reggrSet:0,reggrWon:0, regSet:0,regWon:0, trips:new Set(), bestAS:0};
    const b=g[key];
    // Falls für dieselbe Züchternummer mehrere Schreibweisen in der DB stehen
    // (ältere Importe vor dieser Normalisierung), den längsten/vollständigsten
    // Namen als Anzeige-Namen verwenden.
    if(r.breedername && r.breedername.length>b.name.length) b.name=r.breedername;
    if(!b.number && r.breedernumber) b.number=r.breedernumber;
    // Alle tatsächlich in der DB vorkommenden Rohvarianten dieser Züchternummer
    // merken (z.B. "4050515009" UND "40505015009") — nötig, damit Umbenennen/
    // Löschen/RV-Zuordnen ALLE Varianten desselben (jetzt zusammengeführten)
    // Züchters trifft und nicht nur die zuerst gesehene.
    if(r.breedernumber!=null && r.breedernumber!=='') b.rawNumbers.add(String(r.breedernumber));
    b.total++;
    if(r.tripid) b.trips.add(r.tripid);
    // Preisausbeute nur über Reisen berechnen, bei denen die jeweilige Liste (RV/RegGr/Reg)
    // überhaupt ausgewertet wurde (pigeonsset_xx>0) — sonst zählt "keine Liste erstellt" fälschlich als 0%.
    if(trip){
      if(trip.pigeonsset_rv>0)    { b.rvSet++;    if(r.prize_rv)    b.rvWon++; }
      if(trip.pigeonsset_reggr>0) { b.reggrSet++; if(r.prize_reggr) b.reggrWon++; }
      if(trip.pigeonsset_reg>0)   { b.regSet++;   if(r.prize_reg)   b.regWon++; }
    }
    [r.as_rv,r.as_fg,r.as_reg,r.as_nat].forEach(v=>{ if(v&&v>b.bestAS) b.bestAS=v; });
  });
  return Object.values(g).map(b=>({...b, tripCount:b.trips.size,
    pctRV:   b.rvSet    ? b.rvWon/b.rvSet*100       : null,
    pctRegGr:b.reggrSet ? b.reggrWon/b.reggrSet*100 : null,
    pctReg:  b.regSet   ? b.regWon/b.regSet*100     : null
  })).sort((a,b)=>b.total-a.total);
}

function renderZuechter(){
  if(!ZT.loaded){ loadZuechterData().then(render); return '<div class="loading"><div class="spinner"></div>'+t('zt_loading')+'</div>'; }
  if(ZT.selected) return renderZuechterDetail(ZT.selected);
  // Verfügbare Jahrgänge aus den geladenen Reisen ableiten (neueste zuerst).
  const availableYears=[...new Set(RT.trips.map(tr=>tr.vintage).filter(Boolean))].sort((a,b)=>b-a);
  let list=zuechterAgg(ZT.yearFilter||null);
  // Filter nach RV — sinnvoll, sobald aus mehreren Reisevereinigungen
  // importiert wurde, damit die Liste vergleichbar bleibt.
  if(ZT.vereinFilter==='__none__'){
    list = list.filter(b=>!rvForNumber(b.number));
  } else if(ZT.vereinFilter){
    const v=getRV(ZT.vereinFilter), code=v?v.code:null;
    list = list.filter(b=>code && b.number && String(b.number).indexOf(code)===0);
  }

// Schreibt uneinheitlich formatierte Vereins-/Züchternummern (siehe
// canonicalizeZuechternummer) dauerhaft in der DB auf das einheitliche Format
// um — führt dadurch bisher getrennt geführte Schreibweisen desselben
// Züchters zu einem Eintrag zusammen. Wirkt auf ALLE betroffenen Datensätze,
// unabhängig vom aktuell aktiven RV-/Jahr-Filter.
async function cleanupZuechterNumbers(){
  if(!ZT.loaded) await loadZuechterData();
  const distinct=[...new Set(ZT.rows.map(r=>r.breedernumber).filter(n=>n!=null && n!==''))];
  const changes=distinct.map(raw=>({raw, canonical:canonicalizeZuechternummer(raw)})).filter(c=>c.canonical!==c.raw);
  if(!changes.length){ alert('Alle Züchternummern sind bereits einheitlich formatiert (Reg + RV + 2-stelliger Verein + 3-stellige Züchternummer) — nichts zu bereinigen.'); return; }
  const preview=changes.map(c=>c.raw+'  →  '+c.canonical).join('\n');
  if(!confirm('Folgende Züchternummern werden vereinheitlicht:\n\n'+preview+'\n\nBisher getrennt geführte Schreibweisen desselben Züchters werden dadurch zu einem Eintrag zusammengeführt. Fortfahren?')) return;
  let ok=0; const failed=[];
  for(const c of changes){
    try{ await apiPatchBy('pigeontrips', 'breedernumber=eq.'+encodeURIComponent(c.raw), {breedernumber:c.canonical}); ok++; }
    catch(e){ failed.push(c.raw+': '+e.message); }
  }
  clearPTCache();
  ZT.loaded=false; ZT.selected=null;
  render();
  let msg=ok+' von '+changes.length+' Züchternummern-Varianten vereinheitlicht.';
  if(failed.length) msg+='\n\nFehler bei:\n'+failed.join('\n');
  alert(msg);
}

async function assignVereinToBreeder(key){
  const b = zuechterAgg().find(x=>x.key===key);
  if(!b || !b.number) return;
  if(!RVEN.length){ alert('Bitte zuerst unter "RVen verwalten" eine RV anlegen.'); return; }
  const options = RVEN.map((v,i)=>(i+1)+') '+v.label+' (Code '+v.code+')').join('\n');
  const choice = prompt('Diesem Züchter (bisherige Nummer: '+b.number+') nachträglich eine RV zuordnen — macht die Nummer über RVen hinweg eindeutig.\n\n'+options+'\n\nNummer eingeben:');
  if(!choice) return;
  const v = RVEN[parseInt(choice,10)-1];
  if(!v){ alert('Ungültige Auswahl.'); return; }
  const full = v.code + b.number;
  if(!confirm('Züchternummer für "'+b.name+'" von "'+b.number+'" auf "'+full+'" ('+v.label+') setzen?\n\nBetrifft '+b.total+' Datensätze.')) return;
  try{
    const nums=[...b.rawNumbers].length?[...b.rawNumbers]:[b.number];
    const numFilter='breedernumber=in.('+nums.map(n=>encodeURIComponent(n)).join(',')+')';
    await apiPatchBy('pigeontrips', numFilter+'&breedername=eq.'+encodeURIComponent(b.name), {breedernumber:full});
    ZT.loaded=false; ZT.selected=null;
    clearPTCache();
    render();
  }catch(e){ alert('Fehler beim Zuordnen: '+e.message); }
}
async function renameZuechter(key){
  const b = zuechterAgg().find(x=>x.key===key);
  if(!b) return;
  const newName = prompt('Neuer Name für "'+b.name+'":', b.name);
  if(newName==null) return;
  const trimmed = newName.trim();
  if(!trimmed || trimmed===b.name) return;
  try{
    // Über die Züchternummer aktualisieren (falls vorhanden) statt über den
    // alten Namen — erwischt so auch Datensätze mit abweichender
    // Namens-Schreibweise derselben Züchternummer mit.
    const nums=[...b.rawNumbers];
    const updated = nums.length
      ? await apiPatchBy('pigeontrips', 'breedernumber=in.('+nums.map(n=>encodeURIComponent(n)).join(',')+')', {breedername:trimmed})
      : await apiPatchBy('pigeontrips', 'breedername=eq.'+encodeURIComponent(b.name), {breedername:trimmed});
    if(Array.isArray(updated) && updated.length===0){
      alert('Es wurden 0 Datensätze umbenannt, obwohl '+b.total+' erwartet wurden.\n\nVermutlich verhindert eine Datenbank-Berechtigung (Row Level Security) das Ändern in der Tabelle "pigeontrips". Bitte prüfe die RLS-Policy für UPDATE auf dieser Tabelle in Supabase, oder wende dich an den Admin des Projekts.');
      return;
    }
    if(b.number) nameByNumberCacheClear(b.number, trimmed);
    ZT.loaded=false; ZT.selected=null;
    render();
  }catch(e){ alert('Umbenennen fehlgeschlagen: '+e.message); }
}
// Verhindert, dass ein zukünftiger Import den alten Namen wiederherstellt:
// die Import-Session merkt sich kanonische Namen je Züchternummer (siehe
// handleTripsFiles) — die muss nach einer manuellen Umbenennung nachziehen.
function nameByNumberCacheClear(number, newName){
  if(RT.imp && RT.imp.breederNameByNumber && RT.imp.breederNameByNumber[number]!==undefined){
    RT.imp.breederNameByNumber[number] = newName;
  }
}
async function deleteZuechterData(key){
  const b = zuechterAgg().find(x=>x.key===key);
  if(!b) return;
  const label = zuechterLabel(b.name, b.number);
  if(!confirm('Wirklich ALLE Flugdaten von "'+label+'" löschen?\n\n'+b.total+' Ergebnisse aus '+b.tripCount+' Reise(n).\n\nDas kann nicht rückgängig gemacht werden.')) return;
  try{
    // Über die Züchternummer löschen (falls vorhanden) statt über den Namen —
    // erwischt so auch ältere Datensätze mit abweichender Namens-Schreibweise
    // derselben Züchternummer zuverlässig mit.
    const nums=[...b.rawNumbers];
    const deleted = nums.length
      ? await apiDeleteBy('pigeontrips', 'breedernumber=in.('+nums.map(n=>encodeURIComponent(n)).join(',')+')')
      : await apiDeleteBy('pigeontrips', 'breedername=eq.'+encodeURIComponent(b.name));
    if(deleted.length===0){
      // Löschen "erfolgreich" laut HTTP-Status, aber 0 betroffene Zeilen —
      // typischerweise eine RLS-Policy, die DELETE auf pigeontrips verweigert.
      alert('Es wurden 0 Datensätze gelöscht, obwohl '+b.total+' erwartet wurden.\n\nVermutlich verhindert eine Datenbank-Berechtigung (Row Level Security) das Löschen in der Tabelle "pigeontrips". Bitte prüfe die RLS-Policy für DELETE auf dieser Tabelle in Supabase, oder wende dich an den Admin des Projekts.');
      return;
    }
    if(deleted.length<b.total){
      alert(deleted.length+' von '+b.total+' Datensätzen gelöscht. Die restlichen '+(b.total-deleted.length)+' konnten nicht gelöscht werden (evtl. abweichende Schreibweise/Nummer oder RLS) — bitte Zuchtstatistik prüfen.');
    }
    // Lokale Caches, die Flugdaten enthalten könnten, sind jetzt veraltet.
    Object.keys(PT_CACHE).forEach(id=>delete PT_CACHE[id]);
    ZT.loaded=false; ZT.selected=null;
    render();
  }catch(e){ alert('Löschen fehlgeschlagen: '+e.message); }
}

    const t=byTrip[r.tripid];
    t.total++;

      const kmCell = t.trip.averagedistance3!=null ? Number(t.trip.averagedistance3).toFixed(1)+' km' : '—';
      return `
      <tr data-tripid="${t.tripid}" onclick="openTripFromZuechter(this.dataset.tripid,${jsAttr(key)})" style="cursor:pointer">

        <td style="text-align:center;font-weight:600">${t.bestSpeed!=null?t.bestSpeed.toFixed(3):'—'}</td>
      </tr>`;}).join('');
  const totalTauben=myRows.length;
  const agg=b0||{pctRV:null,pctRegGr:null,pctReg:null,number:null};
  return `<div><button class="back-btn" onclick="ZT.selected=null;render()">${t('zt_back_all')}</button>

      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">

// ── BESTENLISTE ────────────────────────────────────────────────
// Rangliste der Tauben nach Anzahl Preise (ein Flug zählt als ein Preis, unabhängig
// davon in wie vielen Listen RV/RegGr/Reg gleichzeitig platziert wurde) und in
// zweiter Instanz nach Summe der besten AS-Punkte je Flug. Je Reisesaison (Jahr)
// getrennt ausgewertet, neueste Saison zuerst. Getrennt nach Vögel/Weibchen — das
// Geschlecht wird bevorzugt aus der Verbands-Importdatei gelesen, funktioniert also
// auch für Tauben ohne Zuordnung zur eigenen Datenbank — jeweils zusätzlich als
// einjährig (Jahrgang = Saison-Jahr minus 1) gefiltert. Die Kategorie "Alle Tauben"
// zeigt zusätzlich auch Tauben mit unbekanntem Geschlecht; deren Jahrgang wird bei
// fehlender DB-Zuordnung direkt aus der Ringnummer abgeleitet (mittleres Segment,
// z.B. DE 6559-23-3535 → Jahrgang 2023).
let BL = { breeder:'ALL', rv:null, cat:'gesamt', ass:'all', expanded:new Set(), collapsedSeasons:new Set(), sortKey:null, sortDir:'desc' };

const BL_COLUMN_DEFS = [
  { key:'ring',     label:'Ringnummer' },
  { key:'name',     label:'Name' },
  { key:'jahrgang', label:'Jahrgang' },
  { key:'breeder',  label:'Züchter' },
  { key:'ass',      label:'Ass A-D' },
  { key:'prizes',   label:'Preise' },
  { key:'sumas',    label:'Σ AS' },
  { key:'kmsum',    label:'Σ km (Preisflüge)' },
];
const BL_COLUMN_BY_KEY = Object.fromEntries(BL_COLUMN_DEFS.map(c=>[c.key,c]));
const BL_DEFAULT_COLUMNS = BL_COLUMN_DEFS.map(c=>c.key);
try{
  const savedBL = JSON.parse(localStorage.getItem('bestenlisteCols')||'null');
  BL.columns = Array.isArray(savedBL) && savedBL.length ? savedBL.filter(k=>BL_COLUMN_BY_KEY[k]) : [...BL_DEFAULT_COLUMNS];
}catch(e){ BL.columns = [...BL_DEFAULT_COLUMNS]; }
function toggleBLColumn(key){
  const i = BL.columns.indexOf(key);
  if(i>=0){ if(BL.columns.length<=1) return; BL.columns.splice(i,1); }
  else BL.columns.push(key);
  try{ localStorage.setItem('bestenlisteCols', JSON.stringify(BL.columns)); }catch(e){}
  refreshBLColumnMenu(); render();
}
function moveBLColumn(key, dir){
  const i = BL.columns.indexOf(key);
  if(i<0) return;
  const j = i+dir;
  if(j<0 || j>=BL.columns.length) return;
  [BL.columns[i], BL.columns[j]] = [BL.columns[j], BL.columns[i]];
  try{ localStorage.setItem('bestenlisteCols', JSON.stringify(BL.columns)); }catch(e){}
  refreshBLColumnMenu(); render();
}
function resetBLColumns(){
  BL.columns = [...BL_DEFAULT_COLUMNS];
  try{ localStorage.setItem('bestenlisteCols', JSON.stringify(BL.columns)); }catch(e){}
  refreshBLColumnMenu(); render();
}
function blColumnPickerMenuHTML(){
  const activeDefs = BL.columns.map(k=>BL_COLUMN_BY_KEY[k]).filter(Boolean);
  const inactiveDefs = BL_COLUMN_DEFS.filter(c=>!BL.columns.includes(c.key));
  const row = (c,i,arr,isActive) => `
    <div style="display:flex;align-items:center;gap:4px;padding:4px 2px;font-size:13px">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;flex:1;min-width:0">
        <input type="checkbox" ${isActive?'checked':''} onchange="toggleBLColumn('${c.key}')">
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escH(c.label)}</span>
      </label>
      ${isActive?`
        <button type="button" class="btn btn-outline btn-sm" style="padding:2px 8px;line-height:1" title="Nach oben" ${i===0?'disabled':''} onclick="moveBLColumn('${c.key}',-1)">↑</button>
        <button type="button" class="btn btn-outline btn-sm" style="padding:2px 8px;line-height:1" title="Nach unten" ${i===arr.length-1?'disabled':''} onclick="moveBLColumn('${c.key}',1)">↓</button>`:''}
    </div>`;
  return `
    <div style="font-size:11px;color:var(--text3);margin-bottom:6px;line-height:1.4">${t('col_picker_hint')}</div>
    ${activeDefs.map((c,i,arr)=>row(c,i,arr,true)).join('')}
    ${inactiveDefs.length?`<div style="border-top:1px solid var(--border);margin:8px 0 4px;padding-top:6px;font-size:11px;color:var(--text3)">${t('col_picker_more')}</div>`:''}
    ${inactiveDefs.map((c,i,arr)=>row(c,i,arr,false)).join('')}
    <div style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px">
      <button class="btn btn-outline btn-sm" style="width:100%" onclick="resetBLColumns()">${t('col_picker_resetbtn')}</button>
    </div>`;
}
function refreshBLColumnMenu(){
  const m = document.getElementById('bl-col-picker-menu');
  const btn = document.getElementById('bl-col-picker-btn');
  if(m) m.innerHTML = blColumnPickerMenuHTML();
  if(m && btn && m.style.display==='block') positionColumnMenu(btn, m);
}
function toggleBLColumnMenu(btn){
  const m = document.getElementById('bl-col-picker-menu');
  if(!m) return;
  if(m.style.display==='block'){ m.style.display='none'; return; }
  m.innerHTML = blColumnPickerMenuHTML();
  positionColumnMenu(btn, m);
  m.style.display='block';
}
window.addEventListener('resize', ()=>{

// breederFilter: 'ALL' oder zuechterKey() eines Züchters (nicht der rohe Name)
function bestenliste(breederFilter, rvFilter){
  const tripById={}; RT.trips.forEach(t=>tripById[t.tripid]=t);
  // Schlüssel je Saison+Taube (Tauben ohne DB-Zuordnung werden über die Ringnummer gruppiert)
  const byKey={};
  ZT.rows.forEach(r=>{
    if(breederFilter && breederFilter!=='ALL' && zuechterKey(r)!==breederFilter) return;
    if(rvFilter==='__none__'){ if(rvForNumber(r.breedernumber)) return; }
    else if(rvFilter){ const v=getRV(rvFilter); if(!v || !r.breedernumber || String(r.breedernumber).indexOf(v.code)!==0) return; }
    const trip=tripById[r.tripid];
    const yr=trip?trip.vintage:null;
    if(!yr) return; // ohne bekannte Reise/Saison keine Zuordnung möglich
    const pid=r.pigeonid || ('ring:'+normRing(r.ringnumber||''));
    const key=yr+'|'+pid;
    if(!byKey[key]) byKey[key]={year:yr, pigeonid:r.pigeonid||null, ringnumber:r.ringnumber||null, prizes:0, asSum:0, kmSum:0, breedernames:new Set(), sexVotes:{M:0,F:0}, flights:[], ass:{a:false,b:false,c:false,d:false}};
    const b=byKey[key];
    if(r.ass_a) b.ass.a=true;
    if(r.ass_b) b.ass.b=true;
    if(r.ass_c) b.ass.c=true;
    if(r.ass_d) b.ass.d=true;
    const hasPreis = rvField(r,'prize_rv')!=null || r.prize_reggr!=null || r.prize_reg!=null || r.prize_fg!=null;
    if(hasPreis) b.prizes++;
    // Kilometer-Summe: nur Flüge zählen, bei denen die Taube einen Preis
    // erzielt hat (gleiche Preis-Definition wie oben — irgendeine Liste
    // reicht). Als Entfernung gilt die mittlere Entfernung des Fluges in
    // der Gesamt-Konkurrenz (trips.averagedistance3), nicht die individuelle
    // Distanz der Taube.
    if(hasPreis && trip.averagedistance3!=null) b.kmSum += Number(trip.averagedistance3);
    // Je Liste (RV/RegGr/Reg) ein Kandidatenpaar aus Platz+AS; das beste (höchste AS) gilt für den Flug
    const candidates=[
      {platz:rvField(r,'prize_rv'), as:rvField(r,'as_rv')},
      {platz:r.prize_fg,    as:r.as_fg},
      {platz:r.prize_reggr, as:r.as_nat},
      {platz:r.prize_reg,   as:r.as_reg}
    ].filter(c=>c.as!=null && c.as!=='');
    const best = candidates.length ? candidates.reduce((a,c)=>Number(c.as)>Number(a.as)?c:a) : null;
    const flightAS = best ? Number(best.as) : null;
    if(flightAS!=null) b.asSum += flightAS;
    if(r.breedername) b.breedernames.add(r.breedername);
    if(r.sex==='M'||r.sex==='F') b.sexVotes[r.sex]++;
    b.flights.push({
      tripNumber: trip.number, location: trip.location, tripdate: trip.tripdate,
      platz: best?best.platz:null, as: flightAS, hasPreis, speed: r.speed!=null?Number(r.speed):null,
      distance: trip.averagedistance3!=null?Number(trip.averagedistance3):null
    });
  });

  const entries=Object.values(byKey).map(b=>{
    const p=b.pigeonid?S.pigeons.find(x=>x.pigeonid===b.pigeonid):null;
    // Geschlecht bevorzugt aus der Verbands-Importdatei (dort für jede Taube vermerkt,
    // funktioniert daher auch für Tauben, die nicht in der eigenen Datenbank stehen).
    // Nur wenn die Importdatei kein Geschlecht liefert (z.B. Excel-Import), auf die
    // eigene Datenbank zurückfallen.
    let sex = b.sexVotes.M>=b.sexVotes.F && b.sexVotes.M>0 ? 'M'
            : b.sexVotes.F>b.sexVotes.M ? 'F'
            : (p?sex_(p):'?');
    let birthYear=null, ring=b.ringnumber, name=null, inDb=!!p;
    if(p){ birthYear=p.date_year; ring=p.ringnumber||ring; name=p.name; }
    else { const parsed=parseRingComponents(b.ringnumber); birthYear=parsed?.date_year||null; }
    const flights=[...b.flights].sort((a,b2)=>(a.tripNumber||0)-(b2.tripNumber||0));
    return {...b, pigeon:p, inDb, sex, birthYear, ring, name, flights, breedername:[...b.breedernames].join(', ')};
  });

  const years=[...new Set(entries.map(e=>e.year))].sort((a,b)=>Number(b)-Number(a));
  // Standard-Sortierung (wie bisher): Anzahl Preise, bei Gleichstand Σ AS.
  const defaultSortFn=(a,b)=> b.prizes-a.prizes || b.asSum-a.asSum;
  // Klickt der Nutzer auf eine der Spalten "Preise"/"Σ AS"/"Σ km" (siehe
  // setBLSort), wird stattdessen danach sortiert — Gleichstände fallen weiter
  // auf die Standard-Sortierung zurück, damit die Reihenfolge stabil bleibt.
  const BL_SORT_FIELD = { prizes:e=>e.prizes, sumas:e=>e.asSum, kmsum:e=>e.kmSum||0 };
  const sortFn = (BL.sortKey && BL_SORT_FIELD[BL.sortKey])
    ? (a,b)=>{
        const f=BL_SORT_FIELD[BL.sortKey];
        const diff = f(b)-f(a); // absteigend als Basis
        return (BL.sortDir==='asc' ? -diff : diff) || defaultSortFn(a,b);
      }
    : defaultSortFn;
  const build=(filterFn)=> years.map(yr=>({
    year:yr,
    rows: entries.filter(e=>e.year===yr && filterFn(e,yr)).sort(sortFn)
  })).filter(g=>g.rows.length);

  return {
    years,
    gesamt:      build(()=>true),
    tauber:      build(e=>e.sex==='M'),
    taubinnen:   build(e=>e.sex==='F'),
    tauberJg:    build((e,yr)=>e.sex==='M' && String(e.birthYear)===String(Number(yr)-1)),
    taubinnenJg: build((e,yr)=>e.sex==='F' && String(e.birthYear)===String(Number(yr)-1))
  };
}

function renderBestenliste(){
  if(!ZT.loaded){ loadZuechterData().then(render); return '<div class="loading"><div class="spinner"></div>'+t('bl_loading_perf')+'</div>'; }
  if(!RT.trips.length){ loadTrips().then(render); return '<div class="loading"><div class="spinner"></div>'+t('bl_loading_trips')+'</div>'; }
  const breeders=distinctBreeders(ZT.rows);
  const data=bestenliste(BL.breeder, BL.rv);

  const tabs=[
    ['gesamt',t('bl_tab_all')],
    ['tauber',t('bl_tab_cocks')],
    ['taubinnen',t('bl_tab_hens')],
    ['tauberJg',t('bl_tab_cocks_yl')],
    ['taubinnenJg',t('bl_tab_hens_yl')]
  ];
  const groupsRaw=data[BL.cat]||[];
  // Ass-Kategorie-Filter (A/B/C/D/beliebig): kommt aus den Flugergebnissen
  // selbst, funktioniert daher für ALLE geflogenen Tauben — auch ohne
  // Zuordnung zur eigenen Datenbank.
  const assMatch = e => {
    if(BL.ass==='all') return true;
    if(BL.ass==='any') return e.ass.a||e.ass.b||e.ass.c||e.ass.d;
    return !!e.ass[BL.ass];
  };
  const groups = groupsRaw.map(g=>({...g, rows:g.rows.filter(assMatch)})).filter(g=>g.rows.length);
  if(!BL.expanded) BL.expanded=new Set();
  const rowKey=(yr,e)=> BL.cat+'|'+yr+'|'+(e.pigeonid||e.ring);
  function toggleBL(k){ if(BL.expanded.has(k)) BL.expanded.delete(k); else BL.expanded.add(k); render(); }
  window.toggleBL = toggleBL;
  function toggleBLSeason(yr){ const k=String(yr); if(BL.collapsedSeasons.has(k)) BL.collapsedSeasons.delete(k); else BL.collapsedSeasons.add(k); render(); }
  window.toggleBLSeason = toggleBLSeason;
  // Sortierbare Spalten in der Bestenliste: Preise, Σ AS, Σ km. Erster Klick
  // sortiert absteigend, ein weiterer Klick auf dieselbe Spalte kehrt die
  // Richtung um; Klick auf eine andere Spalte startet dort wieder absteigend.
  function setBLSort(key){
    if(BL.sortKey===key) BL.sortDir = (BL.sortDir==='asc'?'desc':'asc');
    else { BL.sortKey=key; BL.sortDir='desc'; }
    render();
  }
  window.setBLSort = setBLSort;

  const renderFlights=(e)=>{
    if(!e.flights.length) return '<div style="padding:10px;color:var(--text3);font-size:12px">'+t('bl_no_flight_data')+'</div>';
    const cells=e.flights.map((f,i)=>{
      return `<div style="text-align:center">
        <div style="font-size:10px;color:var(--text3);margin-bottom:2px">F${String(i+1).padStart(2,'0')}</div>
        <div style="font-size:12px;font-weight:500">${f.platz!=null?f.platz:'—'}</div>
        <div style="font-size:11px;color:var(--green)">${f.as!=null?f.as.toFixed(2):'—'}</div>
        <div style="font-size:10px;color:var(--text3)">${f.speed!=null?f.speed.toFixed(3)+' m/min':'—'}</div>
        <div style="font-size:10px;color:${f.hasPreis?'var(--text2)':'var(--text3)'}">${f.distance!=null?f.distance.toFixed(1)+' km':'—'}${f.hasPreis&&f.distance!=null?' ✓':''}</div>
      </div>`;
    }).join('');
    const sumCheck=e.flights.reduce((s,f)=>s+(f.as||0),0);
    return `<div style="padding:10px 4px">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;background:var(--bg2);border-radius:8px;padding:10px">${cells}</div>
      <div style="font-size:11px;color:var(--text3);margin-top:8px">${t('bl_sum_checked')} <strong style="color:var(--text2)">${sumCheck.toFixed(2)}</strong> ${Math.abs(sumCheck-e.asSum)<0.01?t('bl_sum_match'):t('bl_sum_mismatch')}</div>
    </div>`;
  };

  // Spalten wie im Taubenmodul: über BL.columns konfigurierbar (Reihenfolge +
  // Sichtbarkeit). "Züchter" wird nur angezeigt, wenn tatsächlich alle
  // Züchter gemeinsam betrachtet werden (sonst ist die Spalte redundant).
  const activeBLCols = BL.columns.map(k=>BL_COLUMN_BY_KEY[k]).filter(Boolean)
    .filter(c=>c.key!=='breeder' || BL.breeder==='ALL');
  const BL_CELL = {
    ring:(e)=>`<td style="font-family:monospace;font-size:12px;${e.pigeonid?'cursor:pointer':''}" ${e.pigeonid?`onclick="selectPigeon('${e.pigeonid}')"`:''}>${escH(e.ring||'—')}${!e.inDb?' <span style="color:var(--text3);font-size:10px">(nicht in DB)</span>':''}</td>`,
    name:(e)=>`<td>${escH(e.name||'—')}</td>`,
    jahrgang:(e)=>`<td style="font-size:12px;color:var(--text3)">${e.birthYear||'—'}</td>`,
    breeder:(e)=>`<td style="font-size:12px;color:var(--text3)">${escH(e.breedername||'—')}</td>`,
    ass:(e)=>{
      const letters=['a','b','c','d'].filter(l=>e.ass[l]);
      const cell=letters.length
        ? letters.map(l=>`<span class="badge" style="background:rgba(212,168,67,.15);color:var(--amber);border:1px solid rgba(212,168,67,.35);margin-right:2px">${l.toUpperCase()}</span>`).join('')
        : '<span style="color:var(--text3)">—</span>';
      return `<td style="text-align:center">${cell}</td>`;
    },
    prizes:(e)=>`<td style="text-align:center;font-weight:600">${e.prizes}</td>`,
    sumas:(e)=>`<td style="text-align:center;font-weight:600;color:var(--green)">${e.asSum.toFixed(2)}</td>`,
    kmsum:(e)=>`<td style="text-align:center;font-weight:600">${e.kmSum?e.kmSum.toFixed(1)+' km':'—'}</td>`,
  };

  const renderRow=(e,i,yr)=>{
    const k=rowKey(yr,e);
    const open=BL.expanded.has(k);
    return `
    <tr>
      <td style="text-align:center;font-weight:600;color:${i<3?'var(--green)':'var(--text3)'}">${i+1}</td>
      <td style="text-align:center"><button class="btn btn-outline" style="padding:2px 8px;font-size:11px;min-width:0" onclick="event.stopPropagation();toggleBL('${k}')">${open?'−':'+'}</button></td>
      ${activeBLCols.map(c=>BL_CELL[c.key](e)).join('')}
    </tr>
    ${open?`<tr><td colspan="${2+activeBLCols.length}" style="padding:0">${renderFlights(e)}</td></tr>`:''}`;
  };

  const BL_TH = { ring:t('th_ring'), name:t('th_name'), jahrgang:t('year_abbr'), breeder:t('th_breeder'), ass:'Ass', prizes:t('col_prizes'), sumas:t('col_sum_as'), kmsum:'Σ km' };
  const BL_TH_CENTER = new Set(['ass','prizes','sumas','kmsum']);
  // Spalten, die per Klick auf die Kopfzeile sortiert werden können.
  const BL_SORTABLE = new Set(['prizes','sumas','kmsum']);
  const blHeaderCell=(c)=>{
    const center = BL_TH_CENTER.has(c.key) ? 'text-align:center;' : '';
    if(!BL_SORTABLE.has(c.key)){
      const titleAttr = c.key==='ass' ? ' title="Ass-Kategorien"' : '';
      return `<th style="${center}"${titleAttr}>${BL_TH[c.key]}</th>`;
    }
    const active = BL.sortKey===c.key;
    const arrow = active ? (BL.sortDir==='asc' ? ' ▲' : ' ▼') : '';
    const titleAttr = c.key==='kmsum'
      ? ' title="Summe der mittleren Flugdistanz über alle Preisflüge dieser Taube — Klick zum Sortieren"'
      : ' title="Klick zum Sortieren"';
    return `<th style="${center}cursor:pointer;user-select:none;${active?'color:var(--text)':''}" onclick="setBLSort('${c.key}')"${titleAttr}>${BL_TH[c.key]}${arrow}</th>`;
  };
  const yearBlocks = groups.length ? groups.map(g=>{
    const collapsed = BL.collapsedSeasons.has(String(g.year));
    return `
    <div style="margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:8px;user-select:none" onclick="toggleBLSeason('${g.year}')">
        <span style="font-size:11px;color:var(--text3);transition:transform .15s;transform:rotate(${collapsed?'-90':'0'}deg);display:inline-block">▾</span>
        <span style="font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.5px">${t('season')} ${g.year}</span>
        <span style="font-size:11px;color:var(--text3)">(${g.rows.length})</span>
      </div>
      ${collapsed?'':`<div class="card"><div class="table-wrap"><table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr><th>#</th><th></th>${activeBLCols.map(blHeaderCell).join('')}</tr></thead>
        <tbody>${g.rows.map((e,i)=>renderRow(e,i,g.year)).join('')}</tbody>
      </table></div></div>`}
    </div>`;
  }).join('')
    : '<div class="card" style="text-align:center;padding:24px;color:var(--text3)">'+t('bl_no_pigeons_cat')+'</div>';

  return `<div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
      <div class="serif" style="font-size:20px">🏆 ${t('sub_best')}</div>
      <label style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text3)">
        ${t('bl_breeder_label')}
        <select onchange="BL.breeder=this.value;render()" style="max-width:260px">
          <option value="ALL" ${BL.breeder==='ALL'?'selected':''}>${t('bl_all_breeders_opt')}</option>
          ${breeders.map(b=>`<option value="${escH(b.key)}" ${BL.breeder===b.key?'selected':''}>${escH(b.name)}</option>`).join('')}
        </select>
      </label>
      ${RVEN.length ? `<label style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text3)">
        RV:
        <select onchange="BL.rv=this.value||null;render()">
          <option value="" ${!BL.rv?'selected':''}>Alle</option>
          ${RVEN.map(v=>`<option value="${escH(v.id)}" ${BL.rv===v.id?'selected':''}>${escH(v.label)}</option>`).join('')}
          <option value="__none__" ${BL.rv==='__none__'?'selected':''}>Nicht zugeordnet</option>
        </select>
      </label>` : ''}
      <label style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text3)">
        Ass-Kategorie
        <select onchange="BL.ass=this.value;render()" title="Nur Tauben mit dieser Ass-Kennzeichnung anzeigen">
          <option value="all" ${BL.ass==='all'?'selected':''}>alle</option>
          <option value="a" ${BL.ass==='a'?'selected':''}>🏅 A</option>
          <option value="b" ${BL.ass==='b'?'selected':''}>🏅 B</option>
          <option value="c" ${BL.ass==='c'?'selected':''}>🏅 C</option>
          <option value="d" ${BL.ass==='d'?'selected':''}>🏅 D</option>
          <option value="any" ${BL.ass==='any'?'selected':''}>🏅 beliebig</option>
        </select>
      </label>
      <div style="position:relative">
        <button id="bl-col-picker-btn" class="btn btn-outline btn-sm" onclick="toggleBLColumnMenu(this)">⚙ Spalten</button>
        <div id="bl-col-picker-menu" style="display:none;position:fixed;width:240px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;z-index:200;max-height:480px;overflow:auto;box-shadow:0 6px 20px rgba(0,0,0,.4)" onclick="event.stopPropagation()"></div>
      </div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
      ${tabs.map(([k,label])=>`<button class="btn ${BL.cat===k?'':'btn-outline'}" style="font-size:12px;padding:7px 12px" onclick="BL.cat='${k}';render()">${label}</button>`).join('')}
    </div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:12px">
      ${t('bl_desc1')}
      ${BL.cat==='gesamt'?t('bl_desc2a'):t('bl_desc2b')}
      ${t('bl_desc3')}
    </div>
    ${yearBlocks}
  </div>`;
}

function renderStats(){
  const total=S.pigeons.length,males=S.pigeons.filter(p=>sex_(p)==='M').length,females=S.pigeons.filter(p=>sex_(p)==='F').length;
  const instock=S.pigeons.filter(p=>p.instock).length;
  const withBoth=S.pigeons.filter(p=>(p.fatherid||p.ringnumberfather)&&(p.motherid||p.ringnumbermother)).length;
  const years={};S.pigeons.forEach(p=>{if(p.date_year)years[p.date_year]=(years[p.date_year]||0)+1;});
  const topYears=Object.entries(years).sort((a,b)=>b[0]-a[0]).slice(0,15);
  const maxY=Math.max(...topYears.map(y=>y[1]),1);
  const colors={};S.pigeons.forEach(p=>{if(p.color)colors[p.color]=(colors[p.color]||0)+1;});
  const topColors=Object.entries(colors).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const strains={};S.pigeons.forEach(p=>{if(p.strain)strains[p.strain]=(strains[p.strain]||0)+1;});
  const topStrains=Object.entries(strains).sort((a,b)=>b[1]-a[1]).slice(0,10);

  // Bestand nach Taubentyp
  const reiseInstock=S.pigeons.filter(p=>p.instock&&p.pigeontype==='Reisetaube').length;
  const zuchtInstock=S.pigeons.filter(p=>p.instock&&p.pigeontype==='Zuchttaube').length;
  const heimInstock=S.pigeons.filter(p=>p.instock&&p.pigeontype==='Heimtaube').length;

  // Züchter / Besitzer / Standort
  const breeders={};S.pigeons.forEach(p=>{if(p.breeder)breeders[p.breeder]=(breeders[p.breeder]||0)+1;});
  const topBreeders=Object.entries(breeders).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const owners={};S.pigeons.forEach(p=>{if(p.owner)owners[p.owner]=(owners[p.owner]||0)+1;});
  const topOwners=Object.entries(owners).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const standorte={};S.pigeons.forEach(p=>{if(p.standort)standorte[p.standort]=(standorte[p.standort]||0)+1;});
  const topStandorte=Object.entries(standorte).sort((a,b)=>b[1]-a[1]).slice(0,10);

  // Top-Vererber: Tauben mit den meisten Nachkommen IM BESTAND.
  // Zählung über die verlinkten Eltern-IDs (fatherid/motherid) — das ist die verlässlichste
  // Verknüpfung, da sie unabhängig von Ringnummer-Schreibweisen funktioniert. Es zählen nur
  // Nachkommen, die aktuell im Bestand (instock) sind.
  const parentCounts=new Map();

function bindAC(inpId, dropId, filterSex, onSelect){
  const inp=document.getElementById(inpId);
  const drop=document.getElementById(dropId);
  if(!inp||!drop) return;
  inp.addEventListener('input',()=>{
    const q=inp.value.trim().toLowerCase();
    if(q.length<2){ drop.classList.remove('open'); drop.innerHTML=''; return; }
    let hits=S.pigeons.filter(p=>(p.ringnumber||'').toLowerCase().includes(q)||(p.name||'').toLowerCase().includes(q));
    if(filterSex) hits=hits.filter(p=>sex_(p)===filterSex);
    hits=hits.slice(0,8);
    drop.innerHTML=hits.length ? hits.map(p=>`
      <div class="ac-item" onclick="(${onSelect.toString()})('${p.pigeonid}')">
        <span class="ac-ring">${escH(ring(p))}</span>
        ${p.name?`<span>${escH(p.name)}</span>`:''}
        <span style="color:var(--text3);font-size:11px;margin-left:auto">${p.date_year||''}</span>
      </div>`).join('')
    : '<div class="ac-item" style="cursor:default;color:var(--text3)">Keine Treffer</div>';
    drop.classList.toggle('open', hits.length>0||true);
  });
  document.addEventListener('click', e=>{ if(!inp.contains(e.target)&&!drop.contains(e.target)) drop.classList.remove('open'); });
}

// ── Kinder-Index ──────────────────────────────────────────────────
// findChildren() wurde vorher pro Aufruf mit einem vollen Scan über
// S.pigeons berechnet (O(n) je Aufruf). In renderVererberRanking() wird
// das aber pro Taube UND pro Kind aufgerufen (Enkel-Ebene), was bei
// größeren Beständen zu O(n²)/O(n³) und spürbaren Hängern führt.
// Stattdessen bauen wir den Index einmalig (O(n)) und cachen ihn, bis
// sich S.pigeons ändert (siehe invalidatePedigreeCache()).
var CHILDREN_INDEX=null;      // pigeonid -> Array<pigeon>
var DESC_CACHE=new Map();     // pigeonid -> Array<pigeon> (Kinder+Enkel, für Vererbung)
function invalidatePedigreeCache(){ CHILDREN_INDEX=null; DESC_CACHE.clear(); }
function buildChildrenIndex(){
  var byId={}, byRing={};
  S.pigeons.forEach(function(p){ byId[p.pigeonid]=p; if(p.ringnumber) byRing[p.ringnumber]=p; });
  var idx={};
  function add(parentId, child){ if(!idx[parentId]) idx[parentId]=[]; idx[parentId].push(child); }
  S.pigeons.forEach(function(c){
    if(c.fatherid) add(c.fatherid, c);
    if(c.motherid) add(c.motherid, c);
    if(c.ringnumberfather){ var f=byRing[c.ringnumberfather]; if(f && f.pigeonid!==c.fatherid) add(f.pigeonid, c); }
    if(c.ringnumbermother){ var m=byRing[c.ringnumbermother]; if(m && m.pigeonid!==c.motherid) add(m.pigeonid, c); }
  });
  CHILDREN_INDEX=idx;
}
function findChildren(pigeonId){
  if(!CHILDREN_INDEX) buildChildrenIndex();
  return CHILDREN_INDEX[pigeonId]||[];
}

// Ermittelt den Partner (den jeweils anderen Elternteil) einer Taube relativ
// zu einem bekannten Elternteil (Wurzel-Taube bzw. "via"-Taube bei Enkeln/
// Urenkeln). Wird in der gefilterten Nachkommen-Tabelle angezeigt, damit man
// sieht, mit wem der Nachkomme gezüchtet wurde.
function findPartner(p, knownParentId){
  var ids=[p.fatherid,p.motherid].filter(Boolean);
  var otherId=ids.filter(function(id){return id!==knownParentId;})[0];
  var other = otherId ? findById(otherId) : null;
  if(!other && p.ringnumberfather){
    var f=S.pigeons.find(function(x){return x.ringnumber===p.ringnumberfather;});
    if(f && f.pigeonid!==knownParentId) other=f;
  }
  if(!other && p.ringnumbermother){
    var m=S.pigeons.find(function(x){return x.ringnumber===p.ringnumbermother;});
    if(m && m.pigeonid!==knownParentId) other=m;
  }
  return other||null;
}

function statusStyle(p){
  if(p.died) return {key:'died',label:t('status_died')+(p.sold?' · zuvor verkauft':''),color:'#e07070',bg:'#1e0f0f'};
  if(p.sold) return {key:'sold',label:t('status_sold'),color:'var(--orange)',bg:'#2a1a0a'};
  if(p.instock===false) return {key:'not_instock',label:t('status_not_instock'),color:'#c8883a',bg:'#2a1a0a'};
  return {key:'instock',label:t('status_instock'),color:'var(--green)',bg:'color-mix(in srgb,var(--green) 10%,var(--bg3))'};
}
