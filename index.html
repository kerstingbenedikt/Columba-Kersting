function renderGen(arr,gen,emptyMsg,groupKey){
  if(!arr.length) return '<div style="color:var(--text3);font-size:13px;padding:8px 0">'+(emptyMsg||('Keine '+gen+' in der Datenbank erfasst.'))+'</div>';
  var groups={};
  arr.forEach(function(p){
    var st=statusStyle(p);
    if(!groups[st.label]) groups[st.label]={style:st,birds:[]};
    groups[st.label].birds.push(p);
  });
  // Feste Priorität: Im Bestand, Nicht im Bestand, danach alles Weitere (Verstorben, Verkauft, ...).
  var order=['instock','not_instock','died','sold'];
  var sorted=Object.entries(groups).sort(function(a,b){
    var ia=order.indexOf(a[1].style.key); if(ia<0) ia=order.length;
    var ib=order.indexOf(b[1].style.key); if(ib<0) ib=order.length;
    return ia-ib;
  });
  return sorted.map(function(entry){
    var label=entry[0], g=entry[1];
    var key=groupKey+':'+encodeURIComponent(label);
    var collapsed=!S.nachExpanded[key];
    return '<div style="margin-bottom:14px">'
      +'<div onclick="toggleNachExpand(\''+key+'\')" style="display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:pointer;user-select:none">'
      +'<span style="color:var(--text3);font-size:11px;width:12px;display:inline-block">'+(collapsed?'▸':'▾')+'</span>'
      +'<span style="background:'+g.style.bg+';color:'+g.style.color+';padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500">'+g.style.label+'</span>'
      +'<span style="font-size:12px;color:var(--text3)">'+g.birds.length+' Taube'+(g.birds.length!==1?'n':'')+'</span>'
      +'</div>'
      +(collapsed?'':'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px">'
      +g.birds.map(birdCard).join('')
      +'</div>')+'</div>';
  }).join('');
}

// Tabellarische Ansicht für die gefilterte Nachkommen-Liste (Bestandsstatus
// und/oder Generation gefiltert). Zeigt zusätzlich den Partner (den jeweils
// anderen Elternteil) je Nachkomme an, damit man direkt sieht, aus welcher
// Verpaarung die Taube stammt.
function renderGenTable(birds, genKey, rootId, emptyMsg){
  if(!birds.length) return '<div style="color:var(--text3);font-size:13px;padding:8px 0">'+(emptyMsg||'Keine Ergebnisse.')+'</div>';
  var genLabel = genKey==='children'?'Kind':genKey==='gc'?'Enkel':'Urenkel';
  var order=['instock','not_instock','died','sold'];
  var sorted=birds.slice().sort(function(a,b){
    var sa=statusStyle(a), sb=statusStyle(b);
    var ia=order.indexOf(sa.key); if(ia<0) ia=order.length;
    var ib=order.indexOf(sb.key); if(ib<0) ib=order.length;
    if(ia!==ib) return ia-ib;
    return ring(a).localeCompare(ring(b));
  });
  var rows=sorted.map(function(p){
    var st=statusStyle(p), sx=sex_(p);
    var knownParentId = genKey==='children' ? rootId : p._via;
    var partner = findPartner(p, knownParentId);
    var partnerHtml = partner
      ? '<span style="cursor:pointer" onclick="event.stopPropagation();selectPigeon(\''+partner.pigeonid+'\')" title="Partner anzeigen">'
        +'<span style="font-family:monospace;color:var(--blue)">'+escH(ring(partner))+'</span>'
        +(partner.name?' <span style="color:var(--text2)">· '+escH(partner.name)+'</span>':'')+'</span>'
      : '<span style="color:var(--text3)">—</span>';
    return '<tr style="cursor:pointer" onclick="selectPigeon(\''+p.pigeonid+'\')">'
      +'<td style="font-family:monospace;font-size:12px;color:var(--green);white-space:nowrap">'+escH(ring(p))+' '+(sx==='M'?'♂':sx==='F'?'♀':'')+'</td>'
      +'<td>'+(p.name?escH(p.name):'<span style="color:var(--text3)">—</span>')+'</td>'
      +'<td style="text-align:center;color:var(--text3);font-size:12px;white-space:nowrap">'+genLabel+'</td>'
      +'<td style="text-align:center">'+(p.date_year||'—')+'</td>'
      +'<td>'+(tColor(p.color)?escH(tColor(p.color)):'<span style="color:var(--text3)">—</span>')+'</td>'
      +'<td>'+partnerHtml+'</td>'
      +'<td><span style="background:'+st.bg+';color:'+st.color+';padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap">'+st.label+'</span></td>'
      +'<td style="text-align:right;white-space:nowrap">'
      +'<span onclick="event.stopPropagation();showPedigree(\''+p.pigeonid+'\')" title="Stammbaum" style="font-size:11px;color:var(--text3);cursor:pointer;padding:2px 7px;border:1px solid var(--border);border-radius:4px" onmouseover="this.style.color=\'var(--green)\'" onmouseout="this.style.color=\'var(--text3)\'">🌳</span> '
      +'<span onclick="event.stopPropagation();showNachkommen(\''+p.pigeonid+'\')" title="Nachkommen" style="font-size:11px;color:var(--text3);cursor:pointer;padding:2px 7px;border:1px solid var(--border);border-radius:4px" onmouseover="this.style.color=\'var(--green)\'" onmouseout="this.style.color=\'var(--text3)\'">🐣</span>'
      +'</td></tr>';
  }).join('');
  return '<div class="table-wrap"><table style="width:100%;border-collapse:collapse;font-size:13px">'
    +'<thead><tr><th>Ring</th><th>Name</th><th>Generation</th><th>Jg.</th><th>Farbe</th><th>Partner</th><th>Status</th><th></th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table></div>';
}

function renderNachkommen(pid){
  var root=findById(pid);
  if(!root) return '<div style="padding:20px;color:var(--text3)">Taube nicht gefunden.</div>';
  function dedup(arr){var seen=new Set();return arr.filter(function(p){if(seen.has(p.pigeonid))return false;seen.add(p.pigeonid);return true;});}
  var children=findChildren(pid);
  var gc=dedup(children.flatMap(function(c){return findChildren(c.pigeonid).map(function(g){return Object.assign({},g,{_via:c.pigeonid});});}));
  var ggc=dedup(gc.flatMap(function(g){return findChildren(g.pigeonid).map(function(gg){return Object.assign({},gg,{_via:g.pigeonid});});}));
  var allDesc=dedup(children.concat(gc).concat(ggc));
  var total=allDesc.length;
  var active=allDesc.filter(function(p){return p.instock;}).length;
  var died=allDesc.filter(function(p){return p.died;}).length;
  var sold=allDesc.filter(function(p){return p.sold;}).length;
  var sx=sex_(root);

  // Erfolgreich/Elite-Kennzahlen stammen aus derselben Berechnung wie der
  // Erfolgs-Score unten (computeErfolgsScore -> Vererbungsstärke), damit die
  // Zahlen konsistent sind. Erfasst nur Kinder+Enkel (siehe
  // getVererbungDescendants) — für Urenkel gibt es keine Vererbungs-Bewertung.
  var er = computeErfolgsScore(pid);
  var perDescendant = (er.ver && er.ver.perDescendant) || [];
  var perfMap = {};
  perDescendant.forEach(function(d){
    perfMap[d.pigeon.pigeonid] = { erfolgreich: !!(d.erfolgreich && d.pigeon.instock), elite: !!d.elite };
  });
  var erfolgreichCount = perDescendant.filter(function(d){ return d.erfolgreich && d.pigeon.instock; }).length;
  var eliteCount = perDescendant.filter(function(d){ return d.elite; }).length;

  // KPI-Kacheln: 'Nachkommen' setzt alle Filter zurück, die Status-Kacheln
  // (Im Bestand/Verstorben/Verkauft), die Generations-Kacheln (Kinder/Enkel/
  // Urenkel) und die Erfolgs-Kacheln (Erfolgreich/Elite) sind einzeln
  // anklickbar und togglen den jeweiligen Filter.
  var kpis=[
    ['Nachkommen',total,'var(--green)',null,null],
    ['Kinder',children.length,'var(--blue)','gen','children'],
    ['Enkel',gc.length,'var(--purple)','gen','gc'],
    ['Urenkel',ggc.length,'var(--text2)','gen','ggc'],
    ['Im Bestand',active,'var(--green)','status','instock'],
    ['Verstorben',died,'#e07070','status','died'],
    ['Verkauft',sold,'var(--orange)','status','sold'],
    ['Erfolgreich',erfolgreichCount,'var(--green)','perf','erfolgreich'],
    ['Elite',eliteCount,'#f0c419','perf','elite']
  ];
  var kpiHtml=kpis.map(function(k){
    var isActive = k[3]==='status' ? S.nachStatusFilter===k[4] : (k[3]==='gen' ? S.nachGenFilter===k[4] : (k[3]==='perf' ? S.nachPerfFilter===k[4] : (!S.nachStatusFilter&&!S.nachGenFilter&&!S.nachPerfFilter)));
    var onclick = k[3]===null ? "S.nachStatusFilter=null;S.nachGenFilter=null;S.nachPerfFilter=null;render();"
      : (k[3]==='status' ? "toggleNachStatusFilter('"+k[4]+"')" : (k[3]==='gen' ? "toggleNachGenFilter('"+k[4]+"')" : "toggleNachPerfFilter('"+k[4]+"')"));
    var tip = k[3]===null ? 'Alle Filter zurücksetzen'
      : k[3]==='perf' ? (k[4]==='erfolgreich' ? 'Nachkommen mit erfolgreicher Preisquote (Kinder+Enkel im Bestand)' : 'Elite-Nachkommen (Kinder+Enkel)')
      : (isActive ? 'Filter "'+k[0]+'" entfernen' : 'Nach "'+k[0]+'" filtern');
    return '<div onclick="'+onclick+'" title="'+tip+'" style="cursor:pointer;background:var(--bg3);border:1px solid '+(isActive?k[2]:'var(--border)')+';border-radius:var(--radius-sm);padding:12px;text-align:center;transition:border-color .15s'+(isActive?';box-shadow:0 0 0 1px '+k[2]+' inset':'')+'">'
      +'<div style="font-family:\'Playfair Display\',serif;font-size:24px;color:'+k[2]+';font-weight:600">'+k[1]+'</div>'
      +'<div style="font-size:11px;color:'+(isActive?'var(--text)':'var(--text3)')+';margin-top:3px">'+k[0]+'</div></div>';
  }).join('');

  // Priorität beim Filtern: zuerst Bestandsstatus (Im Bestand/Verstorben/Verkauft),
  // dann Erfolg (Erfolgreich/Elite), dann Generation (Kinder/Enkel/Urenkel).
  // Innerhalb der Ergebnisliste gruppiert renderGen() zusätzlich nach
  // Status/Geschlecht (Täuber/Täubin aktiv).
  function applyStatusFilter(arr){
    var out=arr;
    if(S.nachStatusFilter==='instock') out=out.filter(function(p){return p.instock;});
    if(S.nachStatusFilter==='died') out=out.filter(function(p){return p.died;});
    if(S.nachStatusFilter==='sold') out=out.filter(function(p){return p.sold;});
    if(S.nachPerfFilter==='erfolgreich') out=out.filter(function(p){return perfMap[p.pigeonid]&&perfMap[p.pigeonid].erfolgreich;});
    if(S.nachPerfFilter==='elite') out=out.filter(function(p){return perfMap[p.pigeonid]&&perfMap[p.pigeonid].elite;});
    return out;
  }
  var statusLabel = S.nachStatusFilter==='instock'?'Im Bestand':S.nachStatusFilter==='died'?'Verstorben':S.nachStatusFilter==='sold'?'Verkauft':null;
  var perfLabel = S.nachPerfFilter==='erfolgreich'?'Erfolgreich':S.nachPerfFilter==='elite'?'Elite':null;
  var filterLabel = [statusLabel,perfLabel].filter(Boolean).join(' + ');

  // Sobald gefiltert wird (Status, Erfolg und/oder Generation), klappen die
  // betroffenen Abschnitte automatisch auf und werden als Tabelle (inkl.
  // Partner- und Generations-Spalte) statt als Karten-Raster dargestellt —
  // manuelles Zuklappen bleibt weiterhin per Klick möglich und wird dann
  // respektiert (S.nachExpanded überschreibt den Auto-Expand-Default).
  var isFiltering = !!(S.nachStatusFilter || S.nachGenFilter || S.nachPerfFilter);
  var gens=[['🐣 Kinder (1. Generation)',children,'Kinder','children'],['🐓 Enkel (2. Generation)',gc,'Enkel','gc'],['🥚 Urenkel (3. Generation)',ggc,'Urenkel','ggc']];
  if(S.nachGenFilter) gens=gens.filter(function(g){return g[3]===S.nachGenFilter;});
  var genHtml=gens.map(function(g){
    var birds=applyStatusFilter(g[1]);
    var emptyMsg = filterLabel ? 'Keine '+g[2]+' mit Status "'+filterLabel+'".' : null;
    var genKey='gen:'+g[3];
    var genCollapsed = S.nachExpanded[genKey]===undefined ? !isFiltering : !S.nachExpanded[genKey];
    var body = genCollapsed ? '' : (isFiltering ? renderGenTable(birds,g[3],pid,emptyMsg) : renderGen(birds,g[2],emptyMsg,genKey));
    return '<div class="card" style="margin-bottom:12px">'
      +'<div class="card-title" onclick="toggleNachExpand(\''+genKey+'\')" style="cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px">'
      +'<span style="color:var(--text3);font-size:11px">'+(genCollapsed?'▸':'▾')+'</span>'
      +g[0]+' <span style="color:var(--text3);font-weight:400">('+birds.length+(filterLabel?' von '+g[1].length:'')+')</span></div>'
      +body+'</div>';
  }).join('');

  return '<div class="card" style="margin-bottom:12px">'
    +'<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px">'
    +'<div>'
    +'<div class="serif" style="font-size:22px">'+escH(root.name||ring(root))+'</div>'
    +'<div style="font-family:monospace;font-size:13px;color:var(--green);margin-top:4px">'
    +escH(ring(root))+' · '+(sx==='M'?'♂ Täuber':sx==='F'?'♀ Täubin':'?')+' · Jg. '+(root.date_year||'—')
    +'</div></div>'
    +'</div>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px">'+kpiHtml+'</div>'
    +renderVererbungCard(pid, er)
    +'</div>'+genHtml;
}

function bindNachSearch(){
  var inp=document.getElementById('nach-inp');
  var res=document.getElementById('nach-results');
  if(!inp||!res) return;
  inp.addEventListener('input',function(){
    var q=inp.value.trim();
    if(q.length<2){res.style.display='none';res.innerHTML='';return;}
    var hits=S.pigeons.filter(function(p){
      return (p.ringnumber||'').toLowerCase().indexOf(q.toLowerCase())!==-1
          ||(p.name||'').toLowerCase().indexOf(q.toLowerCase())!==-1;
    }).slice(0,10);
    res.style.display='block';
    res.innerHTML=hits.length?hits.map(function(p){
      return '<div class="ped-result" onclick="showNachkommen(\''+p.pigeonid+'\')">'
        +'<span class="ring">'+escH(ring(p))+'</span>'
        +(p.name?'<span style="color:var(--text)">'+escH(p.name)+'</span>':'')
        +'<span style="color:var(--text3);font-size:12px;margin-left:auto">'+(sex_(p)==='M'?'♂':'♀')+' '+(p.date_year||'')+'</span>'
        +'</div>';
    }).join(''):'<div style="padding:12px;color:var(--text3);font-size:13px">Keine Treffer</div>';
  });
}

// ── App-Start: Session prüfen ─────────────────────────────────
(async function(){
  const ok = await restoreSession();
  if(ok){
    startApp();
    // Zusätzliche Absicherung neben dem Retry-in-apiFetch: Token proaktiv alle
    // 20 Minuten erneuern, damit ein Supabase-Zugriffstoken (üblich: 1h
    // gültig) bei einem lange geöffneten Tab möglichst nie mitten in einer
    // Aktion abläuft.
    setInterval(function(){
      const raw = localStorage.getItem('bv_session');
      if(!raw) return;
      try{ const s = JSON.parse(raw); if(s.refresh) refreshSession(s.refresh); }catch(e){}
    }, 20*60*1000);
  } else {
    renderLogin();
  }
})();
</script>
