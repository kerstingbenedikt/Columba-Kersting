async function deletePigeon(id){
  const p = findById(id);
  if(!p) return;
  const label = (p.ringnumber||p.pigeonid) + (p.name?' · '+p.name:'');
  if(!confirm(`Taube "${label}" wirklich löschen?\n\nSie wird aus der Liste entfernt (Soft-Delete). Verknüpfungen als Vater/Mutter anderer Tauben bleiben über die Ringnummer-Textfelder erhalten, falls vorhanden.`)) return;
  try {
    await apiPatch('pigeons', id, {deleted:true, instock:false});
    S.pigeons = S.pigeons.filter(x=>x.pigeonid!==id); invalidatePedigreeCache();
    if(S.selected && S.selected.pigeonid===id) S.selected=null;
    applyFilter();
    render();
  } catch(e){
    alert('Fehler beim Löschen: '+e.message);
  }
}

function cancelEdit(id){
  const p=findById(id);
  if(p) delete p._editMode;
  render();
}

async function saveEdit(id){
  const msg=document.getElementById('edit-msg');
  const g=id=>document.getElementById(id);
  const val=id=>{const el=g(id);return el?el.value.trim():'';};
  const row={
    ringnumber:     fmtRingnumber(val('e_ringnumber')) || val('e_ringnumber'),
    ringnumberold:  fmtRingnumber(val('e_ringnumberold')) || val('e_ringnumberold'),
    name:           val('e_name'),
    date_year:      val('e_date_year')?Number(val('e_date_year')):null,
    gender:         val('e_gender')||null,
    color:          val('e_color'),
    race:           val('e_race'),
    strain:         val('e_strain'),
    breeder:        val('e_breeder'),
    owner:          val('e_owner'),
    standort:       val('e_standort'),
    countrycode:    normCountryCode(val('e_countrycode')),
    associationno:  val('e_associationno'),
    birthday:       val('e_birthday')||null,
    died:           val('e_died')||null,
    bought:         val('e_bought')||null,
    sold:           val('e_sold')||null,
    instock:        val('e_instock')==='true',
    pigeontype:     (()=>{ const el=document.getElementById('e_pigeontype'); return el&&el.value?el.value:null; })(),
    pigeonstateid:  (()=>{ const el=document.getElementById('e_pigeonstateid'); return el&&el.value?el.value:null; })(),
    info:           val('e_info'),
    internalinfo:   val('e_internalinfo'),
  };
  // Vater/Mutter: NICHT nur das versteckte e_father_id/e_mother_id übernehmen
  // (das wird nur gesetzt, wenn tatsächlich ein Vorschlag aus dem Autocomplete
  // angeklickt wurde) — sonst bleibt beim Löschen/Ändern des sichtbaren
  // Textfelds die alte Verknüpfung unbemerkt bestehen. Stattdessen wie beim
  // Anlegen einer neuen Taube (submitNeu) IMMER aus dem sichtbaren Textfeld
  // ableiten: leer → Verknüpfung wirklich entfernen (fatherid/motherid UND
  // ringnumberfather/-mother auf null); Text vorhanden + aus Dropdown gewählt
  // → Ring-ID verwenden; Text vorhanden ohne Auswahl → per Ringnummer in der
  // DB suchen, sonst als reinen Text-Fallback speichern.
  const fInp=val('e_father_inp'), fId=g('e_father_id')&&g('e_father_id').value?g('e_father_id').value:null;
  if(!fInp){ row.fatherid=null; row.ringnumberfather=null; }
  else if(fId){ row.fatherid=fId; row.ringnumberfather=fInp; }
  else { const fp=findInDb(fInp); if(fp){ row.fatherid=fp.pigeonid; row.ringnumberfather=ring(fp); } else { row.fatherid=null; row.ringnumberfather=fmtRingnumber(fInp)||fInp; } }
  const mInp=val('e_mother_inp'), mId=g('e_mother_id')&&g('e_mother_id').value?g('e_mother_id').value:null;
  if(!mInp){ row.motherid=null; row.ringnumbermother=null; }
  else if(mId){ row.motherid=mId; row.ringnumbermother=mInp; }
  else { const mp=findInDb(mInp); if(mp){ row.motherid=mp.pigeonid; row.ringnumbermother=ring(mp); } else { row.motherid=null; row.ringnumbermother=fmtRingnumber(mInp)||mInp; } }
  // Eine Taube kann nicht ihr eigener Vater/ihre eigene Mutter sein — direkt
  // beim Speichern abfangen, statt eine offensichtlich falsche Verknüpfung
  // erst nachträglich über die Stammbaum-Prüfung bereinigen zu müssen.
  if(row.fatherid===id){ alert('Eine Taube kann nicht als ihr eigener Vater verknüpft werden.'); return; }
  if(row.motherid===id){ alert('Eine Taube kann nicht als ihre eigene Mutter verknüpft werden.'); return; }
  // Leere Strings als null
  Object.keys(row).forEach(k=>{ if(row[k]==='') row[k]=null; });
  if(msg){ msg.style.display='block'; msg.style.background='var(--bg3)'; msg.style.color='var(--text2)'; msg.textContent='Speichern…'; }
  try{
    await apiPatch('pigeons', id, row);
    // Lokalen State aktualisieren
    const idx=S.pigeons.findIndex(p=>p.pigeonid===id);
    if(idx!==-1){ S.pigeons[idx]=Object.assign({},S.pigeons[idx],row,{pigeonid:id}); }
    invalidatePedigreeCache();
    S.selected=S.pigeons.find(p=>p.pigeonid===id)||null;
    if(S.selected) delete S.selected._editMode;
    applyFilter();
    render();
  } catch(err){
    if(msg){ msg.style.background='#2a0f0f'; msg.style.color='#e07070'; msg.textContent='❌ Fehler: '+err.message; }
  }
}

function renderPedigree(pid, opts){
  opts = opts || {};
  const embedded = opts.embedded===true;
  const root=findById(pid);
  if(!root) return '<div style="padding:20px;color:var(--text3)">'+t('pedigree_not_found')+'</div>';
  // Für die "gesetzt"-Zahl bei Flügen mit mehreren beteiligten RVs (siehe rvGesetzt())
  // wird der Züchter-Cache (ZT.rows) benötigt — beim ersten Öffnen eines Stammbaums
  // ggf. im Hintergrund nachladen, ohne den Druck selbst zu blockieren.
  if(!ZT.loaded){ loadZuechterData().then(render); }
  try{
  return renderPedigreeInner(root, opts, embedded);
  } catch(e){
    console.error('Fehler beim Rendern des Stammbaums:', e);
    return `<div class="card"><div class="error-box">⚠️ Der Stammbaum konnte nicht angezeigt werden: ${escH(e.message)}</div>
      <button class="back-btn" onclick="S.selected=null;S.tab='tauben';setActiveNav('tauben');render()">← Zur Übersicht</button></div>`;
  }
}

// ── DRUCK / PDF ────────────────────────────────────────────────
// Baum-Aufbau, Reiseleistungs-Vorladen und Seitenmaße — gemeinsame Basis für den
// HTML-Druck UND den Vektor-PDF-Export, damit beide garantiert exakt dieselbe
// Struktur/Größenlogik verwenden (kein doppelt gepflegter Code, keine Abweichungen).
async function buildPedigreeTreeData(pid, gens){
  gens = parseInt(gens)||4;
  const root = findById(pid);
  if(!root) return null;

  const _ring   = p => p?(p.ringnumber||p.ringnumberold||'—'):'—';
  const _sex    = p => { if(!p) return '?'; const g=String(p.gender||p.sex||'').trim().toLowerCase(); if(['m','1','male','cock'].includes(g))return'M'; if(['f','2','w','female','hen'].includes(g))return'F'; return '?'; };
  const _father = p => { if(!p) return null; if(p.fatherid) return S.pigeons.find(x=>x.pigeonid===p.fatherid)||null; if(p.ringnumberfather) return S.pigeons.find(x=>x.ringnumber===p.ringnumberfather)||null; return null; };
  const _mother = p => { if(!p) return null; if(p.motherid) return S.pigeons.find(x=>x.pigeonid===p.motherid)||null; if(p.ringnumbermother) return S.pigeons.find(x=>x.ringnumber===p.ringnumbermother)||null; return null; };

  // Baum aufbauen
  function buildTree(p, gen, pos, arr){
    if(!arr[gen]) arr[gen]=[];
    arr[gen][pos]=p||null;
    if(gen>=gens-1) return;
    buildTree(_father(p), gen+1, pos*2,   arr);
    buildTree(_mother(p), gen+1, pos*2+1, arr);
  }
  const tree=[];
  buildTree(root, 0, 0, tree);

  // Reiseleistung für Proband, Eltern und Großeltern laden (kompakte Jahreszeilen in
  // den Boxen bis Gen. 2, ausführliche Top-20-Liste für Proband + Eltern).
  const travelIds=[];
  [0,1,2].forEach(g=>{ (tree[g]||[]).forEach(p=>{ if(p&&p.pigeonid) travelIds.push(p.pigeonid); }); });
  await loadPigeonTripsBatch(travelIds);

  // Züchterdaten für die Kopfzeile (bereits über triggerPrint geladen).
  const breederProf = BREEDER_PROFILE || {};

  const rows   = Math.pow(2, gens-1);   // 8 (4gen) oder 16 (5gen)
  // Ab 5 Generationen reicht Hochformat nicht mehr aus (Spalten würden zu schmal für
  // vollständige Ringnummern) → automatisch auf Querformat wechseln, das gibt ca. 45%
  // mehr nutzbare Breite pro Spalte.
  const landscape = gens>=5;
  const pageWmm   = landscape ? 281 : 194;  // nutzbare Breite (A4 minus Ränder)
  const pageHmm   = landscape ? 194 : 281;  // nutzbare Gesamthöhe (A4 minus Rändern, inkl. Kopfzeile)
  const totalConn = (gens-1)*5;
  const datWmm    = Math.floor((pageWmm - totalConn) / gens);
  const conWmm    = 5;

  const safeName = (root.name || _ring(root) || 'Taube').toString()
    .replace(/[^\p{L}\p{N}\-]+/gu,'_').replace(/_+/g,'_').replace(/^_|_$/g,'') || 'Taube';
  const filenameBase = `Stammbaum_${safeName}`;

  return { root, gens, tree, rows, landscape, pageWmm, pageHmm, totalConn, datWmm, conWmm, breederProf, filenameBase, _ring, _sex, _father, _mother };
}

// Gemeinsame Box-Rendering-Funktion für alle Stammbaum-Exportformate (Fächer-Stil
// und Familien-Stil) — Infomenge abhängig von Generation und verfügbarem Platz.
function pedigreeBoxHtml(p, gen, ctx){
  const { withPhoto, landscape, _ring, _sex, _esc } = ctx;
  if(!p) return `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:7pt">–</div>`;
  const sx   = _sex(p);
  const col  = sx==='M'?'#3a7bd5':sx==='F'?'#8e44ad':'#888';
  const tags = [p.color, p.strain, p.breeder?'Z: '+p.breeder:null].filter(Boolean);
  const info = (p.info||'').trim();
  const rn   = _ring(p);

  const szRing = gen===0?'8pt':gen===1?'7.5pt':gen===2?'7pt':gen===3?'6.5pt':'6pt';
  const szName = gen===0?'9pt':gen===1?'8pt':gen===2?'7.5pt':'6.5pt';
  const szTag  = gen===0?'7pt':gen===1?'6.5pt':'6pt';
  const szInfo = gen===0?'7.5pt':gen===1?'7pt':gen===2?'6.5pt':'6pt';
  const showTags = gen<=3;
  const showInfo = gen<=2 && info;
  const showName = gen<=3 || !landscape;

  const travelMaxYears = gen===0?3:gen===1?2:1;
  const travelLines = (gen<=2 && p.pigeonid) ? pigeonTravelCompactLines(p.pigeonid, travelMaxYears) : [];
  const szTravel = gen===0?'7pt':gen===1?'6.5pt':'6pt';

  const topLines = (gen<=1 && p.pigeonid) ? pigeonTopPlacementsCompactLines(p.pigeonid) : [];
  const szTop = gen===0?'7pt':'6.5pt';

  const photoSize = gen===0?'15mm':gen===1?'11mm':'8mm';
  const photoHtml = (withPhoto && p.photo)
    ? `<img src="${p.photo}" style="width:${photoSize};height:${photoSize};object-fit:cover;border-radius:1mm;border:.2mm solid #ddd;float:left;margin:0 2mm 1mm 0;background:#fff">`
    : '';

  return `<div style="border-left:2mm solid ${col};padding:1.5mm 2mm;background:#fafafa;border-radius:.8mm;width:100%;height:100%;min-height:0;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column">
    ${photoHtml}
    ${p._virtual?`<div style="font-size:6.5pt;color:#666;background:#e8e8e8;display:inline-block;padding:.3mm 1.5mm;border-radius:2mm;flex-shrink:0">🧬 Prognose</div>`:`<div style="font-family:monospace;font-size:${szRing};font-weight:700;color:#1a6b1a;white-space:normal;word-break:break-word;line-height:1.2;flex-shrink:0">
      ${sx==='M'?'♂':sx==='F'?'♀':'?'} ${_esc(rn)}</div>`}
    ${p.name&&showName?`<div style="font-size:${szName};font-weight:700;white-space:${p._virtual?'normal':'nowrap'};overflow:hidden;text-overflow:ellipsis;margin-top:.3mm;flex-shrink:0">${_esc(p.name)}</div>`:''}
    ${showTags&&tags.length?`<div style="font-size:${szTag};color:#666;margin-top:.4mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0">${tags.map(_esc).join(' · ')}</div>`:''}
    ${travelLines.length?`<div style="font-size:${szTravel};color:#1a6b1a;margin-top:.6mm;border-top:.2mm solid #ddd;padding-top:.4mm;line-height:1.35;flex-shrink:0">${travelLines.map(_esc).join('<br>')}</div>`:''}
    ${topLines.length?`<div style="font-size:${szTop};color:#333;margin-top:.5mm;line-height:1.35;flex-shrink:0">${topLines.map(_esc).join('<br>')}</div>`:''}
    ${showInfo?`<div style="font-size:${szInfo};color:#333;margin-top:1mm;border-top:.2mm solid #ddd;padding-top:.5mm;line-height:1.45;overflow:hidden;flex:1;word-break:break-word">${_esc(info)}</div>`:''}
  </div>`;
}

// Gemeinsame Kopfzeile für alle Stammbaum-Exportformate: Züchterdaten links,
// Logo/Foto mittig, im Druckdialog ausgewählte Züchtererfolge rechts.
function pedigreeBreederHeaderHtml(breederProf, erfolgeText, _esc){
  const p = breederProf || {};
  if(!p.name && !p.strasse && !p.ort && !p.verein && !p.logo && !erfolgeText) return '';
  const addr = [p.strasse, p.ort].filter(Boolean).join(', ');
  const left = `<div>
    ${p.name?`<div style="font-size:11pt;font-weight:700">${_esc(p.name)}</div>`:''}
    ${addr?`<div style="font-size:7pt;color:#555;margin-top:.5mm">${_esc(addr)}</div>`:''}
    ${p.verein?`<div style="font-size:7pt;color:#555">${_esc(p.verein)}</div>`:''}
    ${p.telefon?`<div style="font-size:7pt;color:#555">Tel. ${_esc(p.telefon)}</div>`:''}
  </div>`;
  const mid = p.logo?`<div style="text-align:center"><img src="${p.logo}" style="max-height:18mm;max-width:40mm;object-fit:contain"></div>`:'<div></div>';
  const right = erfolgeText?`<div style="font-size:7pt;color:#555;text-align:right;max-width:90mm">
    <div style="font-size:8pt;font-weight:700;color:#1a6b1a;margin-bottom:.5mm">Züchtererfolge</div>
    ${_esc(erfolgeText).replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>')}
  </div>`:'<div></div>';
  return `<div style="margin-bottom:2.5mm;padding-bottom:2mm;border-bottom:.3mm solid #ccc;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4mm">
    ${left}${mid}${right}
  </div>`;
}

async function buildPedigreeHtml(pid, gens, withPhoto, erfolgeText){
  try{
    withPhoto = !!withPhoto;
    const data = await buildPedigreeTreeData(pid, gens);
    if(!data){ alert('Taube nicht gefunden'); return null; }
    const { root, gens:gensN, tree, rows, landscape, pageWmm, pageHmm, datWmm, conWmm, breederProf, filenameBase, _ring, _sex } = data;
    gens = gensN;

    const _esc    = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    // Box-HTML — nutzt die gemeinsame pedigreeBoxHtml() (s.o.)
    const box = (p, gen) => pedigreeBoxHtml(p, gen, {withPhoto, landscape, _ring, _sex, _esc});


    // Grid-Template ohne Header-Zeile
    let gtc='';
    for(let g=0;g<gens;g++){ gtc+=datWmm+'mm'; if(g<gens-1) gtc+=' '+conWmm+'mm '; }
    // minmax(0,1fr) statt 1fr: eine reine 1fr-Spur hat eine implizite Mindesthöhe, die
    // sich am Inhalt der Zelle orientiert (min-height:auto). Ist der Boxinhalt (Foto,
    // Reiseleistungs-/Platzierungszeilen) zusammen höher als die verfügbare 1fr-Höhe,
    // "sprengt" das die Zeile und Chrome druckt eine zweite, fast leere Seite — obwohl
    // overflow:hidden auf dem Grid-Container steht. minmax(0,…) erlaubt der Spur, echt
    // auf 0 zu schrumpfen und garantiert damit Zeilenhöhe = verfügbarer Platz / rows.
    const gtr = 'repeat('+rows+',minmax(0,1fr))';  // keine Header-Zeile! Höhe verteilt sich per Flexbox auf Restplatz der Seite

    let cells='';
    for(let g=0;g<gens;g++){
      const count  = Math.pow(2,g);
      const span   = rows/count;
      const gridCol= g*2+1;
      for(let i=0;i<count;i++){
        const p   = tree[g]?tree[g][i]:null;
        const rs  = i*span+1;  // +1 (kein Header)
        const re  = rs+span;
        // min-height:0 + overflow:hidden auf der Zelle selbst: verhindert, dass die
        // implizite Mindesthöhe des Grid-Items (min-height:auto) die Zeile aufbläht.
        cells+=`<div style="grid-column:${gridCol};grid-row:${rs}/${re};padding:.5mm;border-bottom:.15mm solid #e8e8e8;border-right:.15mm solid #e8e8e8;box-sizing:border-box;min-height:0;overflow:hidden">${box(p,g)}</div>`;
      }
      // Verbinder
      if(g<gens-1){
        const cc=g*2+2;
        for(let i=0;i<count;i++){
          const rs=i*span+1, mid=rs+span/2, re=rs+span;
          cells+=`<div style="grid-column:${cc};grid-row:${rs}/${mid};position:relative">
            <svg style="position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible" preserveAspectRatio="none">
              <line x1="0" y1="50%" x2="100%" y2="50%" stroke="#aaa" stroke-width=".3mm"/>
              <line x1="0" y1="50%" x2="0" y2="100%" stroke="#aaa" stroke-width=".3mm"/>
            </svg></div>`;
          cells+=`<div style="grid-column:${cc};grid-row:${mid}/${re};position:relative">
            <svg style="position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible" preserveAspectRatio="none">
              <line x1="0" y1="50%" x2="100%" y2="50%" stroke="#aaa" stroke-width=".3mm"/>
              <line x1="0" y1="0" x2="0" y2="50%" stroke="#aaa" stroke-width=".3mm"/>
            </svg></div>`;
        }
      }
    }



    // Kopfzeile: Züchterdaten links, Logo/Foto mittig, im Druckdialog ausgewählte
    // Züchtererfolge rechts. Grid statt flex-space-between, damit das Logo unabhängig
    // von der Breite der Nachbarspalten exakt mittig steht.
    function buildBreederHeader(){ return pedigreeBreederHeaderHtml(breederProf, erfolgeText, _esc); }

    const html=`<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8">
<title>Stammbaum – ${_esc(root.name||_ring(root))}</title>
<style>
  @page{size:A4 ${landscape?'landscape':'portrait'};margin:8mm 8mm 8mm 8mm}
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
  html,body{height:100%}
  body{width:${pageWmm}mm;height:${pageHmm}mm;background:#fff;color:#111;display:flex;flex-direction:column;overflow:hidden}
  @media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head><body>
<div style="flex-shrink:0">
${buildBreederHeader()}
</div>
<div style="flex:1;min-height:0;display:grid;grid-template-columns:${gtc};grid-template-rows:${gtr};border:.3mm solid #ccc;width:${pageWmm}mm;overflow:hidden">
  ${cells}
</div>
</body></html>`;

    return { html, pageWmm, pageHmm, filenameBase };
  } catch(e){
    alert('Druckfehler: '+e.message+'\n'+e.stack);
    return null;
  }
}

// ── Familien-Stil Stammbaum (à la "SG Steffl"-Vorlage) ──────────────────
// Der Proband erscheint nicht als eigene volle Spalte, sondern als kleines
// Feld ganz links in der Mitte (1/5 der Höhe der ersten Spalte), darüber der
// Vater und darunter die Mutter (je 2/5) — rechts daneben folgen die
// weiteren Ahnen-Generationen als normale Spalten mit je doppelter
// Boxanzahl (Großeltern, Urgroßeltern, …), gleichmäßig über die volle Höhe
// verteilt. "gens" zählt hier die Ahnen-Generationen (Vater/Mutter = 1,
// Großeltern = 2, …) — der Proband kommt zusätzlich dazu.
async function buildFamilyPedigreeHtml(pid, gens, withPhoto, erfolgeText){
  try{
    withPhoto = !!withPhoto;
    const ancestorGens = parseInt(gens)||4;
    // Eine Ebene mehr anfordern, als Ahnen-Spalten gewünscht sind: Ebene 0 =
    // Proband (separat als kleines Feld gerendert), Ebenen 1..ancestorGens =
    // die Ahnen-Spalten.
    const data = await buildPedigreeTreeData(pid, ancestorGens+1);
    if(!data){ alert('Taube nicht gefunden'); return null; }
    const { root, tree, breederProf, _ring, _sex } = data;
    const rows = Math.pow(2, ancestorGens); // Boxanzahl der tiefsten Ahnen-Spalte

    const _esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    // Familienstil bleibt bewusst im Hochformat (DIN A4 Portrait) — auch bei
    // 4-5 Ahnengenerationen bleiben die Boxen in der tiefsten Spalte schmal,
    // enthalten dort aber ohnehin nur noch die Ringnummer.
    const landscape = ancestorGens>=7;
    const pageWmm = landscape ? 281 : 194;
    const pageHmm = landscape ? 194 : 281;

    const totalCols = ancestorGens; // Spalte 1 = Vater/Proband/Mutter zusammen + weitere Ahnen-Spalten
    const gapMm = 1;
    const datWmm = Math.floor((pageWmm - gapMm*(totalCols-1)) / totalCols);

    // 5 Fünftel in Spalte 1: Vater 2/5, Proband 1/5, Mutter 2/5. Damit diese
    // Drittelung bei jeder Ahnen-Tiefe auf ganzzahligen Grid-Linien landet,
    // wird die Gesamthöhe in rows*5 Raster-Zeilen aufgeteilt.
    const totalRows = rows*5;

    const box = (p, gen) => pedigreeBoxHtml(p, gen, {withPhoto, landscape, _ring, _sex, _esc});

    const probandCellHtml = `<div style="display:flex;flex-direction:column;height:100%;overflow:hidden">
      <div style="font-size:6.5pt;color:#666;font-weight:700;margin-bottom:.5mm;flex-shrink:0">Stammbaum von Taube:</div>
      <div style="flex:1;min-height:0">${box(root,0)}</div>
    </div>`;

    let cells = '';
    // Spalte 1: Vater (oben, 2/5) — Proband (mittig, 1/5) — Mutter (unten, 2/5),
    // alle drei übereinander in derselben Spalte statt in getrennten Spalten,
    // damit keine Spaltenbreite an das kleine Probandenfeld verschenkt wird.
    const father = tree[1] ? tree[1][0] : null;
    const mother = tree[1] ? tree[1][1] : null;
    cells += `<div style="grid-column:1;grid-row:1/${2*rows+1};padding:.5mm;border-bottom:.15mm solid #e8e8e8;border-right:.15mm solid #e8e8e8;box-sizing:border-box;min-height:0;overflow:hidden">${box(father,1)}</div>`;
    cells += `<div style="grid-column:1;grid-row:${2*rows+1}/${3*rows+1};padding:.5mm;border-bottom:.15mm solid #e8e8e8;border-right:.15mm solid #e8e8e8;box-sizing:border-box;min-height:0;overflow:hidden">${probandCellHtml}</div>`;
    cells += `<div style="grid-column:1;grid-row:${3*rows+1}/${5*rows+1};padding:.5mm;border-bottom:.15mm solid #e8e8e8;border-right:.15mm solid #e8e8e8;box-sizing:border-box;min-height:0;overflow:hidden">${box(mother,1)}</div>`;

    // Weitere Ahnen-Spalten (Generation 2..ancestorGens): gleichmäßig über die
    // volle Höhe verteilt, wie im klassischen Fächer-Stammbaum.
    for(let g=2; g<=ancestorGens; g++){
      const count = Math.pow(2,g);
      const span  = totalRows/count;
      const gridCol = g;
      for(let i=0;i<count;i++){
        const p  = tree[g] ? tree[g][i] : null;
        const rs = i*span+1, re = rs+span;
        cells += `<div style="grid-column:${gridCol};grid-row:${rs}/${re};padding:.5mm;border-bottom:.15mm solid #e8e8e8;border-right:.15mm solid #e8e8e8;box-sizing:border-box;min-height:0;overflow:hidden">${box(p,g)}</div>`;
      }
    }

    // WICHTIG: keine manuell eingestreuten Gap-Spalten im Grid-Template — die
    // Zellen oben werden mit durchgehenden grid-column-Indizes 1..totalCols
    // platziert (Vater/Mutter bei Spalte 2!). Ein zusätzlicher literaler
    // Gap-Track hätte diese Indizes verschoben und z.B. die Elternspalte in
    // eine 1mm schmale Lücke statt in eine echte Datenspalte gelegt. Der
    // optische Abstand kommt stattdessen über die CSS-Eigenschaft column-gap.
    const gtc = 'repeat('+totalCols+','+datWmm+'mm)';
    const gtr = 'repeat('+totalRows+',minmax(0,1fr))';

    const safeName = (root.name || _ring(root) || 'Taube').toString()
      .replace(/[^\p{L}\p{N}\-]+/gu,'_').replace(/_+/g,'_').replace(/^_|_$/g,'') || 'Taube';
    const filenameBase = `Familienstammbaum_${safeName}`;

    const html=`<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8">
<title>Stammbaum – ${_esc(root.name||_ring(root))}</title>
<style>
  @page{size:A4 ${landscape?'landscape':'portrait'};margin:8mm 8mm 8mm 8mm}
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
  html,body{height:100%}
  body{width:${pageWmm}mm;height:${pageHmm}mm;background:#fff;color:#111;display:flex;flex-direction:column;overflow:hidden}
  @media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head><body>
<div style="flex-shrink:0">
${pedigreeBreederHeaderHtml(breederProf, erfolgeText, _esc)}
</div>
<div style="flex:1;min-height:0;display:grid;grid-template-columns:${gtc};grid-template-rows:${gtr};column-gap:${gapMm}mm;border:.3mm solid #ccc;width:${pageWmm}mm;overflow:hidden">
  ${cells}
</div>
</body></html>`;

    return { html, pageWmm, pageHmm, filenameBase };
  } catch(e){
    alert('Druckfehler: '+e.message+'\n'+e.stack);
    return null;
  }
}

// ── Bild-Export (PNG) ──────────────────────────────────────────
// Rendert dasselbe Druck-HTML in einem unsichtbaren iframe und rastert es per
// html2canvas zu einem PNG. Läuft komplett im Browser (passt zu GitHub Pages,
// kein eigener Server nötig) — die Bibliothek wird bei Bedarf einmalig von
// cdnjs nachgeladen. (Ein "echtes" durchsuchbares Vektor-PDF ist als
// separater, aufwändigerer Schritt für später vorgesehen.)
let _h2cLoadPromise = null;
function ensureHtml2Canvas(){
  if(window.html2canvas) return Promise.resolve();
  if(_h2cLoadPromise) return _h2cLoadPromise;
  _h2cLoadPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>{ _h2cLoadPromise=null; reject(new Error('html2canvas konnte nicht geladen werden (Internetverbindung prüfen)')); };
    document.head.appendChild(s);
  });
  return _h2cLoadPromise;
}

// ── Vektor-PDF-Export (durchsuchbarer/kopierbarer Text, scharf, klein) ──
// Zeichnet dieselbe Baumstruktur direkt mit jsPDF-Text-/Linienbefehlen in
// mm-Koordinaten (statt das HTML zu rastern wie beim PNG-Export). Nutzt
// dieselbe buildPedigreeTreeData()-Basis wie Druck & Bild-Export, damit die
// Struktur immer identisch bleibt. Layout ist eine bewusste Annäherung an das
// HTML/Druck-Layout (gleiche Schriftgrößen-Stufen je Generation, gleiche
// Verbinder-Logik) — keine 1:1-Pixelkopie, dafür deutlich kleinere Datei mit
// echtem, durchsuchbarem Text.
let _jspdfLoadPromise = null;
function ensureJsPDF(){
  if(window.jspdf && window.jspdf.jsPDF) return Promise.resolve();
  if(_jspdfLoadPromise) return _jspdfLoadPromise;
  _jspdfLoadPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>{ _jspdfLoadPromise=null; reject(new Error('jsPDF konnte nicht geladen werden (Internetverbindung prüfen)')); };
    document.head.appendChild(s);
  });
  return _jspdfLoadPromise;
}

// Bildformat aus einer data:-URI ableiten, wie sie Fotos/Logo in diesem
// Projekt üblicherweise verwenden. addImage() bricht bei nicht unterstützten
// Formaten (z.B. eine externe http(s)-URL statt Base64) via try/catch ab —
// die Box wird dann einfach ohne Bild weitergezeichnet statt den ganzen
// Export abzubrechen.
function _pdfImgFormat(dataUrl){
  const m = /^data:image\/(\w+);base64,/.exec(dataUrl||'');
  if(!m) return 'JPEG';
  const f = m[1].toUpperCase();
  if(f==='JPG') return 'JPEG';
  return ['PNG','JPEG','WEBP'].includes(f) ? f : 'JPEG';
}

function _pdfDrawBox(doc, p, gen, x, y, w, h, landscape, withPhoto, mmPerPt, _sex, _ring){
  if(!p){
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(180,180,180);
    doc.text('–', x+w/2, y+h/2, {align:'center'});
    return;
  }
  const sx  = _sex(p);
  const col = sx==='M' ? [58,123,213] : sx==='F' ? [142,68,173] : [136,136,136];
  doc.setFillColor(col[0],col[1],col[2]);
  doc.rect(x, y, 0.8, h, 'F');  // farbiger linker Rand als Geschlechts-Indikator

  const rn    = _ring(p);
  const tags  = [p.color, p.strain, p.breeder?('Z: '+p.breeder):null].filter(Boolean);
  const info  = (p.info||'').trim();

  // Gleiche Schriftgrößen-Stufen je Generation wie im HTML/Druck-Export.
  const szRing   = gen===0?8:gen===1?7.5:gen===2?7:gen===3?6.5:6;
  const szName   = gen===0?9:gen===1?8:gen===2?7.5:6.5;
  const szTag    = gen===0?7:gen===1?6.5:6;
  const szInfo   = gen===0?7.5:gen===1?7:gen===2?6.5:6;
  const szTravel = gen===0?7:gen===1?6.5:6;
  const szTop    = gen===0?7:6.5;
  const showTags = gen<=3;
  const showInfo = gen<=2 && info;
  const showName = gen<=3 || !landscape;
  const travelMaxYears = gen===0?3:gen===1?2:1;
  const travelLines = (gen<=2 && p.pigeonid) ? pigeonTravelCompactLines(p.pigeonid, travelMaxYears) : [];
  const topLines    = (gen<=1 && p.pigeonid) ? pigeonTopPlacementsCompactLines(p.pigeonid) : [];

  const photoSize = withPhoto && p.photo ? (gen===0?15:gen===1?11:8) : 0;
  if(photoSize){
    try{ doc.addImage(p.photo, _pdfImgFormat(p.photo), x+w-photoSize-0.4, y+0.4, photoSize, photoSize); }
    catch(e){ /* Foto überspringen statt Export abzubrechen */ }
  }

  const padX  = 2;
  const textX = x + padX;
  const maxW  = Math.max(4, w - padX*1.5 - (photoSize?photoSize+1:0));
  const bottomLimit = y + h - 0.6;
  let curY = y + 1.5 + szRing*mmPerPt;

  doc.setFont('helvetica','bold'); doc.setFontSize(szRing); doc.setTextColor(26,107,26);
  const sexChar = sx==='M'?'T':sx==='F'?'W':'?';  // ♂/♀ sind in jsPDFs Standardfonts nicht enthalten — T(äuber)/W(eibchen) statt Symbol
  doc.splitTextToSize(sexChar+' '+rn, maxW).forEach(line=>{
    if(curY<=bottomLimit){ doc.text(line, textX, curY); curY += szRing*mmPerPt*1.15; }
  });

  if(p.name && showName && curY<=bottomLimit){
    doc.setFont('helvetica','bold'); doc.setFontSize(szName); doc.setTextColor(20,20,20);
    doc.text(doc.splitTextToSize(p.name, maxW)[0]||'', textX, curY);
    curY += szName*mmPerPt*1.2;
  }
  if(showTags && tags.length && curY<=bottomLimit){
    doc.setFont('helvetica','normal'); doc.setFontSize(szTag); doc.setTextColor(102,102,102);
    doc.text(doc.splitTextToSize(tags.join(' · '), maxW)[0]||'', textX, curY);
    curY += szTag*mmPerPt*1.2;
  }
  if(travelLines.length){
    doc.setFont('helvetica','normal'); doc.setFontSize(szTravel); doc.setTextColor(26,107,26);
    travelLines.forEach(line=>{
      if(curY<=bottomLimit){ doc.text(String(line), textX, curY); curY += szTravel*mmPerPt*1.25; }
    });
  }
  if(topLines.length){
    doc.setFont('helvetica','normal'); doc.setFontSize(szTop); doc.setTextColor(51,51,51);
    topLines.forEach(line=>{
      if(curY<=bottomLimit){ doc.text(String(line), textX, curY); curY += szTop*mmPerPt*1.25; }
    });
  }
  if(showInfo && curY<=bottomLimit){
    doc.setFont('helvetica','normal'); doc.setFontSize(szInfo); doc.setTextColor(51,51,51);
    const maxLines = Math.max(1, Math.floor((bottomLimit-curY)/(szInfo*mmPerPt*1.3)));
    doc.splitTextToSize(info, maxW).slice(0,maxLines).forEach(line=>{
      doc.text(line, textX, curY); curY += szInfo*mmPerPt*1.3;
    });
  }
}

async function exportPedigreePdf(pid, gens, withPhoto, erfolgeText){
  try{
    await ensureJsPDF();
    const data = await buildPedigreeTreeData(pid, gens);
    if(!data){ alert('Taube nicht gefunden'); return; }
    const { gens:gensN, tree, rows, landscape, pageWmm, pageHmm, datWmm, conWmm, breederProf, filenameBase, _ring, _sex } = data;
    gens = gensN;
    withPhoto = !!withPhoto;

    const mmPerPt  = 0.352778;
    const marginMm = 8;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: landscape?'landscape':'portrait', unit:'mm', format:'a4' });
    doc.setProperties({ title: filenameBase });

    // ── Kopfzeile: Züchterdaten links, Logo mittig, Erfolge rechts ──
    const bp = breederProf || {};
    const hasHeader = !!(bp.name || bp.strasse || bp.ort || bp.verein || bp.logo || erfolgeText);
    const logoW = 40, logoH = 18, colGap = 4;
    const midW  = bp.logo ? logoW : 0;
    const sideW = (pageWmm - midW - colGap*2) / 2;
    const leftX = marginMm, midX = marginMm+sideW+colGap, rightX = midX+midW+colGap;

    const leftLines = [];
    if(bp.name) leftLines.push({t:bp.name, size:11, bold:true, color:[20,20,20]});
    const addr = [bp.strasse, bp.ort].filter(Boolean).join(', ');
    if(addr) leftLines.push({t:addr, size:7, bold:false, color:[85,85,85]});
    if(bp.verein) leftLines.push({t:bp.verein, size:7, bold:false, color:[85,85,85]});
    if(bp.telefon) leftLines.push({t:'Tel. '+bp.telefon, size:7, bold:false, color:[85,85,85]});

    const rightLines = [];
    if(erfolgeText){
      rightLines.push({t:'Züchtererfolge', size:8, bold:true, color:[26,107,26]});
      doc.setFont('helvetica','normal'); doc.setFontSize(7);
      doc.splitTextToSize(erfolgeText.replace(/\n{2,}/g,'\n'), sideW).forEach(line=>{
        rightLines.push({t:line, size:7, bold:false, color:[85,85,85]});
      });
    }

    let headerHeight = 0;
    if(hasHeader){
      const lh = arr=>arr.reduce((h,l)=>h+l.size*mmPerPt*1.3,0);
      headerHeight = Math.max(lh(leftLines), lh(rightLines), bp.logo?logoH:0) + 4;
    }

    let ly = marginMm + 3;
    leftLines.forEach(l=>{
      doc.setFont('helvetica', l.bold?'bold':'normal'); doc.setFontSize(l.size); doc.setTextColor(l.color[0],l.color[1],l.color[2]);
      doc.text(l.t, leftX, ly); ly += l.size*mmPerPt*1.3;
    });
    if(bp.logo){
      try{ doc.addImage(bp.logo, _pdfImgFormat(bp.logo), midX, marginMm, midW, logoH); }
      catch(e){ /* Logo überspringen statt Export abzubrechen */ }
    }
    let ry = marginMm + 3;
    rightLines.forEach(l=>{
      doc.setFont('helvetica', l.bold?'bold':'normal'); doc.setFontSize(l.size); doc.setTextColor(l.color[0],l.color[1],l.color[2]);
      doc.text(l.t, rightX, ry); ry += l.size*mmPerPt*1.3;
    });
    if(hasHeader){
      doc.setDrawColor(200,200,200); doc.setLineWidth(0.3);
      doc.line(marginMm, marginMm+headerHeight, marginMm+pageWmm, marginMm+headerHeight);
    }

    // ── Baum-Raster ──
    const gapAfterHeader = hasHeader ? 3 : 0;
    const gridY0 = marginMm + headerHeight + gapAfterHeader;
    const gridH  = pageHmm - headerHeight - gapAfterHeader;
    const rowH   = gridH / rows;
    const colX   = g => marginMm + g*(datWmm+conWmm);

    for(let g=0; g<gens; g++){
      const count = Math.pow(2,g);
      const span  = rows/count;
      const x = colX(g);
      for(let i=0;i<count;i++){
        const pig = tree[g] ? tree[g][i] : null;
        const y = gridY0 + i*span*rowH;
        _pdfDrawBox(doc, pig, g, x, y, datWmm, span*rowH, landscape, withPhoto, mmPerPt, _sex, _ring);
      }
      if(g<gens-1){
        const xStart = x + datWmm, xEnd = xStart + conWmm;
        doc.setDrawColor(170,170,170); doc.setLineWidth(0.25);
        for(let i=0;i<count;i++){
          const y0 = gridY0 + i*span*rowH;
          const c1 = y0 + (span/4)*rowH, c2 = y0 + (3*span/4)*rowH;
          doc.line(xStart, c1, xEnd, c1);
          doc.line(xStart, c2, xEnd, c2);
          doc.line(xStart, c1, xStart, c2);
        }
      }
    }

    doc.save(filenameBase + '.pdf');
  } catch(e){
    alert('PDF-Export fehlgeschlagen: '+e.message);
  }
}

function setPaarungVogel(id){

function renderPaarung(){
  const ib = S.paarungM && S.paarungF ? calcInbreedingPair(S.paarungM, S.paarungF) : null;
  const ibClass = ib===null?'':ib<0.03?'low':ib<0.1?'mid':'high';

// Prüft, ob die im Paarungscheck gewählten Eltern in der Datenbank bereits
// gemeinsame Nachzucht haben (Ring-/ID-Abgleich analog zu buildChildrenIndex()).
function getExistingOffspring(father, mother){
  if(!father || !mother) return [];
  const motherRing = ring(mother), fatherRing = ring(father);
  return findChildren(father.pigeonid).filter(c=>{
    if(c.motherid) return c.motherid===mother.pigeonid;
    if(c.ringnumbermother) return c.ringnumbermother===motherRing;
    return false;
  }).concat(
    // Falls ein Nachkomme nur über die Mutter indiziert ist (z.B. Vater nur
    // per Ringnummer hinterlegt, ohne fatherid) — Duplikate unten entfernt.
    findChildren(mother.pigeonid).filter(c=>{
      if(c.fatherid) return c.fatherid===father.pigeonid;
      if(c.ringnumberfather) return c.ringnumberfather===fatherRing;
      return false;
    })
  ).filter((p,i,arr)=>arr.findIndex(x=>x.pigeonid===p.pigeonid)===i);
}

const MATING_OFFSPRING_LOADING = new Set();
function ensureMatingOffspringLoaded(ids){
  const missing = ids.filter(id=>!PT_CACHE[id]);
  if(!missing.length) return;
  const key = missing.slice().sort().join(',');
  if(MATING_OFFSPRING_LOADING.has(key)) return;
  MATING_OFFSPRING_LOADING.add(key);
  loadPigeonTripsBatchChunked(missing)
    .then(()=>{ MATING_OFFSPRING_LOADING.delete(key); render(); })
    .catch(()=>{ MATING_OFFSPRING_LOADING.delete(key); render(); });
}

// Erfolgsbewertung eines einzelnen Nachkommen — dieselben Schwellwerte wie
// im Vererber-Ranking (VERERBER_ERFOLG_MIN_PREISQUOTE/-TOPAS), aber auf die
// Eigenleistung dieser einen Taube angewendet.
function offspringSuccessInfo(p){
  const er = computeEigenleistung(p.pigeonid);
  if(!er.ready) return {loading:true};
  if(er.noFlights) return {ready:true, hasFlights:false, tooFewFlights:!!er.tooFewFlights, gesetzt:er.gesetzt||0};
  const erfolgreich = er.preisquote>=VERERBER_ERFOLG_MIN_PREISQUOTE && er.topAS80>=VERERBER_ERFOLG_MIN_TOPAS;
  return {ready:true, hasFlights:true, er, erfolgreich};
}

function renderExistingMatingCard(){

// ── SCAN-MODUL v3 ──────────────────────────────────────────────
const EDGE_SCAN_URL = 'https://vwdqqdmtjztduzqrdbpc.supabase.co/functions/v1/scan-pedigree';

// Reihenfolge wichtig: tiefste Generation zuerst, Proband zuletzt — beim Speichern
// (executeScanSave) müssen Vorfahren bereits eine UUID haben, bevor ihre Nachkommen
// per PARENT_MAP darauf verweisen können.
const PED_KEYS = [
  'ffff','fffm','ffmf','ffmm','fmff','fmfm','fmmf','fmmm',
  'mfff','mffm','mfmf','mfmm','mmff','mmfm','mmmf','mmmm',
  'fff','ffm','fmf','fmm','mff','mfm','mmf','mmm',
  'ff','fm','mf','mm','father','mother','proband'
];
const PED_LABEL = {
  proband:'Proband', father:'Vater', mother:'Mutter',
  ff:'Großvater v.', fm:'Großmutter v.', mf:'Großvater m.', mm:'Großmutter m.',
  fff:'Urgroßvater v.v.', ffm:'Urgroßmutter v.v.', fmf:'Urgroßvater v.m.', fmm:'Urgroßmutter v.m.',
  mff:'Urgroßvater m.v.', mfm:'Urgroßmutter m.v.', mmf:'Urgroßvater m.m.', mmm:'Urgroßmutter m.m.',
  ffff:'Ururgroßvater v.v.v.', fffm:'Ururgroßmutter v.v.v.', ffmf:'Ururgroßvater v.v.m.', ffmm:'Ururgroßmutter v.v.m.',
  fmff:'Ururgroßvater v.m.v.', fmfm:'Ururgroßmutter v.m.v.', fmmf:'Ururgroßvater v.m.m.', fmmm:'Ururgroßmutter v.m.m.',
  mfff:'Ururgroßvater m.v.v.', mffm:'Ururgroßmutter m.v.v.', mfmf:'Ururgroßvater m.v.m.', mfmm:'Ururgroßmutter m.v.m.',
  mmff:'Ururgroßvater m.m.v.', mmfm:'Ururgroßmutter m.m.v.', mmmf:'Ururgroßvater m.m.m.', mmmm:'Ururgroßmutter m.m.m.'
};
const PARENT_MAP = {
  proband:{f:'father',m:'mother'}, father:{f:'ff',m:'fm'}, mother:{f:'mf',m:'mm'},
  ff:{f:'fff',m:'ffm'}, fm:{f:'fmf',m:'fmm'}, mf:{f:'mff',m:'mfm'}, mm:{f:'mmf',m:'mmm'},
  fff:{f:'ffff',m:'fffm'}, ffm:{f:'ffmf',m:'ffmm'}, fmf:{f:'fmff',m:'fmfm'}, fmm:{f:'fmmf',m:'fmmm'},
  mff:{f:'mfff',m:'mffm'}, mfm:{f:'mfmf',m:'mfmm'}, mmf:{f:'mmff',m:'mmfm'}, mmm:{f:'mmmf',m:'mmmm'}
};

// Jede Position hat ein festes Geschlecht: Schlüssel auf "f" = männlich, auf "m" = weiblich
function expectedGenderOf(key){
  if(key==='father') return 'M';
  if(key==='mother') return 'F';
  if(key==='proband') return null;
  return key.endsWith('f') ? 'M' : 'F';
}
// Geschwister-Slot mit vertauschtem Geschlecht (gleiche Eltern-Linie, andere Seite)
function siblingKeyOf(key){
  if(key==='father') return 'mother';
  if(key==='mother') return 'father';
  if(key.length<2) return null;
  return key.slice(0,-1) + (key.endsWith('f') ? 'm' : 'f');
}

// Alle Vorfahren-Positionen eines Schlüssels (Elternteil, Großeltern, …) ermitteln.
// Wird für die Plausibilitätsprüfung gebraucht: eine Taube darf nicht ihr eigener
// Vorfahre sein (z.B. Mutter == Großmutter wäre biologisch unmöglich).
function ancestorKeysOf(key){
  const out = [];
  let queue = [key];
  while(queue.length){
    const k = queue.shift();
    const par = PARENT_MAP[k];
    if(!par) continue;
    [par.f, par.m].forEach(pk => { out.push(pk); queue.push(pk); });
  }
  return out;
}

// Plausibilitätsprüfung nach dem Scan (und generell vor dem Speichern eines
// Stammbaums): identische Ringnummern an biologisch unmöglichen Positionen
// erkennen (z.B. Mutter == Großmutter, Vater == Vater der Mutter, Vater == Mutter),
// statt sie unbemerkt durchzuspeichern. Verdächtige aber theoretisch mögliche
// Fälle (z.B. Inzucht: gleicher Großvater auf beiden Seiten) werden nur als
// Warnung markiert, nicht blockiert — die Entscheidung bleibt beim Nutzer.
// Chronologie-Check: ein Elternteil (Vater/Mutter-Position laut PARENT_MAP)
// darf nicht gleich alt oder jünger sein als sein Nachkomme — das ist
// biologisch unmöglich und ein starkes Indiz für eine Fehlverknüpfung
// (z.B. Ringnummer-Kollision zwischen zwei Tieren unterschiedlicher Jahrgänge).
function checkParentChronology(childPigeon, parentPigeon){
  if(!childPigeon || !parentPigeon) return null;
  const childYear = childPigeon.date_year!=null ? Number(childPigeon.date_year) : null;
  const parentYear = parentPigeon.date_year!=null ? Number(parentPigeon.date_year) : null;
  if(childYear==null || parentYear==null) return null;
  if(parentYear >= childYear){
    return `Jahrgang ${parentYear} kann nicht gleich alt oder jünger sein als Nachkomme (Jahrgang ${childYear}) — Verknüpfung vermutlich fehlerhaft (Ringnummer-Kollision?).`;
  }
  return null;
}

function checkScanPlausibility(){
  const keysWithRing = PED_KEYS.filter(k => SCAN.pigeons[k]?.ringnumber);
  keysWithRing.forEach(k => {
    delete SCAN.pigeons[k]._plausibilityError;
    delete SCAN.pigeons[k]._plausibilityWarn;
  });

  keysWithRing.forEach(k => {
    const ring1 = normRing(SCAN.pigeons[k].ringnumber);
    if(!ring1) return;
    const ancestors = new Set(ancestorKeysOf(k));

    keysWithRing.forEach(other => {
      if(other===k) return;
      const ring2 = normRing(SCAN.pigeons[other].ringnumber);
      if(ring1!==ring2) return;

      if(ancestors.has(other) || new Set(ancestorKeysOf(other)).has(k)){
        // k und other stehen in Abstammungslinie zueinander -> unmöglich
        SCAN.pigeons[k]._plausibilityError =
          `Identisch mit "${PED_LABEL[other]}" (${SCAN.pigeons[other].ringnumber}) — das ist als eigener Vorfahre biologisch unmöglich.`;
      } else if(k==='father' && other==='mother' || k==='mother' && other==='father'){
        SCAN.pigeons[k]._plausibilityError =
          `Vater und Mutter haben dieselbe Ringnummer (${SCAN.pigeons[other].ringnumber}) — bitte prüfen.`;
      } else if(!SCAN.pigeons[k]._plausibilityError){
        SCAN.pigeons[k]._plausibilityWarn =
          `Gleiche Ringnummer wie "${PED_LABEL[other]}" — nur plausibel bei starker Inzucht, sonst bitte im Original prüfen.`;
      }
    });

    // NEU: Eltern-Chronologie prüfen — der Elternteil an dieser Position darf
    // nicht gleich alt oder jünger sein als sein Nachkomme.
    if(!SCAN.pigeons[k]._plausibilityError){
      const par = PARENT_MAP[k];
      if(par){
        const father = SCAN.pigeons[par.f], mother = SCAN.pigeons[par.m];
        const fatherMsg = checkParentChronology(SCAN.pigeons[k], father);
        const motherMsg = checkParentChronology(SCAN.pigeons[k], mother);
        if(fatherMsg && father?.ringnumber){
          father._plausibilityError = `${PED_LABEL[par.f]}: ${fatherMsg}`;
          SCAN.actions[par.f] = 'skip';
        }
        if(motherMsg && mother?.ringnumber){
          mother._plausibilityError = `${PED_LABEL[par.m]}: ${motherMsg}`;
          SCAN.actions[par.m] = 'skip';
        }
      }
    }

    // Fehlerhafte Positionen sicherheitshalber vom automatischen Speichern ausschließen,
    // bis der Nutzer die Angabe bestätigt/korrigiert hat.
    if(SCAN.pigeons[k]._plausibilityError) SCAN.actions[k] = 'skip';
  });
}

// Nach dem Scan: prüfen ob das erkannte Geschlecht zur festen Position passt.
// Falls genau das Geschwister-Paar vertauscht wurde (z.B. Großvater/Großmutter
// im Bild verwechselt), automatisch zurücktauschen. Sonst klar markieren,
// damit der Nutzer es im Ergebnis sofort sieht statt eine falsche Taube zu speichern.
function fixGenderSlotMismatches(){
  const checked = new Set();
  PED_KEYS.forEach(k => {
    if(k==='proband' || checked.has(k)) return;
    const p = SCAN.pigeons[k];
    const expected = expectedGenderOf(k);
    if(!p || !p.gender || !expected || p.gender===expected){ return; }

    const sibKey = siblingKeyOf(k);
    const sib = sibKey ? SCAN.pigeons[sibKey] : null;
    const sibExpected = sibKey ? expectedGenderOf(sibKey) : null;

    if(sib && sib.gender && sibExpected && sib.gender!==sibExpected && sib.gender===expected && p.gender===sibExpected){
      // Klassischer Vertauscher: beide Positionen haben jeweils das Geschlecht der anderen → zurücktauschen
      SCAN.pigeons[k] = sib;
      SCAN.pigeons[sibKey] = p;
      checked.add(sibKey);
    } else {
      // Kein eindeutiger Tausch möglich → klar markieren, NICHT automatisch raten
      p._genderMismatch = true;
    }
    checked.add(k);
  });
}

// Während des KI-Calls gibt es keine echten Zwischen-Fortschrittswerte vom Server —
// daher ein ehrlicher, sich der 90%-Marke annähernder Fortschrittsbalken mit wechselnden,
// am tatsächlichen Ablauf orientierten Status-Texten, damit der Prozess sichtbar aktiv bleibt.
let SCAN_PROGRESS_TIMER = null;
function startScanProgress(){
  stopScanProgress();
  const messages = [
    'Bild wird verarbeitet…',
    'KI erkennt Ringnummern & Text…',
    'Generationen werden ausgelesen…',
    'Eltern, Großeltern, Urgroßeltern werden zugeordnet…',
    'Fast fertig…',
  ];
  let i=0, pct=8;
  const setFill = v => { const el=document.getElementById('scan-progress-fill'); if(el) el.style.width=v+'%'; };
  const setTxt  = v => { const el=document.getElementById('scan-status'); if(el) el.textContent=v; };
  setFill(pct); setTxt(messages[0]);
  SCAN_PROGRESS_TIMER = setInterval(()=>{
    i = Math.min(i+1, messages.length-1);
    pct = Math.min(pct+16, 90); // nähert sich an, wird aber nie 100% bis es wirklich fertig ist
    setTxt(messages[i]);
    setFill(pct);

// Ringnummer normalisieren für DB-Vergleich
function normRing(s){
  s = String(s||'').trim();
  if(!s) return '';
  // Pro Segment (durch Leerzeichen/Bindestrich/Punkt/Schrägstrich getrennt) führende Nullen
  // bei rein numerischen Teilen entfernen, damit "004" und "4" als gleich gelten.
  // Trennzeichen bewusst nicht nur der ASCII-Bindestrich "-": aus Excel/Word
  // kopierte Ringnummern enthalten teils Halbgeviertstrich "–", Geviertstrich
  // "—" oder das Unicode-Minuszeichen "−" statt eines normalen Bindestrichs —
  // ohne das würde z.B. "DE–06559–24–4241" als EIN nicht-numerisches Segment
  // durchfallen und nie mit "DE-06559-24-4241" übereinstimmen.
  return s.split(/[\s\-\u2010-\u2015\u2212\.\/]+/).filter(Boolean).map(function(seg){
    if(!/^\d+$/.test(seg)) return seg.toLowerCase();
    let n = seg.replace(/^0+(?=\d)/,'');
    // Jahrgang marginal abweichend: 4-stellig (19xx/20xx) auf 2-stellig normalisieren,
    // damit z.B. "2015" und "15" beim Abgleich als gleich gelten (Bestandsabgleich beim Scan).
    if(/^(19|20)\d{2}$/.test(n)) n = n.slice(-2);
    return n;
  }).join('');
}

// Taube in DB suchen (normalisiert)
function findInDb(ringnumber){
  if(!ringnumber) return null;
  const n = normRing(ringnumber);
  return S.pigeons.find(x => normRing(x.ringnumber)===n || normRing(x.ringnumberold||'')===n) || null;
}

function toggleScanEdit(k){ SCAN.expandedKey = (SCAN.expandedKey===k) ? null : k; render(); }

function updateScanField(k, field, value){
  if(!SCAN.pigeons[k]) return;
  SCAN.pigeons[k][field] = value;
  if(field==='ringnumber'){
    // Bei geänderter Ringnummer DB-Treffer neu bestimmen
    SCAN.matches[k] = findInDb(value);
    if(SCAN.actions[k]!=='skip') SCAN.actions[k] = SCAN.matches[k] ? 'update' : 'new';
    // Plausibilität neu prüfen — eine Korrektur kann einen Fehler beheben oder neu erzeugen
    checkScanPlausibility();
  }
  if(field==='gender'){
    // Manuelle Korrektur entkräftet die Mismatch-Warnung
    delete SCAN.pigeons[k]._genderMismatch;
  }
}

function handleScanFile(file){
  if(!file) return;
  if(file.size>10*1024*1024){ alert('Datei zu groß (max. 10 MB)'); return; }
  SCAN.imageMediaType = file.type||'image/jpeg';
  const reader = new FileReader();
  reader.onload = e => {
    SCAN.imageData    = e.target.result.split(',')[1];
    SCAN.imagePreview = e.target.result;
    SCAN.step = 'analyzing';
    render();
    runScanAI();
  };
  reader.readAsDataURL(file);
}

function normalizePigeonData(d){
  return {
    ringnumber:       d.ringnumber||d.ring||null,
    name:             d.name||null,
    date_year:        d.date_year||d.year||d.vintage||d.jahrgang||null,
    gender:           d.gender||d.sex||d.geschlecht||null,
    color:            d.color||d.colour||d.farbe||null,
    race:             d.race||d.rasse||null,
    strain:           d.strain||d.linie||d.stamm||null,
    breeder:          d.breeder||d.züchter||d.zuchter||null,
    owner:            d.owner||d.besitzer||null,
    countrycode:      d.countrycode||d.country||d.land||null,
    associationno:    d.associationno||d.verband||null,
    ringnumberfather: d.ringnumberfather||d.father_ring||d.father?.ringnumber||null,
    ringnumbermother: d.ringnumbermother||d.mother_ring||d.mother?.ringnumber||null,
    info:             d.info||d.notes||d.notizen||d._raw_info||null,
  };
}

async function runScanAI(){
  startScanProgress();
  try {
    const resp = await fetch(EDGE_SCAN_URL, {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+(AUTH.token||SUPA_KEY),
        'apikey':SUPA_KEY
      },
      body: JSON.stringify({imageData:SCAN.imageData, mediaType:SCAN.imageMediaType})
    });
    const json = await resp.json();
    if(!resp.ok||!json.ok) throw new Error(json.error||`HTTP ${resp.status}`);

    const d = json.data||{};
    SCAN.rawResponse = d;

    // Format erkennen und parsen
    if(d.proband||d.father||d.mother||d.ff||d.fff){
      // Neues Multi-Gen-Format
      PED_KEYS.forEach(k => {
        if(d[k] && (d[k].ringnumber||d[k].ring)){
          SCAN.pigeons[k] = normalizePigeonData(d[k]);
        }
      });
    } else if(d.ringnumber||d.ring){
      // Altes flaches Format — Proband + Eltern aus ringnumberfather/mother
      SCAN.pigeons['proband'] = normalizePigeonData(d);
      if(d.ringnumberfather||d.father_ring)
        SCAN.pigeons['father'] = normalizePigeonData({ringnumber:d.ringnumberfather||d.father_ring});
      if(d.ringnumbermother||d.mother_ring)
        SCAN.pigeons['mother'] = normalizePigeonData({ringnumber:d.ringnumbermother||d.mother_ring});
    }

    stopScanProgress('Abgleich mit Datenbank…');
    fixGenderSlotMismatches();
    checkScanPlausibility();
    PED_KEYS.forEach(k => {
      const p = SCAN.pigeons[k];
      if(!p) return;
      if(p.ringnumber)       p.ringnumber       = fmtRingnumber(p.ringnumber) || p.ringnumber;
      if(p.ringnumberfather) p.ringnumberfather = fmtRingnumber(p.ringnumberfather) || p.ringnumberfather;
      if(p.ringnumbermother) p.ringnumbermother = fmtRingnumber(p.ringnumbermother) || p.ringnumbermother;
      if(p.countrycode)      p.countrycode      = normCountryCode(p.countrycode);
    });
    PED_KEYS.forEach(k => {
      const p = SCAN.pigeons[k];
      if(!p?.ringnumber) return;
      SCAN.matches[k] = findInDb(p.ringnumber);
      SCAN.actions[k] = p._genderMismatch ? 'skip' : (SCAN.matches[k] ? 'update' : 'new');
      // Standardmäßig AUS: importierte Abstammungen werden erstmal nur als Ahnen-Datensätze
      // gespeichert, nicht automatisch als Bestandstaube geführt. Kann pro Position vor dem
      // Speichern in der Vorschau umgeschaltet werden.
      if(SCAN.instock[k]===undefined) SCAN.instock[k] = false;
    });

    SCAN.step = 'result';
    render();
  } catch(err){
    stopScanProgress();
    SCAN.rawResponse = {error:err.message};
    SCAN.pigeons = {};
    SCAN.step = 'result';
    render();
  }
}

async function executeScanSave(){
  SCAN.step = 'saving'; render();
  const setS = t => { const el=document.getElementById('scan-save-status'); if(el) el.textContent=t; };

  // UUID-Map aufbauen (normalisiert)
  const uuidMap = {};
  S.pigeons.forEach(p => { if(p.ringnumber) uuidMap[normRing(p.ringnumber)]=p.pigeonid; });

  for(const k of PED_KEYS){
    const p   = SCAN.pigeons[k];
    const act = SCAN.actions[k];
    if(!p?.ringnumber || act==='skip') continue;

    setS(`Verarbeite ${PED_LABEL[k]}: ${p.ringnumber}…`);

    // Eltern-UUIDs aus Scan-Baum
    let fatherid=null, motherid=null;
    const par = PARENT_MAP[k];
    if(par){
      const fRing = SCAN.pigeons[par.f]?.ringnumber;
      const mRing = SCAN.pigeons[par.m]?.ringnumber;
      if(fRing) fatherid = uuidMap[normRing(fRing)]||null;
      if(mRing) motherid = uuidMap[normRing(mRing)]||null;
    }
    // Fallback: ringnumberfather/mother direkt suchen
    if(!fatherid && p.ringnumberfather) fatherid = uuidMap[normRing(p.ringnumberfather)]||null;
    if(!motherid && p.ringnumbermother) motherid = uuidMap[normRing(p.ringnumbermother)]||null;

    // Zeile aufbauen (nur gefüllte Felder)
    const row = {};
    const setIf = (key,val) => { if(val!==null&&val!==undefined&&val!=='') row[key]=val; };
    setIf('ringnumber',     fmtRingnumber(p.ringnumber) || p.ringnumber);
    setIf('name',           p.name);
    setIf('date_year',      p.date_year ? Number(p.date_year) : null);
    setIf('gender',         p.gender);
    setIf('color',          p.color);
    setIf('race',           p.race);
    setIf('strain',         p.strain);
    setIf('breeder',        p.breeder);
    setIf('owner',          p.owner);
    setIf('countrycode',    normCountryCode(p.countrycode));
    setIf('associationno',  p.associationno);
    setIf('ringnumberfather',fmtRingnumber(p.ringnumberfather) || p.ringnumberfather);
    setIf('ringnumbermother',fmtRingnumber(p.ringnumbermother) || p.ringnumbermother);
    setIf('info',            p.info);
    if(fatherid) row.fatherid = fatherid;
    if(motherid) row.motherid = motherid;

    try {
      if(act==='new'){
        const newId = crypto.randomUUID();
        // "Als Bestandstaube erfassen" wird pro Position in der Vorschau festgelegt
        // (Standard: AUS) — importierte Abstammungen sind erstmal nur Ahnen-Datensätze.
        row.pigeonid=newId; row.deleted=false; row.instock=!!SCAN.instock[k];
        await apiPost('pigeons', row);
        uuidMap[normRing(p.ringnumber)] = newId;
      } else if(act==='update'){
        const m = SCAN.matches[k];
        const updates={};
        Object.keys(row).forEach(f=>{
          if(row[f]!==undefined && String(row[f])!==String(m[f]||'')) updates[f]=row[f];
        });
        // Bestandstaube-Umschaltung greift auch beim Ergänzen bestehender Tauben
        if(SCAN.instock[k] && !m.instock) updates.instock = true;
        if(Object.keys(updates).length) await apiPatch('pigeons',m.pigeonid,updates);
        uuidMap[normRing(p.ringnumber)] = m.pigeonid;
      }
    } catch(e){ console.warn(`Fehler bei ${p.ringnumber}:`, e.message); }
  }

  setS('Lade Datenbank neu…');
  await loadData();
  const probandRing = SCAN.pigeons['proband']?.ringnumber;
  scanReset();
  if(probandRing){
    const found = S.pigeons.find(p=>normRing(p.ringnumber)===normRing(probandRing));
    if(found){ showPedigree(found.pigeonid); return; }
  }
  showTab('stammbaum');
}

async function submitNeu(){
  const rawRing = document.getElementById('neu_ring')?.value?.trim();
  if(!rawRing){ alert('Bitte eine Ringnummer eingeben.'); return; }
  if(NEU.dupMatch){ alert('Diese Ringnummer ist bereits vorhanden: '+ring(NEU.dupMatch)); return; }
  const parsed = parseRingComponents(rawRing);
  const g  = id => document.getElementById(id)?.value?.trim()||null;
  const gs = id => document.getElementById(id)?.value||null;
  const row = { pigeonid: crypto.randomUUID(), deleted:false };
  row.ringnumber    = parsed?.ringnumber || fmtRingnumber(rawRing) || rawRing;
  row.countrycode   = parsed?.countrycode   || null;
  row.associationno = parsed?.associationno || null;
  row.date_year     = parsed?.date_year     || null;
  if(g('neu_name'))          row.name          = g('neu_name');
  const gnd=gs('neu_gender'); if(gnd) row.gender=gnd;
  if(g('neu_color'))         row.color         = g('neu_color');
  if(g('neu_race'))          row.race          = g('neu_race');
  if(g('neu_strain'))        row.strain        = g('neu_strain');
  if(g('neu_breeder'))       row.breeder       = g('neu_breeder');
  if(g('neu_owner'))         row.owner         = g('neu_owner');
  if(g('neu_standort'))      row.standort      = g('neu_standort');
  if(g('neu_father_id'))     row.fatherid      = g('neu_father_id');
  if(g('neu_mother_id'))     row.motherid      = g('neu_mother_id');
  if(g('neu_info'))          row.info          = g('neu_info');
  if(g('neu_internalinfo'))  row.internalinfo  = g('neu_internalinfo');
  const stId=gs('neu_pigeonstateid'); if(stId) row.pigeonstateid=stId;
  row.instock = gs('neu_instock') !== 'false';
  const ptype = gs('neu_pigeontype'); if(ptype) row.pigeontype = ptype;
  // Eltern-Ringnummer aus Textfeld als Fallback
  const fInp=g('neu_father_inp');
  if(!row.fatherid && fInp){ const fp=findInDb(fInp); if(fp){row.fatherid=fp.pigeonid;row.ringnumberfather=ring(fp);}else{row.ringnumberfather=fmtRingnumber(fInp)||fInp;} }
  const mInp=g('neu_mother_inp');
  if(!row.motherid && mInp){ const mp=findInDb(mInp); if(mp){row.motherid=mp.pigeonid;row.ringnumbermother=ring(mp);}else{row.ringnumbermother=fmtRingnumber(mInp)||mInp;} }
  const msg=document.getElementById('form-msg');
  if(msg){msg.style.display='block';msg.className='form-msg';msg.textContent='Speichern…';}
  try{
    await apiPost('pigeons',row);
    await loadData();
    const saved=S.pigeons.find(p=>p.pigeonid===row.pigeonid);
    if(saved){ selectPigeon(saved.pigeonid); return; }
    if(msg){msg.className='form-msg ok';msg.textContent='✅ Gespeichert!';}
  } catch(err){
    if(msg){msg.className='form-msg err';msg.textContent='❌ Fehler: '+err.message;}
  }
}

async function cleanupRingnumbers(){
  // Phase 1: Welche Tauben hätten nach Formatierung eine andere ringnumber/ringnumberold?
  const changes = [];
  S.pigeons.forEach(p => {
    const newRing = fmtRingnumber(p.ringnumber);
    const newOld  = fmtRingnumber(p.ringnumberold);
    const newFa   = fmtRingnumber(p.ringnumberfather);
    const newMo   = fmtRingnumber(p.ringnumbermother);
    const newCC   = normCountryCode(p.countrycode);
    const updates = {};
    if(newRing && newRing!==p.ringnumber) updates.ringnumber = newRing;
    if(newOld  && newOld!==p.ringnumberold) updates.ringnumberold = newOld;
    if(newFa   && newFa!==p.ringnumberfather) updates.ringnumberfather = newFa;
    if(newMo   && newMo!==p.ringnumbermother) updates.ringnumbermother = newMo;
    if(newCC   && newCC!==p.countrycode) updates.countrycode = newCC;
    if(Object.keys(updates).length) changes.push({p, updates});
  });

  // Phase 2: Duplikate erkennen — auf Basis der Ringnummer NACH der virtuellen Formatierung,
  // mit derselben toleranten Normalisierung (normRing) wie bei der Import-Dublettenprüfung,
  // damit z.B. "004" und "4" auch hier als dasselbe erkannt werden.
  const fmtOf = p => { const c = changes.find(c=>c.p===p); return (c && c.updates.ringnumber) || p.ringnumber || ''; };
  const groups = {};
  S.pigeons.forEach(p=>{
    const key = normRing(fmtOf(p));
    if(!key) return;
    (groups[key] = groups[key] || []).push(p);
  });
  const dupGroups = Object.values(groups).filter(g=>g.length>1);

  if(!changes.length && !dupGroups.length){
    alert('Alle Ringnummern sind bereits einheitlich formatiert — und es gibt keine Duplikate.');
    return;
  }

  let preview = '';
  if(changes.length){
    preview += 'Formatierung:\n' + changes.slice(0,5).map(c =>
      `${c.p.ringnumber||'—'} → ${c.updates.ringnumber||c.p.ringnumber}`
    ).join('\n') + (changes.length>5 ? `\n… und ${changes.length-5} weitere` : '');
  }
  if(dupGroups.length){
    if(preview) preview += '\n\n';
    preview += `Duplikate (${dupGroups.length} Gruppen):\n` + dupGroups.slice(0,5).map(g =>
      `${escH(ring(g[0]))}${g[0].name?' · '+g[0].name:''}  ×${g.length}`
    ).join('\n') + (dupGroups.length>5 ? `\n… und ${dupGroups.length-5} weitere Gruppen` : '');
  }

  const dupNote = dupGroups.length
    ? `\n\nBei Duplikaten bleibt der vollständigste Datensatz erhalten, fehlende Felder werden aus den anderen ergänzt. Verweise als Vater/Mutter bei anderen Tauben werden automatisch umgehängt. Die überflüssigen Datensätze werden als gelöscht markiert (Soft-Delete, kein Datenverlust rückwirkend nachvollziehbar in der DB).`
    : '';
  if(!confirm(`Folgende Änderungen werden ausgeführt:\n\n${preview}${dupNote}\n\nFortfahren?`)) return;

  // Schritt A: Formatierung anwenden
  let ok=0, fail=0;
  for(const c of changes){
    try {
      await apiPatch('pigeons', c.p.pigeonid, c.updates);
      Object.assign(c.p, c.updates);
      ok++;
    } catch(e){
      fail++;
      console.error('Bereinigung fehlgeschlagen für', c.p.pigeonid, e.message);
    }
  }

  // Schritt B: Duplikate zusammenführen
  let merged=0, mergeFail=0;
  for(const group of dupGroups){
    try {
      const removed = await mergeDuplicateGroup(group);
      merged += removed;
    } catch(e){
      mergeFail++;
      console.error('Merge fehlgeschlagen für', ring(group[0]), e.message);
    }
  }

  applyFilter();
  render();
  alert(
    `✅ ${ok} Ringnummer(n) formatiert.${fail?` ⚠️ ${fail} Formatierungs-Fehler.`:''}` +
    (merged ? ` 🔗 ${merged} Duplikat(e) zusammengeführt.` : '') +
    (mergeFail ? ` ⚠️ ${mergeFail} Merge-Fehler (siehe Konsole).` : '')
  );
}

// Führt eine Gruppe von Tauben mit derselben (normalisierten) Ringnummer zusammen:
// vollständigster Datensatz bleibt als "Primär" erhalten, fehlende Felder werden aus den
// Duplikaten ergänzt, Eltern-Verweise (fatherid/motherid) anderer Tauben werden umgehängt,
// und die überflüssigen Datensätze werden per Soft-Delete entfernt (gleiche Konvention wie deletePigeon()).
// Gibt die Anzahl der entfernten Duplikate zurück.
async function mergeDuplicateGroup(group){
  const FILL_KEYS = ['name','color','race','strain','breeder','owner','standort','pigeontype','countrycode','associationno',
    'birthday','died','bought','sold','info','internalinfo','pigeonstateid','gender','date_year',
    'ringnumberold','ringnumberfather','ringnumbermother','fatherid','motherid',
    'userdefined1','userdefined2','userdefined3'];
  const filled = v => v!==null && v!==undefined && v!=='';
  const score = p => FILL_KEYS.filter(k=>filled(p[k])).length + (p.instock?1:0);

  const sorted = [...group].sort((a,b)=>score(b)-score(a));
  const primary = sorted[0];
  const dups = sorted.slice(1);

  // Fehlende Felder im Primär-Datensatz aus den Duplikaten ergänzen (bestehende Werte bleiben unangetastet)
  const patch = {};
  dups.forEach(d=>{
    FILL_KEYS.forEach(k=>{
      if(!filled(primary[k]) && !filled(patch[k]) && filled(d[k])) patch[k]=d[k];
    });
  });
  if(group.some(p=>p.instock) && !primary.instock) patch.instock = true;

  if(Object.keys(patch).length){
    await apiPatch('pigeons', primary.pigeonid, patch);
    Object.assign(primary, patch);
  }

  // Andere Tauben, die eines der Duplikate als Vater/Mutter referenzieren, auf den Primär-Datensatz umhängen
  const dupIds = new Set(dups.map(d=>d.pigeonid));
  for(const other of S.pigeons){
    if(dupIds.has(other.pigeonid)) continue;
    const upd={};
    if(other.fatherid && dupIds.has(other.fatherid)) upd.fatherid = primary.pigeonid;
    if(other.motherid && dupIds.has(other.motherid)) upd.motherid = primary.pigeonid;
    if(Object.keys(upd).length){
      await apiPatch('pigeons', other.pigeonid, upd);
      Object.assign(other, upd);
    }
  }

  // Duplikate als gelöscht markieren (Soft-Delete)
  for(const d of dups){
    await apiPatch('pigeons', d.pigeonid, {deleted:true, instock:false});
  }

  S.pigeons = S.pigeons.filter(p=>!dupIds.has(p.pigeonid)); invalidatePedigreeCache();
  return dups.length;
}

/* ── Datei verarbeiten ── */
async function handleImpFile(file){
  if(!file) return;
  if(file.size > 10*1024*1024){ alert('Datei zu groß (max. 10 MB)'); return; }

  const name = file.name.toLowerCase();
  try {
    if(name.endsWith('.xlsx') || name.endsWith('.xls')){
      await parseExcel(file);
    } else {
      await parseCsv(file);
    }
  } catch(e){
    alert('Fehler beim Lesen der Datei: '+e.message);
  }
}

/* ── CSV Parser ── */
async function parseCsv(file){
  const text = await file.text();
  // Trennzeichen erkennen: Tab > Semikolon > Komma
  const firstLine = text.split('\n')[0]||'';
  const sep = firstLine.includes('\t') ? '\t' : firstLine.includes(';') ? ';' : ',';

  const lines = text.split('\n').map(l=>l.replace(/\r$/,''));
  // Headerzeile finden (erste Zeile mit >= 3 nicht-leeren Spalten)
  let headerIdx = 0;
  for(let i=0;i<Math.min(5,lines.length);i++){
    const cols = lines[i].split(sep).filter(x=>x.trim());
    if(cols.length>=3){ headerIdx=i; break; }
  }
  const headers = lines[headerIdx].split(sep).map(h=>h.trim().replace(/^"|"$/g,''));
  const rows = [];
  for(let i=headerIdx+1;i<lines.length;i++){
    const line = lines[i].trim();
    if(!line) continue;
    const vals = line.split(sep).map(v=>v.trim().replace(/^"|"$/g,''));
    const row = {};
    headers.forEach((h,j)=>{ row[h] = vals[j]||''; });
    rows.push(row);
  }
  IMP.headers = headers;
  IMP.raw = rows;
  autoMapColumns();
  IMP.step = 'map';
  render();
}

/* ── Excel Parser (SheetJS via CDN) ── */
async function parseExcel(file){
  // Lade SheetJS dynamisch
  if(!window.XLSX){
    await new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload=res; s.onerror=rej;
      document.head.appendChild(s);
    });
  }
  const buf = await file.arrayBuffer();
  const wb  = XLSX.read(buf, {type:'array'});
  const ws  = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(ws, {defval:'', raw:false});
  if(!raw.length){ alert('Keine Daten in der Datei gefunden.'); return; }
  IMP.headers = Object.keys(raw[0]);
  IMP.raw = raw.map(r=>{ const o={}; IMP.headers.forEach(h=>o[h]=String(r[h]||'').trim()); return o; });
  autoMapColumns();
  IMP.step = 'map';
  render();
}

/* ── Auto-Mapping ── */

  IMP.colMap = {};

    IMP.colMap[h] = IMP_AUTO[key] || '_ignore';
  });
}

    const owner      = val(raw,'owner');
    const info       = val(raw,'info');
    const fatherRaw  = val(raw,'ringnumberfather');
    const motherRaw  = val(raw,'ringnumbermother');
    let   ringRaw    = val(raw,'ringnumber');

    // Ringnummer aus Komponenten bauen falls keine direkte Ringnummer-Spalte
    if(!ringRaw && vereinsnr && jahrgang && endnr){
      const cc = normCountryCode(land) || 'DE';
      const yy = String(jahrgang).slice(-2).padStart(2,'0');
      if(cc==='DE'){
        ringRaw = `DE-${vereinsnr.padStart(5,'0')}-${yy}-${endnr}`;
      } else {
        ringRaw = `${cc}-${yy}-${endnr}`;
      }
    }

    if(!ringRaw) return { _idx:idx, _status:'err', _msg:'Keine Ringnummer', raw };

    const parsed = parseRingComponents(ringRaw) || {};
    const ringnumber = parsed.ringnumber || fmtRingnumber(ringRaw) || ringRaw;

    // Geschlecht normalisieren
    let gender = null;
    const gn = String(genderRaw).trim();
    if(['m','1','männlich','tauber','täuber','cock','male'].includes(gn.toLowerCase())) gender='M';
    else if(['f','2','w','weiblich','taubin','täubin','hen','female'].includes(gn.toLowerCase())) gender='F';
    else if(gn==='2') gender='F';

    // Duplikat prüfen
    const dup = findInDb(ringnumber);

    // Eltern-UUIDs nachschlagen
    let fatherid=null, motherid=null, ringnumberfather=null, ringnumbermother=null;
    let fp=null, mp=null;
    if(fatherRaw){
      fp = findInDb(fatherRaw);
      if(fp){ fatherid=fp.pigeonid; ringnumberfather=ring(fp); }
      else ringnumberfather = fmtRingnumber(fatherRaw)||fatherRaw;
    }
    if(motherRaw){
      mp = findInDb(motherRaw);
      if(mp){ motherid=mp.pigeonid; ringnumbermother=ring(mp); }
      else ringnumbermother = fmtRingnumber(motherRaw)||motherRaw;
    }

    const row = {
      pigeonid: crypto.randomUUID(),
	  ringnumber,
      countrycode:   parsed.countrycode   || normCountryCode(land) || null,
      associationno: parsed.associationno || vereinsnr || null,
      date_year:     parsed.date_year     || (jahrgang?Number(jahrgang):null),
      endnumber:     parsed.endnumber     || (endnr?Number(endnr):null),
      gender, name:name||null, color:color||null, strain:strain||null,
      breeder:breeder||null, owner:owner||null, info:info||null,
      fatherid, motherid, ringnumberfather, ringnumbermother,
      instock:true, deleted:false,
    };
    // Null-Felder entfernen
    Object.keys(row).forEach(k=>{ if(row[k]===null||row[k]===''||row[k]===undefined) delete row[k]; });

    // Plausibilitätsprüfung: eine Taube kann nicht ihr eigener Elternteil sein,
    // und Vater/Mutter dürfen nicht dieselbe Ringnummer haben. Solche Zeilen
    // werden nicht automatisch blockiert (Tippfehler bei Ringnummern sind häufig),
    // aber deutlich markiert, damit sie vor dem Import geprüft werden.
    let plausibilityMsg = null;
    const rNorm = normRing(ringnumber);
    const fNorm = ringnumberfather ? normRing(ringnumberfather) : null;
    const mNorm = ringnumbermother ? normRing(ringnumbermother) : null;
    if(fNorm && rNorm===fNorm) plausibilityMsg = 'Ringnummer identisch mit Vater — das ist biologisch unmöglich.';
    else if(mNorm && rNorm===mNorm) plausibilityMsg = 'Ringnummer identisch mit Mutter — das ist biologisch unmöglich.';
    else if(fNorm && mNorm && fNorm===mNorm) plausibilityMsg = 'Vater und Mutter haben dieselbe Ringnummer — bitte prüfen.';

    // NEU: Eltern-Chronologie prüfen — nur möglich, wenn Vater/Mutter über
    // findInDb() aufgelöst werden konnten (fp/mp) und dort ein Jahrgang vorliegt.
    // Ein Elternteil, der gleich alt oder jünger ist als das Kind, ist
    // biologisch unmöglich (z.B. Ringnummer-Kollision zwischen zwei Jahrgängen).
    if(!plausibilityMsg){
      const childForCheck = { date_year: parsed.date_year || (jahrgang?Number(jahrgang):null) };
      const fChronMsg = checkParentChronology(childForCheck, fp);
      const mChronMsg = checkParentChronology(childForCheck, mp);
      if(fChronMsg) plausibilityMsg = `Vater: ${fChronMsg}`;
      else if(mChronMsg) plausibilityMsg = `Mutter: ${mChronMsg}`;
    }

    return {
      _idx: idx,
      _status: plausibilityMsg ? 'err' : (dup ? 'dup' : 'new'),
      _dup: dup || null,
      _msg: plausibilityMsg || (dup ? `Bereits vorhanden: ${ring(dup)}` : 'Neu'),
      _action: plausibilityMsg ? 'skip' : (dup ? 'skip' : 'import'),
      _plausibilityError: plausibilityMsg || null,
      row,
    };
  });

  IMP.step = 'preview';
  render();
}

/* ── Import ausführen ── */
async function runImport(){
  const toProcess = IMP.rows.filter(r=>r._action!=='skip' && r._status!=='err');
  IMP.stats = {new:0, dup:0, err:0, done:0};
  IMP.log   = [];
  IMP.step  = 'importing';
  render();

  const setS = t => { const el=document.getElementById('imp-cur-status'); if(el) el.textContent=t; };
  const updProg = () => {
    const total = toProcess.length;
    const pct = total ? Math.round(IMP.stats.done/total*100) : 0;
    const bar = document.querySelector('.imp-progress-bar');
    if(bar) bar.style.width=pct+'%';
    const lbl = document.querySelector('.imp-progress + div');
    if(lbl) lbl.textContent=`${IMP.stats.done} von ${total} · ${pct}%`;
  };

  for(const r of toProcess){
    setS(`Verarbeite: ${r.row?.ringnumber||'?'}…`);
    try {
      if(r._action==='import' && r._status==='new'){
        const newId = crypto.randomUUID();
        await apiPost('pigeons', {...r.row, pigeonid:newId});
        IMP.stats.new++;
      } else if((r._action==='update'||r._action==='import') && r._dup){
        // Nur Felder ergänzen die in DB leer sind (bei update) oder alle überschreiben (import)
        const updates = {};
        Object.keys(r.row).forEach(k=>{
          if(['pigeonid','deleted'].includes(k)) return;
          if(r._action==='update'){
            // Nur setzen wenn DB-Feld leer
            if(!r._dup[k] && r.row[k]) updates[k]=r.row[k];
          } else {
            // Alle überschreiben
            if(r.row[k]) updates[k]=r.row[k];
          }
        });
        if(Object.keys(updates).length) await apiPatch('pigeons', r._dup.pigeonid, updates);
        IMP.stats.dup++;
      }
    } catch(e){
      IMP.stats.err++;
      IMP.log.push({ring:r.row?.ringnumber, err:e.message});
    }
    IMP.stats.done++;
    updProg();
  }

  setS('Lade Datenbank neu…');
  await loadData();
  IMP.step = 'done';
  render();
}

// ── REISEN-MODUL ─────────────────────────────────────────────────
// .009 verified positions:
// Header  [0:3]=ReiseNr  [4:6]=Tag [6:8]=Mon [8:10]=Jahr  [18:38]=Ort
// Züchter [9:12]=Gesetzt [12:15]=P1(RV) [15:18]=P2(FG) [18:21]=P3(RegGr)
//         [21:24]=P4(Reg) [24:27]=P5(Nat) [27:34]=Dist*1000
// Taube   [10:12]=Jahr [12:16]=Verein [16:20]=Endnr [20]=Geschl(W=F)
//         [32:41]=Speed/10000
// Platzierungsfelder je Taube (5 Kategorie-Slots, Reihenfolge identisch zur
// Flug-Kopfzeile "A ... G ... [Nat] R ..."): [41:46]=FG (unbenutzt bei diesem
// Verein) [46:51]=Reg/RegV (A-Liste, große Liste) [51:56]=RegGr (G-Liste)
// [56:61]=Nat (unbenutzt) [61:66]=RV (kleine Liste, Reisevereinigung)
// Verifiziert anhand Taube 06559.24.4241W, Flug F06 (Würzburg 30.05.26):
// Datei liefert 0 / 458 / 175 / 0 / 33 → amtlicher Ausdruck bestätigt
// Reg=458, RegGr=175, RV=33 (vorher waren Reg/RegGr vertauscht und RV wurde
// gar nicht gelesen, stattdessen das immer-leere FG-Feld als RV interpretiert).
//
// Vorbenennungs-/Auszeichnungs-Flags (je Taube, Spalte 20-30), verifiziert
// per Spaltenanalyse an dieser Musterdatei (Rückmeldung Benedikt 14.07.26):
// [20]=Geschlecht (W=weiblich, sonst männlich — KEIN Vorbenennungs-Flag)
// [21]=V  Verbandsmeisterschaft-Vorbenennung  (je Flug, Top-3 zählen)
// [23]=J  Jährige-Kennzeichnung               (je Flug, Top-3 zählen;
//      deckt auch das früher angenommene "P" mit ab — eigenes P-Feld
//      entfällt, J ist gleichbedeutend)
// [24]=M  Medaillen-Vorbenennung   (nur auf Flugebene relevant, wird NICHT
//      an die Taube weitergereicht/aggregiert)
// [27]=A, [28]=B, [29]=C, [30]=D  Ass-Kategorien — nur EINMAL pro Jahr auf
//      einem einzigen Flug gesetzt → wird an der Taube (nicht am Flug)
//      gespeichert (S.pigeons.ass_a/ass_b/ass_c/ass_d) und erscheint dort
//      als eigene, filterbare Spalte in der Taubenübersicht.
const FLAG_COL = { v:21, j:23, m:24, a:27, b:28, c:29, d:30 };
function calcAS(platz, g_aufgesetzt) {
  if (!platz || platz <= 0 || !g_aufgesetzt || g_aufgesetzt <= 0) return null;
  // Laut Reglement erhält nur jede 3. gesetzte Taube einen Preis (aufgerundet).
  // Die AS-Punkte werden auf Basis dieser Preis-Anzahl berechnet — nicht auf
  // Basis der Gesamtzahl gesetzter Tauben, sonst ergeben sich deutlich zu
  // niedrige Werte (Platz/Gesetzt statt echtem AS-Wert).
  // Verifiziert anhand Taube 06559.24.4241W, Flug F06 (Würzburg 30.05.26):
  //   RV:    Platz 33,  224 gesetzt → 75 Preise  → AS 57.33 ✓
  //   RegGr: Platz 175, 1641 gesetzt → 547 Preise → AS 68.19 ✓
  //   Reg:   Platz 458, 3673 gesetzt → 1225 Preise → AS 62.69 ✓
  const preise = Math.ceil(g_aufgesetzt / 3);
  if (!preise || platz > preise) return null;
  return Math.round((preise - platz + 1) / preise * 10000) / 100;
}


function decodeLatin1(buf){
  try{ return new TextDecoder('windows-1252').decode(buf); }
  catch(e){ try{ return new TextDecoder('iso-8859-1').decode(buf); } catch(e2){ return ''; } }
}

function fixUmlauts(s){
  // CP850/windows-1252 → Unicode
  return (s||'')
    .replace(/\u0081/g,'\xFC').replace(/\u0094/g,'\xF6').replace(/\u0084/g,'\xE4')
    .replace(/\u008E/g,'\xC4').replace(/\u0099/g,'\xD6').replace(/\u009A/g,'\xDC')
    .replace(/\xE1/g,'\xDF').replace(/\xFC/g,'ü').replace(/\xF6/g,'ö')
    .replace(/\xE4/g,'ä').replace(/\xC4/g,'Ä').replace(/\xD6/g,'Ö')
    .replace(/\xDC/g,'Ü').replace(/\xDF/g,'ß').trim();
}

async function upsertBreederProfile(partial){
  if(BREEDER_PROFILE && BREEDER_PROFILE.id){
    await apiPatchBy('breederprofile', 'id=eq.'+BREEDER_PROFILE.id, partial);

  } else {

    BREEDER_PROFILE = (inserted && inserted[0]) || {...partial};

// ── Züchtererfolge (Tabelle breedersdata) ─────────────────────────────────
// Erfolge werden hier verwaltet (anlegen/bearbeiten/löschen) und die für den
// Druck vorgesehene Auswahl wird als Standard im Züchterprofil gespeichert
// (Spalte erfolge_ids, kommagetrennte Liste von breederdataid). Damit muss
// die Auswahl nur einmal getroffen werden — jeder Druck nutzt automatisch
// diesen Standard, bis er über "Züchterdaten" bewusst geändert wird.
let BREEDERSDATA_CACHE = null;
let BREEDERSDATA_ERROR = null;
async function loadBreedersdata(force){
  if(BREEDERSDATA_CACHE!==null && !force) return BREEDERSDATA_CACHE;
  BREEDERSDATA_ERROR = null;
  try{ BREEDERSDATA_CACHE = await apiGet('/breedersdata?select=breederdataid,name,info,createdby,createdon&order=createdon.desc&limit=500') || []; }
  catch(e){ BREEDERSDATA_CACHE = []; BREEDERSDATA_ERROR = e.message; }
  return BREEDERSDATA_CACHE;
}
function getDefaultErfolgeIds(){
  const raw = (BREEDER_PROFILE && BREEDER_PROFILE.erfolge_ids) || '';
  return raw.split(',').map(s=>s.trim()).filter(Boolean);
}
async function saveDefaultErfolgeIds(ids){
  try{ await upsertBreederProfile({erfolge_ids: ids.join(',')}); }
  catch(e){
    alert('Auswahl konnte nicht gespeichert werden: '+e.message+'\n\nHinweis: In Supabase muss die Tabelle "breederprofile" eine Text-Spalte "erfolge_ids" besitzen.');
    throw e;
  }
}
async function toggleDefaultErfolg(id){
  const cur = new Set(getDefaultErfolgeIds());
  if(cur.has(id)) cur.delete(id); else cur.add(id);
  try{ await saveDefaultErfolgeIds([...cur]); } catch(e){ return; }
  render();
}
function openErfolgAddForm(){ S.erfolgeEditingId='new'; render(); }
function startEditErfolg(id){ S.erfolgeEditingId=id; render(); }
function cancelEditErfolg(){ S.erfolgeEditingId=null; render(); }
async function addErfolgEntry(){
  const name = (document.getElementById('erf_new_name')?.value||'').trim();
  const info = (document.getElementById('erf_new_info')?.value||'').trim();
  if(!name && !info) return;
  try{
    const inserted = await apiPost('breedersdata', {name, info});
    await loadBreedersdata(true);
    const row = inserted && inserted[0];
    if(row && row.breederdataid){
      const cur = new Set(getDefaultErfolgeIds());
      cur.add(row.breederdataid);
      await saveDefaultErfolgeIds([...cur]);
    }
  }catch(e){ alert('Erfolg konnte nicht gespeichert werden: '+e.message); return; }
  S.erfolgeEditingId=null;
  render();
}
async function saveEditErfolg(id){
  const name = (document.getElementById('erf_edit_name_'+id)?.value||'').trim();
  const info = (document.getElementById('erf_edit_info_'+id)?.value||'').trim();
  try{
    await apiPatchBy('breedersdata','breederdataid=eq.'+id,{name, info});
    await loadBreedersdata(true);
  }catch(e){ alert('Änderung konnte nicht gespeichert werden: '+e.message); return; }
  S.erfolgeEditingId=null;
  render();
}
async function deleteErfolgEntry(id){
  if(!confirm('Diesen Erfolgs-Eintrag wirklich löschen?')) return;
  try{
    await apiDeleteBy('breedersdata','breederdataid=eq.'+id);
    await loadBreedersdata(true);
    const cur = new Set(getDefaultErfolgeIds());
    if(cur.has(id)){ cur.delete(id); await saveDefaultErfolgeIds([...cur]); }
  }catch(e){ alert('Löschen fehlgeschlagen: '+e.message); return; }
  render();
}

// Lädt Züchterprofil + Standard-Erfolge-Auswahl — gemeinsame Vorbereitung für
